name: Daily AI Digest

on:
  # GitHub Actions retarde fortement les crons aux heures pile (06:00, 07:00...).
  # Stratégie : crons décalés hors heure pile, dans la plage 06h-12h UTC (08h-14h Paris été).
  # L'idempotence (email_sent_at) empêche les doublons : seul le 1er run "qui passe" envoie.
  schedule:
    - cron: '7 6 * * *'    # 08:07 Paris été (cible principale)
    - cron: '23 6 * * *'   # 08:23 Paris été
    - cron: '47 6 * * *'   # 08:47 Paris été
    - cron: '13 7 * * *'   # 09:13 Paris été
    - cron: '37 7 * * *'   # 09:37 Paris été
    - cron: '7 8 * * *'    # 10:07 Paris été
    - cron: '37 9 * * *'   # 11:37 Paris été
    - cron: '7 11 * * *'   # 13:07 Paris été (filet de sécurité midi)
  workflow_dispatch:

# Le workflow doit pouvoir pusher de nouveaux commits (pour publier la page)
permissions:
  contents: write

# Empêche 2 runs simultanés
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_PUBLIC_URL: 'https://lucasheylen94200-beep.github.io/x-ai-digest/'
      DIGEST_TO_EMAIL: 'lucas.heylen94200@gmail.com'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Récupération du repo
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: 1/3 — Fetch + Process + Build
        run: python digest.py all

      - name: 2/3 — Envoi de l'email (ecrit le flag email_sent_at dans le data file)
        run: python send_email.py

      - name: 3/3 — Commit & push la nouvelle page (avec le flag email)
        run: |
          git config user.name "Daily AI Digest Bot"
          git config user.email "bot+daily-ai-digest@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à pusher"
          else
            git commit -m "Digest auto $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Statut final
        if: always()
        run: |
          echo "===== Résumé ====="
          if [ -f "data/$(date -u +'%Y-%m-%d').json" ]; then
            echo "✅ Data file généré"
            python -c "import json; d=json.load(open('data/$(date -u +'%Y-%m-%d').json')); v=d.get('validation',{}); print(f'   Traduction : {v.get(\"translated_pct\",0)}%'); print(f'   Tweets : {v.get(\"total\",0)}')"
          else
            echo "❌ Pas de data file"
          fi
