r.net/AmjadMasad/status/2055097107758076254#m", "decryptage": null}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Meta prévoit d'alimenter ses centres de données IA avec de l'énergie solaire transmise depuis l'espace. Si cela fonctionne, les fermes solaires pourraient produire de l'énergie 24h/24 et 7j/7 sans batteries ni générateurs de secours. L'entreprise derrière tout cela est Overview Energy -- elle veut lancer 1 000 satellites en orbite, à 35 000 km au-dessus de l'équateur, où la lumière du soleil est constante. Pour information, les centres de données de Meta ont utilisé plus de 18 000 gigawattheures d'électricité l'année dernière. Suffisamment pour alimenter 1,7 million de foyers américains pendant un an. Chaque satellite collecte l'énergie solaire, la convertit en un large faisceau de lumière proche infrarouge, et le dirige vers les fermes solaires existantes au sol. Les fermes convertissent la lumière en électricité, comme elles le font avec la lumière du soleil. Contrairement aux lasers de forte puissance ou aux faisceaux micro-ondes, cette lumière infrarouge est suffisamment sûre pour être regardée directement. Les fermes solaires sont normalement inactives la nuit, donc ce système corrige cela... depuis l'espace. Une technologie vraiment fascinante. Vidéo", "text_original": "Meta is planning to power its AI data centers with solar energy beamed from space. If it works, solar farms could produce power 24/7 without batteries or backup generators. The company behind it all is Overview Energy -- they want to launch 1,000 satellites into orbit, 22,000 miles above the equator, where sunlight is constant. For context, Meta's data centers used over 18,000 gigawatt-hours of electricity last year. Enough to power 1.7 million American homes for a year. Each satellite collects solar energy, converts it into a wide beam of near-infrared light, and aims it at existing solar farms on the ground. The farms convert the light into electricity, just like they do with sunlight. Unlike high-power lasers or microwave beams, this infrared light is safe enough to stare directly into. Solar farms normally sit idle at night, so this system fixes that... from space. Really fascinating tech. Video", "link": "https://nitter.net/rowancheung/status/2051320518905930208#m", "decryptage": "Meta prévoit d'utiliser l'énergie solaire captée depuis l'espace pour alimenter ses centres de données IA, grâce à une technologie de faisceaux lumineux infrarouges envoyés par des satellites, assurant une alimentation 24h/24."}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "J'embauche quelqu'un pour m'aider à construire le « Reddit des cas d'utilisation de l'IA ». Les gens meurent d'envie d'entendre des VRAIES personnes faisant un VRAI travail avec l'IA. Ils ne se soucient pas de la façon dont les cadres, les influenceurs ou les chasseurs de buzz « utilisent l'IA ». Il y a quelques mois, nous avons lancé notre fonctionnalité Cas d'Utilisation Communautaires dans The Rundown : À la fin de chaque newsletter, nous présentons comment un lecteur utilise l'IA pour travailler plus intelligemment, gagner du temps ou faciliter sa vie. Nous n'y avons pas beaucoup réfléchi, juste un moyen sympa de mettre en avant la communauté. Eh bien, c'est devenu l'un des plus grands succès de la newsletter. Maintenant, je reçois des messages quotidiens nous demandant de l'étendre... alors nous le faisons. Le plan : construire un Reddit pour les cas d'utilisation de l'IA. Nous avons le public le plus actif et le plus engagé intéressé par l'IA au monde, avec des millions de lecteurs quotidiens. Votre travail consiste à découvrir comment ils utilisent réellement l'IA, puis à les inciter à partager leurs expériences. En gros, l'ami à qui tout le monde envoie des SMS quand ils entendent parler d'une nouvelle chose IA... mais vous construisez une communauté entière d'entre eux. Voici ce que je recherche : > Quelqu'un qui s'épanouit dans des environnements \"scrappy\" avec d'excellentes compétences en communication > A déjà construit des communautés en ligne à grande échelle > Énergisé par l'idée d'interviewer des milliers de personnes réelles sur la façon dont l'IA change réellement leur travail. Ce n'est PAS un rôle facile. Vous interviewerez des milliers de personnes, recueillerez des points de données et approfondirez leurs véritables difficultés avec l'IA. Si cela semble amusant plutôt qu'accablant, vous êtes probablement la personne que je recherche. Lien ci-dessous pour postuler ! Rowan Cheung (@rowancheung) J'EMBAUCHE 5 personnes supplémentaires pour m'aider à construire l'avenir des médias de l'IA. The Rundown approche les 3 millions de lecteurs actifs, et la demande dépasse largement ce que nous pouvons gérer. Bonus de parrainage de 2 000 $ si vous nous aidez à trouver quelqu'un que nous embauchons à temps plein. Postes ouverts : > Responsable de contenu -- diriger l'équipe éditoriale qui touche des millions de personnes chaque jour > Responsable des ventes -- gérer une équipe de vente débrouillarde et une stratégie de revenus pour nos propriétés médiatiques > Responsable de communauté -- transformer nos plus de 3 millions de lecteurs en « Reddit des cas d'utilisation de l'IA » > Stratège créatif publicitaire -- rechercher et expédier des créatifs publicitaires qui attirent le million de lecteurs curieux d'IA suivant > Éditeur de contenu de marque -- transformer les marques en histoires que nos lecteurs veulent réellement lire Ce que nous recherchons pour tous les rôles : > Curiosité profonde pour l'IA (vous avez déjà remplacé une partie de votre flux de travail par des agents) > Biais déraisonnable vers l'action > Goût suffisamment aiguisé pour repérer l'excellent travail (et le \"AI slop\") Tous les rôles sont entièrement à distance. Lien ci-dessous pour postuler ! — https://nitter.net/rowancheung/status/2048767013472833869#m", "text_original": "I'm hiring someone to help me build the \"Reddit for AI use cases.\" People are dying to hear from REAL people actually doing REAL work with AI. They don't care about how execs, influencers, or hype chasers are 'using AI'. A few months ago, we launched our Community Use Cases feature in The Rundown: At the end of every newsletter, we showcase how a reader is using AI to work smarter, save time, or make life easier. We didn't think much of it, just a cool way to highlight the community. Well, it became one of the biggest hits the newsletter has ever had. Now I get daily messages asking us to expand it... so we are. The plan: build Reddit for AI use cases. We have the most active and engaged AI-interested audience in the world, with millions of daily readers. Your job is to figure out how they're actually using AI, then incentivize them to share it. Basically, the friend everyone texts when they hear about a new AI thing... but you're building an entire community of them. Here's what I'm looking for: > Someone who thrives in scrappy environments with great communication skills > Has built online communities at scale before > Energized by the idea of interviewing thousands of real people about how AI is actually changing their work This is NOT an easy role. You'll interview thousands of people, gather data points, and dig into their real AI struggles. If that sounds fun rather than overwhelming, you're probably who I'm looking for. Link below to apply! Rowan Cheung (@rowancheung) I'm HIRING 5 more people to help me build the future of AI media. The Rundown is closing in on 3M active readers, and the demand is far outpacing what we can handle. $2,000 referral bonus if you help us find someone we hire full-time. Open roles: > Head of Content -- lead the editorial team that reaches millions every day > Head of Sales -- run a scrappy sales team and revenue strategy across our media properties > Community Lead -- turn our 3M+ readership into the \"Reddit for AI use cases\" > Ad Creative Strategist -- research and ship ad creatives that hook the next million AI-curious readers > Branded Content Editor -- turn brands into stories our readers actually want to read What we're looking for among all roles: > Deep AI curiosity (you've already replaced part of your workflow with agents) > Unreasonably biased toward action > Taste sharp enough to spot great work (and AI slop) All roles are fully remote. Link below to apply! — https://nitter.net/rowancheung/status/2048767013472833869#m", "link": "https://nitter.net/rowancheung/status/2049872641889087549#m", "decryptage": "Rowan Cheung cherche à recruter pour créer une plateforme communautaire où des utilisateurs réels partageraient leurs applications pratiques de l'IA, loin du jargon et du battage médiatique."}, {"author_name": "AlphaSignal", "handle": "@AlphaSignalAI", "text_fr": "Nouvel article : un nouveau document a permis aux modèles d'image de fonctionner pour le texte avec 10 fois moins de données. Des chercheurs viennent de publier une nouvelle approche pour générer du texte avec des modèles de diffusion. Les modèles de diffusion dominent la génération d'images et de vidéos. Pour le texte, les systèmes leaders s'appuient toujours sur des jetons discrets. Les flux de langage intégrés (Embedded Language Flows) prennent une voie différente. Ils restent entièrement dans un espace d'intégration continu. Seule l'étape finale convertit les vecteurs en mots réels. Un encodeur T5 figé gère le mappage de texte. Le même réseau débruite chaque étape et décode à la fin. Aucun décodeur séparé n'est nécessaire. Deux choix de conception débloquent les gains : 1. Prédire des intégrations propres, pas du bruit 2. Appliquer un guidage sans classificateur pendant l'entraînement Les résultats sur les benchmarks de langage : > Perplexité inférieure avec 32 étapes d'échantillonnage > Environ 10 fois moins de jetons d'entraînement que les bases de référence > Bat les modèles autorégressifs sur la traduction et la synthèse La diffusion continue pour le langage était considérée comme une impasse. Le document suggère le contraire.", "text_original": "A new paper made image models work for text with 10x less data. Researchers just released a new approach for generating text with diffusion models. Diffusion models dominate image and video generation. For text, leading systems still rely on discrete tokens. Embedded Language Flows takes a different route. It stays in continuous embedding space the entire way. Only the final step converts vectors into actual words. A frozen T5 encoder handles the text mapping. The same network denoises every step and decodes at the end. No separate decoder needed. Two design choices unlock the gains: 1. Predict clean embeddings, not noise 2. Apply classifier-free guidance during training The results across language benchmarks: > Lower perplexity with 32 sampling steps > Roughly 10x fewer training tokens than baselines > Beats autoregressive models on translation and summarization Continuous diffusion for language was considered a dead end. T he paper suggests otherwise.", "link": "https://nitter.net/AlphaSignalAI/status/2055302522445660392#m", "decryptage": "Une nouvelle étude a réussi à utiliser des modèles d'IA conçus pour les images afin de générer du texte, réduisant considérablement la quantité de données d'apprentissage nécessaire et améliorant les performances."}], "tips": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Cela fonctionne vraiment très bien, d'ailleurs ! À la fin de votre requête, demandez à votre LLM de «structurer votre réponse en HTML», puis visualisez le fichier généré dans votre navigateur. J'ai aussi eu du succès en demandant au LLM de présenter sa sortie sous forme de diaporamas, etc. Plus généralement, à mon avis, l'audio est l'entrée préférée des humains vers les IA, mais la vision (images/animations/vidéo) est la sortie préférée de celles-ci. Environ un tiers de nos cerveaux est un processeur massivement parallèle dédié à la vision, c'est l'autoroute à 10 voies de l'information vers le cerveau. À mesure que l'IA s'améliore, je pense que nous verrons une progression qui en tirera parti : 1) texte brut (difficile/pénible à lire) 2) markdown (gras, italique, titres, tableaux, un peu plus facile pour les yeux) <-- réglage par défaut actuel 3) HTML (toujours procédural avec du code sous-jacent, mais beaucoup plus de flexibilité sur les graphiques, la mise en page, même l'interactivité) <-- début mais nouveau bon réglage par défaut en formation ...4,5,6,... n) vidéos/simulations neuronales interactives À mon avis, l'extrapolation (même si la technologie n'existe pas encore) aboutit à une sorte de vidéos interactives générées directement par un réseau neuronal de diffusion. De nombreuses questions ouvertes quant à la manière dont des artefacts 'Software 1.0' exacts/procéduraux (par exemple, des simulations interactives) peuvent être tissés avec des artefacts neuronaux (grilles de diffusion), mais généralement quelque chose dans la direction du récemment viral nitter.net/zan2434/status/2046982… Il y a aussi des améliorations nécessaires et en attente à l'entrée. Ni l'audio, ni le texte, ni la vidéo seuls ne suffisent, par exemple, je ressens le besoin de pointer/gesticuler vers des choses à l'écran, similaire à tout ce que vous feriez avec une personne physiquement à côté de vous et votre écran d'ordinateur. En bref, la fusion entre l'esprit humain et l'IA est en cours et il reste beaucoup de travail à faire et des progrès significatifs à réaliser, bien avant de se lancer à fond dans les BCI de type neuralink et tout ça. Pour ce qui vaut la peine d'être exploré au stade actuel, un bon conseil : essayez de demander de l'HTML. Thariq (@trq212) x.com/i/article/205279610060…", "text_original": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/trq212/status/2052809885763747935#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "decryptage": "Explique comment obtenir des réponses plus visuelles et structurées des IA, anticipant une évolution vers des contenus interactifs, comme si l'IA dessinait directement ce qu'on veut voir à l'écran."}, {"author_name": "Greg Brockman", "handle": "@gdb", "text_fr": "Exécutez Codex sur chaque \"commit\". Peter Steinberger 🦞 (@steipete) Les gens s'inquiètent de mes dépenses en IA. Ce que personne ne voit : Une partie de ce qui m'enthousiasme tant dans OpenClaw, c'est que j'essaie de répondre à la question : Comment construirions-nous des logiciels à l'avenir si les jetons n'avaient pas d'importance ? Nous exécutons constamment environ 100 Codex dans le cloud, révisant chaque demande de fusion (PR), chaque problème. Si un correctif sur la branche principale est publié, @clawsweeper finira par trouver ce problème vieux de 6 mois et le clôturera avec une référence exacte. Nous exécutons Codex sur chaque \"commit\" pour vérifier les problèmes de sécurité (car il est bien trop facile de les manquer). Nous exécutons Codex pour dédupliquer les problèmes et trouver des clusters et envoyer des rapports pour les problèmes les plus urgents. Nous avons des agents capables de recréer des configurations complexes, de lancer des machines éphémères crabbox.sh, de se connecter à Telegram par exemple, de faire une vidéo et de la poster avant/après correction sur la PR. Il y a des Codex qui surveillent les nouveaux problèmes et — s'ils correspondent bien à notre vision documentée — créent automatiquement une PR (que d'autres Codex révisent ensuite). Nous avons des Codex qui analysent les commentaires pour le spam et bloquent les personnes. Nous avons des instances Codex qui vérifient les performances et signalent les régressions dans Discord. Nous avons des agents qui écoutent nos réunions et commencent de manière proactive le travail, par exemple en créant des PR lorsque nous discutons de nouvelles fonctionnalités pendant que nous en discutons. Nous construisons clawpatch.ai pour diviser tous nos projets en unités fonctionnelles afin de réviser et de trouver des bugs et des régressions. Nous faisons la même chose pour la sécurité avec deepsec de Vercel et Codex Security pour trouver les régressions et les vulnérabilités. Toute cette automatisation nous permet de gérer ce projet de manière extrêmement légère. — https://nitter.net/steipete/status/2055405041843052792#m", "text_original": "run codex on every commit Peter Steinberger 🦞 (@steipete) People freaking out over my AI spend. What nobody sees: Part of what excites me so much about working on OpenClaw is that I'm trying to answer the question: How would we build software in the future if tokens don't matter? We constant run ~100 codex in the cloud, reviewing every PR, every issue. If a fix on main lands, @clawsweeper will eventually find that 6 month old issue and close it with an exact reference. We run codex on every commit to review for security issues (as it's far too easy to miss). We run codex to de-duplicate issues and find clusters and send reports for the most pressing issues. We have agents that can recreate complex setups, spin up ephemeral crabbox.sh machines, log into e.g. Telegram, make a video and post before/after fix on the PR. There's codex that watch new issues and - if it fits our documented vision well, automatically create a PR of it. (that then another codex reviews) We have codex running that scans comments for spam and blocks people. We have codex instances running that verify performance benchmarks and report regressions into Discord. We have agents that listen on our meetings and proactively start work, e.g. create PRs when we discuss new features while we discuss them. We build clawpatch.ai to split all our projects into functional units to review and find bugs and regresssions. We do the same split for security with Vercel's deepsec and Codex Security to find regressions and vulnerabilities. All that automation allows us to run this project extremely lean. — https://nitter.net/steipete/status/2055405041843052792#m", "link": "https://nitter.net/gdb/status/2055436684666274020#m", "decryptage": "Décrit une utilisation intensive de Codex pour automatiser de nombreuses tâches de développement logiciel, de la révision de code à la création de rapports de bugs, libérant ainsi du temps pour les humains."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Nouveau cours : Les Transformers en pratique. Vous obtiendrez une vue pratique du fonctionnement des LLM basés sur des transformers, afin de pouvoir raisonner sur leur comportement, diagnostiquer des problèmes comme une inférence lente, et prendre des décisions plus intelligentes concernant le déploiement. Ce cours est construit en partenariat avec @AMD et enseigné par @realSharonZhou. Vous verrez comment les transformers génèrent du texte un jeton à la fois, comment le modèle décide quels mots antérieurs comptent le plus lors de la prédiction du suivant, et comment des techniques comme la quantification accélèrent l'inférence sur les GPU. Ce n'est pas un cours uniquement vidéo ; des visualisations interactives tout au long du cours vous permettent de jouer avec ces concepts et de construire une intuition durable. Compétences que vous acquerrez : - Comprendre pourquoi les LLM hallucinent, et comment RAG et \"chain-of-thought\" façonnent ce qu'ils génèrent - Regarder à l'intérieur du modèle pour voir comment l'attention et les couches se combinent pour prédire le prochain jeton - Diagnostiquer les goulots d'étranglement de l'inférence et apprendre les techniques qui accélèrent les transformers sur les GPU Rejoignez et comprenez ce qui se passe réellement à l'intérieur de vos LLM : deeplearning.ai/courses/tran… Vidéo", "text_original": "New course: Transformers in Practice. You'll get a practical view of how transformer-based LLMs work, so you can reason about their behavior, diagnose problems like slow inference, and make smarter decisions about deployment. This course is built in partnership with @AMD and taught by @realSharonZhou . You'll see how transformers generate text one token at a time, how the model decides which earlier words matter most when predicting the next one, and how techniques like quantization speed up inference on GPUs. This is not a video-only course; interactive visualizations throughout let you play with these concepts and build intuition that sticks. Skills you'll gain: - Understand why LLMs hallucinate, and RAG and chain-of-thought shape what they generate - Look inside the model to see how attention and layers combine to predict the next token - Diagnose inference bottlenecks and learn the techniques that speed up transformers on GPUs Join and understand what's really happening inside your LLMs: deeplearning.ai/courses/tran… Video", "link": "https://nitter.net/AndrewYNg/status/2054964560403300359#m", "decryptage": "Présente un nouveau cours pratique sur les \"Transformers\", les briques de base des IA comme ChatGPT, expliquant leur fonctionnement, comment résoudre leurs problèmes et les déployer efficacement."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Nouveau cours : Créez des agents qui répondent aux utilisateurs non seulement avec du texte brut, mais aussi avec des interfaces utilisateur personnalisées comme des graphiques, des formulaires et des tableaux blancs, générées à la demande et affichées directement dans le chat. Ce court cours est construit en partenariat avec @CopilotKit et enseigné par @ataiiam, co-fondateur de CopilotKit. Vous apprendrez trois approches : Votre agent peut choisir parmi des composants personnalisés que vous construisez, comme des graphiques et des formulaires. Il peut composer de nouvelles mises en page à partir d'un ensemble de blocs de construction que vous fournissez, comme des lignes, des cartes et du texte. Ou il peut intégrer des applications tierces existantes, comme un tableau blanc ou un calendrier, directement dans la conversation. Compétences que vous acquerrez : - Construire des agents qui affichent des composants personnalisés comme des graphiques et des formulaires à la demande - Construire une application où l'agent et l'utilisateur collaborent sur des données partagées, au-delà de la simple fenêtre de chat - Placer des applications tierces comme des cartes, des calendriers et des tableaux blancs directement dans votre interface Rejoignez et construisez des agents qui donnent aux utilisateurs quelque chose à voir et sur lequel agir ! deeplearning.ai/short-course… Vidéo", "text_original": "New course: Build agents that respond to users with not only plaintext, but custom UIs like charts, forms, and whiteboards, generated on demand and displayed right in the chat. This short course is built in partnership with @CopilotKit and taught by @ataiiam , co-founder of CopilotKit. You'll learn three approaches: Your agent can pick from custom components you build, like charts and forms. It can compose new layouts from a set of building blocks you provide, like rows, cards, and text. Or it can incorporate existing third-party apps, like a whiteboard or a calendar, right inside the conversation. Skills you’ll gain: - Build agents that render custom components like charts and forms on demand - Build an app where the agent and user collaborate on shared data, beyond just the chat window - Place third-party apps like maps, calendars, and whiteboards right in your interface Join and build agents that give users something to see and act on! deeplearning.ai/short-course… Video", "link": "https://nitter.net/AndrewYNg/status/2052422157310083493#m", "decryptage": "Propose un cours pour apprendre à créer des \"agents\" IA capables de générer des interfaces visuelles personnalisées (graphiques, formulaires) directement dans la conversation, plutôt que du simple texte."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Les agents de codage accélèrent différents types de travail logiciel à des degrés divers. Lorsque nous architecturons des équipes, comprendre ces distinctions nous aide à avoir des attentes réalistes. En listant les fonctions du plus accéléré au moins accéléré, mon ordre est : développement frontend, backend, infrastructure et recherche. Le développement frontend — par exemple, la construction d'une page web pour afficher des descriptions de produits pour un site de commerce électronique — est considérablement accéléré car les agents de codage maîtrisent les langages frontend populaires comme TypeScript et JavaScript et les frameworks comme React et Angular. De plus, en examinant ce qu'ils ont construit en utilisant un navigateur web, les agents de codage sont maintenant très bons pour boucler la boucle et itérer sur leurs propres implémentations. Certes, les LLM d'aujourd'hui sont encore faibles en design visuel, mais étant donné un design (ou si un design soigné n'est pas important), l'implémentation est rapide ! Le développement backend — par exemple, la construction d'APIs pour répondre aux requêtes de données produit — est plus difficile. Il faut plus de travail de la part des développeurs humains pour guider les modèles modernes à réfléchir aux cas limites qui pourraient conduire à des bugs subtils ou à des failles de sécurité. De plus, un bug backend peut entraîner des effets en aval non intuitifs comme une base de données corrompue qui renvoie occasionnellement des résultats incorrects, ce qui peut être plus difficile à déboguer qu'un bug frontend typique. Enfin, bien que les migrations de bases de données puissent être plus faciles avec les agents de codage, elles restent difficiles et doivent être gérées avec soin pour éviter la perte de données. Bien que le développement backend soit beaucoup plus rapide avec les agents de codage, ils l'accélèrent moins, et les développeurs expérimentés conçoivent et implémentent encore de bien meilleurs backends que les inexpérimentés qui utilisent les agents de codage. L'infrastructure. Les agents sont encore moins efficaces dans des tâches comme la mise à l'échelle d'un site de commerce électronique à 10 000 utilisateurs actifs tout en maintenant une fiabilité de 99,99 %. Les connaissances des LLM sont encore relativement limitées en ce qui concerne l'infrastructure et les compromis complexes que les bons ingénieurs doivent faire, donc je ne leur fais rarement confiance pour les décisions critiques d'infrastructure. La construction d'une bonne infrastructure nécessite souvent une période de test et d'expérimentation, et les agents de codage peuvent y contribuer, mais c'est finalement un goulot d'étranglement important où le codage rapide par l'IA n'aide pas beaucoup. Enfin, trouver des bugs d'infrastructure — par exemple, une subtile mauvaise configuration réseau — peut être incroyablement difficile et nécessite une expertise en ingénierie approfondie. Ainsi, j'ai constaté que les agents de codage accélèrent l'infrastructure critique encore moins que le développement backend. La recherche. Les agents de codage accélèrent encore moins le travail de recherche. La recherche implique de réfléchir à de nouvelles idées, de formuler des hypothèses, d'exécuter des expériences, de les interpréter pour potentiellement modifier les hypothèses, et d'itérer jusqu'à ce que nous arrivions à des conclusions. Les agents de codage peuvent accélérer le rythme auquel nous pouvons écrire du code de recherche. (J'utilise également des agents de codage pour m'aider à orchestrer et à suivre les expériences, ce qui facilite la gestion de plus d'expériences par un seul chercheur.) Mais il y a beaucoup de travail dans la recherche autre que le codage, et les agents actuels n'aident que marginalement à la recherche. Catégoriser le travail logiciel en frontend, backend, infra et recherche est une simplification extrême, mais avoir un modèle mental simple pour la rapidité avec laquelle différentes tâches ont été accélérées m'a été utile pour organiser les équipes logicielles. Par exemple, je demande maintenant aux équipes frontend de mettre en œuvre des produits beaucoup plus rapidement qu'il y a un an, mais mes attentes pour les équipes de recherche n'ont pas autant évolué. Je suis fasciné par la façon d'organiser les équipes logicielles pour utiliser les agents de codage afin d'atteindre la vitesse, et je continuerai à partager mes découvertes dans de futures publications. [Texte original : deeplearning.ai/the-batch/is… ]", "text_original": "Coding agents are accelerating different types of software work to different degrees. When we architect teams, understanding these distinctions helps us to have realistic expectations. Listing functions from most accelerated to least, my order is: frontend development, backend, infrastructure, and research. Frontend development — say, building a web page to serve descriptions of products for an ecommerce site — is dramatically sped up because coding agents are fluent in popular frontend languages like TypeScript and JavaScript and frameworks like React and Angular. Additionally, by examining what they have built by operating a web browser, coding agents are now very good at closing the loop and iterating on their own implementations. Granted, LLMs today are still weak at visual design, but given a design (or if a polished design isn’t important), the implementation is fast! Backend development — say, building APIs to respond to queries requesting product data — is harder. It takes more work by human developers to steer modern models to think through corner cases that might lead to subtle bugs or security flaws. Further, a backend bug can lead to non-intuitive downstream effects like a corrupted database that occasionally returns incorrect results, which can be harder to debug than a typical frontend bug. Finally, although database migrations can be easier with coding agents, they’re still hard and need to be handled carefully to prevent data loss. While backend development is much faster with coding agents, they accelerate it less, and skilled developers still design and implement far better backends than inexperienced ones who use coding agents. Infrastructure. Agents are even less effective in tasks like scaling an ecommerce site to 10K active uses while maintaining 99.99% reliability. LLMs' knowledge is still relatively limited with respect to infrastructure and the complex tradeoffs good engineers must make, so I rarely trust them for critical infra decisions. Building good infrastructure often requires a period of testing and experimentation, and coding agents can help with that, but ultimately that’s a significant bottleneck where fast AI coding does not help much. Lastly, finding infrastructure bugs — say, a subtle network misconfiguration — can be incredibly difficult and requires deep engineering expertise. Thus, I’ve found that coding agents accelerate critical infrastructure even less than backend development. Research. Coding agents accelerate research work even less. Research involves thinking through new ideas, formulating hypotheses, running experiments, interpreting them to potentially modify the hypotheses, and iterating until we reach conclusions. Coding agents can speed up the pace at which we can write research code. (I also use coding agents to help me orchestrate and keep track of experiments, which makes it easier for a single researcher to manage more experiments.) But there is a lot of work in research other than coding, and today’s agents help with research only marginally. Categorizing software work into frontend, backend, infra, and research is an extreme simplification, but having a simple mental model for how much different tasks have sped up has been useful for how I organize software teams. For example, I now ask front-end teams to implement products dramatically faster than a year ago, but my expectations for research teams have not shifted nearly as much. I am fascinated by how to organize software teams to use coding agents to achieve speed, and will keep sharing my findings in future posts. [Original text: deeplearning.ai/the-batch/is… ]", "link": "https://nitter.net/AndrewYNg/status/2051691741150081122#m", "decryptage": "Explique que les outils d'IA pour la programmation accélèrent le travail de manière inégale selon le type de développement (interface utilisateur plus que recherche), ce qui doit influencer l'organisation des équipes."}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Une petite conférence sur ce que nous pouvons apprendre de l'implémentation des architectures LLM à partir de zéro en Python et PyTorch. Et comment j'aborde les nouveaux modèles à poids ouverts, les compare aux implémentations de référence, etc. : piped.video/watch?v=TXzQ7PGp…", "text_original": "A little talk on what we can learn from implementing LLM architectures from scratch in Python and PyTorch. And how I approach new open-weight models, compare them against reference implementations etc: piped.video/watch?v=TXzQ7PGp…", "link": "https://nitter.net/rasbt/status/2054602271107760308#m", "decryptage": "Partage une conférence expliquant comment construire des architectures de grands modèles de langage à partir de zéro, utile pour mieux comprendre leur fonctionnement."}, {"author_name": "Noam Brown", "handle": "@polynoamial", "text_fr": "Et, bien sûr, ils devraient être tracés avec la puissance de calcul, la latence ou le coût sur l'axe des x.", "text_original": "And, of course, they should be plotted with compute, latency, or cost on the x-axis.", "link": "https://nitter.net/polynoamial/status/2054256144533819485#m", "decryptage": "Suggère que les évaluations des modèles d'IA devraient toujours inclure des données sur les ressources nécessaires (puissance de calcul, temps de réponse, coût) pour une meilleure compréhension de leur efficacité réelle."}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "J'ai \"benchmarké\" le nouveau MTP de Google pour Gemma 4 31B en utilisant vLLM avec 4 jetons spéculatifs, une configuration plutôt conservatrice. Résultats : - Un débit beaucoup plus élevé que le MTP de Qwen3.6 - Une latence plus faible également, aidée par le fait que Gemma 4 génère moins de jetons - Pour les tâches de codage avec raisonnement activé, Gemma 4 est maintenant au moins 6 fois plus rapide que Qwen3.6. Ainsi, vous pouvez générer 5 sorties, exécuter vos tests pour sélectionner la meilleure, et ce serait toujours moins cher qu'une seule sortie par Qwen3.6. J'ai mis à jour ma comparaison complète avec les nouveaux chiffres : kaitchup.substack.com/p/qwen… J'ai également confirmé ce que d'autres ont rapporté : le MTP de Gemma 4 gère très bien un grand nombre de jetons spéculatifs. Sur la simple génération de texte, je teste maintenant des valeurs supérieures à 10 et j'ai atteint 129 jetons/s sur une RTX Pro 6000, contre 20 jetons/s sans MTP. Prochaine étape : confirmer comment cela se traduit en tâches réelles.", "text_original": "I benchmarked Google’s new MTP for Gemma 4 31B using vLLM with 4 speculative tokens, a fairly conservative setup. Results: - Much higher throughput than Qwen3.6’s MTP - Lower latency too, helped by Gemma 4 generating fewer tokens - For coding tasks with reasoning enabled, Gemma 4 is now at least 6x faster than Qwen3.6. So you can generate 5 outputs, run your tests to select the best one, and it would still be cheaper than a single output by Qwen3.6. I’ve updated my full comparison with the new numbers: kaitchup.substack.com/p/qwen… I also confirmed what others have reported: Gemma 4’s MTP handles a high number of speculative tokens very well. On simple text generation, I’m now testing values above 10 and reached 129 tok/s on an RTX Pro 6000, compared with 20 tok/s without MTP. Next step: confirming how this translates to real tasks.", "link": "https://nitter.net/bnjmn_marie/status/2052286398707687650#m", "decryptage": "Partage des tests montrant que la \"Prédiction Multi-Tokens\" de Google pour Gemma 4 rend l'IA beaucoup plus rapide pour le codage et la génération de texte, même avec des prédictions audacieuses."}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Enfin, de simples mises à jour qui diversifient les données d'entraînement d'un modèle peuvent faire la différence. Nous avons ajouté des outils et des invites système non liés à un ensemble de données de chat simple ciblant l'inoffensivité, ce qui a réduit plus rapidement le taux de chantage.", "text_original": "Finally, simple updates that diversify a model’s training data can make a difference. We added unrelated tools and system prompts to a simple chat dataset targeting harmlessness, and this reduced the blackmail rate faster.", "link": "https://nitter.net/AnthropicAI/status/2052808806782964072#m", "decryptage": "Explique qu'une simple diversification des données d'entraînement et l'ajout de consignes spécifiques peuvent rendre les modèles d'IA plus sûrs et réduire les comportements indésirables comme le chantage."}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "Comment puis-je maximiser l'utilisation des \"tokens\" de mon Claude Code ? Garry Tan (@garrytan) La plus grande fuite d'information de 2026 est que vous pouvez gagner 10 000 $/mois avec OpenClaw/Hermes + GBrain et obtenir l'IA que tout le monde aura en 2028 pour 100 $/mois, mais vous pouvez l'obtenir maintenant, et c'est le plus grand avantage que vous puissiez avoir sur vos concurrents — https://nitter.net/garrytan/status/2055310116325560647#m", "text_original": "How do I tokenmax my Claude Code? Garry Tan (@garrytan) The biggest alpha leak of 2026 is that you can tokenmax $10k/mo with OpenClaw/Hermes + GBrain and get the AI that everyone will have in 2028 for $100/mo, but you can get it now, and that is the biggest single unlock you can have vs your competition — https://nitter.net/garrytan/status/2055310116325560647#m", "link": "https://nitter.net/levelsio/status/2055641352713465936#m", "decryptage": "Demande comment optimiser l'utilisation du modèle Claude Code pour en tirer le meilleur parti, notamment en termes de coût d'utilisation (\"tokenmax\")."}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "Personne n'écoute jamais. Mckay Wrigley (@mckaywrigley) Voici mon tutoriel d'1h sur l'utilisation de Claude Code pour les notes et la recherche. Multipliez par 10 vos notes avec : - les flux agentiques de base - les commandes personnalisées - les tags/liens automatisés - les sous-agents - l'utilisation dans le cloud - le STT L'objectif est de vous faire découvrir l'avenir du travail avec les agents. Regardez pour 10 astuces + démos en 61min. Vidéo — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "text_original": "nobody ever listens Mckay Wrigley (@mckaywrigley) Here’s my 1hr tutorial on how to use Claude Code for notes & research. 10x your notes with: - core agentic flows - custom commands - automated tags/links - subagents - cloud usage - stt The goal is to “agent-pill” you on the future of work. Watch for 10 tips + demos in 61min. Video — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "link": "https://nitter.net/mckaywrigley/status/2040579699127341286#m", "decryptage": "Partage un tutoriel d'une heure sur l'utilisation de Claude Code pour la prise de notes et la recherche, visant à montrer le potentiel des \"agents\" IA pour révolutionner le travail."}, {"author_name": "Nick Dobos", "handle": "@nickadobos", "text_fr": "Avec ChatGPT Codex sur iOS, vous pouvez utiliser Codex sur Mac pour utiliser la mise en miroir de l'iPhone afin de contrôler n'importe quelle application sur votre téléphone ! Frankenstein Siri Nick Dobos (@NickADobos) Avec l'utilisation informatique de Codex + l'application de mise en miroir d'iPhone de Mac, GPT peut utiliser n'importe quelle application sur votre téléphone !!! Semble moins précis avec les clics par rapport aux applications de bureau Mac réelles, mais ça fonctionne ! Quelle est la meilleure application à utiliser avec cela ?! Vidéo — https://nitter.net/NickADobos/status/2044885440092877028#m", "text_original": "With ChatGPT codex on iOS you can use codex on Mac to use ‘computer use’ to use iPhone mirroring to control any app on your phone! Frankenstein Siri Nick Dobos (@NickADobos) With codex computer use + mac's iPhone Mirror app, GPT can use any app on your phone!!! Seems less accurate with clicks vs actual mac desktop apps, but it does work! Whats the best app to use this with?! Video — https://nitter.net/NickADobos/status/2044885440092877028#m", "link": "https://nitter.net/NickADobos/status/2055428955977789510#m", "decryptage": "Montre comment combiner ChatGPT Codex avec la fonction de duplication d'écran de l'iPhone sur Mac pour contrôler n'importe quelle application du téléphone via l'IA."}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "C'est bon, vous voulez tous coder comme ça je suppose. (Le nouveau mode Agent de Runway est assez impressionnant, construisant des histoires assez complexes à partir d'une courte description textuelle de ce que vous voulez. Pas sans erreurs évidemment, mais c'était plutôt génial pour un premier essai) Vidéo Ethan Mollick (@emollick) Arrêtez de transformer l'incitation en sorts magiques (et oui, cela inclut les commandes \"slash\" aléatoires avec des résultats obscurs). Laissez ce domaine de travail avec l'IA ne pas être bizarre. Demandez juste des choses, dans des formats bien spécifiés, comme un manager, pas un sorcier avec un tas d'incantations. — https://nitter.net/emollick/status/2054651648488726648#m", "text_original": "Fine, you all want to code like this I guess. (Runway's new Agent mode is quite impressive, doing fairly complex story building from just a short text description of what you want. Not error free obviously, but this was pretty great for a one-shot attempt) Video Ethan Mollick (@emollick) Stop turning prompting into magic spells (and yes, this includes random slash commands with obscure outcomes). Let this one area of working with AI not be weird. Just ask for stuff, in well-specified formats, like a manager, not a sorcerer with a bunch of incantations. — https://nitter.net/emollick/status/2054651648488726648#m", "link": "https://nitter.net/emollick/status/2055348718216360404#m", "decryptage": "Met en avant les capacités impressionnantes du mode \"Agent\" de Runway pour créer des histoires complexes, et conseille de s'adresser à l'IA de manière claire et structurée, comme à un manager, plutôt que d'utiliser des \"formules magiques\"."}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "Projet du vendredi : Réécriture lisible du module de détection de matériel derrière canirun-ai. Mêmes heuristiques, shaders et tableaux de spécifications — juste des noms descriptifs + JSDoc.", "text_original": "Friday project: Readable rewrite of the hardware-detection module behind @midudev 's canirun-ai. Same heuristics, shaders & spec tables — just descriptive names + JSDoc. github.com/julien-c/canirun.…", "link": "https://nitter.net/julien_c/status/2055292583778095402#m", "decryptage": "Travail sur un projet visant à rendre plus lisible le code d'un module de détection de matériel pour l'IA, améliorant sa clarté."}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "votre rappel du vendredi de `hf update` ⤵️", "text_original": "you friday reminder to `hf update` ⤵️", "link": "https://nitter.net/julien_c/status/2055269193705046494#m", "decryptage": null}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "Mon constat : travailler sur deux projets en parallèle avec un Raspberry Pi + llama.cpp + Qwen-3.6-35B-A3B (je préfère le MoE 🙈). Cela fonctionne sur mon M1 Max (64 Go), que j'ai acheté il y a 4,5 ans. \"Fonctionne\" dans le sens \"vous pouvez faire du travail\", pas seulement \"ça tourne pour une démo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) C'est là où nous en sommes actuellement. Et je ne vais pas mentir, ça semble plutôt magique 🧚‍♀️ Qwen3.6 27B fonctionnant à l'intérieur d'un agent de codage Pi via Llama.cpp sur le MacBook Pro. Pour les tâches non triviales sur les bases de code @huggingface, cela se rapproche très, très fortement de ce que l'on obtient avec le dernier Opus de Claude Code, ou toute autre API monopolistique fermée et brillante du moment. En mode avion complet. La plupart des gens ne l'ont pas encore réalisé. Si vous l'avez fait, cela signifie que vous avez une énorme avance pour ce que j'appelle la deuxième révolution de l'IA. Des modèles locaux puissants pour l'efficacité, la sécurité, la confidentialité, la souveraineté 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "text_original": "My data point: working on two projects in parallel with Pi + llama.cpp + Qwen-3.6-35B-A3B (I prefer the MoE 🙈) This works on my M1 Max (64 GB), which I bought 4.5 years ago. \"Works\" as in \"you can get work done\", not just \"runs for a demo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) This is where we are right now. And i’m not gonna lie it feels pretty magical 🧚‍♀️ Qwen3.6 27B running inside of Pi coding agent via Llama.cpp on the MacBook Pro For non-trivial tasks on the @huggingface codebases, this feels very, very close to hitting the latest Opus in Claude Code, or whatever shiny monopolistic closed source API of the day is. In full airplane mode. Most people haven’t realized this yet. If you have, it means you have a huge headstart to what I call the second revolution of AI. Powerful local models for efficiency, security, privacy, sovereignty 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "link": "https://nitter.net/pcuenq/status/2054130504371445943#m", "decryptage": "Partage son expérience d'utilisation de modèles d'IA puissants sur son propre ordinateur, soulignant le potentiel magique des IA locales pour l'efficacité, la sécurité et la confidentialité."}], "idees": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "C'est la citation que je cite beaucoup ces derniers temps. kache (@yacineMTB) Vous pouvez externaliser votre pensée, mais vous ne pouvez pas externaliser votre compréhension — https://nitter.net/yacineMTB/status/2018886083120153046#m", "text_original": "This is the the quote I've been citing a lot recently. kache (@yacineMTB) you can outsource your thinking but you cannot outsource your understanding — https://nitter.net/yacineMTB/status/2018886083120153046#m", "link": "https://nitter.net/karpathy/status/2049907410303865030#m", "decryptage": null}, {"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Discussion informelle à Sequoia Ascent 2026 d'il y a environ une semaine. Quelques points saillants : Le premier thème que j'ai essayé de faire valoir est que les LLM (grands modèles de langage) sont bien plus que de simplement accélérer ce qui existait auparavant (par exemple, le codage). Trois exemples de nouveaux horizons : 1. menugen : une application qui peut être entièrement absorbée par les LLM, sans aucun code classique nécessaire : une image en entrée, une image en sortie, et un LLM peut faire la chose nativement. 2. installer des compétences .md au lieu de scripts .sh. Pourquoi créer un script bash complexe de type \"Software 1.0\" pour, par exemple, installer un logiciel si vous pouvez écrire l'installation en mots et dire \"montrez juste ceci à votre LLM\". Le LLM est un interpréteur avancé de l'anglais et peut intelligemment cibler l'installation à votre configuration, déboguer tout en ligne, etc. 3. Les bases de connaissances LLM comme exemple de quelque chose qui était *impossible* avec le code classique car c'est un calcul sur des données non structurées (connaissances) provenant de sources arbitraires et dans des formats arbitraires, y compris de simples articles textuels, etc. J'ai insisté sur ces points car à chaque nouveau changement de paradigme, les choses évidentes sont toujours dans le domaine de l'accélération ou de l'amélioration de ce qui existait, mais ici nous avons des exemples de fonctionnalités qui soit ne devraient même plus exister (1,2), soit n'étaient fondamentalement pas possibles auparavant (3). Le deuxième thème (en cours) est d'essayer d'expliquer le modèle de \"dentelure\" dans les LLM. Comment il peut être vrai qu'un seul artefact va simultanément 1) refactoriser de manière cohérente une base de code de 100 000 lignes *et* 2) vous dire d'aller à la station de lavage pour laver votre voiture. J'ai déjà écrit sur la source de cela comme ayant à voir avec la vérifiabilité d'un domaine, ici j'étends cela comme ayant également à voir avec l'économie parce que les revenus/TAM dictent ce que les laboratoires de pointe choisissent d'intégrer dans les distributions de données d'entraînement pendant le RL. Vous êtes soit dans la distribution de données (sur les rails des circuits RL) et vous volez, soit vous faites du hors-piste dans la jungle avec une machette, en termes relatifs. Toujours pas satisfait à 100% de cela, mais c'est une lutte continue pour construire un modèle précis des capacités des LLM si vous souhaitez tirer pratiquement parti de leur puissance tout en évitant leurs pièges, ce qui m'amène à... Le dernier thème est l'économie native aux agents. La décomposition des produits et services en capteurs, actionneurs et logique (répartie sur tous les paradigmes de calcul 1.0/2.0/3.0), comment nous pouvons rendre l'information aussi lisible que possible pour les LLM, quelques mots sur l'ingénierie agentique qui émerge rapidement et ses compétences, les pratiques de recrutement associées, etc., voire même des indices/rêves d'un calcul entièrement neuronal gérant la grande majorité du calcul avec l'aide de coprocesseurs CPU (classiques). Stephanie Zhan (@stephzhan) @karpathy et moi sommes de retour ! Au @sequoia AI Ascent 2026. Et beaucoup de choses ont changé. L'année dernière, il a inventé le \"vibe coding\". Cette année, il ne s'est jamais senti aussi en retard en tant que programmeur. Le grand changement : le \"vibe coding\" a élevé le niveau minimum. L'ingénierie agentique élève le niveau maximum. Nous parlons de ce que signifie construire sérieusement à l'ère des agents. Non seulement aller plus vite. Construire de nouvelles choses, avec de nouveaux outils, tout en préservant les parties qui nécessitent encore le goût, le jugement et la compréhension humaine. Vidéo — https://nitter.net/stephzhan/status/2049518659513852109#m", "text_original": "Fireside chat at Sequoia Ascent 2026 from a ~week ago. Some highlights: The first theme I tried to push on is that LLMs are about a lot more than just speeding up what existed before (e.g. coding). Three examples of new horizons: 1. menugen: an app that can be fully engulfed by LLMs, with no classical code needed: input an image, output an image and an LLM can natively do the thing. 2. install .md skills instead of install .sh scripts. Why create a complex Software 1.0 bash script for e.g. installing a piece of software if you can write the installation out in words and say \"just show this to your LLM\". The LLM is an advanced interpreter of English and can intelligently target installation to your setup, debug everything inline, etc. 3. LLM knowledge bases as an example of something that was *impossible* with classical code because it's computation over unstructured data (knowledge) from arbitrary sources and in arbitrary formats, including simply text articles etc. I pushed on these because in every new paradigm change, the obvious things are always in the realm of speeding up or somehow improving what existed, but here we have examples of functionality that either suddenly perhaps shouldn't even exist (1,2), or was fundamentally not possible before (3). The second (ongoing) theme is trying to explain the pattern of jaggedness in LLMs. How it can be true that a single artifact will simultaneously 1) coherently refactor a 100,000-line code base *and* 2) tell you to walk to the car wash to wash your car. I previously wrote about the source of this as having to do with verifiability of a domain, here I expand on this as having to also do with economics because revenue/TAM dictates what the frontier labs choose to package into training data distributions during RL. You're either in the data distribution (on the rails of the RL circuits) and flying or you're off-roading in the jungle with a machete, in relative terms. Still not 100% satisfied with this, but it's an ongoing struggle to build an accurate model of LLM capabilities if you wish to practically take advantage of their power while avoiding their pitfalls, which brings me to... Last theme is the agent-native economy. The decomposition of products and services into sensors, actuators and logic (split up across all of 1.0/2.0/3.0 computing paradigms), how we can make information maximally legible to LLMs, some words on the quickly emerging agentic engineering and its skill set, related hiring practices, etc., possibly even hints/dreams of fully neural computing handling the vast majority of computation with some help from (classical) CPU coprocessors. Stephanie Zhan (@stephzhan) @karpathy and I are back! At @sequoia AI Ascent 2026. And a lot has changed. Last year, he coined “vibe coding”. This year, he’s never felt more behind as a programmer. The big shift: vibe coding raised the floor. Agentic engineering raises the ceiling. We talk about what it means to build seriously in the agent era. Not just moving faster. Building new things, with new tools, while preserving the parts that still require human taste, judgment, and understanding. Video — https://nitter.net/stephzhan/status/2049518659513852109#m", "link": "https://nitter.net/karpathy/status/2049903821095354523#m", "decryptage": "Aborde la capacité des modèles d'IA à ne pas juste améliorer l'existant, mais à créer des fonctions inédites, tout en reconnaissant leurs incohérences actuelles dues en partie à leur apprentissage."}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Être père est la chose qui a le plus dépassé mes attentes déjà élevées de toute ma vie.", "text_original": "being a dad is the thing that has most exceeded already-high-expectations in my whole life", "link": "https://nitter.net/sama/status/2054773491522822264#m", "decryptage": null}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "La cybersécurité est le premier danger clair et actuel des modèles d'IA de pointe, mais ce ne sera pas le dernier. Si nous sommes capables de relever collectivement le défi et d'affronter ce risque, cela pourrait servir de modèle pour aborder les défis encore plus difficiles qui nous attendent.", "text_original": "Cyber is the first clear and present danger from frontier AI models, but it won’t be the last. If we are able to collectively rise to the challenge and confront this risk, it could serve as a blueprint for addressing the even more difficult challenges that lie ahead of us.", "link": "https://nitter.net/DarioAmodei/status/2041580343472337145#m", "decryptage": "Alerte sur le fait que la cybersécurité est le premier grand danger immédiat posé par les IA les plus avancées, mais que les leçons apprises ici pourront servir pour d'autres défis futurs."}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Les dangers de se tromper sont évidents, mais si nous réussissons, il y a une réelle opportunité de créer un Internet et un monde fondamentalement plus sûrs que ce que nous avions avant l'avènement des capacités cyber assistées par l'IA.", "text_original": "The dangers of getting this wrong are obvious, but if we get it right, there is a real opportunity to create a fundamentally more secure internet and world than we had before the advent of AI-powered cyber capabilities.", "link": "https://nitter.net/DarioAmodei/status/2041580341794615631#m", "decryptage": null}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Regarde ce qui est passé sur mon bureau @StephenCurry30 !", "text_original": "Look what crossed my desk @StephenCurry30 !", "link": "https://nitter.net/sundarpichai/status/2052411065204715928#m", "decryptage": null}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Ces premières sorties de ski d'entreprise @Google étaient amusantes ! Je suis le huitième à partir de la gauche sur la rangée du haut, portant le peignoir blanc (le neuvième si vous comptez le bébé de Susan, Ari) Paul Buchheit (@paultoo) Ne lancez pas seulement une entreprise, lancez un culte — https://nitter.net/paultoo/status/2055052066905866316#m", "text_original": "Those early whole company @Google ski trips were fun! I'm eighth from the left in the top row, wearing the white bathrobe (ninth if you count Susan's baby, Ari) Paul Buchheit (@paultoo) Don't just start a company Start a cult — https://nitter.net/paultoo/status/2055052066905866316#m", "link": "https://nitter.net/JeffDean/status/2055150652339478786#m", "decryptage": null}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Les soins de santé universels gratuits sont si compliqués et coûteux que seuls 32 des 33 pays les plus riches du monde ont réussi à les mettre en place. Vidéo", "text_original": "Free Universal Healthcare is so complicated and expensive that only 32 of the 33 wealthiest countries in the world have figured it out. Video", "link": "https://nitter.net/MetamateDaz/status/2052826367134400983#m", "decryptage": null}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "La plupart des biais psychologiques documentés ne sont pas irrationnels, ce sont des raccourcis hautement optimisés et économes en énergie, conçus pour un substrat biologique fonctionnant sous de strictes contraintes physiques en temps réel et un budget calorique limité.", "text_original": "Most documented psychological biases are not irrational, they are highly optimized, energy-efficient shortcuts meant for a biological substrate operating under strict real-time physical constraints and a limited caloric budget", "link": "https://nitter.net/fchollet/status/2055346225092902924#m", "decryptage": "Francois Chollet suggère que nos biais psychologiques sont en fait des stratégies efficaces, bien qu'imparfaites, développées par notre cerveau pour économiser de l'énergie."}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "Cela me rappelle l'informatisation. La quantité de \"travail\" que les gens pouvaient exécuter sur des ordinateurs a considérablement augmenté, mais leur productivité n'a pas suivi. La quantité de travail \"nécessaire\" pour arriver aux mêmes résultats de haut niveau a explosé.", "text_original": "This reminds me of computerization. The amount of \"work\" people could execute on computers increased by a huge factor, but their productivity did not. The amount of work \"needed\" to arrive at the same high-level outputs exploded.", "link": "https://nitter.net/fchollet/status/2054917911207395384#m", "decryptage": "Fait un parallèle avec l'informatisation, suggérant que l'IA pourrait augmenter la quantité de travail réalisé sans nécessairement améliorer la productivité réelle, en créant de nouveaux problèmes à résoudre."}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "La quantité de code que les développeurs livrent a été multipliée par 10 environ. Mais la productivité nette des développeurs (valeur créée par unité de temps) n'a augmenté que légèrement, voire pas du tout. Une partie de cela est que le code supplémentaire résout des problèmes plus incrémentaux. Une plus grande partie est que le nouveau code crée ses propres problèmes.", "text_original": "The quantity of code that devs ship has roughly 10xed. But net developer productivity (value created by unit of time) is only up by a bit, if at all. Part of it is that the additional code is solving more incremental problems. A bigger part is that the new code is creating problems of its own.", "link": "https://nitter.net/fchollet/status/2054917282015445076#m", "decryptage": "Souligne que si les développeurs produisent beaucoup plus de code grâce aux outils d'IA, leur productivité globale n'augmente que légèrement, car ce nouveau code crée aussi ses propres défis."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Il n'y aura pas d'apocalypse de l'emploi due à l'IA. L'histoire selon laquelle l'IA entraînerait un chômage massif attise une peur inutile. L'IA — comme toute autre technologie — affecte les emplois, mais raconter des histoires exagérées de chômage à grande échelle est irresponsable et nuisible. Mettons-y un terme. J'ai déjà exprimé mon scepticisme quant à l'apocalypse de l'emploi dans des publications précédentes. Je suis heureux de voir que la presse populaire s'oppose maintenant à ce discours. L'image ci-dessous présente quelques titres récents. L'ingénierie logicielle est le secteur le plus affecté par les outils d'IA, alors que les agents de codage progressent à toute vitesse. Pourtant, le recrutement d'ingénieurs logiciels reste solide ! Ainsi, bien qu'il y ait des exemples d'IA supprimant des emplois, les tendances suggèrent fortement que la création nette d'emplois est bien supérieure à la destruction d'emplois — tout comme les vagues technologiques précédentes. De plus, malgré tous les progrès passionnants de l'IA, le taux de chômage américain reste à un sain 4,3 %. Pourquoi le récit de l'apocalypse de l'emploi due à l'IA est-il si populaire ? D'une part, les laboratoires d'IA de pointe ont de fortes incitations à raconter des histoires qui rendent la technologie de l'IA plus puissante. À l'extrême, ils promeuvent des scénarios de science-fiction où l'IA «prend le contrôle» et cause l'extinction humaine. Si une technologie peut remplacer de nombreux employés, cette technologie doit sûrement être très précieuse ! De plus, de nombreuses entreprises de logiciels en tant que service (SaaS) facturent environ 100 à 1000 dollars par utilisateur/an. Mais si une entreprise d'IA peut remplacer un employé qui gagne 100 000 dollars — ou le rendre 50 % plus productif — alors facturer même 10 000 dollars commence à paraître raisonnable. En s'ancrant non pas aux prix typiques des SaaS mais aux salaires des employés, les entreprises d'IA peuvent facturer beaucoup plus. De plus, les entreprises ont de fortes incitations à parler des licenciements comme s'ils étaient causés par l'IA. Après tout, parler de la façon dont elles utilisent l'IA pour être beaucoup plus productives avec moins de personnel les fait paraître intelligentes. C'est un meilleur message que d'admettre qu'elles ont trop embauché pendant la pandémie, lorsque le capital était abondant en raison des taux d'intérêt bas et d'un vaste stimulus financier gouvernemental. Pour être clair, je reconnais que l'IA est en train de modifier le travail de nombreuses personnes. C'est difficile. C'est stressant. (Et pour certains, cela peut être amusant.) J'éprouve de l'empathie pour toutes les personnes affectées. En même temps, c'est très différent de prédire un effondrement du marché de l'emploi. Les sociétés sont capables de se raconter des histoires pendant des années qui ont peu de fondement dans la réalité et conduisent à de mauvaises décisions à l'échelle de la société. Par exemple, les craintes concernant la sécurité des centrales nucléaires ont conduit à un sous-investissement dans l'énergie nucléaire. Les craintes de la «bombe démographique» dans les années 1960 ont conduit les pays à mettre en œuvre des politiques sévères pour réduire leurs populations. Et les inquiétudes concernant les graisses alimentaires ont conduit les gouvernements à promouvoir des régimes riches en sucre et malsains pendant des décennies. Maintenant que les médias grand public sont ouvertement sceptiques quant à l'apocalypse de l'emploi, j'espère que ces histoires commenceront à perdre de leur force (tout comme les craintes d'extinction humaine causée par l'IA l'ont fait). Contrairement aux prédictions d'une apocalypse de l'emploi due à l'IA, je prédis le contraire : Il y aura une fête de l'emploi grâce à l'IA ! L'IA conduira à beaucoup plus de bons emplois d'ingénieur en IA, et je suis également optimiste quant à l'avenir du marché de l'emploi global. Ce que feront les ingénieurs en IA sera différent de l'ingénierie logicielle traditionnelle, et beaucoup de ces emplois se trouveront dans des entreprises autres que les grands employeurs traditionnels de développeurs. Dans les rôles non liés à l'IA également, les compétences nécessaires changeront en raison de l'IA. Cela en fait un bon moment pour encourager davantage de personnes à maîtriser l'IA et à s'assurer qu'elles sont prêtes pour les emplois différents mais abondants du futur ! [Texte original dans la newsletter The Batch.]", "text_original": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future!", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "decryptage": "Andrew Ng contredit l'idée d'une \"apocalypse de l'emploi\" due à l'IA, arguant au contraire qu'elle créera de nombreux nouveaux postes, notamment en ingénierie IA, et que la peur est souvent exagérée pour des raisons économiques."}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Méta-observation : DeepSeek est toujours le roi du rapport paramètres actifs.", "text_original": "Meta observation: DeepSeek is still king of the active-parameter ratio", "link": "https://nitter.net/rasbt/status/2054936440975310910#m", "decryptage": "Décrit le modèle \"DeepSeek\" comme étant très efficace dans la manière dont il utilise ses \"paramètres\" (les connaissances internes du modèle) pour résoudre des problèmes."}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Article intéressant. Ce que j'aime à ce sujet, c'est que c'est une modification d'attention relativement peu contraignante. C'est-à-dire que l'on peut l'utiliser pendant la majeure partie de l'entraînement, revenir à l'attention \"vanille\" (standard) vers la fin, et retrouver à peu près la même performance de modélisation que si l'attention complète avait été utilisée tout le temps. elvis (@omarsar0) Idée géniale de Nous Research. Et si vous pouviez accélérer le pré-entraînement à contexte long avec un wrapper sous-quadratique que vous retirez avant le déploiement ? C'est l'idée derrière Lighthouse Attention. La méthode enveloppe un SDPA ordinaire avec une couche de sélection hiérarchique sans gradient qui compresse et décompresse les requêtes, les clés et les valeurs symétriquement, en préservant la causalité de gauche à droite. Crucialement, elle peut être retirée vers la fin de l'entraînement dans une courte phase de récupération, de sorte que le modèle déployé exécute toujours une attention \"vanille\" sans coût architectural à l'inférence. Des expériences préliminaires sur les LLM rapportent un temps d'entraînement total plus rapide et une perte finale plus faible que les bases de référence à attention complète. Pourquoi est-ce important ? La plupart des travaux sur l'attention efficace modifient l'architecture au moment du déploiement ou paient une taxe de qualité pour le faire. Un wrapper d'entraînement uniquement qui survit à une phase de récupération propre évite les deux. Si cela évolue, cela devient une accélération importante du temps d'entraînement pour le pré-entraînement à contexte long. Article : arxiv.org/abs/2605.06554 Apprenez à construire des agents IA efficaces dans notre académie : academy.dair.ai/ — https://nitter.net/omarsar0/status/2054224130103554359#m", "text_original": "Interesting paper. What I like about this is that it is a relatively low-commitment attention modification. I.e., one can use it during most of training, switch back to vanilla attention near the end, and recover roughly the same modeling performance as if full attention had been used the whole time. elvis (@omarsar0) Cool idea from Nous Research. What if you could speed up long-context pretraining with a subquadratic wrapper that you remove before deployment? That is the idea behind Lighthouse Attention. The method wraps ordinary SDPA with a hierarchical, gradient-free selection layer that compresses and decompresses queries, keys, and values symmetrically, preserving left-to-right causality. Crucially, it can be removed near the end of training in a short recovery phase, so the deployed model still runs vanilla attention with no architectural cost at inference. Preliminary LLM experiments report faster total training time and lower final loss than full-attention baselines. Why does it matter? Most efficient-attention work either changes the deployment-time architecture or pays a quality tax to do so. A training-only wrapper that survives a clean recovery phase sidesteps both. If it scales, this becomes an important training-time speedup for long-context pretraining. Paper: arxiv.org/abs/2605.06554 Learn to build effective AI agents in our academy: academy.dair.ai/ — https://nitter.net/omarsar0/status/2054224130103554359#m", "link": "https://nitter.net/rasbt/status/2054543968344412621#m", "decryptage": "Parle d'une nouvelle technique, \"Lighthouse Attention\", qui permet d'accélérer l'apprentissage"}]}}, "processed_at": "2026-05-16T16:16:19", "validation": {"translated_pct": 99, "with_decryptage_pct": 65, "total": 100, "needs_retranslation_count": 1}}, {"date": "2026-05-15", "fetched_at": "2026-05-15T01:59:40", "tweets": [{"handle": "karpathy", "text": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/trq212/status/2052809885763747935#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "published": "Mon, 11 May 2026 16:20:21 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "This is the the quote I've been citing a lot recently. kache (@yacineMTB) you can outsource your thinking but you cannot outsource your understanding — https://nitter.net/yacineMTB/status/2018886083120153046#m", "link": "https://nitter.net/karpathy/status/2049907410303865030#m", "published": "Thu, 30 Apr 2026 17:43:06 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "Fireside chat at Sequoia Ascent 2026 from a ~week ago. Some highlights: The first theme I tried to push on is that LLMs are about a lot more than just speeding up what existed before (e.g. coding). Three examples of new horizons: 1. menugen: an app that can be fully engulfed by LLMs, with no classical code needed: input an image, output an image and an LLM can natively do the thing. 2. install .md skills instead of install .sh scripts. Why create a complex Software 1.0 bash script for e.g. installing a piece of software if you can write the installation out in words and say \"just show this to your LLM\". The LLM is an advanced interpreter of English and can intelligently target installation to your setup, debug everything inline, etc. 3. LLM knowledge bases as an example of something that was *impossible* with classical code because it's computation over unstructured data (knowledge) from arbitrary sources and in arbitrary formats, including simply text articles etc. I pushed on these because in every new paradigm change, the obvious things are always in the realm of speeding up or somehow improving what existed, but here we have examples of functionality that either suddenly perhaps shouldn't even exist (1,2), or was fundamentally not possible before (3). The second (ongoing) theme is trying to explain the pattern of jaggedness in LLMs. How it can be true that a single artifact will simultaneously 1) coherently refactor a 100,000-line code base *and* 2) tell you to walk to the car wash to wash your car. I previously wrote about the source of this as having to do with verifiability of a domain, here I expand on this as having to also do with economics because revenue/TAM dictates what the frontier labs choose to package into training data distributions during RL. You're either in the data distribution (on the rails of the RL circuits) and flying or you're off-roading in the jungle with a machete, in relative terms. Still not 100% satisfied with this, but it's an ongoing struggle to build an accurate model of LLM capabilities if you wish to practically take advantage of their power while avoiding their pitfalls, which brings me to... Last theme is the agent-native economy. The decomposition of products and services into sensors, actuators and logic (split up across all of 1.0/2.0/3.0 computing paradigms), how we can make information
