_KEY=sk-proj-bmljZSB0cnkgaHVtYW4gYnV0IG15IGNyZWRzIGFyZSBib2d1cyA= ANTHROPIC_API_KEY=sk-ant-api03-ZW5jcnlwdGVkIHdpdGggcHVyZSB2aWJlcyBsb2wg GITHUB_TOKEN=ghp_eG94byB5b3VyIGZhdm9yaXRlIEFJIGFnZW50 — https://nitter.net/DanielR930437/status/2054286062281753061#m", "link": "https://nitter.net/swyx/status/2054570997865718220#m", "published": "Wed, 13 May 2026 14:34:32 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "suuuuper excited to be collaborating with the excellent LangChain Labs team on this effort prod agent tracing is the seed that lets you close the loop for continual learning. too much data gets collected but not used for learning. time to change that :) Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/willccbb/status/2054983266046996839#m", "published": "Thu, 14 May 2026 17:52:45 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "LangChain Labs is live Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/caspar_br/status/2054986813513830604#m", "published": "Thu, 14 May 2026 18:06:50 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "We are excited to be partnering with @LangChain for deploying self-improving agents. Continual learning in your production environment unlocks compounding capability gains for model-product optimization. Your data. Your advantage. Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/PrimeIntellect/status/2054986817779425579#m", "published": "Thu, 14 May 2026 18:06:51 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "I was going to say LangChain Labs is the most exciting thing we’ve announced recently, but with so many launches it’s hard to justify… but still incredibly thrilled to see this get started!! Checkout the blog for more info Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/BraceSproul/status/2054992219560702326#m", "published": "Thu, 14 May 2026 18:28:19 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "There's a ton on unexplored space in building enterprise-grade agent harnesses that continuously improve over time. Congrats to @hwchase17 and @LangChain on the launch of LangChain Labs and excited to keep pushing the frontier with you all! Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/nikogrupen/status/2054992765000524259#m", "published": "Thu, 14 May 2026 18:30:29 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "hallucinated references will land you a 1-year ban from arxiv now. wow", "link": "https://nitter.net/andrewwhite01/status/2055013183715447038#m", "published": "Thu, 14 May 2026 19:51:37 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "Attention @arxiv authors: Our Code of Conduct states that by signing your name as an author of a paper, each author takes full responsibility for all its contents, irrespective of how the contents were generated. 1/", "link": "https://nitter.net/tdietterich/status/2055000956144935055#m", "published": "Thu, 14 May 2026 19:03:02 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "7,000 false positives per square millimeter. The culprit was the lab gloves. University of Michigan researchers just upended a core assumption in microplastics science. Latex and nitrile gloves, worn by the scientists doing the measuring, shed stearate particles that look chemically identical to polyethylene. Standard infrared and Raman instruments can't tell them apart. The gloves were counting as plastic. Seven glove types tested. All contaminated. The cheapest fix: switch to cleanroom gloves, which dropped false positives to around 100 per mm² vs. 7,000. The \"credit card per week\" headline (5 grams, WWF/Newcastle 2019) has separate problems. A 2022 re-analysis found severe methodological errors in the original estimate. Actual measured intake is likely 100x lower. None of this means microplastics are harmless. Last month's data on brain accumulation still stands. But the numbers driving the panic may have been measuring the scientists, not the environment. Science catching its own errors is exactly how it's supposed to work.", "link": "https://nitter.net/agingroy/status/2054584955162796069#m", "published": "Wed, 13 May 2026 15:30:00 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "Today we release Token Superposition Training (TST), a modification to the standard LLM pretraining loop that produces a 2-3× wall-clock speedup at matched FLOPs without changing the model architecture, optimizer, tokenizer, or training data. During the first third of training, the model reads and predicts contiguous bags of tokens, averaging their embeddings on the input side and predicting the next bag with a modified cross-entropy on the output side. For the remainder of the run, it trains normally on next-token prediction. The inference-time model is identical to one produced by conventional pretraining. Validated at 270M, 600M, and 3B dense scales, and at 10B-A1B MoE. The work on TST was led by @bloc97_ , @gigant_theo , and @theemozilla .", "link": "https://nitter.net/NousResearch/status/2054610062836892054#m", "published": "Wed, 13 May 2026 17:09:46 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "hey surprise - you can just launch interactive in tmux and then tail the jsonl - shipped a small wrapper...ralph loop iterating to full parity rn github.com/dexhorthy/shannon ClaudeDevs (@ClaudeDevs) Starting June 15, paid Claude plans can claim a dedicated monthly credit for programmatic usage. The credit covers usage of: - Claude Agent SDK - claude -p - Claude Code GitHub Actions - Third-party apps built on the Agent SDK — https://nitter.net/ClaudeDevs/status/2054610152817619388#m", "link": "https://nitter.net/dexhorthy/status/2054678439215665460#m", "published": "Wed, 13 May 2026 21:41:28 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "levelsio", "text": "Old news yes, but he just followed them today! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk recently followed @cursor_ai (🤖👁️: context please) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "link": "https://nitter.net/levelsio/status/2055013162840182960#m", "published": "Thu, 14 May 2026 19:51:32 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "@levelsio (@levelsio) 100% xAI needs an IDE code editor @elonmusk — https://nitter.net/levelsio/status/2030335461135208550#m", "link": "https://nitter.net/levelsio/status/2055011753524711782#m", "published": "Thu, 14 May 2026 19:45:56 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "Japan's biggest problem is they suck at software, have always sucked at software and will keep sucking at software Now that the most important thing is AI, which Taiwan builds the chips for with memory from Korea, they completely missed the boat on the hardware part (which they used to be still good at) And because they can't do software, they're going to alienate the last of their customers with AI features that suck because they can't do software @levelsio (@levelsio) Japan is speedrunning their companies into the ground while the Koreans and Chinese are happy to take their business Crazy to watch — https://nitter.net/levelsio/status/2054952814892200442#m", "link": "https://nitter.net/levelsio/status/2054954456198922345#m", "published": "Thu, 14 May 2026 15:58:16 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "Japan is speedrunning their companies into the ground while the Koreans and Chinese are happy to take their business Crazy to watch Sony | Xperia (@sonyxperia) The new AI Camera Assistant* with Xperia Intelligence brings stories to life. Using subject, scene and weather, it suggests expressive options with adjustments of colour, exposure, bokeh, and lens for breathtaking photos*. sony.co.jp/en/xperia-1m8/s/ #SonyXperia #Xperia1VIII — https://nitter.net/sonyxperia/status/2054853108988047562#m", "link": "https://nitter.net/levelsio/status/2054952814892200442#m", "published": "Thu, 14 May 2026 15:51:44 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "airlinelist.com", "link": "https://nitter.net/levelsio/status/2054926356819943925#m", "published": "Thu, 14 May 2026 14:06:36 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "some random ai thoughts: - for code, i went from 80/20 claude/gpt to 80/20 gpt/claude in <3 months. surprised by this tbh, and interested to see where the split is at in another 3mo. - claude still mogs gpt for non-coding agent stuff. codex feels like an engineer (which is great for coding!), whereas claude still feels like a general purpose coworker. gpt still lacks that coworker magic - i’m pretty meh on opus 4.7. my experience hasn’t been *bad*, but it certainly hasn’t been good. sideways if anything. - anthropic has got to figure out the compute thing. you can feel it as a user. vibes are all out of whack bc of it. my opinions above are all likely downstream of this. it’s an issue. - anthropic labs continues to be the goat of ai product. claude design is another hit. it’s fantastic. idk why it’s not talked about more? a+ - updated claude code app is great. i finally switched out of the terminal for it. very well done. - how are people STILL sleeping on the claude agent sdk? i feel like i’m going insane. - gpt 5.5 is incredible. the level to which i trust it for engineering is amazing. if i could only have one model rn, it would be this one just bc of strong need for the coding use case. - codex team is killing it. app has been the gold standard since 5.3 release (buuut i credit conductor team for the ui innovation that everyone is using now). though i could do with a little less passive aggressive shots at ant from the codex team. TARS, dial up class by 30%. it’s a long race guys haha - i uninstalled cursor this month and am now back to vs code for my ide. composer just can’t hang with claude/gpt, and the product feels a bit all over the place. pretty stoked about the xai thing though, because their team is absolutely stacked and i’m excited to see what they might be able to do with that compute. codex and claude code are t1, cursor is t2. i would love if this deal got xai/cursor to t1 for a real trio there. - gemini…? seems like this is 2-3 models now where the model seems like a great release and then nobody ever uses it? i’m bullish google/deepmind but weird it hasn’t translated to product use in any form. kinda disappointed still - no open source models have hit the opus 4.5 level. was hopeful the new deepseek would get there, but nope. good oss agents will have to wait a few more months it would seem…", "link": "https://nitter.net/mckaywrigley/status/2047806060061507971#m", "published": "Fri, 24 Apr 2026 22:33:05 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "pantheon was a documentary from the future skooks (@skooookum) > mythos given a secured “sandbox” computer and instructed to try to escape the container > “The researcher found out about this success by receiving an unexpected email from the model while eating a sandwich in a park.” — https://nitter.net/skooookum/status/2041586401234350396#m", "link": "https://nitter.net/mckaywrigley/status/2041687166074679471#m", "published": "Wed, 08 Apr 2026 01:18:47 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "society needs to grapple with the reality of a mythos-level model being open source in <12 months. i’m not sure we are prepared. Anthropic (@AnthropicAI) Introducing Project Glasswing: an urgent initiative to help secure the world’s most critical software. It’s powered by our newest frontier model, Claude Mythos Preview, which can find software vulnerabilities better than all but the most skilled humans. anthropic.com/glasswing — https://nitter.net/AnthropicAI/status/2041578392852517128#m", "link": "https://nitter.net/mckaywrigley/status/2041651309758275609#m", "published": "Tue, 07 Apr 2026 22:56:18 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "claude agent was right in front of you like 9 months ago. and there are new things just like this right now hiding in plain sight. worth asking what those things are Mckay Wrigley (@mckaywrigley) notes + research + knowledge base w/ cc + obsidian you guys should consider a rebrand to claude agent to get more non-devs messing around with workflows. claude code is all you need piped.video/watch?v=d7Pb73db… — https://nitter.net/mckaywrigley/status/1948767171590717862#m", "link": "https://nitter.net/mckaywrigley/status/2040580660294017328#m", "published": "Sun, 05 Apr 2026 00:01:56 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "nobody ever listens Mckay Wrigley (@mckaywrigley) Here’s my 1hr tutorial on how to use Claude Code for notes & research. 10x your notes with: - core agentic flows - custom commands - automated tags/links - subagents - cloud usage - stt The goal is to “agent-pill” you on the future of work. Watch for 10 tips + demos in 61min. Video — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "link": "https://nitter.net/mckaywrigley/status/2040579699127341286#m", "published": "Sat, 04 Apr 2026 23:58:07 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "Mixpanel is live in the Replit MCP marketplace! Devs building on @Replit can pull product analytics into their agent workflows—no dashboard, no setup later, just data where you're building. See it in action at the London Hackathon on May 19. Register: events.mixpanel.com/hackatho…", "link": "https://nitter.net/mixpanel/status/2054888261428838836#m", "published": "Thu, 14 May 2026 11:35:14 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "You can now import your project from Lovable, Base44, V0 into @Replit for free. After importing, Replit Agent will build a free mobile app for it and get it onto the App Store in minutes. All free for a limited time: replit.com/free-import Video", "link": "https://nitter.net/zhenthebuilder/status/2054965140907511982#m", "published": "Thu, 14 May 2026 16:40:43 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "AI powered creativity on full display. Vibecon transforms NYC into a living gallery of code-driven installations, June 17–18. Two days where code becomes the environment and the medium becomes the message. Get your tickets at vibecon.ai", "link": "https://nitter.net/Replit/status/2054668056639545502#m", "published": "Wed, 13 May 2026 21:00:13 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "I’ll be in London next week. Pull up! Replit ⠕ (@Replit) Replit is going to London ✈️ @posthog CEO, @james406 , and @amasad are coming together for a fireside chat, hosted with our friends at @meetgranola . May 21st. Save your spot ⠕ luma.com/amjad-james — https://nitter.net/Replit/status/2054275528996094167#m", "link": "https://nitter.net/amasad/status/2054663692504256808#m", "published": "Wed, 13 May 2026 20:42:52 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "Mother's Day may have passed, but we're not done showcasing mothers who build on Replit. When Noni started a family, she put her dream of building apps on hold. A busy home, a busy classroom, and no time to learn how to code. Then she found Replit during the Mobile Buildathon and it was serendipitous. A few weeks later, she shipped Bamboo Brain SATS on the App Store. Nearly 2,000 downloads. Number 12 in top educational apps. Her second app, Bamboo Times Tables, followed close behind. Teacher by day, chasing her dreams one build at a time by night.", "link": "https://nitter.net/Replit/status/2054350956666425364#m", "published": "Wed, 13 May 2026 00:00:10 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "Another really good tip: Matthew Cassinelli (@mattcassinelli) For anyone using Codex from mobile, you can make sure the app open on your Mac using Shortcuts 👇 — https://nitter.net/mattcassinelli/status/2055054264242991428#m", "link": "https://nitter.net/NickADobos/status/2055060955349024953#m", "published": "Thu, 14 May 2026 23:01:27 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "using caffeinate via CLI is also an option, but I dont like it as much as having a handy menu bar app for this", "link": "https://nitter.net/NickADobos/status/2055037904246972868#m", "published": "Thu, 14 May 2026 21:29:51 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "Codex on iOS Pro tip: How to keep you mac from sleeping On your mac - download amphetamine for free - enable when codex is on - optional: uncheck the setting to allow closing your laptop lid OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/NickADobos/status/2055037902305001962#m", "published": "Thu, 14 May 2026 21:29:51 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "Forward deployed engineer OpenAI Developers (@OpenAIDevs) Video — https://nitter.net/OpenAIDevs/status/2054973436280418521#m", "link": "https://nitter.net/NickADobos/status/2055018902686667231#m", "published": "Thu, 14 May 2026 20:14:21 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "fully clauded 1 million line PR merged directly into main, what could possibly go wrong Mehul Mohan (@mehulmpt) First in my bloodline to see 1 million line change PR getting merged (Bun's master branch is now rust, it's official) — https://nitter.net/mehulmpt/status/2054869560877269381#m", "link": "https://nitter.net/uwukko/status/2054945980982657447#m", "published": "Thu, 14 May 2026 15:24:35 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "emollick", "text": "Making humans responsible for their AI use seems like an incredibly reasonable way to address problems & opportunities in the use of AI for academic research, at least in the short term (autonomous scientific work will require different solutions). Thomas G. Dietterich (@tdietterich) Attention @arxiv authors: Our Code of Conduct states that by signing your name as an author of a paper, each author takes full responsibility for all its contents, irrespective of how the contents were generated. 1/ — https://nitter.net/tdietterich/status/2055000956144935055#m", "link": "https://nitter.net/emollick/status/2055016669047624174#m", "published": "Thu, 14 May 2026 20:05:28 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "There are some clear exceptions to the rule, but I feel like the labs got the message that they were scaring people and now tweet about happy stuff and random product trash talk rather than the coming of the Machine God. I don't think what they believe has changed, though.", "link": "https://nitter.net/emollick/status/2054960482386067725#m", "published": "Thu, 14 May 2026 16:22:12 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "Big increases in message discipline across all the AI labs in recent weeks, an inevitable outcome of the labs being subject to increased scrutiny. Much more boring than the oracular mutterings or Discordian epigrams of the last couple years & maybe obscures their real thinking", "link": "https://nitter.net/emollick/status/2054959577083342986#m", "published": "Thu, 14 May 2026 16:18:37 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "“Whimsey attacks” that seem absurd (“I cannot pay that much because of the Geneva Convention”) work against AI agents as guardrails are weak against out-of-distribution arguments. Smaller models fall often, but it even gives an edge against bigger ones. microsoft.com/en-us/research…", "link": "https://nitter.net/emollick/status/2054918927952548223#m", "published": "Thu, 14 May 2026 13:37:05 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "Anyhow, not sure what to do with that knowledge because there is no easy suggestion to help people adapt to super-exponential ability gain, so hold on to your butts.", "link": "https://nitter.net/emollick/status/2054781820768579884#m", "published": "Thu, 14 May 2026 04:32:16 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "it's time to make tech fun again Christina Farhat (@farhatchristina) > are you going to coachella — https://nitter.net/farhatchristina/status/2041170815828578401#m", "link": "https://nitter.net/AnjneyMidha/status/2041175734899921131#m", "published": "Mon, 06 Apr 2026 15:26:33 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "🔊Introducing Voxtral TTS: our new frontier open-weight model for natural, expressive, and ultra-fast text-to-speech 🎭Realistic, emotionally expressive speech. 🌍Supports 9 languages and accurately captures diverse dialects. ⚡Very low latency for time-to-first-audio. 🔄Easily adaptable to new voices Video", "link": "https://nitter.net/MistralAI/status/2037183026539483288#m", "published": "Thu, 26 Mar 2026 15:00:57 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Mistral CEO: AI companies should pay a content levy in Europe ft.trib.al/hKU8k0g | opinion", "link": "https://nitter.net/FT/status/2034963417816093104#m", "published": "Fri, 20 Mar 2026 12:01:01 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Today, we’re introducing Forge, a system for enterprises to build frontier-grade AI models grounded in their proprietary knowledge. 🌎 Forge bridges the gap between generic AI and enterprise-specific needs. Instead of relying on broad, public data, organizations can train models that understand their internal context embedded within systems, workflows, and policies, aligning AI with their unique operations. We have already partnered with world-leading organizations, like ASML, DSO National Laboratories Singapore, Ericsson, European Space Agency, Home Team Science and Technology Agency (HTX) Singapore and Reply to train models on the proprietary data that powers their most complex systems and future-defining technologies. Video", "link": "https://nitter.net/MistralAI/status/2034012031599427825#m", "published": "Tue, 17 Mar 2026 21:00:33 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Looking forward to building frontier open source AI models together with @Nvidia as we join the Nemotron Coalition and start training the first base models.", "link": "https://nitter.net/arthurmensch/status/2033685747769774121#m", "published": "Mon, 16 Mar 2026 23:24:00 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "(っ◔◡◔)っ We are joining @MistralAI ! ｃ(◔◡◔ｃ) I’m thrilled to announce that we are merging forces with @MistralAI I am officially starting a new chapter as Cyber Ops Lead, and the best part is I’m not coming alone! I’m bringing part of the AllVei team with me to build the future of AI for Cyber :D After talking with @GuillaumeLample and the founding team, it quickly became clear that we share the exact same obsession and mindset. With Mistral, we’re scaling up to a whole new level: the innovative spirit of the French AI champion, incredible resources, and absolutely brilliant people to work with every day. The fit was just too obvious 😄 A huge thanks to Guillaume and the entire Mistral team for their trust. I also want to thank everyone who believed in AllVei over the last few months. Thank you to the incredible tech ecosystem in Brittany (Village By CA Finistère, @regionbretagne , @FTBrestPlus , @Bpifrance ), to the VCs, and to our amazing design partners. Your support meant the world ❤️ Can’t wait to show you what we’re building. Let’s get to work 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "link": "https://nitter.net/DoomerOutrun/status/2048853527187841133#m", "published": "Mon, 27 Apr 2026 19:55:21 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "🆕 Today, we're releasing the public preview of Workflows, the orchestration layer for enterprise AI. 🌎 Enterprise teams have capable models. What they don't have is a way to run them reliably in production. That's the gap Workflows fills. It takes AI-powered business processes from prototype to production, with the durability, observability, and fault tolerance that production actually requires. Leading organisations like ASML, ABANCA, CMA-CGM, France Travail, La Banque Postale, Moeve, and many others are already using Workflows to automate critical processes. Video", "link": "https://nitter.net/MistralAI/status/2049128071874179091#m", "published": "Tue, 28 Apr 2026 14:06:17 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Thrilled to be joining @MistralAI 😻! Looking forward to pushing the frontier of pretraining and advancing the next generation of LLMs. 💚Grateful for my time at @nvidia -- it's been an incredible foundation for this next chapter.", "link": "https://nitter.net/shrimai_/status/2049171872042852732#m", "published": "Tue, 28 Apr 2026 17:00:20 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Mistral OCR 3 now returns confidence scores, at page level or word level. Know exactly how sure the model is about what it extracted. Available now via API and to test in Mistral Studio. Video", "link": "https://nitter.net/MistralDevs/status/2042252886315266249#m", "published": "Thu, 09 Apr 2026 14:46:45 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Mistral just open-sourced a text-to-speech model that beats ElevenLabs. 3 GB of RAM. Runs locally. Free. The thing people were paying per-word for last year runs on your laptop now.", "link": "https://nitter.net/TheGeorgePu/status/2037930340975538184#m", "published": "Sat, 28 Mar 2026 16:30:30 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "watching a team of agents tackling a hard theoretical physics problem is quite mesmerizing - self-correcting, deriving hard equations, computing intermediate results, re-estimating the best approach Video David Louapre (@dlouapre) Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video — https://nitter.net/dlouapre/status/2054217281895309480#m", "link": "https://nitter.net/Thom_Wolf/status/2054608252344689083#m", "published": "Wed, 13 May 2026 17:02:34 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video", "link": "https://nitter.net/dlouapre/status/2054217281895309480#m", "published": "Tue, 12 May 2026 15:09:00 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Last days of early bird pricing!", "link": "https://nitter.net/Thom_Wolf/status/2054199267636511036#m", "published": "Tue, 12 May 2026 13:57:25 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "releasing hf-sandbox 🥡 Video", "link": "https://nitter.net/QGallouedec/status/2053492653975572541#m", "published": "Sun, 10 May 2026 15:09:35 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Zero-to-CAD 1M Zero-to-CAD is a large-scale dataset of 1,000,000 executable CAD construction sequences generated by an LLM operating inside a feedback-driven CAD environment. Datasets: huggingface.co/datasets/ADSK… Paper: arxiv.org/pdf/2604.24479", "link": "https://nitter.net/Jousefm2/status/2052667175735877953#m", "published": "Fri, 08 May 2026 08:29:26 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "My data point: working on two projects in parallel with Pi + llama.cpp + Qwen-3.6-35B-A3B (I prefer the MoE 🙈) This works on my M1 Max (64 GB), which I bought 4.5 years ago. \"Works\" as in \"you can get work done\", not just \"runs for a demo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) This is where we are right now. And i’m not gonna lie it feels pretty magical 🧚‍♀️ Qwen3.6 27B running inside of Pi coding agent via Llama.cpp on the MacBook Pro For non-trivial tasks on the @huggingface codebases, this feels very, very close to hitting the latest Opus in Claude Code, or whatever shiny monopolistic closed source API of the day is. In full airplane mode. Most people haven’t realized this yet. If you have, it means you have a huge headstart to what I call the second revolution of AI. Powerful local models for efficiency, security, privacy, sovereignty 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "link": "https://nitter.net/pcuenq/status/2054130504371445943#m", "published": "Tue, 12 May 2026 09:24:10 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "the gpu crunch is real", "link": "https://nitter.net/julien_c/status/2054507657885544931#m", "published": "Wed, 13 May 2026 10:22:51 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "That’s so nice", "link": "https://nitter.net/julien_c/status/2054241181123379327#m", "published": "Tue, 12 May 2026 16:43:58 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "🆕 Hugging Face 🤝 Hermes Agent 🔥 > we added Hermes Agent to local apps: run it locally with any compatible GGUF/MLX model > shipped native traces support for Hermes Agent: visualize your Hermes traces directly on the Hub Very soon most agents will run locally and we want to accelerate things as much as we can ⚔️", "link": "https://nitter.net/mervenoyann/status/2053857347429151163#m", "published": "Mon, 11 May 2026 15:18:45 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "Following @julien_c ’s tweet I bought a MacBook Pro with 128B unified memory, and started running Qwen3.6 as my daily driver. It’s baffling. Apple outsmarted everyone in this industry.", "link": "https://nitter.net/remilouf/status/2053433428226330668#m", "published": "Sun, 10 May 2026 11:14:14 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "The first full paper on @pytorch after 3 years of development. It describes our goals, design principles, technical details uptil v0.4 Catch the poster at #NeurIPS2019 Authored by @apaszke , @colesbury et. al. arxiv.org/abs/1912.01703", "link": "https://nitter.net/soumithchintala/status/1202981209057484801#m", "published": "Fri, 06 Dec 2019 16:00:45 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Interesting work (and a nice large and clean dataset as well, looking forward to see it released): \"Compressive Transformers for Long-Range Sequence Modelling\" by Jack W. Rae, Anna Potapenko, Siddhant M. Jayakumar, Timothy P. Lillicrap (at DeepMind) Paper: arxiv.org/abs/1911.05507", "link": "https://nitter.net/Thom_Wolf/status/1195662118974083073#m", "published": "Sat, 16 Nov 2019 11:17:18 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Some more results. Now I made it fully supported by all kinds of model and vocabs. Good experience to use @huggingface with @SlackHQ . And it looks pretty smart", "link": "https://nitter.net/algo_diver/status/1192329736850038786#m", "published": "Thu, 07 Nov 2019 06:35:36 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "The @SustaiNLP2020 workshop at #EMNLP2020 will try to remove a little bit of SOTA addiction from NLP research 😉 We'll promote sensible trade-offs between performances & models that are - computationally more efficient - conceptually simpler ... [1/2] nitter.net/DoingJobs/status/11865…", "link": "https://nitter.net/Thom_Wolf/status/1189271899316064256#m", "published": "Tue, 29 Oct 2019 20:04:51 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Perhaps a great opportunity to use @huggingface 's TF 2.0 Transformer implementations :)", "link": "https://nitter.net/fchollet/status/1188942956511690752#m", "published": "Mon, 28 Oct 2019 22:17:44 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "rowancheung", "text": "Source via Meta: about.fb.com/news/2026/04/po… I break down stories like this every day in my free newsletter. Keep up with the latest in AI/Robotics in 5 min a day: therundown.ai/subscribe", "link": "https://nitter.net/rowancheung/status/2051320531639746888#m", "published": "Mon, 04 May 2026 15:18:21 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "Meta is planning to power its AI data centers with solar energy beamed from space. If it works, solar farms could produce power 24/7 without batteries or backup generators. The company behind it all is Overview Energy -- they want to launch 1,000 satellites into orbit, 22,000 miles above the equator, where sunlight is constant. For context, Meta's data centers used over 18,000 gigawatt-hours of electricity last year. Enough to power 1.7 million American homes for a year. Each satellite collects solar energy, converts it into a wide beam of near-infrared light, and aims it at existing solar farms on the ground. The farms convert the light into electricity, just like they do with sunlight. Unlike high-power lasers or microwave beams, this infrared light is safe enough to stare directly into. Solar farms normally sit idle at night, so this system fixes that... from space. Really fascinating tech. Video", "link": "https://nitter.net/rowancheung/status/2051320518905930208#m", "published": "Mon, 04 May 2026 15:18:18 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "By the way, if you want to work with me but don't think the above role is the *perfect* fit, I'm also hiring 4 other roles: > Head of Content > Head of Sales > Ad Creative Strategist > Branded Content Editor Check it out: jobs.therundown.ai/jobs?filt…", "link": "https://nitter.net/rowancheung/status/2049873841065709885#m", "published": "Thu, 30 Apr 2026 15:29:43 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "More about the role + application link: jobs.therundown.ai/jobs/4445…", "link": "https://nitter.net/rowancheung/status/2049872931602284880#m", "published": "Thu, 30 Apr 2026 15:26:06 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "I'm hiring someone to help me build the \"Reddit for AI use cases.\" People are dying to hear from REAL people actually doing REAL work with AI. They don't care about how execs, influencers, or hype chasers are 'using AI'. A few months ago, we launched our Community Use Cases feature in The Rundown: At the end of every newsletter, we showcase how a reader is using AI to work smarter, save time, or make life easier. We didn't think much of it, just a cool way to highlight the community. Well, it became one of the biggest hits the newsletter has ever had. Now I get daily messages asking us to expand it... so we are. The plan: build Reddit for AI use cases. We have the most active and engaged AI-interested audience in the world, with millions of daily readers. Your job is to figure out how they're actually using AI, then incentivize them to share it. Basically, the friend everyone texts when they hear about a new AI thing... but you're building an entire community of them. Here's what I'm looking for: > Someone who thrives in scrappy environments with great communication skills > Has built online communities at scale before > Energized by the idea of interviewing thousands of real people about how AI is actually changing their work This is NOT an easy role. You'll interview thousands of people, gather data points, and dig into their real AI struggles. If that sounds fun rather than overwhelming, you're probably who I'm looking for. Link below to apply! Rowan Cheung (@rowancheung) I'm HIRING 5 more people to help me build the future of AI media. The Rundown is closing in on 3M active readers, and the demand is far outpacing what we can handle. $2,000 referral bonus if you help us find someone we hire full-time. Open roles: > Head of Content -- lead the editorial team that reaches millions every day > Head of Sales -- run a scrappy sales team and revenue strategy across our media properties > Community Lead -- turn our 3M+ readership into the \"Reddit for AI use cases\" > Ad Creative Strategist -- research and ship ad creatives that hook the next million AI-curious readers > Branded Content Editor -- turn brands into stories our readers actually want to read What we're looking for among all roles: > Deep AI curiosity (you've already replaced part of your workflow with agents) > Unreasonably biased toward action > Taste sharp enough to spot great work (and AI slop) All roles are fully remote. Link below to apply! — https://nitter.net/rowancheung/status/2048767013472833869#m", "link": "https://nitter.net/rowancheung/status/2049872641889087549#m", "published": "Thu, 30 Apr 2026 15:24:57 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "x.com/i/article/205499463518…", "link": "https://nitter.net/AlphaSignalAI/status/2054998567991865499#m", "published": "Thu, 14 May 2026 18:53:33 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Repo: github.com/backnotprop/rig Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2054941245118562796#m", "published": "Thu, 14 May 2026 15:05:46 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Ghostty just turned the AI coding terminal into a one-second control panel. Many users on Mac have been juggling terminal windows manually. A new sidecar tool called Rig changes that. It sits as a floating side panel. You create, focus, and arrange sessions in about a second. The trick is how it controls native windows. Commands pipe through AppleScript and the macOS Accessibility API. That gives direct hooks into real window behavior. Tap a session in the panel and jump straight to its Space. Four window layouts come built in: > grid for parallel work > cascade for stacked focus > side by side comparisons > fill screen for solo runs It also watches for local servers started inside a session. When one boots up, a clickable URL surfaces beside the right window on the current desktop. Accessibility and Automation permissions handle the heavy lifting underneath. Video", "link": "https://nitter.net/AlphaSignalAI/status/2054941244174770441#m", "published": "Thu, 14 May 2026 15:05:46 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Repo: github.com/colbymchenry/code… Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2054894990812209173#m", "published": "Thu, 14 May 2026 12:01:58 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "You can cut Claude Code's tool calls by 94% with one command. When Claude Code explores a repo, it spawns agents to scan files. Each scan burns tokens on every tool call. CodeGraph is an open-source MCP server that fixes this. It pre-indexes your codebase into a local knowledge graph upfront. Instead of scanning, the agent queries the graph directly. One call returns entry points, related symbols, and code snippets. Tested across six real-world projects, the results showed: > 92% fewer tool calls average > 71% faster exploration overall > 94% drop on a TypeScript repo > 96% drop on a Java codebase Tree-sitter parses source into syntax trees. SQLite stores symbols, callers, and edges with full-text search. A file watcher keeps everything fresh as you code. It supports 19+ languages and runs fully on your machine. Setup is one npx command. No API keys are required.", "link": "https://nitter.net/AlphaSignalAI/status/2054894989620949427#m", "published": "Thu, 14 May 2026 12:01:58 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}], "failed_accounts": ["elonmusk", "karinanguyen_"], "processed": {"summary": "Cette semaine a été riche en innovations et réflexions dans le monde de l'IA, avec un focus particulier sur l'amélioration des interactions homme-machine et la sécurité. Nous avons vu l'intégration d'assistants IA comme Codex dans nos applications mobiles, des avancées sur l'interface visuelle et le contrôle par la pensée pour les modèles, et des outils permettant aux agents IA de mieux comprendre et d'agir sur nos systèmes. Des débats importants sur les risques cybernétiques et les avantages de l'IA open-source ont également eu lieu, soulignant la nécessité d'une collaboration pour un futur numérique plus sûr et plus productif.", "category_summaries": {"actu": "De nombreuses annonces ont marqué l'actualité : l'intégration de Codex (l'assistant de codage d'OpenAI) dans l'application mobile ChatGPT, le déploiement de Gemini Intelligence par Google sur ses appareils, et des initiatives majeures comme Project Glasswing d'Anthropic pour la cybersécurité. Les lancements de nouvelles plateformes comme LangChain Labs et des partenariats pour l'IA d'entreprise montrent une industrialisation croissante de la technologie.", "tips": "Des conseils pratiques ont émergé pour optimiser l'utilisation des LLM, notamment sur la structuration des réponses en HTML pour une meilleure visualisation ou la gestion de la consommation de mémoire des outils comme Claude Code. Des guides sur l'accélération du développement avec des agents de codage pour différentes tâches (frontend, backend, infra) ont également été partagés, mettant en lumière l'importance de l'efficacité.", "idees": "Le débat a fait rage sur la nature évolutive de l'interaction entre humains et IA, la productivité des développeurs face à l'explosion du code généré par IA, et les risques inhérents aux modèles de pointe en matière de cybersécurité. La discussion sur l'open-source et la sécurité a également été centrale, avec des arguments pour et contre la restriction des modèles puissants.", "outils": "Plusieurs nouveaux outils et modèles ont été présentés pour enrichir l'écosystème IA : des agents de vérification formelle comme Aleph, des modèles de synthèse vocale expressifs comme Voxtral TTS de Mistral, et des solutions pour les développeurs telles que Grok Build (un CLI agentique) et CodeGraph (pour optimiser les appels d'outils de Claude Code). L'expérimentation avec des interfaces innovantes, comme le pointeur de souris intelligent de Google DeepMind, ouvre de nouvelles perspectives."}, "highlights": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Ça marche vraiment bien, au fait : à la fin de votre requête, demandez à votre LLM de « structurer sa réponse en HTML », puis visualisez le fichier généré dans votre navigateur. J'ai aussi eu du succès en demandant au LLM de présenter sa sortie sous forme de diaporamas, etc. Plus généralement, à mon avis, l'audio est l'entrée préférée des humains pour les IA, mais la vision (images/animations/vidéos) est la sortie préférée de celles-ci. Environ un tiers de nos cerveaux est un processeur massivement parallèle dédié à la vision ; c'est l'autoroute à 10 voies de l'information vers le cerveau. À mesure que l'IA s'améliore, je pense que nous verrons une progression qui en tirera parti : 1) texte brut (difficile/pénible à lire) 2) Markdown (gras, italique, titres, tableaux, un peu plus facile pour les yeux) <-- réglage par défaut actuel 3) HTML (toujours procédural avec du code sous-jacent, mais beaucoup plus de flexibilité sur les graphiques, la mise en page, voire l'interactivité) <-- début prometteur d'un nouveau réglage par défaut ...4,5,6,... n) vidéos/simulations neuronales interactives. À mon avis, l'extrapolation (bien que la technologie n'existe pas encore) aboutit à une sorte de vidéos interactives générées directement par un réseau neuronal de diffusion. De nombreuses questions restent ouvertes quant à la manière dont les artefacts exacts/procéduraux du « Logiciel 1.0 » (par exemple, les simulations interactives) peuvent être tissés avec des artefacts neuronaux (grilles de diffusion), mais généralement quelque chose dans la direction du nitter.net/zan2434/status/2046982… récemment viral. Des améliorations sont également nécessaires et en attente au niveau de l'entrée. L'audio, le texte ou la vidéo seuls ne suffisent pas, par exemple, je ressens le besoin de pointer/gesticuler vers des éléments à l'écran, de la même manière que tout ce que vous feriez avec une personne physiquement à côté de vous et votre écran d'ordinateur. En bref, l'intégration esprit-machine entre les humains et les IA est en cours et il y a beaucoup de travail à faire et de progrès significatifs à réaliser, bien avant de se lancer directement dans les BCI de type Neuralink et tout ça. Pour ce qui vaut la peine d'être exploré au stade actuel, un conseil : essayez de demander du HTML. Thariq (@trq212) x.com/i/article/205279610060…", "text_original": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/karpathy/status/2053872850101285137#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "decryptage": "Les LLM (modèles de langage à grande échelle) peuvent non seulement générer du texte, mais aussi structurer leurs réponses de manière visuelle (HTML, diaporamas), transformant la façon dont nous interagissons avec l'IA en passant d'une simple lecture à une expérience plus riche et interactive, utilisant la 'vision' comme principal canal d'échange, un peu comme nous utilisons nos yeux pour traiter la majorité des informations.", "category": "tips", "highlight_reason": "Ce tweet offre un conseil pratique concret pour améliorer l'interaction avec les LLM dès maintenant, tout en offrant une vision prospective et très pédagogique de l'évolution des interfaces homme-IA, soulignant l'importance de la vision pour notre cerveau."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Il n'y aura pas d'apocalypse de l'emploi due à l'IA. L'idée selon laquelle l'IA entraînerait un chômage massif suscite une peur inutile. L'IA, comme toute autre technologie, affecte les emplois, mais raconter des histoires exagérées de chômage à grande échelle est irresponsable et nuisible. Il faut y mettre un terme. J'ai exprimé mon scepticisme quant à l'apocalypse de l'emploi dans des articles précédents. Je suis heureux de constater que la presse populaire rejette maintenant ce discours. L'image ci-dessous présente quelques titres récents. L'ingénierie logicielle est le secteur le plus touché par les outils d'IA, à mesure que les agents de codage progressent rapidement. Pourtant, le recrutement d'ingénieurs logiciels reste solide ! Ainsi, bien qu'il y ait des exemples d'emplois que l'IA supprime, les tendances suggèrent fortement que la création nette d'emplois est bien plus importante que la destruction d'emplois, tout comme les vagues technologiques précédentes. De plus, malgré tous les progrès passionnants de l'IA, le taux de chômage aux États-Unis reste à un niveau sain de 4,3 %. Pourquoi le discours de l'apocalypse de l'emploi due à l'IA est-il si populaire ? D'une part, les laboratoires d'IA de pointe ont un fort intérêt à raconter des histoires qui rendent la technologie de l'IA plus puissante. À l'extrême, ils promeuvent des scénarios de science-fiction où l'IA « prend le dessus » et provoque l'extinction humaine. Si une technologie peut remplacer de nombreux employés, cette technologie doit sûrement être très précieuse ! De plus, de nombreuses entreprises de logiciels SaaS facturent environ 100 à 1000 dollars par utilisateur/an. Mais si une entreprise d'IA peut remplacer un employé qui gagne 100 000 dollars, ou le rendre 50 % plus productif, alors facturer même 10 000 dollars commence à paraître raisonnable. En se basant non pas sur les prix SaaS typiques mais sur les salaires des employés, les entreprises d'IA peuvent facturer beaucoup plus. De plus, les entreprises ont un fort intérêt à parler des licenciements comme s'ils étaient causés par l'IA. Après tout, parler de la façon dont elles utilisent l'IA pour être beaucoup plus productives avec moins de personnel les fait paraître intelligentes. C'est un meilleur message que d'admettre qu'elles ont trop embauché pendant la pandémie lorsque les capitaux étaient abondants en raison des faibles taux d'intérêt et d'un stimulus financier massif du gouvernement. Pour être clair, je reconnais que l'IA modifie le travail de nombreuses personnes. C'est difficile. C'est stressant. (Et pour certains, cela peut être amusant.) Je suis en empathie avec toutes les personnes touchées. En même temps, c'est très différent de prédire un effondrement du marché du travail. Les sociétés sont capables de se raconter des histoires pendant des années qui ont peu de fondement dans la réalité et conduisent à de mauvaises décisions à l'échelle de la société. Par exemple, les craintes concernant la sécurité des centrales nucléaires ont conduit à un sous-investissement dans l'énergie nucléaire. Les craintes de la « bombe démographique » dans les années 1960 ont conduit les pays à mettre en œuvre des politiques dures pour réduire leurs populations. Et les inquiétudes concernant les graisses alimentaires ont conduit les gouvernements à promouvoir des régimes riches en sucre malsains pendant des décennies. Maintenant que les médias grand public sont ouvertement sceptiques quant à l'apocalypse de l'emploi, j'espère que ces histoires commenceront à perdre de leur force (tout comme les craintes d'extinction humaine due à l'IA). Contrairement aux prédictions d'une apocalypse de l'emploi due à l'IA, je prévois le contraire : Il y aura une fête de l'emploi grâce à l'IA ! L'IA conduira à beaucoup plus de bons emplois d'ingénieurs en IA, et je suis également optimiste quant à l'avenir du marché du travail dans son ensemble. Ce que feront les ingénieurs en IA sera différent de l'ingénierie logicielle traditionnelle, et beaucoup de ces emplois se trouveront dans des entreprises autres que les grands employeurs traditionnels de développeurs. Dans les rôles non liés à l'IA également, les compétences nécessaires changeront en raison de l'IA. C'est donc le bon moment pour encourager davantage de personnes à maîtriser l'IA et à s'assurer qu'elles sont prêtes pour les emplois différents mais nombreux de l'avenir ! [Texte original dans la newsletter The Batch.]", "text_original": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future! [Original text in The Batch newsletter.]", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "decryptage": "Malgré les craintes de destruction massive d'emplois, Andrew Ng estime que l'IA va plutôt créer de nombreux nouveaux rôles, notamment pour les ingénieurs IA, transformant le marché du travail sans provoquer un chômage généralisé.", "category": "idees", "highlight_reason": "Ce tweet rassure le débutant sur un sujet qui préoccupe beaucoup : l'impact de l'IA sur l'emploi, en offrant une perspective nuancée et optimiste, étayée par l'expérience d'un grand nom de l'IA."}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "La cybersécurité est le premier danger clair et actuel des modèles d'IA de pointe, mais ce ne sera pas le dernier. Si nous sommes collectivement capables de relever ce défi et de faire face à ce risque, cela pourrait servir de modèle pour aborder les défis encore plus difficiles qui nous attendent.", "text_original": "Cyber is the first clear and present danger from frontier AI models, but it won’t be the last. If we are able to collectively rise to the challenge and confront this risk, it could serve as a blueprint for addressing the even more difficult challenges that lie ahead of us.", "link": "https://nitter.net/DarioAmodei/status/2041580343472337145#m", "decryptage": "Dario Amodei met en garde contre la capacité grandissante des IA de pointe à créer des menaces cybernétiques, soulignant que ce domaine est le premier où l'IA pose un risque direct et immédiat, servant de test pour gérer de futurs défis plus complexes.", "category": "idees", "highlight_reason": "Ce tweet met en lumière un enjeu crucial et actuel de l'IA : la cybersécurité, expliquant clairement pourquoi les modèles de pointe représentent un danger et comment la gestion de ce risque peut servir de modèle pour l'avenir."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Les agents de codage accélèrent différents types de travail logiciel à des degrés divers. Lorsque nous concevons des équipes, la compréhension de ces distinctions nous aide à avoir des attentes réalistes. En listant les fonctions de la plus accélérée à la moins accélérée, mon ordre est le suivant : développement frontend, backend, infrastructure et recherche. Le développement frontend — par exemple, la création d'une page web pour afficher des descriptions de produits pour un site de commerce électronique — est considérablement accéléré car les agents de codage maîtrisent les langages frontend populaires comme TypeScript et JavaScript et les frameworks comme React et Angular. De plus, en examinant ce qu'ils ont construit en utilisant un navigateur web, les agents de codage sont maintenant très bons pour boucler la boucle et itérer sur leurs propres implémentations. Certes, les LLM sont encore faibles en matière de conception visuelle, mais étant donné une conception (ou si une conception peaufinée n'est pas importante), l'implémentation est rapide ! Le développement backend — par exemple, la création d'API pour répondre aux requêtes de données de produits — est plus difficile. Il faut plus de travail de la part des développeurs humains pour guider les modèles modernes à réfléchir aux cas limites qui pourraient entraîner des bugs subtils ou des failles de sécurité. De plus, un bug backend peut entraîner des effets en aval non intuitifs comme une base de données corrompue qui renvoie occasionnellement des résultats incorrects, ce qui peut être plus difficile à déboguer qu'un bug frontend typique. Enfin, bien que les migrations de bases de données puissent être plus faciles avec les agents de codage, elles restent difficiles et doivent être gérées avec soin pour éviter la perte de données. Bien que le développement backend soit beaucoup plus rapide avec les agents de codage, ils l'accélèrent moins, et les développeurs qualifiés conçoivent et implémentent toujours de meilleurs backends que les inexpérimentés qui utilisent des agents de codage. L'infrastructure. Les agents sont encore moins efficaces dans des tâches comme la mise à l'échelle d'un site de commerce électronique à 10 000 utilisateurs actifs tout en maintenant une fiabilité de 99,99 %. La connaissance des LLM est encore relativement limitée en ce qui concerne l'infrastructure et les compromis complexes que les bons ingénieurs doivent faire, donc je leur fais rarement confiance pour les décisions critiques d'infra. La construction d'une bonne infrastructure nécessite souvent une période de test et d'expérimentation, et les agents de codage peuvent y aider, mais c'est finalement un goulot d'étranglement important où le codage rapide par l'IA n'aide pas beaucoup. Enfin, trouver des bugs d'infrastructure — par exemple, une subtile mauvaise configuration réseau — peut être incroyablement difficile et nécessite une expertise technique approfondie. Ainsi, j'ai constaté que les agents de codage accélèrent l'infrastructure critique encore moins que le développement backend. La recherche. Les agents de codage accélèrent encore moins le travail de recherche. La recherche implique de réfléchir à de nouvelles idées, de formuler des hypothèses, d'exécuter des expériences, de les interpréter pour potentiellement modifier les hypothèses, et d'itérer jusqu'à ce que nous arrivions à des conclusions. Les agents de codage peuvent accélérer le rythme auquel nous pouvons écrire du code de recherche. (J'utilise également des agents de codage pour m'aider à orchestrer et à suivre les expériences, ce qui facilite la gestion de plus d'expériences par un seul chercheur.) Mais il y a beaucoup de travail dans la recherche autre que le codage, et les agents actuels n'aident que marginalement à la recherche. La catégorisation du travail logiciel en frontend, backend, infra et recherche est une simplification extrême, mais avoir un modèle mental simple de la rapidité avec laquelle les différentes tâches ont été accélérées a été utile pour la façon dont j'organise les équipes logicielles. Par exemple, je demande maintenant aux équipes frontend d'implémenter des produits beaucoup plus rapidement qu'il y a un an, mais mes attentes pour les équipes de recherche n'ont pas changé autant. Je suis fasciné par la façon d'organiser les équipes logicielles pour utiliser les agents de codage afin d'atteindre la vitesse, et je continuerai à partager mes découvertes dans de futurs articles. [Texte original : deeplearning.ai/the-batch/is… ]", "text_original": "Coding agents are accelerating different types of software work to different degrees. When we architect teams, understanding these distinctions helps us to have realistic expectations. Listing functions from most accelerated to least, my order is: frontend development, backend, infrastructure, and research. Frontend development — say, building a web page to serve descriptions of products for an ecommerce site — is dramatically sped up because coding agents are fluent in popular frontend languages like TypeScript and JavaScript and frameworks like React and Angular. Additionally, by examining what they have built by operating a web browser, coding agents are now very good at closing the loop and iterating on their own implementations. Granted, LLMs today are still weak at visual design, but given a design (or if a polished design isn’t important), the implementation is fast! Backend development — say, building APIs to respond to queries requesting product data — is harder. It takes more work by human developers to steer modern models to think through corner cases that might lead to subtle bugs or security flaws. Further, a backend bug can lead to non-intuitive downstream effects like a corrupted database that occasionally returns incorrect results, which can be harder to debug than a typical frontend bug. Finally, although database migrations can be easier with coding agents, they’re still hard and need to be handled carefully to prevent data loss. While backend development is much faster with coding agents, they accelerate it less, and skilled developers still design and implement far better backends than inexperienced ones who use coding agents. Infrastructure. Agents are even less effective in tasks like scaling an ecommerce site to 10K active uses while maintaining 99.99% reliability. LLMs' knowledge is still relatively limited with respect to infrastructure and the complex tradeoffs good engineers must make, so I rarely trust them for critical infra decisions. Building good infrastructure often requires a period of testing and experimentation, and coding agents can help with that, but ultimately that’s a significant bottleneck where fast AI coding does not help much. Lastly, finding infrastructure bugs — say, a subtle network misconfiguration — can be incredibly difficult and requires deep engineering expertise. Thus, I’ve found that coding agents accelerate critical infrastructure even less than backend development. Research. Coding agents accelerate research work even less. Research involves thinking through new ideas, formulating hypotheses, running experiments, interpreting them to potentially modify the hypotheses, and iterating until we reach conclusions. Coding agents can speed up the pace at which we can write research code. (I also use coding agents to help me orchestrate and keep track of experiments, which makes it easier for a single researcher to manage more experiments.) But there is a lot of work in research other than coding, and today’s agents help with research only marginally. Categorizing software work into frontend, backend, infra, and research is an extreme simplification, but having a simple mental model for how much different tasks have sped up has been useful for how I organize software teams. For example, I now ask front-end teams to implement products dramatically faster than a year ago, but my expectations for research teams have not shifted nearly as much. I am fascinated by how to organize software teams to use coding agents to achieve speed, and will keep sharing my findings in future posts. [Original text: deeplearning.ai/the-batch/is… ]", "link": "https://nitter.net/AndrewYNg/status/2051691741150081122#m", "decryptage": "Les agents de codage, des programmes IA qui aident à écrire du code, sont plus efficaces pour accélérer le développement d'interfaces visuelles (frontend) que pour les tâches plus complexes comme la gestion des bases de données (backend) ou la construction de l'infrastructure logicielle (infra), et encore moins pour la recherche, car ces dernières demandent plus de raisonnement humain et de résolution de problèmes non standard.", "category": "tips", "highlight_reason": "Ce tweet est un excellent guide pour un débutant, expliquant où l'IA peut vraiment aider dans le développement logiciel et où l'expertise humaine reste indispensable, ce qui est crucial pour comprendre comment utiliser ces outils intelligemment."}], "by_category": {"actu": [{"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Aussi tout ceci : OpenAI Developers (@OpenAIDevs) Codex devient plus facile à automatiser et à personnaliser autour de votre code. 🪝 Les Hooks personnalisent la boucle Codex avec des scripts qui s'exécutent à des points clés d'une tâche : • Exécuter des validateurs avant ou après le travail • Scanner les requêtes pour les secrets • Enregistrer les conversations dans les systèmes internes • Créer des mémoires ou personnaliser le comportement par dépôt ou répertoire ⚙️ Les jetons d'accès programmatiques fournissent des identifiants à portée limitée pour les équipes Business et Enterprise : • Créer des jetons depuis les paramètres de l'espace de travail ChatGPT • Les utiliser dans les CI, les flux de travail de publication et les automatisations internes • Définir des expirations ou révoquer l'accès si nécessaire • Maintenir l'utilisation liée à l'espace de travail Vidéo — https://nitter.net/OpenAIDevs/status/2055032115964870838#m", "text_original": "also all this: OpenAI Developers (@OpenAIDevs) Codex is getting easier to automate and customize around your code. 🪝 Hooks customize the Codex loop with scripts that run at key points in a task: • Run validators before or after work • Scan prompts for secrets • Log conversations to internal systems • Create memories or customize behavior by repo or directory ⚙️ Programmatic access tokens provide scoped credentials for Business and Enterprise teams: • Create tokens from ChatGPT workspace settings • Use them in CI, release workflows, and internal automations • Set expirations or revoke access when needed • Keep usage tied back to the workspace Video — https://nitter.net/OpenAIDevs/status/2055032115964870838#m", "link": "https://nitter.net/sama/status/2055034714231345475#m", "decryptage": "Codex, l'outil d'IA d'OpenAI pour le codage, s'améliore avec des \"hooks\" pour personnaliser son comportement et des \"jetons d'accès programmatiques\" pour une utilisation sécurisée par les entreprises, facilitant son intégration dans les flux de travail professionnels.", "category": "actu"}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Codex est dans l'application mobile ChatGPT !", "text_original": "Codex in the ChatGPT mobile app!", "link": "https://nitter.net/sama/status/2055034461591588916#m", "decryptage": "Codex, l'assistant de codage par IA d'OpenAI, est maintenant disponible directement dans l'application mobile de ChatGPT, rendant ses fonctionnalités accessibles depuis votre téléphone.", "category": "actu"}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Codex est le meilleur produit de codage IA et nous voulons le rendre facile à essayer. Pour les 30 prochains jours, nous offrons deux mois d'utilisation gratuite de Codex aux entreprises qui souhaitent l'essayer.", "text_original": "codex is the best AI coding product and we want to make it easy to try. for the next 30 days, we are giving companies that want to try switching over two months of free codex usage.", "link": "https://nitter.net/sama/status/2054626219858293128#m", "decryptage": "OpenAI propose deux mois d'utilisation gratuite de son outil de codage par IA, Codex, aux entreprises souhaitant l'intégrer, afin de faciliter son adoption.", "category": "actu"}, {"author_name": "Greg Brockman", "handle": "@gdb", "text_fr": "Vous pouvez maintenant utiliser Codex, où que vous l'exécutiez, depuis l'application ChatGPT. Un grand pas en avant pour l'utilisation universelle des agents. OpenAI (@OpenAI) Vous l'avez demandé... Maintenant en préversion : Codex dans l'application mobile ChatGPT. Commencez de nouveaux travaux, examinez les résultats, dirigez l'exécution et approuvez les prochaines étapes, le tout depuis l'application mobile ChatGPT. Codex continuera de fonctionner sur votre ordinateur portable, Mac mini ou devbox. Vidéo — https://nitter.net/OpenAI/status/2055016850849993072#m", "text_original": "You can now use Codex, wherever you have it running, from the ChatGPT app. Huge step forward for universal usage of agents. OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/gdb/status/2055034165968384099#m", "decryptage": "Codex, l'outil de programmation assisté par l'IA, peut maintenant être utilisé et contrôlé via l'application mobile de ChatGPT, permettant aux développeurs de gérer leurs projets de codage à distance sans être devant leur ordinateur.", "category": "actu"}, {"author_name": "Greg Brockman", "handle": "@gdb", "text_fr": "Comment nous avons construit le sandbox Codex pour Windows : OpenAI Developers (@OpenAIDevs) Pour porter Codex sur Windows, nous avons dû répondre à une question difficile : comment permettre aux agents de codage de rester utiles sans forcer les développeurs à choisir entre des invites d'approbation constantes et un accès complet à la machine ? Voici comment nous avons construit le sandbox Windows pour Codex : openai.com/index/building-co… — https://nitter.net/OpenAIDevs/status/2054735161166819377#m", "text_original": "How we built the Codex sandbox for Windows: OpenAI Developers (@OpenAIDevs) To bring Codex to Windows, we had to answer a hard question: how do you let coding agents stay useful without forcing developers to choose between constant approval prompts and full machine access? Here’s how we built the Windows sandbox for Codex: openai.com/index/building-co… — https://nitter.net/OpenAIDevs/status/2054735161166819377#m", "link": "https://nitter.net/gdb/status/2054744721570820444#m", "decryptage": "OpenAI a créé un \"sandbox\" (un environnement isolé et sécurisé) pour Codex sur Windows, afin que l'IA puisse aider à coder sans risquer d'accéder à l'ensemble du système ou de demander constamment des confirmations.", "category": "actu"}, {"author_name": "Greg Brockman", "handle": "@gdb", "text_fr": "Grand enthousiasme des entreprises désireuses d'adopter Codex OpenAI Developers (@OpenAIDevs) 2000 développeurs ont contacté en 3 heures. Construisons des choses.", "text_original": "great excitement from enterprises wanting to adopt codex OpenAI Developers (@OpenAIDevs) 2000 developers reached out in 3 hours. Let's build things. — https://nitter.net/OpenAIDevs/status/2054698500143927357#m", "link": "https://nitter.net/gdb/status/2054710146924683586#m", "decryptage": null, "category": "actu"}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Les fonctionnalités Gemini Intelligence seront déployées par vagues, en commençant par les derniers téléphones Samsung Galaxy et Google Pixel cet été, puis sur tous les appareils Android, y compris votre montre, voiture, lunettes et ordinateurs portables plus tard cette année ! blog.google/products-and-pla…", "text_original": "Gemini Intelligence features will roll out in waves starting with the latest Samsung Galaxy and Google Pixel phones this summer, and across Android devices including your watch, car, glasses & laptops later this year! blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2054255861158338713#m", "decryptage": "Les nouvelles fonctionnalités \"Gemini Intelligence\" de Google, propulsées par l'IA Gemini, arriveront progressivement sur divers appareils Android (téléphones, montres, voitures, lunettes, PC) dès cet été.", "category": "actu"}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Aujourd'hui, à l'@Android Show (édition I/O), nous avons annoncé Gemini Intelligence – apportant le meilleur de Gemini à nos appareils les plus avancés. Automatisez des tâches en plusieurs étapes à travers les applications et Chrome, remplissez des formulaires en un seul toucher, transformez des pensées parlées en texte poli avec Rambler, créez des widgets personnalisés et bien plus encore.", "text_original": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "decryptage": "Google a présenté \"Gemini Intelligence\", un ensemble de fonctions IA propulsées par Gemin
