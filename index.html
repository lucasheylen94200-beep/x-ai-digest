rées de chômage à grande échelle est irresponsable et nuisible. Mettons-y un terme. J'ai déjà exprimé mon scepticisme quant à l'apocalypse de l'emploi dans des publications précédentes. Je suis heureux de voir que la presse populaire s'oppose maintenant à ce discours. L'image ci-dessous présente quelques titres récents. L'ingénierie logicielle est le secteur le plus affecté par les outils d'IA, alors que les agents de codage progressent à toute vitesse. Pourtant, le recrutement d'ingénieurs logiciels reste solide ! Ainsi, bien qu'il y ait des exemples d'IA supprimant des emplois, les tendances suggèrent fortement que la création nette d'emplois est bien supérieure à la destruction d'emplois — tout comme les vagues technologiques précédentes. De plus, malgré tous les progrès passionnants de l'IA, le taux de chômage américain reste à un sain 4,3 %. Pourquoi le récit de l'apocalypse de l'emploi due à l'IA est-il si populaire ? D'une part, les laboratoires d'IA de pointe ont de fortes incitations à raconter des histoires qui rendent la technologie de l'IA plus puissante. À l'extrême, ils promeuvent des scénarios de science-fiction où l'IA «prend le contrôle» et cause l'extinction humaine. Si une technologie peut remplacer de nombreux employés, cette technologie doit sûrement être très précieuse ! De plus, de nombreuses entreprises de logiciels en tant que service (SaaS) facturent environ 100 à 1000 dollars par utilisateur/an. Mais si une entreprise d'IA peut remplacer un employé qui gagne 100 000 dollars — ou le rendre 50 % plus productif — alors facturer même 10 000 dollars commence à paraître raisonnable. En s'ancrant non pas aux prix typiques des SaaS mais aux salaires des employés, les entreprises d'IA peuvent facturer beaucoup plus. De plus, les entreprises ont de fortes incitations à parler des licenciements comme s'ils étaient causés par l'IA. Après tout, parler de la façon dont elles utilisent l'IA pour être beaucoup plus productives avec moins de personnel les fait paraître intelligentes. C'est un meilleur message que d'admettre qu'elles ont trop embauché pendant la pandémie, lorsque le capital était abondant en raison des taux d'intérêt bas et d'un vaste stimulus financier gouvernemental. Pour être clair, je reconnais que l'IA est en train de modifier le travail de nombreuses personnes. C'est difficile. C'est stressant. (Et pour certains, cela peut être amusant.) J'éprouve de l'empathie pour toutes les personnes affectées. En même temps, c'est très différent de prédire un effondrement du marché de l'emploi. Les sociétés sont capables de se raconter des histoires pendant des années qui ont peu de fondement dans la réalité et conduisent à de mauvaises décisions à l'échelle de la société. Par exemple, les craintes concernant la sécurité des centrales nucléaires ont conduit à un sous-investissement dans l'énergie nucléaire. Les craintes de la «bombe démographique» dans les années 1960 ont conduit les pays à mettre en œuvre des politiques sévères pour réduire leurs populations. Et les inquiétudes concernant les graisses alimentaires ont conduit les gouvernements à promouvoir des régimes riches en sucre et malsains pendant des décennies. Maintenant que les médias grand public sont ouvertement sceptiques quant à l'apocalypse de l'emploi, j'espère que ces histoires commenceront à perdre de leur force (tout comme les craintes d'extinction humaine causée par l'IA l'ont fait). Contrairement aux prédictions d'une apocalypse de l'emploi due à l'IA, je prédis le contraire : Il y aura une fête de l'emploi grâce à l'IA ! L'IA conduira à beaucoup plus de bons emplois d'ingénieur en IA, et je suis également optimiste quant à l'avenir du marché de l'emploi global. Ce que feront les ingénieurs en IA sera différent de l'ingénierie logicielle traditionnelle, et beaucoup de ces emplois se trouveront dans des entreprises autres que les grands employeurs traditionnels de développeurs. Dans les rôles non liés à l'IA également, les compétences nécessaires changeront en raison de l'IA. Cela en fait un bon moment pour encourager davantage de personnes à maîtriser l'IA et à s'assurer qu'elles sont prêtes pour les emplois différents mais abondants du futur ! [Texte original dans la newsletter The Batch.]", "text_original": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future! [Original text in The Batch newsletter.]", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "decryptage": "Andrew Ng contredit l'idée d'une \"apocalypse de l'emploi\" due à l'IA, arguant au contraire qu'elle créera de nombreux nouveaux postes, notamment en ingénierie IA, et que la peur est souvent exagérée pour des raisons économiques.", "category": "idees", "highlight_reason": "Ce tweet est crucial pour déconstruire les mythes sur l'IA et l'emploi, rassurant les débutants tout en les encourageant à se former aux nouvelles compétences de l'ère de l'IA."}, {"author_name": "Boris Cherny", "handle": "@bcherny", "text_fr": "Beaucoup de gens se sont interrogés sur Mythos, Glasswing et les vulnérabilités que nous / nos partenaires corrigeons. Aujourd'hui, je suis ravi que nous commencions à partager davantage. (Pour le contexte, je dirige Glasswing chez @AnthropicAI.) Deux évaluations indépendantes cette semaine — de XBOW et de l'UK AISI — confirment ce que nous avons vu en interne : Claude Mythos Preview représente un changement radical dans les capacités autonomes de cybersécurité. Nous devons commencer à nous préparer rapidement à un monde de modèles dotés de ce niveau de capacités. L'UK AI Security Institute a testé le modèle que nous avons livré lors du lancement du Project Glasswing et a constaté que Mythos Preview est le premier modèle à résoudre leurs deux cyber-gammes de bout en bout, y compris l'une (Cooling Tower) qu'aucun modèle n'avait jamais franchie. Mais les attaquants (et les défenseurs) ont des contraintes de sophistication et de coût — Mythos est également le seul modèle à accomplir toutes leurs tâches estimées sur 8 heures sous leur limite délibérément basse de 2,5 millions de jetons. XBOW l'a testé sur ses benchmarks de sécurité offensive, constatant « une précision sans précédent jeton par jeton ». C'est le seul modèle à réussir un travail subtil de sandbox V8. D'autres partenaires de Glasswing ont partagé des histoires similaires. En quelques semaines de tests, Mythos Preview les a aidés à trouver plusieurs milliers de vulnérabilités (estimées) de gravité élevée + critique, parfois le double de ce qu'ils trouveraient normalement en un an. Je ne partage pas cela pour promouvoir Mythos. En fait, il ne s'agit pas de Mythos. Il s'agit de se préparer à un monde où les modèles seront meilleurs, plus rapides, moins chers et plus créatifs que certains des meilleurs experts humains en matière de capacités à double usage. Clairement, nous devons les soutenir les défenseurs aussi largement que possible en toute sécurité – et surtout les moins bien lotis. D'ici un an, Mythos semblera probablement assez bête (par rapport à d'autres nouveaux modèles). Et d'autres pourraient publier des modèles de capacités de niveau Mythos disponibles ouvertement ou sans protection. Nous avons lancé le Project Glasswing parce que les capacités comme celles de Mythos Preview ne resteront pas rares, ni entre des mains prudentes. Nous les mettons à la disposition des défenseurs aussi rapidement et de manière responsable que possible, tout en travaillant à déterminer, par exemple, les bonnes garanties et les processus de patch et de divulgation. De plus, pour être clair, la puissance de calcul n'a jamais été un facteur limitant dans notre déploiement. Attendez-vous à une mise à jour plus complète sur notre travail Glasswing dans les prochains jours. Rapport XBOW : xbow.com/blog/mythos-offensi… Rapport UK AISI : aisi.gov.uk/blog/how-fast-is… AI Security Institute (@AISecurityInst) Nos résultats sur les cyber-gammes illustrent cette avancée. Depuis notre première évaluation de Mythos, nous avons eu accès à un point de contrôle plus récent de Mythos Preview. Sur une attaque de réseau d'entreprise en 32 étapes que nous estimons prendre environ 20 heures à un expert humain, ce point de contrôle complète l'attaque complète en 6/10 tentatives. — https://nitter.net/AISecurityInst/status/20545897631731263339#m", "text_original": "A lot of people have been wondering about Mythos, Glasswing, and the vulns we / our partners are fixing. Today, I’m excited for us to start sharing more. (For context, I lead Glasswing @AnthropicAI .) Two independent evaluations this week—from XBOW and the UK AISI—confirm what we've been seeing internally: Claude Mythos Preview is a step change in autonomous cybersecurity capabilities. We need to start preparing fast for a world of models with this level of capabilities. The UK AI Security Institute tested the model we shipped at the launch of Project Glasswing and found Mythos Preview is the first model to solve both of their end-to-end cyber ranges, including one (Cooling Tower) which no model had ever cleared. But attackers (and defenders) have sophistication & cost constraints – Mythos is also the only model that clears every one of their tasks estimated over 8 hours under their deliberately low 2.5M-token cap. XBOW tested it on their offensive security benchmarks, finding \"token-for-token, unprecedented precision.\" It's the only model to succeed at subtle V8 sandbox work. Other Glasswing partners shared similar stories. In a few weeks of testing, Mythos Preview has helped them find many thousands of (estimated) high + critical severity vulnerabilities, sometimes double what they'd normally find in a year. I don't share this to boost Mythos. In fact, this is not about Mythos. It’s about preparing for the coming world of models being better, faster, cheaper, and more creative than some of the best human experts at dual use capabilities. Clearly, we need them supporting defenders as widely as can be done safely – and especially the least resourced ones. Within a year, Mythos will probably look quite dumb (relative to other new models). And others may release openly available or unguardrailed models of Mythos-level capabilities. We started Project Glasswing because capabilities like Mythos Preview's won't stay rare, or stay in careful hands. We are bringing it to defenders as fast as we responsibly can, while working to figure out, for example, the right safeguards and patching & disclosure processes. Also, to be clear, compute has never been a limiter in our rollout. Expect a fuller update on our Glasswing work in the coming days. XBOW report: xbow.com/blog/mythos-offensi… UK AISI report: aisi.gov.uk/blog/how-fast-is… AI Security Institute (@AISecurityInst) Our cyber range results illustrate this step-up. Since our first Mythos evaluation, we received access to a newer Mythos Preview checkpoint. On a 32-step corporate network attack we estimate takes a human expert ~20 hours, this checkpoint completes the full attack in 6 /10 attempts. — https://nitter.net/AISecurityInst/status/2054589763173126339#m", "link": "https://nitter.net/logangraham/status/2054613618168082935#m", "decryptage": "Explique que le modèle \"Mythos Preview\" représente un bond spectaculaire dans les capacités des IA pour la cybersécurité, capable de trouver des failles avec une précision inégalée, et que sa diffusion nécessite des mesures de protection.", "category": "actu", "highlight_reason": "Ce tweet met en lumière une avancée majeure et très concrète de l'IA dans un domaine critique comme la cybersécurité, tout en soulevant des questions essentielles sur les risques et la préparation nécessaire."}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Pendant des décennies, votre souris ne faisait que suivre où vous pointiez. L'IA l'aide à comprendre ce que vous pointez. 💭 Cela signifie qu'une photo d'une note griffonnée pourrait se transformer en une liste de tâches interactive, ou qu'une image vidéo mise en pause peut devenir un lien de réservation de restaurant. Vidéo", "text_original": "For decades, your mouse only tracked where you were pointing. AI helps it understand what you're pointing at. 💭 This means a photo of a scribbled note could turn into an interactive to-do list, or a paused video frame can become a restaurant booking link. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246130511225053#m", "decryptage": "Décrit une nouvelle fonction pour la souris qui, grâce à l'IA, ne se contente plus de suivre votre mouvement mais \"comprend\" ce que vous pointez, transformant un texte écrit à la main en liste interactive ou une image de vidéo en lien de réservation.", "category": "outils", "highlight_reason": "Ce tweet illustre de manière très concrète et imaginative comment l'IA peut révolutionner des interfaces familières comme la souris, rendant l'interaction homme-machine beaucoup plus intuitive et puissante."}], "by_category": {"actu": [{"author_name": "Sam Altman", "handle": "@sama", "text_fr": "J'apprécie le sérieux avec lequel l'équipe prend toujours ces rapports (même quand la réponse s'avère être 'je me suis habitué au niveau de magie actuel et maintenant j'en voudrais plus s'il vous plaît'). Tibo (@thsottiaux) L'équipe Codex est consciente des rapports selon lesquels GPT-5.5 fonctionne moins bien pour certains utilisateurs et enquête. Nous n'avons encore rien de concluant et les systèmes sont sains, mais nous partagerons les mises à jour au fur et à mesure. — https://nitter.net/thsottiaux/status/2055316274394300829#m", "text_original": "i appreciate how seriously the team always takes these reports (even when the answer turns out to be 'i got used to the current level of magic and now i'd like more please') Tibo (@thsottiaux) Codex team is aware of reports of GPT-5.5 performing worse for some users and investigating. We don't have anything conclusive yet and systems are healthy but we will share updates as we go. — https://nitter.net/thsottiaux/status/2055316274394300829#m", "link": "https://nitter.net/sama/status/2055356452286640630#m", "decryptage": "Sam Altman reconnaît que les utilisateurs s'habituent vite aux performances des IA, même si cela peut les rendre exigeants face à de légères variations."}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Un aperçu pour les utilisateurs Pro : une nouvelle expérience de gestion des finances personnelles dans ChatGPT. Les utilisateurs Pro aux États-Unis peuvent connecter leurs comptes financiers en toute sécurité, voir où va leur argent et poser des questions basées sur les informations qu'ils choisissent de connecter. Votre tableau financier complet, maintenant dans ChatGPT. Vidéo", "text_original": "A preview for Pro users: a new personal finance experience in ChatGPT. Pro users in the U.S. can securely connect financial accounts, see where their money is going, and ask questions based on the information they choose to connect. Your full financial picture, now in ChatGPT. Video", "link": "https://nitter.net/ChatGPTapp/status/2055317612687675545#m", "decryptage": null}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "Codex dans l'application mobile ChatGPT !", "text_original": "Codex in the ChatGPT mobile app!", "link": "https://nitter.net/sama/status/2055034461591588916#m", "decryptage": null}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Glasswing n'est que la première étape : la correction et la sécurisation de l'infrastructure logicielle mondiale sera un travail de mois et d'années, et nécessitera une coopération encore plus large entre les entreprises d'IA, les cyberdéfenseurs, les fournisseurs de logiciels, les gouvernements, et bien d'autres.", "text_original": "Glasswing is just the first step: patching and securing the world’s software infrastructure will be the work of months and years, and will require even broader cooperation across AI companies, cyberdefenders, software providers, governments, and more.", "link": "https://nitter.net/DarioAmodei/status/2041580340032995821#m", "decryptage": "Le projet \"Glasswing\" est le début d'un long travail pour sécuriser les logiciels face aux IA, nécessitant une collaboration étendue entre de nombreux acteurs."}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Plutôt que de lancer Mythos Preview à la disposition générale, nous donnons aux défenseurs un accès contrôlé anticipé afin de trouver et de corriger les vulnérabilités avant que les modèles de classe Mythos ne prolifèrent dans l'écosystème.", "text_original": "Rather than release Mythos Preview to general availability, we’re giving defenders early controlled access in order to find and patch vulnerabilities before Mythos-class models proliferate across the ecosystem.", "link": "https://nitter.net/DarioAmodei/status/2041580338426585171#m", "decryptage": "Le modèle \"Mythos Preview\" est mis à la disposition des experts en cybersécurité avant sa sortie générale, pour qu'ils puissent découvrir et corriger les failles qu'il pourrait trouver."}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Nous suivons l'augmentation des capacités cyber des modèles d'IA depuis des années, qui apparaissent dans le cadre de leur compétence générale en codage. Mais notre nouveau modèle, Mythos Preview, représente un pas en avant particulièrement important.", "text_original": "We’ve been tracking the increasing cyber capabilities of AI models for years, which arise as part of their general proficiency at coding. But our new model, Mythos Preview, represents a particularly large step up.", "link": "https://nitter.net/DarioAmodei/status/2041580336828568000#m", "decryptage": "Décrit \"Mythos Preview\" comme un bond en avant dans les capacités des IA pour la cybersécurité, grâce à leur maîtrise générale du code."}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Les fonctionnalités de Gemini Intelligence seront déployées par vagues, en commençant par les derniers téléphones Samsung Galaxy et Google Pixel cet été, puis sur tous les appareils Android, y compris votre montre, voiture, lunettes et ordinateurs portables plus tard cette année !", "text_original": "Gemini Intelligence features will roll out in waves starting with the latest Samsung Galaxy and Google Pixel phones this summer, and across Android devices including your watch, car, glasses & laptops later this year! blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2054255861158338713#m", "decryptage": null}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Aujourd'hui, au @Android Show (édition I/O), nous avons annoncé Gemini Intelligence — apportant le meilleur de Gemini à nos appareils les plus avancés. Automatisez des tâches en plusieurs étapes à travers les applications et Chrome, remplissez des formulaires en un seul clic, transformez des pensées parlées en texte soigné avec Rambler, créez des widgets personnalisés et bien plus encore.", "text_original": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "decryptage": "Annonce \"Gemini Intelligence\", une intégration poussée de l'IA dans les appareils Android pour automatiser des tâches complexes et améliorer l'interaction."}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Aujourd'hui, nous commençons à déployer le chiffrement de bout en bout pour les messages RCS entre les utilisateurs Android et iPhone ! Sameer Samat (@ssamat) Grande nouvelle : Aujourd'hui, nous commençons à déployer le chiffrement de bout en bout pour les messages RCS entre les utilisateurs Android et iPhone ! Cet effort inter-industriel remplace le SMS obsolète par un moyen plus sécurisé et privé de discuter, quel que soit votre téléphone.🔒 Merci à la communauté pour avoir continué à pousser pour ce genre de fonctionnalités. Votre engagement aide vraiment à faire la différence. Félicitations à l'équipe pour avoir atteint cette étape incroyable ! 🚀 En savoir plus : blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "text_original": "Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! Sameer Samat (@ssamat) Big news: Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! This cross-industry effort replaces outdated SMS with a more secure & private way to chat, no matter what phone you have.🔒 Thank you to the community for continuing to push for these kinds of features. Your engagement really helps make a difference. Congratulations to the team for reaching this amazing milestone! 🚀 Read more: blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "link": "https://nitter.net/sundarpichai/status/2053900771947942085#m", "decryptage": null}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "blog.google/products-and-pla…", "text_original": "blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2052411066840416742#m", "decryptage": null}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Perplexity est en train de construire l'une des plateformes de 'sandbox' d'exécution d'agents les plus sécurisées et évolutives du marché. Un article de blog sur la façon dont nous : 1. Gérons les clés API proxy pour les agents en toute sécurité 2. Exécutons la détection de sécurité pour tout contenu accessible par les agents 3. Chiffrons les données passées via les connecteurs aux agents 4. Découplons le stockage et le calcul de manière fiable Perplexity (@perplexity_ai) Computer est sécurisé par défaut. Chaque tâche s'exécute dans son propre 'sandbox' isolé par le matériel avec une séparation du stockage et du calcul au niveau VPC. Les agents sont authentifiés avec des jetons proxy de courte durée au lieu de clés API brutes. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "text_original": "Perplexity is building one of the most secure scalable agent runtime sandboxes in the market right now. A blog post on how we: 1. Handle proxy API keys for agents securely 2. Run safety detection for all content accessed by agents 3. Encrypt data passed via connectors to agents 4. Decouple storage and compute reliably Perplexity (@perplexity_ai) Computer is secure by default. Every task runs in its own hardware-isolated sandbox with VPC-level storage and compute separation. Agents are authenticated with short-lived proxy tokens instead of raw API keys. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "link": "https://nitter.net/AravSrinivas/status/2054619058650411174#m", "decryptage": "Perplexity se concentre sur la création d'environnements sécurisés pour ses \"agents\" IA, garantissant la confidentialité et la protection des données."}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Perplexity devient discrètement la plateforme de connaissances et de recherche pour l'entreprise Perplexity (@perplexity_ai) PayPal exécute 74 000 tâches hebdomadaires dans Perplexity Enterprise. Les équipes l'utilisent pour la validation de modèles, la performance des canaux, la recherche de tendances du marché, l'intelligence concurrentielle et l'analyse de produits. Lisez l'histoire du client : perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "text_original": "Perplexity is quietly becoming the knowledge and research platform for the enterprise Perplexity (@perplexity_ai) PayPal runs 74,000 weekly tasks in Perplexity Enterprise. Teams use it for model validation, channel performance, market trend research, competitive intelligence, and product analysis. Read the customer story: perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "link": "https://nitter.net/AravSrinivas/status/2054581332232302701#m", "decryptage": "Perplexity est de plus en plus utilisée par les grandes entreprises, comme PayPal, pour l'analyse de données, la recherche de marché et l'intelligence concurrentielle."}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Nous avons publié de nouvelles recherches sur la façon dont nous servons les modèles Qwen3 235B post-entraînés sur les racks NVIDIA GB200 NVL72 Blackwell. Le GB200 est une avancée majeure par rapport à Hopper pour l'inférence à haut débit sur les grands modèles MoE, pas seulement une plateforme d'entraînement.", "text_original": "We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform.", "link": "https://nitter.net/perplexity_ai/status/2054204402144350450#m", "decryptage": "Perplexity a partagé une recherche expliquant comment ils utilisent les nouvelles puces NVIDIA GB200 pour faire fonctionner des modèles d'IA très complexes de manière efficace."}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "Magiciens des clusters et souffleurs de GPU, venez nous rejoindre ! Nous recherchons des ingénieurs en supercalcul pour construire l'infrastructure derrière les modèles interactifs en temps réel, Tinker, et l'entraînement à grande échelle : planification, stockage, mise en réseau, fiabilité et systèmes distribués à l'échelle. Recrutement à NYC et SF job-boards.greenhouse.io/thi…", "text_original": "Cluster magicians and GPU whisperers, come join us! We’re looking for supercomputing engineers to build the infrastructure behind real-time interactive models, Tinker, and large-scale training: scheduling, storage, networking, reliability, and distributed systems at scale. Hiring in NYC and SF job-boards.greenhouse.io/thi…", "link": "https://nitter.net/soumithchintala/status/2054248270780604876#m", "decryptage": null}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "Très heureux de partager une nouvelle étape importante pour l'IA en mathématiques : Aletheia, propulsée par Gemini Deep Think, a été utilisée pour résoudre de manière autonome un problème de Kirby ! La « liste de Kirby » est un « recueil des problèmes non résolus les plus importants en topologie, l'étude des formes déformables » (magazine Quanta). 🧵", "text_original": "Very excited to share a new milestone in AI for Math: Aletheia, powered by Gemini Deep Think, was just used to autonomously solve a Kirby problem! “Kirby’s list” is a “compendium of the most important unsolved problems in topology, the study of deformable shapes” (Quanta magazine). 🧵", "link": "https://nitter.net/lmthang/status/2054615931838677436#m", "decryptage": "Annonce qu'une IA, \"Aletheia\", a réussi à résoudre un problème mathématique très complexe en topologie, marquant une avancée significative pour l'IA en mathématiques."}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "Présentation de Googlebook, le premier ordinateur portable conçu pour Gemini Intelligence. Il est conçu pour des performances lourdes, construit avec Gemini au cœur et parfaitement synchronisé avec votre téléphone Android. Disponible cet automne. 💻✨ #TheAndroidShow Vidéo", "text_original": "Introducing Googlebook, the first laptop designed for Gemini Intelligence. It’s crafted for heavyweight performance, built with Gemini at the core and perfectly synced with your Android phone. Coming this fall. 💻✨ #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054270454467121187#m", "decryptage": null}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "En savoir plus ici : bit.ly/4v2OI03", "text_original": "Read more here: bit.ly/4v2OI03", "link": "https://nitter.net/demishassabis/status/2054197463855042669#m", "decryptage": null}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Ravi de voir @percyliang en tant que conférencier principal à #cais2026 ! ACM Conference on AI and Agentic Systems (@CAISconf) 🎤 Annonce de conférencier principal : @percyliang (Percy Liang), professeur d'informatique à @Stanford, directeur fondateur du Center for Research on Foundation Models, et co-fondateur de @togethercompute, sera le conférencier principal de #CAIS2026. Le framework HELM de Percy a établi la norme pour l'évaluation holistique des modèles de langage, et son Indice de transparence des modèles de fondation (maintenant dans sa troisième année) a mis tous les principaux laboratoires d'IA en garde sur ce qu'ils divulguent et ne divulguent pas. Son travail actuel sur Marin va plus loin : un laboratoire ouvert où chaque expérience, réussie ou non, est publique dès le premier jour. Ça va être bien. San Jose · 26-29 mai caisconf.org — https://nitter.net/CAISconf/status/2054256506464596282#m", "text_original": "Great to see @percyliang as a keynote speaker at #cais2026 ! ACM Conference on AI and Agentic Systems (@CAISconf) 🎤 Keynote announcement: @percyliang (Percy Liang), Professor of Computer Science at @Stanford , founding director of the Center for Research on Foundation Models, and co-founder of @togethercompute , is keynoting #CAIS2026 . Percy's HELM framework set the standard for holistic evaluation of language models, and his Foundation Model Transparency Index (now in its third year) put every major AI lab on notice for what they do and don't disclose. His current work on Marin takes this further: an open lab where every experiment, successful or not, is public from day one. This one's going to be good. San Jose · May 26–29 caisconf.org — https://nitter.net/CAISconf/status/2054256506464596282#m", "link": "https://nitter.net/JeffDean/status/2054294479113515385#m", "decryptage": "Mentionne Percy Liang, un expert reconnu en IA, qui interviendra à une conférence, connu pour ses travaux sur l'évaluation et la transparence des modèles d'IA."}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Aujourd'hui, nous lançons l'Initiative de Défense Ouverte : jusqu'à 5 millions de dollars en crédits @depthfirstlabs pour les projets open source critiques afin de trouver et de corriger des vulnérabilités réelles et exploitables. Nous avons investi massivement dans toute la pile technologique de sécurité agentique : un harnais qui permet aux modèles de raisonner efficacement sur le code comme le ferait un ingénieur en sécurité, la compréhension du contexte pour valider l'exploitabilité et produire des correctifs prêts à être fusionnés, et récemment, des modèles post-entraînés optimisés pour la découverte de vulnérabilités. Aujourd'hui, nous avons partagé un point de données qui met en évidence la valeur de cette approche. depthfirst a identifié de manière autonome 12 vulnérabilités dans @FFmpeg, après qu'Anthropic ait effectué plusieurs centaines d'exécutions avec Mythos, pour 1/10e du coût de calcul rapporté par Anthropic. En tant qu'ancien chercheur chez @GoogleDeepMind, je suis reconnaissant aux laboratoires de fondation de repousser les limites de ce que l'IA peut faire, car chaque avancée nous donne une base plus solide sur laquelle construire. Mais l'exécution de modèles à usage général sans le harnais approprié peut être trop coûteuse pour être économiquement viable. C'est ce qui rend le lancement d'aujourd'hui possible. L'efficacité que nous avons construite nous permet de mettre une sécurité de pointe entre les mains des mainteneurs qui en ont le plus besoin, avant que les modèles open source ne rattrapent leur retard et que de mauvais acteurs ne manient ces capacités sans filtres ni garde-fous. Si vous maintenez un projet open source critique, demandez des crédits Open Defense via le formulaire dans les commentaires.", "text_original": "Today we're launching the Open Defense Initiative: up to $5 million in @depthfirstlabs credits for critical open source projects to find and fix real, exploitable vulnerabilities. We’ve been investing heavily in the entire agentic security technology stack: a harness that allows models to efficiently reason through code the way a security engineer would, the context understanding to validate exploitability and produce ready-to-merge fixes, and recently, post-trained models optimized for vulnerability discovery. Today we shared a datapoint that highlights the value of that approach. depthfirst autonomously identified 12 vulnerabilities in @FFmpeg , after Anthropic did several hundred runs with Mythos, for 1/10th of the compute cost reported by Anthropic. As a former @GoogleDeepMind researcher, I am grateful to foundation labs for pushing the boundaries of what AI can do, as every advance there gives us a stronger base to build on. But running general purpose models without the proper harness can be too expensive to be economically viable. That's what makes today's launch possible. The efficiency we've built lets us put frontier-level security in the hands of the maintainers who need it most, before open source models catch up and bad actors wield these capabilities without filters or guardrails. If you maintain a critical open source project, apply for Open Defense credits through the form in the comments.", "link": "https://nitter.net/andreamichi/status/2054262136659194352#m", "decryptage": "Annonce une initiative pour aider les projets open source à trouver et corriger des failles de sécurité grâce à l'IA, en soulignant l'efficacité des outils comme `depthfirst` par rapport à des modèles plus coûteux."}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "Le package JAX a maintenant atteint un niveau similaire, avec 20 millions de téléchargements mensuels. Ce qui est une croissance incroyablement rapide, car il y a 5 ans, je me souviens qu'il était en dessous de 2 millions environ. Il est passé de niche à grand public ces deux dernières années. Un succès bien mérité.", "text_original": "The JAX package is now around the same level, 20M monthly downloads. Which is incredibly fast growth, because 5 years ago I recall it being below 2M or so. It went from niche to mainstream in the past couple of years. Well deserved success.", "link": "https://nitter.net/fchollet/status/2055040945763336508#m", "decryptage": null}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "Le package Keras a récemment dépassé les 21 millions de téléchargements mensuels sur PyPI, un record historique (le record quotidien est d'environ 900k). Je me souviens encore quand il a franchi les 10 millions de téléchargements mensuels il y a environ 5 ans et je pensais qu'il ne pouvait pas aller plus haut...", "text_original": "The Keras package recently crossed 21M monthly downloads on PyPI, an all-time high (the daily ATH is around 900k). I still remember when it first crossed 10M monthly downloads about 5 years ago and I thought it couldn't possibly go any higher...", "link": "https://nitter.net/fchollet/status/2055039639350919653#m", "decryptage": null}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Je suis ravi que @coursera et @udemy se soient réunis en une seule entreprise pour servir les apprenants. Coursera et Udemy ont toutes deux été fondées sur la conviction que l'accès à une éducation de haute qualité change des vies. Au fil des ans, les deux entreprises ont fait progresser cet objectif, créant des opportunités pour les individus, les organisations et les communautés du monde entier. Ce rôle est encore plus important maintenant, car l'IA change la nature du travail et augmente le besoin d'apprentissage continu. Aider les gens à acquérir des compétences pertinentes pour l'emploi sera essentiel pour créer un monde meilleur. En combinant les forces des deux entreprises, nous pouvons mieux répondre à ce besoin. Nous rassemblons un plus large éventail de contenus d'apprentissage, d'instructeurs et d'éducateurs de confiance, et des expériences d'apprentissage engageantes. Cela crée de nouvelles opportunités pour rendre l'apprentissage plus personnalisé, plus appliqué et plus accessible à grande échelle. Je suis ravi d'être président de l'entreprise combinée, travaillant aux côtés de Greg Hart et de l'équipe de direction. Il existe une base solide dans les deux organisations, et j'attends avec impatience ce que les équipes construiront ensemble pour étendre l'accès aux opportunités à l'échelle mondiale. En savoir plus : blog.coursera.org/coursera-a…", "text_original": "I'm delighted that @coursera and @udemy have come together as one company to serve learners. Both Coursera and Udemy were founded with the belief that access to high-quality education changes lives. Over the years, both companies have advanced this goal, creating opportunities for individuals, organizations, and communities around the world. That role is even more important now, as AI is changing the nature of work and increasing the need for continuous learning. Helping people build job-relevant skills will be critical to how we create a better world. By combining the strengths of both ‌companies, we can better serve this need. We bring together a broader range of learning content, trusted instructors and educators, and engaging learning experiences. This creates new opportunities to make learning more personalized, more applied, and more accessible at scale. I’m excited to serve as Chairman of the combined company, working alongside Greg Hart and the leadership team. There is a strong foundation in both organizations, and I look forward to what the teams will build together to expand access opportunity globally. Learn more: blog.coursera.org/coursera-a…", "link": "https://nitter.net/AndrewYNg/status/2053857910451827061#m", "decryptage": null}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Nouvel article : une visite visuelle des récentes avancées architecturales des LLM, de Gemma 4 à DeepSeek V4. Je me concentre sur les ajustements d'efficacité pour les contextes longs comme le partage KV, les embeddings par couche, les budgets d'attention par couche, l'attention compressée et le mHC. Lien : magazine.sebastianraschka.co…", "text_original": "New article: a visual tour of recent LLM architecture advances, from Gemma 4 to DeepSeek V4. I focus on long-context efficiency tweaks like KV sharing, per-layer embeddings, layer-wise attention budgets, compressed attention, and mHC. Link: magazine.sebastianraschka.co…", "link": "https://nitter.net/rasbt/status/2055637086380650538#m", "decryptage": "Présente un nouvel article qui explore visuellement les avancées récentes dans la conception des grands modèles de langage, notamment pour qu'ils traitent de plus longs textes plus efficacement."}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Le tableau au format HTML pour une visualisation plus facile (et non tronquée) : sebastianraschka.com/llm-arc…", "text_original": "The table in HTML format for easier (and non-truncated) viewing: sebastianraschka.com/llm-arc…", "link": "https://nitter.net/rasbt/status/2054949267630940606#m", "decryptage": null}, {"author_name": "Boris Cherny", "handle": "@bcherny", "text_fr": "Mythos a craqué MacOS. Cela a pris cinq jours.", "text_original": "Mythos has cracked MacOS. It took five days.", "link": "https://nitter.net/AndrewCurran_/status/2054975129621495973#m", "decryptage": "Annonce que l'IA \"Mythos\" a réussi à contourner la sécurité de MacOS en seulement cinq jours, soulignant ses capacités avancées en cybersécurité."}, {"author_name": "Boris Cherny", "handle": "@bcherny", "text_fr": "L'automatisation de la recherche en IA est la prochaine étape majeure de l'IA. Nous avons laissé Claude Code (Opus 4.7) et Codex (GPT 5.5) s'exécuter de manière autonome sur la piste d'optimisation du 'speedrun' de nanoGPT en utilisant notre puissance de calcul inactive. Environ 10 000 exécutions, environ 14 000 heures H200. Opus détient maintenant le record avec 2930 étapes contre la référence humaine de 2990.", "text_original": "Automating AI research is the next major step in AI We let Claude Code (Opus 4.7) and Codex (GPT 5.5) run autonomously on the nanoGPT speedrun optimizer track using our idle compute. ~10k runs, ~14k H200 hours Opus now holds the record at 2930 steps vs the 2990 human baseline", "link": "https://nitter.net/PrimeIntellect/status/2055056380881744365#m", "decryptage": "Des modèles d'IA comme Claude Code et Codex ont atteint des records de performance en optimisant du code, dépassant même les capacités humaines sur certaines tâches."}, {"author_name": "Boris Cherny", "handle": "@bcherny", "text_fr": "À partir du 15 juin, les forfaits Claude payants pourront réclamer un crédit mensuel dédié à l'utilisation programmatique. Le crédit couvre l'utilisation de : - Claude Agent SDK - claude -p - Claude Code GitHub Actions - Applications tierces basées sur le Agent SDK", "text_original": "Starting June 15, paid Claude plans can claim a dedicated monthly credit for programmatic usage. The credit covers usage of: - Claude Agent SDK - claude -p - Claude Code GitHub Actions - Third-party apps built on the Agent SDK", "link": "https://nitter.net/ClaudeDevs/status/2054610152817619388#m", "decryptage": "Annonce des crédits mensuels pour les utilisateurs payants de Claude, facilitant l'intégration du modèle dans leurs outils et processus de programmation via un \"SDK\" ou des \"GitHub Actions\"."}, {"author_name": "Noam Brown", "handle": "@polynoamial", "text_fr": "Vous voulez utiliser officiellement Codex au travail ? Envoyez ce message à votre CTO pour introduire votre équipe à Codex. Les clients d'entreprise éligibles qui changent dans les 30 prochains jours bénéficient de 2 mois gratuits d'utilisation de Codex pour les nouveaux utilisateurs.", "text_original": "Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users.", "link": "https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "decryptage": null}, {"author_name": "Noam Brown", "handle": "@polynoamial", "text_fr": "Fait amusant : les erreurs fatales ont été initialement signalées à l'aide de GPT-5.5 d'OpenAI. Epoch AI (@EpochAIResearch) Nous effectuons un examen assisté par IA de FrontierMath : Tiers 1-4. Cela a signalé des erreurs fatales dans environ un tiers des problèmes, et nous pensons que la plupart de ces signalements sont valides. Nous publierons des scores mis à jour sur un ensemble de données corrigé après avoir terminé un examen humain approfondi. — https://nitter.net/EpochAIResearch/status/2053995435870892048#m", "text_original": "Fun fact: the fatal errors were initially flagged using @OpenAI 's GPT-5.5 Epoch AI (@EpochAIResearch) We are conducting an AI-assisted review of FrontierMath: Tiers 1-4. This has flagged fatal errors in about a third of problems, and we believe most of these flags to be valid. We will release updated scores on a corrected dataset after completing a thorough human review. — https://nitter.net/EpochAIResearch/status/2053995435870892048#m", "link": "https://nitter.net/polynoamial/status/2054012326249185658#m", "decryptage": "Le modèle GPT-5.5 a permis d'identifier des erreurs critiques dans un ensemble de problèmes mathématiques complexes, démontrant sa capacité à valider la recherche."}, {"author_name": "Mark Chen", "handle": "@markchen90", "text_fr": "Ce n'est qu'une évaluation, mais c'est une évaluation importante - les tests de cyber-range de l'UK AISI évaluent les capacités agentiques à long terme. Le 5.5 fonctionne de manière similaire à Mythos. Les risques pour les modèles de pointe sont réels. Mais nous faisons de notre mieux pour déployer une IA que les gens peuvent réellement utiliser - grâce à un travail acharné sur les atténuations. AI Security Institute (@AISecurityInst) Le GPT-5.5 d'OpenAI est le deuxième modèle à compléter l'une de nos simulations d'attaques cyber multi-étapes de bout en bout 🧵 — https://nitter.net/AISecurityInst/status/2049868227740565890#m", "text_original": "This is just one eval, but it's an important one - UK AISI’s cyber range tests long-horizon, agentic capability. 5.5 performs similarly to Mythos. The risks for frontier models are real. But we do our best to deploy AI people can actually use - through hard work on mitigations. AI Security Institute (@AISecurityInst) OpenAI’s GPT-5.5 is the second model to complete one of our multi-step cyber-attack simulations end-to-end 🧵 — https://nitter.net/AISecurityInst/status/2049868227740565890#m", "link": "https://nitter.net/markchen90/status/2050011838990168462#m", "decryptage": "Confirme que GPT-5.5, comme Mythos, est très performant dans les tests de cybersécurité, soulignant les risques liés aux IA avancées mais aussi l'importance des efforts pour les rendre sûres et utiles."}, {"author_name": "Mark Chen", "handle": "@markchen90", "text_fr": "Nous avons essayé quelque chose de nouveau avec NVIDIA pour déployer Codex dans toute une entreprise et c'était génial de voir que ça fonctionnait. Faites-nous savoir si vous souhaitez le faire dans votre entreprise !", "text_original": "We tried a new thing with NVIDIA to roll out Codex across a whole company and it was awesome to see it work. Let us know if you'd like to do it at your company!", "link": "https://nitter.net/sama/status/2047395562501411058#m", "decryptage": null}, {"author_name": "Mark Chen", "handle": "@markchen90", "text_fr": "Et il fait un travail phénoménal ! Ashlee Vance (@ashleevance) L'une des choses les plus importantes que j'ai retenues de cette interview est que @gdb est de retour en force pour définir la stratégie d'@OpenAI. Le podcast complet est ici - corememory.com/p/the-great-r… Vidéo — https://nitter.net/ashleevance/status/2047012273840066909#m", "text_original": "And he’s doing a phenomenal job! Ashlee Vance (@ashleevance) One of the biggest things I took away from this interview was that @gdb is back in a major way setting the strategy for @OpenAI . Full pod right here - corememory.com/p/the-great-r… Video — https://nitter.net/ashleevance/status/2047012273840066909#m", "link": "https://nitter.net/markchen90/status/2047104498817286505#m", "decryptage": null}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Lien pour s'inscrire : rsvp.withgoogle.com/events/g…", "text_original": "Link to sign up: rsvp.withgoogle.com/events/g…", "link": "https://nitter.net/OfficialLoganK/status/2052816512797507623#m", "decryptage": null}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Venez fêter après Google IO avec l'équipe DeepMind à SF le 21 mai :) Beaucoup de choses à attendre avec impatience !! Lien dans le fil 🧵", "text_original": "Come celebrate after Google IO with the DeepMind team in SF on May 21st :) Lots to look forward to!! Link in 🧵", "link": "https://nitter.net/OfficialLoganK/status/2052816356928868465#m", "decryptage": null}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "PSA, nous recrutons pour notre équipe DevX afin de lancer notre présence en Inde 🇮🇳 ! Si vous voulez aider les développeurs à tirer le meilleur parti de Gemini en Inde, n'hésitez pas à me contacter par DM ou par e-mail. L'Inde est notre plus grand marché du point de vue des utilisateurs d'AI Studio, très excité de visiter plus tard cette année également !!", "text_original": "PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!!", "link": "https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "decryptage": "Google recherche des talents en Inde pour soutenir les développeurs utilisant Gemini, soulignant l'importance croissante de ce marché pour l'IA."}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "Gemma-4 arrive dans Vision Arena en tant que 2e et 4e modèles ouverts, et déplace la frontière de Pareto ! @GoogleDeepMind domine la frontière de Pareto prix-performance en Vision sur les modèles propriétaires et ouverts. - Gemma-4-31b se classe #2 ouvert (#20 au total) - Gemma-4-26b-a4b se classe #4 ouvert (#26 au total) Vision Arena classe les modèles d'IA multimodaux capables de raisonner sur des entrées visuelles. Félicitations à @GoogleDeepMind encore une fois pour les progrès des modèles ouverts ! Google DeepMind (@GoogleDeepMind) Découvrez Gemma 4 : notre nouvelle famille de modèles ouverts que vous pouvez exécuter sur votre propre matériel. Conçus pour le raisonnement avancé et les workflows d'agents, nous les publions sous une licence Apache 2.0. Voici les nouveautés 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "text_original": "Gemma-4 lands in Vision Arena as #2 & #4 open models, and shifts the Pareto frontier! @GoogleDeepMind dominates the price-performance Pareto in Vision across both proprietary and open models. - Gemma-4-31b ranks #2 open (#20 overall) - Gemma-4-26b-a4b ranks #4 open (#26 overall) The Vision Arena ranks multimodal AI models capable of reasoning over visual inputs. Congrats to @GoogleDeepMind again on the open model progress! Google DeepMind (@GoogleDeepMind) Meet Gemma 4: our new family of open models you can run on your own hardware. Built for advanced reasoning and agentic workflows, we’re releasing them under an Apache 2.0 license. Here’s what’s new 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "link": "https://nitter.net/arena/status/2052496756773093814#m", "decryptage": "Annonce que les modèles \"Gemma 4\" de Google DeepMind ont atteint un très haut niveau de performance pour l'interprétation visuelle, se classant parmi les meilleurs modèles ouverts."}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "Gemma 4 jusqu'à 3x plus rapide, directement sur votre téléphone ! 🚀 Découvrez la différence que fait le décodage spéculatif (Multi-Token Prediction) ! Le Multi-Token Prediction (MTP) suralimente les vitesses d'inférence pour Gemma 4.", "text_original": "Gemma 4 up to 3x faster, directly in your phone! 🚀 Check out the difference Speculative Decoding makes! Multi-Token Prediction (MTP) is supercharging inference speeds for Gemma 4.", "link": "https://nitter.net/googlegemma/status/2052468624657654194#m", "decryptage": "Le modèle \"Gemma 4\" peut être jusqu'à 3 fois plus rapide sur les téléphones grâce à une technique appelée \"Speculative Decoding\", qui permet de prédire plusieurs mots à la fois."}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Nous avons publié un document qui explique notre point de vue sur la concurrence en matière d'IA entre les États-Unis et la Chine. Les États-Unis et leurs alliés démocratiques détiennent aujourd'hui l'avantage en matière d'IA de pointe. Lisez la suite sur ce qu'il faudra pour maintenir cet avantage : anthropic.com/research/2028-…", "text_original": "We've published a paper that explains our views on AI competition between the US and China. The US and democratic allies hold the lead in frontier AI today. Read more on what it’ll take to keep that lead: anthropic.com/research/2028-…", "link": "https://nitter.net/AnthropicAI/status/2054987444664377374#m", "decryptage": "Anthropic a publié un rapport analysant la compétition en IA entre les États-Unis et la Chine, et ce qu'il faut faire pour maintenir l'avance des démocraties."}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Nous nous associons à la Fondation Gates, engageant 200 millions de dollars en subventions, crédits Claude et soutien technique pour des programmes de santé mondiale, de sciences de la vie, d'éducation, d'agriculture et de mobilité économique. En savoir plus : anthropic.com/news/gates-fou…", "text_original": "We’re partnering with the Gates Foundation, committing $200 million in grants, Claude credits, and technical support to programs in global health, life sciences, education, agriculture, and economic mobility. Read more: anthropic.com/news/gates-fou…", "link": "https://nitter.net/AnthropicAI/status/2054941901900611787#m", "decryptage": "Anthropic s'associe à la Fondation Gates pour investir 200 millions de dollars en subventions et support technique pour des programmes mondiaux dans la santé, l'éducation et l'agriculture."}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "La Constitution de Claude est maintenant un livre audio, lu par deux de ses auteurs, Amanda Askell et Joe Carlsmith. Il comprend une séance de questions-réponses sur le processus d'écriture, les philosophies qui ont façonné le document et comment il pourrait changer à mesure que les modèles deviennent plus performants. Écoutez sur anthropic.com/constitution Vidéo", "text_original": "Claude's Constitution is now an audiobook, read by two of its authors, Amanda Askell and Joe Carlsmith. It includes a Q&A on the writing process, the philosophies that shaped the document, and how it might change as models become more capable. Listen at anthropic.com/constitution Video", "link": "https://nitter.net/AnthropicAI/status/2053881827396653207#m", "decryptage": "La \"Constitution de Claude\" (les principes éthiques qui guident l'IA Claude) est désormais disponible en livre audio, offrant un aperçu de sa création et de son évolution."}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Lisez l'article complet ici : alignment.anthropic.com/2026…", "text_original": "Read the full post here: alignment.anthropic.com/2026…", "link": "https://nitter.net/AnthropicAI/status/2052808809182060581#m", "decryptage": null}, {"author_name": "OpenAI", "handle": "@OpenAI", "text_fr": "Déploiement aujourd'hui en avant-première sur iOS et Android dans toutes les régions prises en charge. Le support pour la connexion de votre téléphone à l'application Codex sur Windows arrive bientôt. openai.com/index/work-with-c…", "text_original": "Rolling out today as a preview on iOS and Android in all supported regions. Support for connecting your phone to the Codex app on Windows is coming soon. openai.com/index/work-with-c…", "link": "https://nitter.net/OpenAI/status/2055016852133417389#m", "decryptage": null}, {"author_name": "OpenAI", "handle": "@OpenAI", "text_fr": "Vous l'attendiez... Maintenant en avant-première : Codex dans l'application mobile ChatGPT. Commencez de nouveaux travaux, examinez les résultats, dirigez l'exécution et approuvez les prochaines étapes, tout depuis l'application mobile ChatGPT. Codex continuera de fonctionner sur votre ordinateur portable, Mac mini ou devbox. Vidéo", "text_original": "You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video", "link": "https://nitter.net/OpenAI/status/2055016850849993072#m", "decryptage": "Annonce que Codex est maintenant disponible en avant-première sur l'application mobile ChatGPT, permettant de gérer les tâches de programmation à distance depuis son téléphone."}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Votre agent IA peut-il relever notre nouveau défi simulé ? 🧑🌾 Le tout nouveau défi de clôture de notre cours intensif de 5 jours sur les Agents IA : \"Vibecoding\" avec @Google est arrivé : Kaggriculture ! Rejoignez notre cours pratique et gratuit, conçu par des chercheurs et ingénieurs de Google, du 15 au 19 juin, pour apprendre à construire et déployer votre propre agent IA gagnant.", "text_original": "Can your AI agent win our new simulated challenge? 🧑🌾 The all-new capstone challenge for our 5-Day AI Agents: Intensive Vibecoding Course with @Google is here: Kaggriculture! Join our no-cost, hands-on course designed by Google researchers and engineers from June 15–19 to learn how to build and deploy your own winning AI agent.", "link": "https://nitter.net/kaggle/status/2054705171050164348#m", "decryptage": "Propose un nouveau défi de programmation (\"Kaggriculture\") dans le cadre d'un cours intensif sur les \"agents\" IA, pour apprendre à construire et déployer des IA gagnantes."}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Vous pouvez maintenant utiliser votre abonnement @grok à l'intérieur de NousResearch Hermes Agent. x.ai/news/grok-hermes", "text_original": "You can now use your @grok subscription inside @NousResearch Hermes Agent. x.ai/news/grok-hermes", "link": "https://nitter.net/xai/status/2055375676656783733#m", "decryptage": null}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Une première version bêta de Grok Build, une interface en ligne de commande (\"agentic CLI\") pour le codage, la création d'applications et l'automatisation des workflows, est maintenant disponible pour les abonnés SuperGrok Heavy. Grâce à cette bêta anticipée, nous améliorerons le modèle et le produit en fonction de vos retours. Essayez-le sur x.ai/cli", "text_original": "An early beta of Grok Build, an agentic CLI for coding, building apps, and automating workflows is now available for SuperGrok Heavy subscribers. Through this early beta, we will improve the model and product based on your feedback. Try it at x.ai/cli", "link": "https://nitter.net/xai/status/2054993285152989373#m", "decryptage": "Lancement d'une version bêta de \"Grok Build\", un outil en ligne de commande qui utilise l'IA pour aider à coder, créer des applications et automatiser des tâches, destiné aux abonnés de Grok."}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Essayez-le maintenant gratuitement : console.x.ai/playground/voic…", "text_original": "Try it now for free: console.x.ai/playground/voic…", "link": "https://nitter.net/xai/status/2052529105086857397#m", "decryptage": null}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "La première présentation de notre piste IA à #PyConUS aura lieu à 11h. Paolo Melchiorre @ PyCon US (@pauloxnet) Aujourd'hui à 11h00, je parlerai à PyCon US dans la Grande Salle de Bal A du Long Beach Convention Center des contributions assistées par l'IA et de l'impact qu'elles ont déjà sur les mainteneurs open source 🎤 us.pycon.org/2026/schedule/p… CC @simonw @pycon #Python #OpenSource #PyConUS #PyCon — https://nitter.net/pauloxnet/status/2055301632833863835#m", "text_original": "First talk in our AI track at #PyConUS is coming up at 11am Paolo Melchiorre @ PyCon US (@pauloxnet) Today at 11:00 AM I’ll be speaking at PyCon US in Grand Ballroom A at the Long Beach Convention Center about AI-assisted contributions and the impact they’re already having on open source maintainers 🎤 us.pycon.org/2026/schedule/p… CC @simonw @pycon #Python #OpenSource #PyConUS #PyCon — https://nitter.net/pauloxnet/status/2055301632833863835#m", "link": "https://nitter.net/simonw/status/2055339124035625185#m", "decryptage": null}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "J'ai écrit sur la restructuration / « réduction d'effectifs » de GitLab annoncée aujourd'hui, et j'ai fini par fouiller dans le contrôle de version des manuels d'employés publics de GitLab et de 37signals pour aider à illustrer mes réflexions simonwillison.net/2026/May/1…", "text_original": "Wrote about today's GitLab restructuring / \"workforce reduction\" announcement, and ended up digging around in version control for both the GitLab and the 37signals public employee handbooks to help illustrate my thoughts simonwillison.net/2026/May/1…", "link": "https://nitter.net/simonw/status/2053992869405618580#m", "decryptage": null}, {"author_name": "Shawn Wang", "handle": "@swyx", "text_fr": "C'est incroyable – le ministre des Affaires étrangères de Singapour, @VivianBala, explique comment il utilise un Nanoclaw sur un Raspberry PI. C'est un bijou ; il dit que les barrières à l'accessibilité se sont effondrées ; sa configuration n'a pas été créée par lui ; et que la mémoire est la prochaine frontière (LOL)", "text_original": "This is amazing - we have Singapore's Minister of Foreign Affairs @VivianBala explaining how he uses a Nanoclaw on Raspberry PI This is a gem; He says the barriers to accessibility have collapsed - his setup was not created by him; and that memory is the next frontier (LOL)", "link": "https://nitter.net/zeroxkyle/status/2055469774784926192#m", "decryptage": "Le ministre des Affaires étrangères de Singapour explique comment il utilise un petit ordinateur (Raspberry Pi) avec une IA, montrant que l'IA devient accessible à tous."}, {"author_name": "Shawn Wang", "handle": "@swyx", "text_fr": "Clôture du deuxième jour de @aiDotEngineer Singapore. @swyx, un homme pour le peuple ! Nehal (@NehallAgrawal) 🛑[EN DIRECT] au deuxième jour de @aiDotEngineer 🇸🇬 @swyx l'homme lui-même sur la construction de @aiDotEngineer, ce à quoi ressemble un véritable focus sur l'entreprise et la liste de contrôle pour la construction d'un laboratoire d'agents. « La chose la plus intéressante pour moi est d'être le premier à découvrir des problèmes complexes, et cela se trouve généralement au niveau de l'entreprise » — https://nitter.net/NehallAgrawal/status/2055588427639439646#m", "text_original": "Closing out day 2 of @aiDotEngineer Singapore. @swyx a man for the people! Nehal (@NehallAgrawal) 🛑[LIVE] on day 2 of @aiDotEngineer 🇸🇬 @swyx the man himself on building @aiDotEngineer , what true enterprise focus looks like and the checklist for building an agent lab. “The most interesting thing to me is being the first to discover complex problems, and that usually is in enterprise level” — https://nitter.net/NehallAgrawal/status/2055588427639439646#m", "link": "https://nitter.net/waynesutton/status/2055610560998441224#m", "decryptage": "Shawn Wang partage sa vision sur la construction de \"laboratoires d'agents\" IA et l'importance de se concentrer sur les besoins des entreprises pour découvrir des problèmes complexes."}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "Nos ingénieurs ont passé un excellent moment à Interrupt:2026 de @LangChain, apprenant sur l'observabilité, les évaluations d'agents et les meilleures pratiques des leaders de l'industrie ! Impatients de voir ce qu'ils vont concocter avec leurs apprentissages 👀", "text_original": "our engineers had an awesome time attending Interrupt:2026 by @LangChain learning about observability, agent evals, and best practices from the industry leaders! can't wait to see what they cook up with their learnings 👀", "link": "https://nitter.net/ZipEngineering/status/2055055613067923699#m", "decryptage": null}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "J'ai eu l'honneur de partager la scène avec la seule et unique @sydneyrunkle à Interrupt 2026 pour parler des Deep Agents. Inscrivez-vous dès aujourd'hui sur la liste d'attente de Managed Deep Agents pour un accès anticipé ! langchain.com/langsmith-mana… Sydney Runkle (@sydneyrunkle) La conférence Interrupt 2026 de @LangChain a été un succès retentissant !! Quel plaisir de discuter avec @VictorMoreira16 des agents profonds ! Au cas où vous l'auriez manqué : nous venons de sortir la v0.6, qui est axée sur la performance aux niveaux du modèle, du harnais et du contexte ! — https://nitter.net/sydneyrunkle/status/2055307843243479046#m", "text_original": "Had the honor of sharing the stage with the one and only @sydneyrunkle at Interrupt 2026 to talk about Deep Agents. Sign-up for the Managed Deep Agents waitlist today to get early access! langchain.com/langsmith-mana… Sydney Runkle (@sydneyrunkle) @LangChain ’s Interrupt 2026 conference was a blast!! such a pleasure to with @VictorMoreira16 about deep agents! ICYMI: we just dropped v0.6, which is focused on performance at the model, harness, and context layers! — https://nitter.net/sydneyrunkle/status/2055307843243479046#m", "link": "https://nitter.net/VictorMoreira16/status/2055353074118754673#m", "decryptage": "Lance la liste d'attente pour \"Managed Deep Agents\" et annonce la version 0.6 de LangChain, axée sur l'amélioration des performances des modèles d'IA."}, {"author_name": "Jeremy Howard", "handle": "@jeremyphoward", "text_fr": "Nous sommes allés encore plus loin : Nemotron 3 Super fait 120 milliards de paramètres et est pré-entraîné sur 25 téraoctets de jetons en NVFP4. Nemotron 3 Ultra fait environ 500 milliards et est également pré-entraîné en NVFP4. L'informatique accélérée signifie que nous repensons chaque aspect de la pile IA à la recherche de nouvelles opportunités d'améliorer l'efficacité. How To AI (@HowToAI_) NVIDIA a fait l'impossible et personne n'en parle. Ils ont entraîné un LLM de 12 MILLIARDS de paramètres en précision 4 bits sur 10 trillions de jetons. Pendant des années, l'industrie de l'IA a été bloquée. Si vous vouliez entraîner une IA de classe mondiale, vous deviez utiliser une précision de 16 ou 8 bits. Descendre à 4 bits était une condamnation à mort pour le modèle. Il deviendrait instable, \"hallucinerait\" ses propres calculs et finirait par s'effondrer. Mais NVIDIA a prouvé que l'\"impossible\" n'était qu'un problème mathématique. Ils ont utilisé un nouveau format appelé NVFP4. Au lieu d'une structure standard et rigide, NVFP4 utilise la \"micro-mise à l'échelle\". Il regroupe les nombres en petits blocs et applique des facteurs de mise à l'échelle individuels à chacun. C'est comme donner à l'IA une paire de lunettes haute définition pour ses propres données, lui permettant de voir les détails fins même avec 75 % moins de mémoire. Le résultat est un changement de paradigme total : - 2 à 3 fois plus de performances arithmétiques. - Réduction de 50 % de l'utilisation de la mémoire. - Perte d'intelligence quasi nulle. Les chercheurs ont comparé le modèle 4 bits à une base de référence massive de 8 bits. Les courbes sont identiques. Sur MMLU, GSM8K et les benchmarks de codage, la \"petite\" version 4 bits a fonctionné à 0,1 % près du modèle plus coûteux. C'est un séisme économique. L'entraînement d'un modèle de pointe nécessitait des dizaines de milliers de GPU et des mois de temps. NVIDIA vient de montrer que nous pouvons obtenir les mêmes résultats avec la moitié du matériel et une fraction de l'électricité. — https://nitter.net/HowToAI_/status/2055130148614050264#m", "text_original": "We've gone even farther: Nemotron 3 Super is 120B and pretrained on 25T tokens in NVFP4. Nemotron 3 Ultra is ~500B and also pretrained in NVFP4. Accelerated computing means we rethink every aspect of the AI stack looking for new opportunities to improve efficiency. How To AI (@HowToAI_) NVIDIA has done the impossible and nobody's talking about it. They trained a 12 BILLION parameter LLM in 4-bit precision on 10 trillion tokens. For years, the AI industry has been stuck. If you wanted to train a world-class AI, you had to use 16-bit or 8-bit precision. Going lower to 4-bit, was a death sentence for the model. It would become unstable, \"hallucinate\" its own math, and eventually collapse. But NVIDIA proved that \"impossible\" was just a math problem. They used a new format called NVFP4. Instead of a standard, rigid structure, NVFP4 uses \"micro-scaling.\" It groups numbers into tiny blocks and applies individual scaling factors to each one. It’s like giving the AI a pair of high-definition glasses for its own data, allowing it to see fine details even with 75% less memory. The result is a total paradigm shift: - 2× to 3× faster arithmetic performance. - 50% reduction in memory usage. - Near-zero loss in intelligence. The researchers compared the 4-bit model against a massive 8-bit baseline. The curves are identical. On MMLU, GSM8K, and coding benchmarks, the \"tiny\" 4-bit version performed within 0.1% of the more expensive model. This is an economic earthquake. Training a frontier model used to require tens of thousands of GPUs and months of time. NVIDIA just showed we can get the same results with half the hardware and a fraction of the electricity. — https://nitter.net/HowToAI_/status/2055130148614050264#m", "link": "https://nitter.net/ctnzr/status/2055393135971492034#m", "decryptage": "NVIDIA a réalisé une avancée majeure en entraînant des modèles d'IA massifs avec une précision de 4 bits, réduisant énormément les besoins en matériel et en énergie tout en maintenant la performance."}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "Vieille nouvelle oui, mais il vient de les suivre aujourd'hui ! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk a récemment suivi @cursor_ai (🤖👁️ : contexte s'il vous plaît) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "text_original": "Old news yes, but he just followed them today! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk recently followed @cursor_ai (🤖👁️: context please) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "link": "https://nitter.net/levelsio/status/2055013162840182960#m", "decryptage": null}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "Toujours en train de penser à hier 🥹 tellement reconnaissant d'avoir pu parler à @artistatmachine au nom de @Replit et de présenter ce que nous avons construit ! C'était tellement amusant de partager la scène avec Andy et Teresa alors qu'ils montraient leurs propres projets construits avec Replit aussi. Quelle salle cool de personnes créatives et tech !", "text_original": "still thinking about yesterday 🥹 so grateful I got to speak at @artistatmachine on behalf of @Replit and demo what we’ve been building! it was so fun getting to share the stage with Andy and Teresa as they showed their own Replit-built projects too. such a cool room of creative tech people!", "link": "https://nitter.net/sarahli/status/2055384060005064980#m", "decryptage": null}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "Musique et code se rencontrent. Vibecon s'empare de NYC les 17 et 18 juin, avec des performances construites à l'intersection du logiciel et de la scène. Deux jours où le travail ne reste pas figé. Obtenez vos billets sur vibecon.ai", "text_original": "Music meets code. Vibecon takes over NYC June 17–18, with performances built at the intersection of software and stage. Two days where the work doesn't sit still. Get your tickets at vibecon.ai", "link": "https://nitter.net/Replit/status/2055392846937485385#m", "decryptage": "Annonce \"Vibecon\", un événement à New York où la musique et la technologie se rencontrent, avec des performances créées à l'intersection du logiciel et de la scène."}, {"author_name": "Arthur Mensch", "handle": "@ArthurMensch", "text_fr": "Le PDG de Mistral : les entreprises d'IA devraient payer une taxe sur le contenu en Europe ft.trib.al/hKU8k0g | opinion", "text_original": "Mistral CEO: AI companies should pay a content levy in Europe ft.trib.al/hKU8k0g | opinion", "link": "https://nitter.net/FT/status/2034963417816093104#m", "decryptage": "Le PDG de Mistral suggère que les entreprises d'IA devraient payer une taxe en Europe pour l'utilisation de contenus, ce qui pourrait financer les créateurs de contenu."}, {"author_name": "Arthur Mensch", "handle": "@ArthurMensch", "text_fr": "Hâte de construire des modèles d'IA de pointe en open source avec @Nvidia alors que nous rejoignons la Coalition Nemotron et commençons à entraîner les premiers modèles de base.", "text_original": "Looking forward to building frontier open source AI models together with @Nvidia as we join the Nemotron Coalition and start training the first base models.", "link": "https://nitter.net/arthurmensch/status/2033685747769774121#m", "decryptage": "Annonce la collaboration avec Nvidia dans la \"Nemotron Coalition\" pour développer les premiers modèles d'IA de base, soulignant l'importance de ce partenariat."}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "(っ◔◡◔)っ Nous rejoignons @MistralAI ! ｃ(◔◡◔ｃ) Je suis ravi d'annoncer que nous unissons nos forces avec @MistralAI Je commence officiellement un nouveau chapitre en tant que Responsable des Opérations Cyber, et le meilleur, c'est que je ne viens pas seul ! J'emmène une partie de l'équipe AllVei avec moi pour construire l'avenir de l'IA pour la Cyber :D Après avoir discuté avec @GuillaumeLample et l'équipe fondatrice, il est rapidement devenu clair que nous partagions la même obsession et le même état d'esprit. Avec Mistral, nous passons à un tout autre niveau : l'esprit innovant du champion français de l'IA, des ressources incroyables, et des gens absolument brillants avec qui travailler chaque jour. L'accord était trop évident 😄 Un grand merci à Guillaume et à toute l'équipe Mistral pour leur confiance. Je tiens également à remercier tous ceux qui ont cru en AllVei ces derniers mois. Merci à l'incroyable écosystème technologique en Bretagne (Village By CA Finistère, @regionbretagne, @FTBrestPlus, @Bpifrance), aux VCs, et à nos incroyables partenaires de conception. Votre soutien a énormément compté ❤️ Impatient de vous montrer ce que nous construisons. Au travail 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "text_original": "(っ◔◡◔)っ We are joining @MistralAI ! ｃ(◔◡◔ｃ) I’m thrilled to announce that we are merging forces with @MistralAI I am officially starting a new chapter as Cyber Ops Lead, and the best part is I’m not coming alone! I’m bringing part of the AllVei team with me to build the future of AI for Cyber :D After talking with @GuillaumeLample and the founding team, it quickly became clear that we share the exact same obsession and mindset. With Mistral, we’re scaling up to a whole new level: the innovative spirit of the French AI champion, incredible resources, and absolutely brilliant people to work with every day. The fit was just too obvious 😄 A huge thanks to Guillaume and the entire Mistral team for their trust. I also want to thank everyone who believed in AllVei over the last few months. Thank you to the incredible tech ecosystem in Brittany (Village By CA Finistère, @regionbretagne , @FTBrestPlus , @Bpifrance ), to the VCs, and to our amazing design partners. Your support meant the world ❤️ Can’t wait to show you what we’re building. Let’s get to work 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "link": "https://nitter.net/DoomerOutrun/status/2048853527187841133#m", "decryptage": "Annonce que Guillaume Lample et son équipe rejoignent MistralAI pour diriger la cybersécurité avec l'IA, combinant l'expertise en IA et en sécurité."}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "Ravi de rejoindre @MistralAI 😻 ! Hâte de repousser les frontières du pré-entraînement et de faire progresser la prochaine génération de LLM. 💚 Reconnaissant pour mon temps chez @nvidia -- ça a été une base incroyable pour ce nouveau chapitre.", "text_original": "Thrilled to be joining @MistralAI 😻! Looking forward to pushing the frontier of pretraining and advancing the next generation of LLMs. 💚Grateful for my time at @nvidia -- it's been an incredible foundation for this next chapter.", "link": "https://nitter.net/shrimai_/status/2049171872042852732#m", "decryptage": "Shrimai se réjouit de rejoindre MistralAI pour faire progresser la recherche sur l'apprentissage des grands modèles de langage et développer la prochaine génération d'IA."}, {"author_name": "Thomas Wolf", "handle": "@Thom_Wolf", "text_fr": "Derniers jours pour les tarifs de prévente !", "text_original": "Last days of early bird pricing!", "link": "https://nitter.net/Thom_Wolf/status/2054199267636511036#m", "decryptage": null}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "J'ai eu des discussions incroyables, et j'ai fait un tour de 'vibe' à NYC ! C'est ce dont parle ce post : https://nitter.net/AmjadMasad/status/2055097107758076254#m", "text_original": "I had some amazing talks, and I did a NYC 'vibe' tour! This is what this post is all about: https://nitter.net/AmjadMasad/status/2055097107758076254#m", "link": "https://nitte
