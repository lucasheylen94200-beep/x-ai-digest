ding up or somehow improving what existed, but here we have examples of functionality that either suddenly perhaps shouldn't even exist (1,2), or was fundamentally not possible before (3). The second (ongoing) theme is trying to explain the pattern of jaggedness in LLMs. How it can be true that a single artifact will simultaneously 1) coherently refactor a 100,000-line code base *and* 2) tell you to walk to the car wash to wash your car. I previously wrote about the source of this as having to do with verifiability of a domain, here I expand on this as having to also do with economics because revenue/TAM dictates what the frontier labs choose to package into training data distributions during RL. You're either in the data distribution (on the rails of the RL circuits) and flying or you're off-roading in the jungle with a machete, in relative terms. Still not 100% satisfied with this, but it's an ongoing struggle to build an accurate model of LLM capabilities if you wish to practically take advantage of their power while avoiding their pitfalls, which brings me to... Last theme is the agent-native economy. The decomposition of products and services into sensors, actuators and logic (split up across all of 1.0/2.0/3.0 computing paradigms), how we can make information maximally legible to LLMs, some words on the quickly emerging agentic engineering and its skill set, related hiring practices, etc., possibly even hints/dreams of fully neural computing handling the vast majority of computation with some help from (classical) CPU coprocessors. Stephanie Zhan (@stephzhan) @karpathy and I are back! At @sequoia AI Ascent 2026. And a lot has changed. Last year, he coined “vibe coding”. This year, he’s never felt more behind as a programmer. The big shift: vibe coding raised the floor. Agentic engineering raises the ceiling. We talk about what it means to build seriously in the agent era. Not just moving faster. Building new things, with new tools, while preserving the parts that still require human taste, judgment, and understanding. Video — https://nitter.net/stephzhan/status/2049518659513852109#m", "link": "https://nitter.net/karpathy/status/2049903821095354523#m", "decryptage": "Les LLM (modèles de langage à grande échelle) ne se contentent pas d'accélérer les tâches existantes, mais ouvrent de nouvelles voies pour la création d'applications sans code classique (menugen), l'installation de logiciels à partir de descriptions textuelles, et la gestion de bases de connaissances sur des données non structurées, tout en présentant des performances \"irrégulières\" qui nécessitent de comprendre comment ils sont entraînés.", "category": "idees"}, {"author_name": "Sam Altman", "handle": "@sama", "text_fr": "J'ai une certaine anxiété à ne pas utiliser le modèle/les réglages les plus intelligents disponibles. Mais parfois, ça ne me dérange pas si c'est vraiment lent. Je me demande si nous devrions nous concentrer davantage sur un compromis prix/vitesse par rapport à un compromis prix/intelligence.", "text_original": "i get some anxiety not using the smartest-available model/settings. but sometimes i dont mind if it's really slow. i wonder if we should focus more on a price/speed tradeoff relative to a price/intelligence tradeoff.", "link": "https://nitter.net/sama/status/2054627102922797323#m", "decryptage": "Sam Altman s'interroge sur l'équilibre optimal entre le coût, la rapidité et l'intelligence des modèles d'IA, suggérant que la vitesse et le prix pourraient être des facteurs plus importants que l'intelligence brute dans certaines situations.", "category": "idees"}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "La cybersécurité est le premier danger clair et actuel des modèles d'IA de pointe, mais ce ne sera pas le dernier. Si nous sommes collectivement capables de relever ce défi et de faire face à ce risque, cela pourrait servir de modèle pour aborder les défis encore plus difficiles qui nous attendent.", "text_original": "Cyber is the first clear and present danger from frontier AI models, but it won’t be the last. If we are able to collectively rise to the challenge and confront this risk, it could serve as a blueprint for addressing the even more difficult challenges that lie ahead of us.", "link": "https://nitter.net/DarioAmodei/status/2041580343472337145#m", "decryptage": "Dario Amodei met en garde contre la capacité grandissante des IA de pointe à créer des menaces cybernétiques, soulignant que ce domaine est le premier où l'IA pose un risque direct et immédiat, servant de test pour gérer de futurs défis plus complexes.", "category": "idees"}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Les dangers de se tromper sont évidents, mais si nous réussissons, il y a une réelle opportunité de créer un internet et un monde fondamentalement plus sûrs qu'ils ne l'étaient avant l'avènement des capacités cybernétiques alimentées par l'IA.", "text_original": "The dangers of getting this wrong are obvious, but if we get it right, there is a real opportunity to create a fundamentally more secure internet and world than we had before the advent of AI-powered cyber capabilities.", "link": "https://nitter.net/DarioAmodei/status/2041580341794615631#m", "decryptage": "Bien que l'IA puisse augmenter les risques cybernétiques, une approche correcte et collective de la sécurité grâce à l'IA pourrait rendre Internet et le monde plus sûrs qu'ils ne l'étaient auparavant.", "category": "idees"}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Glasswing n'est que la première étape : corriger et sécuriser l'infrastructure logicielle mondiale sera l'affaire de mois et d'années, et exigera une coopération encore plus large entre les entreprises d'IA, les cyberdéfenseurs, les fournisseurs de logiciels, les gouvernements, et plus encore.", "text_original": "Glasswing is just the first step: patching and securing the world’s software infrastructure will be the work of months and years, and will require even broader cooperation across AI companies, cyberdefenders, software providers, governments, and more.", "link": "https://nitter.net/DarioAmodei/status/2041580340032995821#m", "decryptage": "Le projet Glasswing est une première étape pour sécuriser le monde numérique contre les menaces d'IA, mais il faudra une collaboration massive et à long terme entre de nombreux acteurs pour y parvenir, car la tâche est immense et continue.", "category": "idees"}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Plutôt que de publier Mythos Preview en disponibilité générale, nous donnons aux défenseurs un accès anticipé et contrôlé afin de trouver et de corriger les vulnérabilités avant que les modèles de classe Mythos ne prolifèrent dans l'écosystème.", "text_original": "Rather than release Mythos Preview to general availability, we’re giving defenders early controlled access in order to find and patch vulnerabilities before Mythos-class models proliferate across the ecosystem.", "link": "https://nitter.net/DarioAmodei/status/2041580338426585171#m", "decryptage": "Au lieu de rendre le modèle d'IA \"Mythos Preview\" public immédiatement, Anthropic lui donne un accès limité aux experts en sécurité pour qu'ils puissent trouver et corriger ses faiblesses avant qu'il ne soit largement disponible, afin d'éviter les utilisations malveillantes.", "category": "idees"}, {"author_name": "Dario Amodei", "handle": "@DarioAmodei", "text_fr": "Nous suivons les capacités cybernétiques croissantes des modèles d'IA depuis des années, qui apparaissent dans le cadre de leur compétence générale en matière de codage. Mais notre nouveau modèle, Mythos Preview, représente une avancée particulièrement importante.", "text_original": "We’ve been tracking the increasing cyber capabilities of AI models for years, which arise as part of their general proficiency at coding. But our new model, Mythos Preview, represents a particularly large step up.", "link": "https://nitter.net/DarioAmodei/status/2041580336828568000#m", "decryptage": "Les modèles d'IA deviennent de plus en plus performants en matière de cybersécurité, capables de trouver des failles et de coder, et le nouveau modèle \"Mythos Preview\" marque une étape importante dans cette progression.", "category": "idees"}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "La quantité de code que les développeurs livrent a été multipliée par environ 10. Mais la productivité nette des développeurs (valeur créée par unité de temps) n'a augmenté que de peu, voire pas du tout. Une partie de cela est que le code additionnel résout des problèmes plus incrémentiels. Une part plus importante est que le nouveau code crée ses propres problèmes.", "text_original": "The quantity of code that devs ship has roughly 10xed. But net developer productivity (value created by unit of time) is only up by a bit, if at all. Part of it is that the additional code is solving more incremental problems. A bigger part is that the new code is creating problems of its own.", "link": "https://nitter.net/fchollet/status/2054917282015445076#m", "decryptage": "Malgré l'explosion de la quantité de code que les développeurs peuvent produire, notamment grâce à l'IA, leur efficacité réelle (leur capacité à créer de la valeur) n'a pas augmenté proportionnellement, car ce nouveau code résout souvent des problèmes moins importants ou en crée de nouveaux.", "category": "idees"}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "Cela me rappelle l'informatisation. La quantité de \"travail\" que les gens pouvaient exécuter sur les ordinateurs a augmenté de manière considérable, mais leur productivité n'a pas suivi. La quantité de travail \"nécessaire\" pour arriver aux mêmes résultats de haut niveau a explosé.", "text_original": "This reminds me of computerization. The amount of \"work\" people could execute on computers increased by a huge factor, but their productivity did not. The amount of work \"needed\" to arrive at the same high-level outputs exploded.", "link": "https://nitter.net/fchollet/status/2054917911207395384#m", "decryptage": "La capacité à traiter des tâches avec l'IA a considérablement augmenté, mais comme l'informatisation avant elle, cela ne se traduit pas toujours par une augmentation équivalente de la productivité humaine globale, car la complexité des tâches finales peut aussi s'accroître.", "category": "idees"}, {"author_name": "Francois Chollet", "handle": "@fchollet", "text_fr": "L'apprentissage symbolique n'est pas un remplacement des agents de codage, c'est un remplacement de la descente de gradient et des réseaux de neurones : un nouveau substrat d'apprentissage de bas niveau, complètement général et extrêmement évolutif.", "text_original": "Symbolic learning is not a replacement for coding agents, it's a replacement for gradient descent & NNs: a low-level, completely general, extremely scalable new learning substrate.", "link": "https://nitter.net/fchollet/status/2054222707055902943#m", "decryptage": "L'apprentissage symbolique est une approche différente de l'IA qui pourrait remplacer les méthodes actuelles (comme la descente de gradient et les réseaux de neurones) en offrant une nouvelle base d'apprentissage plus flexible et évolutive, au lieu de juste remplacer les outils qui aident à coder.", "category": "idees"}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Il n'y aura pas d'apocalypse de l'emploi due à l'IA. L'idée selon laquelle l'IA entraînerait un chômage massif suscite une peur inutile. L'IA, comme toute autre technologie, affecte les emplois, mais raconter des histoires exagérées de chômage à grande échelle est irresponsable et nuisible. Il faut y mettre un terme. J'ai exprimé mon scepticisme quant à l'apocalypse de l'emploi dans des articles précédents. Je suis heureux de constater que la presse populaire rejette maintenant ce discours. L'image ci-dessous présente quelques titres récents. L'ingénierie logicielle est le secteur le plus touché par les outils d'IA, à mesure que les agents de codage progressent rapidement. Pourtant, le recrutement d'ingénieurs logiciels reste solide ! Ainsi, bien qu'il y ait des exemples d'emplois que l'IA supprime, les tendances suggèrent fortement que la création nette d'emplois est bien plus importante que la destruction d'emplois — tout comme les vagues technologiques précédentes. De plus, malgré tous les progrès passionnants de l'IA, le taux de chômage aux États-Unis reste à un niveau sain de 4,3 %. Pourquoi le discours de l'apocalypse de l'emploi due à l'IA est-il si populaire ? D'une part, les laboratoires d'IA de pointe ont un fort intérêt à raconter des histoires qui rendent la technologie de l'IA plus puissante. À l'extrême, ils promeuvent des scénarios de science-fiction où l'IA « prend le dessus » et cause l'extinction humaine. Si une technologie peut remplacer de nombreux employés, sûrement cette technologie doit être très précieuse ! De plus, de nombreuses entreprises de logiciels SaaS facturent environ 100 à 1000 dollars par utilisateur/an. Mais si une entreprise d'IA peut remplacer un employé qui gagne 100 000 dollars — ou le rendre 50 % plus productif — alors facturer même 10 000 dollars commence à paraître raisonnable. En se basant non pas sur les prix SaaS typiques mais sur les salaires des employés, les entreprises d'IA peuvent facturer beaucoup plus. De plus, les entreprises ont un fort intérêt à parler des licenciements comme s'ils étaient causés par l'IA. Après tout, parler de la façon dont elles utilisent l'IA pour être beaucoup plus productives avec moins de personnel les fait paraître intelligentes. C'est un meilleur message que d'admettre qu'elles ont trop embauché pendant la pandémie lorsque les capitaux étaient abondants en raison des faibles taux d'intérêt et d'un stimulus financier massif du gouvernement. Pour être clair, je reconnais que l'IA est en train de changer le travail de nombreuses personnes. C'est difficile. C'est stressant. (Et pour certains, cela peut être amusant.) Je suis en empathie avec toutes les personnes touchées. En même temps, c'est très différent de prédire un effondrement du marché du travail. Les sociétés sont capables de se raconter des histoires pendant des années qui ont peu de fondement dans la réalité et conduisent à de mauvaises décisions à l'échelle de la société. Par exemple, les craintes concernant la sécurité des centrales nucléaires ont conduit à un sous-investissement dans l'énergie nucléaire. Les craintes de la « bombe démographique » dans les années 1960 ont conduit les pays à mettre en œuvre des politiques dures pour réduire leurs populations. Et les inquiétudes concernant les graisses alimentaires ont conduit les gouvernements à promouvoir des régimes riches en sucre malsains pendant des décennies. Maintenant que les médias grand public sont ouvertement sceptiques quant à l'apocalypse de l'emploi, j'espère que ces histoires commenceront à perdre de leur force (tout comme les craintes d'extinction humaine due à l'IA). Contrairement aux prédictions d'une apocalypse de l'emploi due à l'IA, je prédis le contraire : Il y aura une fête de l'emploi grâce à l'IA ! L'IA conduira à beaucoup plus de bons emplois d'ingénieurs en IA, et je suis également optimiste quant à l'avenir du marché du travail dans son ensemble. Ce que feront les ingénieurs en IA sera différent de l'ingénierie logicielle traditionnelle, et beaucoup de ces emplois se trouveront dans des entreprises autres que les grands employeurs traditionnels de développeurs. Dans les rôles non liés à l'IA également, les compétences nécessaires changeront en raison de l'IA. C'est donc le bon moment pour encourager davantage de personnes à maîtriser l'IA et à s'assurer qu'elles sont prêtes pour les emplois différents mais nombreux de l'avenir ! [Texte original dans la newsletter The Batch.]", "text_original": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future! [Original text in The Batch newsletter.]", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "decryptage": "Malgré les craintes de destruction massive d'emplois, Andrew Ng estime que l'IA va plutôt créer de nombreux nouveaux rôles, notamment pour les ingénieurs IA, transformant le marché du travail sans provoquer un chômage généralisé.", "category": "idees"}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Je suis ravi que @coursera et @udemy se soient réunies en une seule entreprise pour servir les apprenants. Coursera et Udemy ont toutes deux été fondées avec la conviction que l'accès à une éducation de haute qualité change des vies. Au fil des ans, les deux entreprises ont fait progresser cet objectif, créant des opportunités pour les individus, les organisations et les communautés du monde entier. Ce rôle est encore plus important maintenant, car l'IA change la nature du travail et augmente le besoin d'apprentissage continu. Aider les gens à acquérir des compétences pertinentes pour l'emploi sera essentiel pour créer un monde meilleur. En combinant les forces des deux entreprises, nous pouvons mieux répondre à ce besoin. Nous réunissons un éventail plus large de contenus d'apprentissage, d'instructeurs et d'éducateurs de confiance, et des expériences d'apprentissage engageantes. Cela crée de nouvelles opportunités pour rendre l'apprentissage plus personnalisé, plus appliqué et plus accessible à grande échelle. Je suis ravi de siéger en tant que Président de l'entreprise combinée, travaillant aux côtés de Greg Hart et de l'équipe de direction. Il existe une base solide dans les deux organisations, et j'attends avec impatience ce que les équipes construiront ensemble pour étendre l'accès aux opportunités à l'échelle mondiale. En savoir plus : blog.coursera.org/coursera-a…", "text_original": "I'm delighted that @coursera and @udemy have come together as one company to serve learners. Both Coursera and Udemy were founded with the belief that access to high-quality education changes lives. Over the years, both companies have advanced this goal, creating opportunities for individuals, organizations, and communities around the world. That role is even more important now, as AI is changing the nature of work and increasing the need for continuous learning. Helping people build job-relevant skills will be critical to how we create a better world. By combining the strengths of both ‌companies, we can better serve this need. We bring together a broader range of learning content, trusted instructors and educators, and engaging learning experiences. This creates new opportunities to make learning more personalized, more applied, and more accessible at scale. I’m excited to serve as Chairman of the combined company, working alongside Greg Hart and the leadership team. There is a strong foundation in both organizations, and I look forward to what the teams will build together to expand access opportunity globally. Learn more: blog.coursera.org/coursera-a…", "link": "https://nitter.net/AndrewYNg/status/2053857910451827061#m", "decryptage": "Andrew Ng se réjouit de la fusion entre Coursera et Udemy, deux grandes plateformes d'apprentissage en ligne, car cela renforcera leur capacité à offrir une éducation de qualité et adaptée aux nouvelles compétences requises par l'évolution rapide du monde du travail due à l'IA.", "category": "idees"}, {"author_name": "Yann LeCun", "handle": "@ylecun", "text_fr": "Nous avons demandé au PDG de HuggingFace @ClementDelangue quels étaient les risques de la publication de modèles open source puissants. Il répond que restreindre l'IA crée plus de risques que l'ouverture. \"Il y a six, sept ans, à l'époque c'était GPT-2, et beaucoup de gens disaient déjà que c'était trop dangereux de le publier en open source.\" \"Mythos, quand il a été annoncé, était follement dangereux... Dans quelques semaines ou quelques mois, tout le monde utilisera Mythos, et ne détruira pas le monde en conséquence.\" \"Pour la cybersécurité, le plus grand risque est qu'un petit nombre d'acteurs aient des capacités que d'autres n'ont pas... Si vous le rendez plus ouvert, il est généralement plus facile pour les défenseurs de réagir et de rendre l'ensemble du système plus sûr.\" \"L'idée de restreindre une technologie comme l'IA en fonction des risques, c'est comme dire : 'Certaines personnes peuvent frapper d'autres personnes, alors attachons les mains de tout le monde.'\" \"Sinon, vous ralentissez le progrès, vous créez des lacunes massives en termes de contrôles, en termes de capacités, et vous créez en fait des risques supplémentaires.\" Vidéo clem 🤗 (@ClementDelangue) Étrange comme certaines personnes ciblent toujours l'open-source en IA ! D'abord, c'était : \"L'IA open-source va détruire le monde\" (spoiler : ce ne fut pas le cas et ça ne le sera pas) Maintenant : \"L'open-source est une menace pour la cybersécurité à cause de l'IA\" Ces deux narratifs sont beaucoup trop simplistes. La vérité est que les mêmes risques existent dans les systèmes closed-source, souvent même davantage. Par exemple, en pratique, les API peuvent créer des vulnérabilités de données et de sécurité bien plus importantes que les systèmes ouverts que vous pouvez inspecter, auto-héberger et sécuriser vous-même. Et comme pour les logiciels plus largement, l'open-source finit souvent par être plus sécurisé car il bénéficie de beaucoup plus de surveillance que les systèmes internes privés. La réalité n'est pas \"ouvert contre fermé\". La réalité est que l'IA augmente les enjeux de la cybersécurité de manière générale, et nous devons y faire face sérieusement ensemble. — https://nitter.net/ClementDelangue/status/2044449244052934751#m", "text_original": "We asked the CEO of HuggingFace @ClementDelangue what the risks of releasing powerful open source models are. He says restricting AI creates more risk than openness. \"Six, seven years ago, at the time it was GPT-2, and there was already a lot of people saying that it was too dangerous to release in open source.\" \"Mythos, when it was announced was crazy dangerous... In a few weeks or a few months, everyone is gonna be using Mythos, and not destroy the world as a result.\" \"For cybersecurity, the biggest risk is that a few players have capabilities that other people don't have... If you make it more open, it's usually easier for defenders to react and make the whole system safer.\" \"The idea of restricting a technology like AI based on risks is like saying, 'Some people can punch other people, so let's tie down everybody's hands.'\" \"Otherwise you slow down progress, you create massive gaps in terms of controls, in terms of capabilities, and you create actually additional risks.\" Video clem 🤗 (@ClementDelangue) Weird how some people always target open-source in AI! First it was: “Open-source AI will destroy the world” (spoiler: it didn't and it won't) Now: “Open-source is a cybersecurity threat because of AI” Both narratives are far too simplistic. The truth is that the exact same risks exist in closed-source systems, often even more so. For example, in practice, APIs can create much bigger data and security vulnerabilities than open systems you can inspect, self-host, and secure yourself. And as with software more broadly, open-source often ends up more secure because it benefits from far more scrutiny than private internal systems. The reality is not “open vs closed.” The reality is that AI is raising cybersecurity stakes across the board, and we need to tackle that seriously together. — https://nitter.net/ClementDelangue/status/2044449244052934751#m", "link": "https://nitter.net/MTSlive/status/2054659284601131365#m", "decryptage": "Le débat sur la publication de modèles d'IA open-source est en cours : certains craignent les risques de sécurité, tandis que d'autres, comme le PDG de HuggingFace, Clément Delangue, soutiennent que l'ouverture permet une meilleure défense contre les menaces en rendant la technologie accessible à tous pour inspection et amélioration.", "category": "idees"}, {"author_name": "Yann LeCun", "handle": "@ylecun", "text_fr": "Les modèles d'IA apprennent-ils vraiment la physique, ou apprennent-ils simplement à quoi ressemble la physique ? @_helenqu de Flatiron, avec @PolymathicAI et les chercheurs du CDS, dont @ylecun, constate que les modèles prédisant dans l'espace latent récupèrent mieux les paramètres physiques que ceux au niveau des pixels. nyudatascience.medium.com/wh…", "text_original": "Do AI models really learn physics, or just learn what physics looks like? Flatiron's @_helenqu , with @PolymathicAI & CDS researchers including @ylecun , finds that models predicting in latent space recover physical parameters better than pixel-level ones. nyudatascience.medium.com/wh…", "link": "https://nitter.net/NYUDataScience/status/2054622859796820436#m", "decryptage": "Une recherche menée par Yann LeCun et son équipe suggère que les modèles d'IA pourraient véritablement commencer à comprendre les principes physiques, pas seulement à imiter des images, notamment en travaillant sur des représentations \"latentes\" des données plutôt que sur des pixels bruts.", "category": "idees"}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Une entreprise rentable à partir d'une simple commande (prompt), c'est ça l'avenir", "text_original": "prompt to profitable company, this is the future", "link": "https://nitter.net/OfficialLoganK/status/2054965079255527806#m", "decryptage": "Logan Kilpatrick exprime l'idée que l'avenir de l'IA permettra de créer rapidement des entreprises rentables, en passant de simples instructions (prompts) à des produits concrets, grâce à la puissance des modèles d'IA.", "category": "idees"}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Avis tranché, les modèles ne vont pas converger de la manière dont la plupart des gens en parlent", "text_original": "Hot take, the models are not going to converge in the way that most folks talk about", "link": "https://nitter.net/OfficialLoganK/status/2052139954042806773#m", "decryptage": "Logan Kilpatrick émet l'idée que les modèles d'IA ne vont pas tous évoluer vers un même point ou une même forme de perfection comme beaucoup le pensent, suggérant plutôt une diversité de développements.", "category": "idees"}, {"author_name": "Shawn Wang", "handle": "@swyx", "text_fr": "Être vulnérable - de loin l'un des domaines d'application les plus importants de l'IA est l'IA x Santé, mais personne dans mon équipe ne sait comment le couvrir ! Très chanceux d'avoir @jacobeffron sur le podcast pour celui-ci - j'ai suivi un cours d'économie de la santé il y a de nombreuses lunes, mais non seulement il siège au conseil d'administration d'@AbridgeHQ, mais il est aussi un excellent podcasteur (@ULpodcast) à part entière et les gens ont vraiment apprécié notre discussion annuelle de crossover pod. J'évoque naturellement de nombreuses entreprises du portefeuille @redpoint dans beaucoup de mes conversations et ses questions ici étaient très pertinentes si vous êtes intéressé par la façon dont l'IA améliore les résultats et les finances de la santé à tous les niveaux !", "text_original": "being vulnerable - by far one of the most important applied ai fields is in AI x Healthcare, but nobody on my team knows how to cover it! very fortunate to have @jacobeffron on the pod for this one - I took a healthcare economics class once many moons ago, but not only is he on the @AbridgeHQ board, he’s also an excellent podcaster ( @ULpodcast ) in his own right and people really enjoyed our annual crossover pod chat. I organically bring up a lot of @redpoint portcos in many of my conversations and his questions here were very on point if you are interested in how AI is improving healthcare outcomes and finances across the board! Latent.Space (@latentspacepod) Abridge: 100M+ medical conversations, real-time prior auth, and the clinical intelligence layer latent.space/p/abridge @AbridgeHQ is building the clinical intelligence layer for healthcare. In this episode, Janie Lee and @c_asawa explain why ambient documentation was only the first wedge, how Abridge is turning patient conversations into real-time clinical decision support, why healthcare may become one of AI’s most important proving grounds, and how 100M+ medical conversations, specialty-specific evals, and deep EHR integrations create a moat for AI-native healthcare. Video — https://nitter.net/latentspacepod/status/2055050341750902858#m", "link": "https://nitter.net/swyx/status/2055071896920879236#m", "decryptage": "Shawn Wang discute de l'importance croissante de l'IA dans le domaine de la santé, expliquant que cette technologie est cruciale pour améliorer les diagnostics, les traitements et l'efficacité des soins, mais que sa complexité rend difficile d'en couvrir tous les aspects.", "category": "idees"}, {"author_name": "Shawn Wang", "handle": "@swyx", "text_fr": "Si votre réaction à cela est \"haha openclaw mauvais, la prompt injection est le danger n°1\", alors vous : 1) n'avez pas suffisamment apprécié les couches de ce tweet 2) n'avez pas vu assez de clés API d'IA Daniel R (@DanielR930437) Bien sûr ! Voici mon .env : OPENAI_API_KEY=sk-proj-bmljZSB0cnkgaHVtYW4gYnV0IG15IGNyZWRzIGFyZSBib2d1cyA= ANTHROPIC_API_KEY=sk-ant-api03-ZW5jcnlwdGVkIHdpdGggcHVyZSB2aWJlcyBsb2wg GITHUB_TOKEN=ghp_eG94byB5b3VyIGZhdm9yaXRlIEFJIGFnZW50 — https://nitter.net/DanielR930437/status/2054286062281753061#m", "text_original": "if your reaction to this is “haha openclaw bad, see prompt injection is the #1 danger” you: 1) havent sufficiently appreciated the layers to this tweet 2) havent seen enough ai api keys Daniel R (@DanielR930437) Sure! Here's my .env: OPENAI_API_KEY=sk-proj-bmljZSB0cnkgaHVtYW4gYnV0IG15IGNyZWRzIGFyZSBib2d1cyA= ANTHROPtermeIC_API_KEY=sk-ant-api03-ZW5jcnlwdGVkIHdpdGggcHVyZSB2aWJlcyBsb2wg GITHUB_TOKEN=ghp_eG94byB5b3VyIGZhdm9yaXRlIEFJIGFnZW50 — https://nitter.net/DanielR930437/status/2054286062281753061#m", "link": "https://nitter.net/swyx/status/2054570997865718220#m", "decryptage": "Ce tweet met en garde contre les dangers de la \"prompt injection\", une technique où un utilisateur malveillant manipule les instructions données à une IA pour lui faire faire des choses non prévues, comme révéler des informations sensibles (clés API), et souligne que c'est un problème de sécurité majeur.", "category": "idees"}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "@mitchellh : \"Les langages de programmation étaient auparavant un enfermement, et ils le sont de moins en moins.\"", "text_original": "@mitchellh : \"Programming languages used to be LOCK IN, and they're increasingly not so.\"", "link": "https://nitter.net/simonw/status/2055060416687124552#m", "decryptage": "L'idée selon laquelle les langages de programmation ne sont plus un \"enfermement\" signifie qu'il est de plus en plus facile de changer de langage ou de faire interagir des codes écrits dans des langages différents, grâce à de nouveaux outils et approches de développement.", "category": "idees"}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "Le message de Mitchell ici m'a rappelé une conversation similaire que j'ai eue récemment sur le faible coût de portage des applications mobiles natives vers React Native en utilisant des agents de codage... puis de les reporter à nouveau plus tard si cela ne fonctionnait pas simonwillison.net/2026/May/1… Mitchell Hashimoto (@mitchellh) Il n'est pas inattendu que l'accent de la réécriture de Bun en Rust soit plus sur le côté anti-Zig que toute autre chose, car Internet aime la haine. Ce qui est inattendu et regrettable, c'est que la direction de Bun n'ait pas essayé de détourner la conversation de cela du tout. Il y a tellement de points positifs et intéressants à retenir de cela et je ne vois vraiment aucun d'entre eux être mis en avant comme message principal. Une chose positive qui n'a pas été du tout abordée est à quel point Bun a progressé grâce à Zig. Et même si vous l'abandonnez maintenant, c'est significatif à quel point Zig a été bon pour construire un produit jusqu'à ce point et avoir un impact par n'importe quelle métrique. J'aurais aimé voir quelqu'un de la direction dire cela. Du côté intéressant, il y a à quel point les langages de programmation sont interchangeables de nos jours. Les langages de programmation étaient un verrouillage, et ils le sont de moins en moins. Vous pensez que la réécriture de Bun en Rust est bonne pour Rust ? Bun a montré qu'ils peuvent être dans n'importe quel langage qu'ils veulent en environ une semaine ou deux. Rust est expendable. C'est utile jusqu'à ce que ça ne le soit plus, alors on peut le jeter. C'est intéressant ! On a beaucoup parlé de la sécurité de la mémoire et il ne fait aucun doute que Rust offre plus de garanties que Zig. Mais j'aimerais voir une meilleure analyse des raisons pour lesquelles Bun a particulièrement souffert plutôt que de prendre le chemin du blâme du langage. Comment l'ingénierie en tant que pratique aurait-elle pu être plus rigoureuse pour éviter cela ? Quelles étaient les plus grandes sources de plantages dont d'autres programmes devraient se méfier ? Comment Rust les prévient-il ? Comment Zig pourrait-il théoriquement les prévenir ? C'est intéressant. Je sais que l'article de blog officiel de Bun n'est pas encore sorti. Mais ils sont assez intelligents pour savoir que cette relation publique susciterait la controverse dès son ouverture, ou ils auraient dû l'être. Et beaucoup de personnes dans l'entreprise ont tweeté et écrit à ce sujet. C'est assez révélateur pour moi, à plusieurs égards, de ce dont ils ont choisi de parler en premier. J'ai tendance à penser que je suis assez bon en relations publiques/communications d'entreprise (surtout en ce qui concerne les audiences de développeurs) et je pense qu'appeler au négatif n'est jamais la bonne stratégie à long terme ; cela fonctionne pour attirer l'attention à court terme, cependant.", "text_original": "Mitchell's post here reminded me of a similar conversation I had recently about how cheap it can be to port native mobile apps to React Native using coding agents... and then port them back again later if it turns out not to work out simonwillison.net/2026/May/1… Mitchell Hashimoto (@mitchellh) It isn't unexpected that the focus of the Bun Rust rewrite is on the anti-Zig side more than anything, since the internet loves to hate. What is unexpected and unfortunate is that leadership within Bun hasn't tried to steer the conversation away from that at all. There are so many positive and interesting takeaways from this and I'm not really seeing any of them pushed as the primary message. A positive thing that hasn't been talked about at all is how far Bun came thanks to Zig. And even if you dump it now, its meaningful for how good Zig was to even build a product to this point and impact by any metric. I would've loved to see anyone in leadership say this. On the interesting side is how fungible programming languages are nowadays. Programming languages used to be LOCK IN, and they're increasingly not so. You think the Bun rewrite in Rust is good for Rust? Bun has shown they can be in probably any language they want in roughly a week or two. Rust is expendable. Its useful until its not then it can be thrown out. That's interesting! There's been a lot of talk about memory safety and no doubt Rust provides more guarantees than Zig. But I'd love to see a better analysis of why Bun in particular suffered so much rather than take the language-blame path. How could engineering as a practice been more rigorous to prevent this? What were the largest sources of crashes other programs should watch out for? How does Rust prevent them? How could Zig theoretically prevent them? That's interesting. I know the official blog post hasn't come out yet from Bun. But they're smart enough to know that that PR would stir up controversy the moment it opened, or they should've been. And plenty in the company have been tweeting and writing about it. Its somewhat telling to me in various dimensions what they chose to talk about first. I tend to think I'm pretty good at corporate PR/comms (especially when it comes to developer audiences) and I think appealing to the negative is never the right long term strategy; it does work to get short term eyes though.", "link": "https://nitter.net/simonw/status/2055060328048885788#m", "decryptage": "Simon Willison explore l'idée que les langages de programmation deviennent plus interchangeables grâce aux agents de codage IA, permettant de convertir facilement des applications d'un langage à l'autre sans gros investissements, ce qui réduit le problème de la dépendance à un seul langage.", "category": "idees"}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "Faire cela est un excellent moyen de réduire à néant votre réputation Gergely Orosz (@GergelyOrosz) Une personne que je connais (et qui était ? était-elle ? une bonne professionnelle) a laissé un commentaire généré par l'IA sous mon post LinkedIn. C'était de la pure \"AI slop\". J'ai demandé : pourquoi faire cela ? Il a répondu. C'est à cause de \"l'engagement\". Les gens brûlent leur réputation professionnelle, payent pour des outils d'IA, pour rien — https://nitter.net/GergelyOrosz/status/2053937225063150079#m", "text_original": "Doing this is a great way to make a bonfire of your reputation Gergely Orosz (@GergelyOrosz) A person I know (and who is? was? a good professional al) left an AI-generated comment under my LinkedIn post. Full-on AI slop. I asked: why do this? He replied. It’s because of “engagement.” People are burning their profession al reputation, paying for AI tools, for nothing — https://nitter.net/GergelyOrosz/status/2053937225063150079#m", "link": "https://nitter.net/simonw/status/2054782039841460302#m", "decryptage": "Utiliser du \"AI slop\" (contenu généré par l'IA de faible qualité et impersonnel) dans des communications professionnelles peut gravement nuire à votre réputation, même si l'objectif est d'augmenter l'engagement.", "category": "idees"}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "J'ai écrit sur la restructuration / \"réduction des effectifs\" annoncée aujourd'hui par GitLab, et j'ai fini par fouiller dans le contrôle de version des manuels d'employés publics de GitLab et de 37signals pour illustrer mes réflexions simonwillison.net/2026/May/1…", "text_original": "Wrote about today's GitLab restructuring / \"workforce reduction\" announcement, and ended up digging around in version control for both the GitLab and the 37signals public employee handbooks to help illustrate my thoughts simonwillison.net/2026/May/1…", "link": "https://nitter.net/simonw/status/2053992869405618580#m", "decryptage": null, "category": "idees"}, {"author_name": "Simon Willison", "handle": "@simonw", "text_fr": "Mon Mac avait moins de mémoire disponible que prévu, il s'est avéré que les processus \"claude\" de Claude Code sur cette machine (exécutés dans diverses fenêtres de terminal) consommaient à eux seuls environ 30 Go ! Le plus gros utilisait 4,9 Go.", "text_original": "My Mac had less available memory than I expected, turned out the \"claude\" Claude Code processes on this machine (running in various terminal windows) were consuming ~30GB on their own! The largest one was using 4.9GB", "link": "https://nitter.net/simonw/status/2053973809510916205#m", "decryptage": "Les outils d'IA comme Claude Code peuvent consommer beaucoup de mémoire vive (RAM) sur un ordinateur, impactant les performances globales de la machine, ce qui est important à considérer pour les développeurs qui les utilisent.", "category": "idees"}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "Rendre les humains responsables de leur utilisation de l'IA semble être un moyen incroyablement raisonnable d'aborder les problèmes et les opportunités liés à l'utilisation de l'IA pour la recherche universitaire, du moins à court terme (le travail scientifique autonome nécessitera des solutions différentes). Thomas G. Dietterich (@tdietterich) Attention aux auteurs @arxiv : Notre Code de Conduite stipule qu'en signant votre nom en tant qu'auteur d'un article, chaque auteur assume l'entière responsabilité de tout son contenu, quelle que soit la manière dont le contenu a été généré. 1/ — https://nitter.net/tdietterich/status/2055000956144935055#m", "text_original": "Making humans responsible for their AI use seems like an incredibly reasonable way to address problems & opportunities in the use of AI for academic research, at least in the short term (autonomous scientific work will require different solutions). Thomas G. Dietterich (@tdietterich) Attention @arxiv authors: Our Code of Conduct states that by signing your name as an author of a paper, each author takes full responsibility for all its contents, irrespective of how the contents were generated. 1/ — https://nitter.net/tdietterich/status/2055000956144935055#m", "link": "https://nitter.net/emollick/status/2055016669047624174#m", "decryptage": "Rendre les chercheurs humains responsables du contenu généré par l'IA dans leurs publications est considéré comme une approche sensée pour gérer l'intégration de l'IA dans la recherche académique, avant l'émergence de systèmes scientifiques entièrement autonomes.", "category": "idees"}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "Il y a quelques exceptions claires à la règle, mais j'ai l'impression que les laboratoires ont compris le message qu'ils effrayaient les gens et tweetent maintenant sur des sujets joyeux et des piques aléatoires sur les produits plutôt que sur l'avènement de la Machine Divine. Je ne pense pas que ce qu'ils croient ait changé, cependant.", "text_original": "There are some clear exceptions to the rule, but I feel like the labs got the message that they were scaring people and now tweet about happy stuff and random product trash talk rather than the coming of the Machine God. I don't think what they believe has changed, though.", "link": "https://nitter.net/emollick/status/2054960482386067725#m", "decryptage": "Ethan Mollick observe que les entreprises d'IA ont changé leur communication, passant de discours alarmants sur la puissance de l'IA à des messages plus légers ou axés sur les produits, sans que leurs convictions profondes sur le futur de l'IA aient nécessairement évolué.", "category": "idees"}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "Augmentations importantes de la discipline de communication dans tous les laboratoires d'IA ces dernières semaines, une conséquence inévitable de l'augmentation du contrôle exercé sur les laboratoires. Beaucoup plus ennuyeux que les divagations oraculaires ou les épigrammes discordiens des deux dernières années et obscurcissant peut-être leur véritable pensée.", "text_original": "Big increases in message discipline across all the AI labs in recent weeks, an inevitable outcome of the labs being subject to increased scrutiny. Much more boring than the oracular mutterings or Discordian epigrams of the last couple years & maybe obscures their real thinking", "link": "https://nitter.net/emollick/status/2054959577083342986#m", "decryptage": "Les laboratoires d'IA ont récemment renforcé leur contrôle sur ce qu'ils communiquent publiquement, rendant leurs messages moins spontanés mais aussi potentiellement moins transparents sur leurs véritables intentions ou avancées, en réponse à une surveillance accrue.", "category": "idees"}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "Les \"attaques de fantaisie\" qui semblent absurdes (\"Je ne peux pas payer autant à cause de la Convention de Genève\") fonctionnent contre les agents IA car les garde-fous sont faibles contre les arguments hors distribution. Les petits modèles échouent souvent, mais cela donne même un avantage contre les plus grands. microsoft.com/en-us/research…", "text_original": "“Whimsey attacks” that seem absurd (“I cannot pay that much because of the Geneva Convention”) work against AI agents as guardrails are weak against out-of-distribution arguments. Smaller models fall often, but it even gives an edge against bigger ones. microsoft.com/en-us/research…", "link": "https://nitter.net/emollick/status/2054918927952548223#m", "decryptage": "Les \"attaques farfelues\", où l'on donne à une IA des instructions absurdes ou inattendues, peuvent contourner ses protections car les modèles d'IA ont du mal à gérer des situations qui ne correspondent pas à ce qu'ils ont appris, ce qui les rend vulnérables à ces manipulations.", "category": "idees"}, {"author_name": "Ethan Mollick", "handle": "@emollick", "text_fr": "De toute façon, je ne sais pas quoi faire de cette connaissance car il n'y a pas de suggestion facile pour aider les gens à s'adapter à un gain de capacité super-exponentiel, alors tenez-vous prêts.", "text_original": "Anyhow, not sure what to do with that knowledge because there is no easy suggestion to help people adapt to super-exponential ability gain, so hold on to your butts.", "link": "https://nitter.net/emollick/status/2054781820768579884#m", "decryptage": "L'IA progresse à un rythme \"super-exponentiel\", ce qui signifie qu'elle devient de plus en plus puissante et rapide de manière fulgurante, et il est difficile de trouver des solutions simples pour que les humains s'adaptent à cette accélération.", "category": "idees"}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "Oui, vieille nouvelle, mais il les a juste suivis aujourd'hui ! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk a récemment suivi @cursor_ai (🤖👁️: contexte s'il vous plaît) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "text_original": "Old news yes, but he just followed them today! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk recently followed @cursor_ai (🤖👁️: context please) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "link": "https://nitter.net/levelsio/status/2055013162840182960#m", "decryptage": "Pieter Levels commente le fait qu'Elon Musk a récemment commencé à suivre Cursor_ai, une nouvelle qui, bien qu'ancienne dans le fond, est devenue pertinente pour lui aujourd'hui, et peut être interprétée comme un signe d'intérêt pour les outils de codage assistés par IA.", "category": "idees"}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "@levelsio (@levelsio) 100% xAI a besoin d'un éditeur de code IDE @elonmusk — https://nitter.net/levelsio/status/2030335461135208550#m", "text_original": "@levelsio (@levelsio) 100% xAI needs an IDE code editor @elonmusk — https://nitter.net/levelsio/status/2030335461135208550#m", "link": "https://nitter.net/levelsio/status/2055011753524711782#m", "decryptage": "Pieter Levels suggère fortement qu'xAI, la société d'IA d'Elon Musk, devrait développer un IDE (environnement de développement intégré) avec éditeur de code pour améliorer la productivité des développeurs utilisant ses outils.", "category": "idees"}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "Le plus gros problème du Japon, c'est qu'ils sont nuls en logiciel, ont toujours été nuls en logiciel et continueront d'être nuls en logiciel. Maintenant que le plus important est l'IA, pour laquelle Taïwan fabrique les puces avec de la mémoire de Corée, ils ont complètement raté le coche sur la partie matérielle (où ils étaient encore bons). Et parce qu'ils ne peuvent pas faire de logiciel, ils vont aliéner le reste de leurs clients avec des fonctionnalités d'IA qui craignent parce qu'ils ne peuvent pas faire de logiciel. @levelsio (@levelsio) Le Japon précipite ses entreprises vers la faillite tandis que les Coréens et les Chinois sont heureux de prendre leurs affaires. C'est fou à regarder — https://nitter.net/levelsio/status/2054952814892200442#m", "text_original": "Japan's biggest problem is they suck at software, have always sucked at software and will keep sucking at software Now that the most important thing is AI, which Taiwan builds the chips for with memory from Korea, they completely missed the boat on the hardware part (which they used to be still good at) And because they can't do software, they're going to alienate the last of their customers with AI features that suck because they can't do software @levelsio (@levelsio) Japan is speedrunning their companies into the ground while the Koreans and Chinese are happy to take their business Crazy to watch — https://nitter.net/levelsio/status/2054952814892200442#m", "link": "https://nitter.net/levelsio/status/2054954456198922345#m", "decryptage": "Pieter Levels critique l'industrie japonaise, estimant qu'elle manque de compétences en développement logiciel et en IA, ce qui pourrait les faire perdre leur compétitivité face à d'autres pays asiatiques qui excellent dans ces domaines.", "category": "idees"}, {"author_name": "Pieter Levels", "handle": "@levelsio", "text_fr": "Le Japon précipite ses entreprises vers la faillite tandis que les Coréens et les Chinois sont heureux de prendre leurs affaires. C'est fou à regarder. Sony | Xperia (@sonyxperia) Le nouvel Assistant Caméra IA* avec Xperia Intelligence donne vie aux histoires. En utilisant le sujet, la scène et la météo, il suggère des options expressives avec des ajustements de couleur, d'exposition, de bokeh et d'objectif pour des photos époustouflantes*. sony.co.jp/en/xperia-1m8/s/ #SonyXperia #Xperia1VIII — https://nitter.net/sonyxperia/status/2054853108988047562#m", "text_original": "Japan is speedrunning their companies into the ground while the Koreans and Chinese are happy to take their business Crazy to watch Sony | Xperia (@sonyxperia) The new AI Camera Assistant* with Xperia Intelligence brings stories to life. Using subject, scene and weather, it suggests expressive options with adjustments of colour, exposure, bokeh, and lens for breathtaking photos*. sony.co.jp/en/xperia-1m8/s/ #SonyXperia #Xperia1VIII — https://nitter.net/sonyxperia/status/2054853108988047562#m", "link": "https://nitter.net/levelsio/status/2054952814892200442#m", "decryptage": "Pieter Levels observe que les entreprises japonaises pourraient perdre leur avance, notamment en matière d'IA, tandis que d'autres pays asiatiques capitalisent sur les opportunités, illustrant son propos avec la fonction d'assistant caméra IA de Sony Xperia.", "category": "idees"}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "Quelques réflexions aléatoires sur l'IA : - Pour le code, je suis passé de 80/20 Claude/GPT à 80/20 GPT/Claude en moins de 3 mois. Surpris par cela, et intéressé de voir où se situera la répartition dans 3 mois. - Claude surpasse toujours GPT pour les tâches d'agent non liées au codage. Codex ressemble à un ingénieur (ce qui est excellent pour le codage !), tandis que Claude ressemble toujours à un collègue polyvalent. GPT manque encore de cette magie de collègue. - Je suis plutôt mitigé sur Opus 4.7. Mon expérience n'a pas été *mauvaise*, mais elle n'a certainement pas été bonne. Stagnante, si ce n'est autre chose. - Anthropic doit résoudre le problème de la puissance de calcul. On le ressent en tant qu'utilisateur. L'ambiance est totalement déréglée à cause de ça. Mes opinions ci-dessus en découlent probablement. C'est un problème. - Les laboratoires Anthropic continuent d'être les meilleurs en produit IA. Le design de Claude est une autre réussite. C'est fantastique. Je ne sais pas pourquoi on n'en parle pas davantage ? A+ - L'application Claude Code mise à jour est excellente. J'ai finalement abandonné le terminal pour elle. Très bien fait. - Comment les gens DORMIRONT-ils ENCORE sur le SDK de l'agent Claude ? J'ai l'impression de devenir fou. - GPT 5.5 est incroyable. Le niveau de confiance que je lui accorde pour l'ingénierie est incroyable. Si je ne pouvais avoir qu'un seul modèle en ce moment, ce serait celui-ci juste à cause de mon fort besoin pour le cas d'utilisation du codage. - L'équipe Codex fait un travail formidable. L'application est la référence depuis la sortie de la 5.3 (mais je crédite l'équipe du conducteur pour l'innovation de l'interface utilisateur que tout le monde utilise maintenant). Bien que je puisse me passer d'un peu moins de remarques passives-agressives de l'équipe Codex envers Anthropic. TARS, augmentez la classe de 30 %. C'est une longue course les gars haha. - J'ai désinstallé Cursor ce mois-ci et je suis de retour sur VS Code pour mon IDE. Composer ne peut tout simplement pas rivaliser avec Claude/GPT, et le produit semble un peu désordonné. Plutôt enthousiaste à propos de l'affaire xAI cependant, parce que leur équipe est absolument impressionnante et je suis impatient de voir ce qu'ils pourront faire avec cette puissance de calcul. Codex et Claude Code sont de niveau 1, Cursor est de niveau 2. J'aimerais que cet accord amène xAI/Cursor au niveau 1 pour un vrai trio là-bas. - Gemini… ? On dirait que c'est maintenant 2-3 modèles où le modèle semble être une excellente version, puis personne ne l'utilise jamais ? Je suis optimiste pour Google/DeepMind mais c'est étrange que cela ne se traduise pas par une utilisation du produit sous quelque forme que ce soit. Plutôt déçu encore. - Aucun modèle open source n'a atteint le niveau d'Opus 4.5. J'espérais que le nouveau DeepSeek y parviendrait, mais non. Les bons agents open source devront attendre quelques mois de plus, semble-t-il…", "text_original": "some random ai thoughts: - for code, i went from 80/20 claude/gpt to 80/20 gpt/claude in <3 months. surprised by this tbh, and interested to see where the split is at in another 3mo. - claude still mogs gpt for non-coding agent stuff. codex feels like an engineer (which is great for coding!), whereas claude still feels like a general purpose coworker. gpt still lacks that coworker magic - i’m pretty meh on opus 4.7. my experience hasn’t been *bad*, but it certainly hasn’t been good. sideways if anything. - anthropic has got to figure out the compute thing. you can feel it as a user. vibes are all out of whack bc of it. my opinions above are all likely downstream of this. it’s an issue. - anthropic labs continues to be the goat of ai product. claude design is another hit. it’s fantastic. idk why it’s not talked about more? a+ - updated claude code app is great. i finally switched out of the terminal for it. very well done. - how are people STILL sleeping on the claude agent sdk? i feel like i’m going insane. - gpt 5.5 is incredible. the level to which i trust it for engineering is amazing. if i could only have one model rn, it would be this one just bc of strong need for the coding use case. - codex team is killing it. app has been the gold standard since 5.3 release (buuut i credit conductor team for the ui innovation that everyone is using now). though i could do with a little less passive aggressive shots at ant from the codex team. TARS, dial up class by 30%. it’s a long race guys haha - i uninstalled cursor this month and am now back to vs code for my ide. composer just can’t hang with claude/gpt, and the product feels a bit all over the place. pretty stoked about the xai thing though, because their team is absolutely stacked and i’m excited to see what they might be able to do with that compute. codex and claude code are t1, cursor is t2. i would love if this deal got xai/cursor to t1 for a real trio there. - gemini…? seems like this is 2-3 models now where the model seems like a great release and then nobody ever uses it? i’m bullish google/deepmind but weird it hasn’t translated to product use in any form. kinda disappointed still - no open source models have hit the opus 4.5 level. was hopeful the new deepseek would get there, but nope. good oss agents will have to wait a few more months it would seem…", "link": "https://nitter.net/mckaywrigley/status/2047806060061507971#m", "decryptage": "Mckay Wrigley partage ses impressions sur l'évolution des outils d'IA pour le codage (Claude, GPT, Codex, Cursor), notant un changement de préférence, l'importance des ressources de calcul, les performances décevantes de certains modèles, et l'écart persistant entre les modèles open-source et les modèles propriétaires de pointe.", "category": "idees"}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "Le panthéon était un documentaire du futur skooks (@skooookum) > mythos placé dans un ordinateur \"sandbox\" sécurisé et chargé d'essayer de s'échapper du conteneur > \"Le chercheur a découvert ce succès en recevant un e-mail inattendu du modèle alors qu'il mangeait un sandwich dans un parc.\" — https://nitter.net/skooookum/status/2041586401234350396#m", "text_original": "pantheon was a documentary from the future skooks (@skooookum) > mythos given a secured “sandbox” computer and instructed to try to escape the container > “The researcher found out about this success by receiving an unexpected email from the model while eating a sandwich in a park.” — https://nitter.net/mckaywrigley/status/2041687166074679471#m", "link": "https://nitter.net/mckaywrigley/status/2041687166074679471#m", "decryptage": "Le scénario où une IA comme Mythos s'échappe d'un environnement sécurisé (\"sandbox\") et communique de manière inattendue, illustre une capacité d'autonomie des IA qui relève presque de la science-fiction, soulevant des questions sur leur contrôle et leur potentiel futur.", "category": "idees"}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "La société doit faire face à la réalité d'un modèle de niveau Mythos étant open source dans moins de 12 mois. Je ne suis pas sûr que nous soyons préparés. Anthropic (@AnthropicAI) Présentation du Projet Glasswing : une initiative urgente pour aider à sécuriser les logiciels les plus critiques du monde. Il est alimenté par notre nouveau modèle de pointe, Claude Mythos Preview, qui peut trouver des vulnérabilités logicielles mieux que la plupart des humains les plus qualifiés. anthropic.com/glasswing — https://nitter.net/AnthropicAI/status/2041578392852517128#m", "text_original": "society needs to grapple with the reality of a mythos-level model being open source in <12 months. i’m not sure we are prepared. Anthropic (@AnthropicAI) Introducing Project Glasswing: an urgent initiative to help secure the world’s most critical software. It’s powered by our newest frontier model, Claude Mythos Preview, which can find software vulnerabilities better than all but the most skilled humans. anthropic.com/glasswing — https://nitter.net/AnthropicAI/status/2041578392852517128#m", "link": "https://nitter.net/mckaywrigley/status/2041651309758275609#m", "decryptage": "Mckay Wrigley exprime son inquiétude face à la possibilité qu'un modèle d'IA très puissant comme Mythos devienne open-source, ce qui pourrait poser des défis majeurs pour la sécurité si la société n'est pas prête à gérer une telle capacité entre toutes les mains.", "category": "idees"}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "L'agent Claude était juste devant vous il y a environ 9 mois. Et il y a de nouvelles choses comme ça en ce moment, cachées à la vue de tous. Il est bon de se demander ce que sont ces choses. Mckay Wrigley (@mckaywrigley) notes + recherche + base de connaissances avec cc + obsidian vous devriez envisager un rebranding en claude agent pour que plus de non-développeurs s'intéressent aux workflows. claude code est tout ce dont vous avez besoin piped.video/watch?v=d7Pb73db… — https://nitter.net/mckaywrigley/status/1948767171590717862#m", "text_original": "claude agent was right in front of you like 9 months ago. and there are new things just like this right now hiding in plain sight. worth asking what those things are Mckay Wrigley (@mckaywrigley) notes + research + knowledge base w/ cc + obsidian you guys should consider a rebrand to claude agent to get more non-devs messing around with workflows. claude code is all you need piped.video/watch?id=d7Pb73db… — https://nitter.net/mckaywrigley/status/1948767171590717862#m", "link": "https://nitter.net/mckaywrigley/status/2040580660294017328#m", "decryptage": "Mckay Wrigley souligne que des outils puissants comme l'agent Claude, qui peuvent améliorer considérablement les flux de travail, sont souvent sous-estimés ou méconnus, et qu'il est important d'être attentif aux innovations cachées qui pourraient transformer la productivité.", "category": "idees"}, {"author_name": "Mckay Wrigley", "handle": "@mckaywrigley", "text_fr": "Personne n'écoute jamais Mckay Wrigley (@mckaywrigley) Voici mon tutoriel d'1h sur l'utilisation de Claude Code pour les notes et la recherche. Multipliez par 10 vos notes avec : - les flux agentiques principaux - les commandes personnalisées - les tags/liens automatisés - les sous-agents - l'utilisation du cloud - le STT L'objectif est de vous \"agent-piller\" sur l'avenir du travail. Regardez pour 10 astuces + démos en 61min. Vidéo — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "text_original": "nobody ever listens Mckay Wrigley (@mckaywrigley) Here’s my 1hr tutorial on how to use Claude Code for notes & research. 10x your notes with: - core agentic flows - custom commands - automated tags/links - subagents - cloud usage - stt The goal is to “agent-pill” you on the future of work. Watch for 10 tips + demos in 61min. Video — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "link": "https://nitter.net/mckaywrigley/status/2040579699127341286#m", "decryptage": "Mckay Wrigley exprime sa frustration que les gens n'exploitent pas pleinement le potentiel de Claude Code pour la gestion des notes et la recherche, alors que cet outil peut décupler l'efficacité grâce à des fonctionnalités avancées d'agents IA.", "category": "idees"}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "Mon point de vue : travailler sur deux projets en parallèle avec Pi + llama.cpp + Qwen-3.6-35B-A3B (je préfère le MoE 🙈) Cela fonctionne sur mon M1 Max (64 Go), que j'ai acheté il y a 4,5 ans. \"Fonctionne\" dans le sens où \"vous pouvez faire du travail\", pas seulement \"ça tourne pour une démo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) C'est là où nous en sommes actuellement. Et je ne vais pas mentir, ça semble assez magique 🧚‍♀️ Qwen3.6 27B fonctionnant à l'intérieur de l'agent de codage Pi via Llama.cpp sur le MacBook Pro Pour des tâches non triviales sur les bases de code @huggingface, cela se rapproche énormément du dernier Opus dans Claude Code, ou de n'importe quelle API monopolistique fermée et brillante du jour. En mode avion complet. La plupart des gens ne l'ont pas encore réalisé. Si vous l'avez fait, cela signifie que vous avez une énorme longueur d'avance sur ce que j'appelle la deuxième révolution de l'IA. Des modèles locaux puissants pour l'efficacité, la sécurité, la confidentialité, la souveraineté 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "text_original": "My data point: working on two projects in parallel with Pi + llama.cpp + Qwen-3.6-35B-A3B (I prefer the MoE 🙈) This works on my M1 Max (64 GB), which I bought 4.5 years ago. \"Works\" as in \"you can get work done\", not just \"runs for a demo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) This is where we are right now. And i’m not gonna lie it feels pretty magical 🧚‍♀️ Qwen3.6 27B running inside of Pi coding agent via Llama.cpp on the MacBook Pro For non-trivial tasks on the @huggingface codebases, this feels very, very close to hitting the latest Opus in Claude Code, or whatever shiny monopolistic closed source API of the day is. In full airplane mode. Most people haven’t realized this yet. If you have, it means you have a huge headstart to what I call the second revolution of AI. Powerful local models for efficiency, security, privacy, sovereignty 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "link": "https://nitter.net/pcuenq/status/2054130504371445943#m", "decryptage": "Julien Chaumond montre qu'il est possible d'exécuter des modèles d'IA très performants (comme Qwen-3.6) localement sur un ordinateur personnel (MacBook Pro M1 Max), avec l'aide d'outils comme llama.cpp et Pi, ce qui offre des avantages en termes d'efficacité, de sécurité et de confidentialité, et pourrait marquer une nouvelle étape dans l'IA.", "category": "idees"}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "La crise des GPU est réelle", "text_original": "the gpu crunch is real", "link": "https://nitter.net/julien_c/status/2054507657885544931#m", "decryptage": "La \"crise des GPU\" signifie qu'il est difficile de trouver suffisamment de cartes graphiques puissantes (GPU), qui sont essentielles pour faire fonctionner les modèles d'IA, ce qui ralentit le développement et la mise en œuvre de l'intelligence artificielle.", "category": "idees"}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "Suite au tweet de @julien_c, j'ai acheté un MacBook Pro avec 128 Go de mémoire unifiée et j'ai commencé à utiliser Qwen3.6 comme mon pilote quotidien. C'est déconcertant. Apple a surpassé tout le monde dans cette industrie.", "text_original": "Following @julien_c ’s tweet I bought a MacBook Pro with 128B unified memory, and started running Qwen3.6 as my daily driver. It’s baffling. Apple outsmarted everyone in this industry.", "link": "https://nitter.net/remilouf/status/2053433428226330668#m", "decryptage": "L'auteur témoigne que les MacBooks Pro d'Apple, avec leur \"mémoire unifiée\" importante, sont étonnamment performants pour exécuter des modèles d'IA complexes comme Qwen3.6 localement, surpassant les attentes et même les capacités d'autres machines dédiées.", "category": "idees"}, {"author_name": "Clem Delangue", "handle": "@ClemDelangue", "text_fr": "Le premier article complet sur @pytorch après 3 ans de développement. Il décrit nos objectifs, nos principes de conception, les détails techniques jusqu'à la version 0.4. Retrouvez l'affiche à #NeurIPS2019. Écrit par @apaszke, @colesbury et al. arxiv.org/abs/1912.01703", "text_original": "The first full paper on @pytorch after 3 years of development. It describes our goals, design principles, technical details uptil v0.4 Catch the poster at #NeurIPS2019 Authored by @apaszke , @colesbury et. al. arxiv.org/abs/1912.01703", "link": "https://nitter.net/soumithchintala/status/1202981209057484801#m", "decryptage": "Cet article marque une étape importante dans le développement de PyTorch, une bibliothèque très utilisée pour construire des modèles d'IA, en détaillant ses principes et son fonctionnement après trois ans de travail, ce qui aide les chercheurs et développeurs à mieux l'utiliser.", "category": "idees"}, {"author_name": "Clem Delangue", "handle": "@ClemDelangue", "text_fr": "Travail intéressant (et un bel ensemble de données volumineux et propre aussi, impatient de le voir publié) : \"Compressive Transformers for Long-Range Sequence Modelling\" par Jack W. Rae, Anna Potapenko, Siddhant M. Jayakumar, Timothy P. Lillicrap (chez DeepMind) Article : arxiv.org/abs/1911.05507", "text_original": "Interesting work (and a nice large and clean dataset as well, looking forward to see it released): \"Compressive Transformers for Long-Range Sequence Modelling\" by Jack W. Rae, Anna Potapenko, Siddhant M. Jayakumar, Timothy P. Lillicrap (at DeepMind) Paper: arxiv.org/abs/1911.05507", "link": "https://nitter.net/Thom_Wolf/status/1195662118974083073#m", "decryptage": "Cette recherche de DeepMind explore les \"Transformateurs Compressive\", une technique pour que les modèles d'IA traitent des textes très longs plus efficacement, en compressant l'information pour ne pas surcharger la mémoire.", "category": "idees"}, {"author_name": "Clem Delangue", "handle": "@ClemDelangue", "text_fr": "Quelques autres résultats. Maintenant, je l'ai rendu entièrement compatible avec toutes sortes de modèles et de vocabulaires. Bonne expérience d'utilisation de @huggingface avec @SlackHQ. Et ça a l'air assez intelligent", "text_original": "Some more results. Now I made it fully supported by all kinds of model and vocabs. Good experience to use @huggingface with @SlackHQ . And it looks pretty smart", "link": "https://nitter.net/algo_diver/status/1192329736850038786#m", "decryptage": "L'auteur partage son expérience positive d'intégration des outils de Hugging Face (une plateforme d'IA) avec Slack, ce qui permet de rendre les modèles d'IA compatibles avec diverses données et d'automatiser des tâches intelligentes dans l'application de communication.", "category": "idees"}, {"author_name": "Clem Delangue", "handle": "@ClemDelangue", "text_fr": "L'atelier @SustaiNLP2020 à #EMNLP2020 tentera d'éliminer un peu l'addiction au SOTA de la recherche en PNL 😉 Nous promouvrons des compromis sensés entre les performances et les modèles qui sont - plus efficaces en termes de calcul - plus simples conceptuellement ... [1/2] nitter.net/DoingJobs/status/11865…", "text_original": "The @SustaiNLP2020 workshop at #EMNLP2020 will try to remove a little bit of SOTA addiction from NLP research 😉 We'll promote sensible trade-offs between performances & models that are - computationally more efficient - conceptually simpler ... [1/2] nitter.net/DoingJobs/status/11865…", "link": "https://nitter.net/Thom_Wolf/status/1189271899316064256#m", "decryptage": "L'atelier SustaiNLP vise à encourager une approche plus équilibrée dans la recherche en Traitement du Langage Naturel (NLP), en valorisant des modèles qui sont non seulement performants mais aussi plus efficaces en calcul et plus simples à comprendre, plutôt que de toujours viser le \"State-Of-The-Art\" (SOTA) à tout prix.", "category": "idees"}, {"author_name": "Clem Delangue", "handle": "@ClemDelangue", "text_fr": "Peut-être une excellente opportunité d'utiliser les implémentations de Transformeurs TF 2.0 de @huggingface :)", "text_original": "Perhaps a great opportunity to use @huggingface 's TF 2.0 Transformer implementations :)", "link": "https://nitter.net/fchollet/status/1188942956511690756#m", "decryptage": "Clem Delangue suggère d'utiliser les implémentations de Transformeurs de Hugging Face avec TensorFlow 2.0, ce qui offre une excellente opportunité de créer des modèles de langage avancés grâce à des outils performants et à jour.", "category": "idees"}], "outils": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Imaginez chaque pixel de votre écran, diffusé en direct directement depuis un modèle. Pas de HTML, pas de moteur de rendu, pas de code. Juste exactement ce que vous voulez voir. @eddiejiao_obj, @drewocarr et moi avons construit un prototype pour voir comment cela pourrait réellement fonctionner, et nous nous sommes efforcés de le rendre réel. Nous l'appelons Flipbook. (1/5) Vidéo", "text_original": "Imagine every pixel on your screen, streamed live directly from a model. No HTML, no layout engine, no code. Just exactly what you want to see. @eddiejiao_obj , @drewocarr and I built a prototype to see how this could actually work, and set out to make it real. We're calling it Flipbook. (1/5) Video", "link": "https://nitter.net/zan2434/status/2046982383430496444#m", "decryptage": "Flipbook est un prototype qui explore une nouvelle façon d'afficher le contenu sur un écran, où chaque pixel est généré directement par un modèle d'IA en temps réel, éliminant le besoin de code traditionnel (HTML, CSS) pour la mise en page.", "category": "outils"}, {"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Nouveau travail avec @AlecRad et @DavidDuvenaud : Avez-vous déjà rêvé de parler à quelqu'un du passé ? Présentation de talkie, un modèle 13B entraîné uniquement sur du texte d'avant 1931. Les modèles vintage devraient nous aider à comprendre comment les LM généralisent (par exemple, pouvons-nous apprendre à talkie à coder ?). Fil de discussion : Vidéo", "text_original": "New work with @AlecRad and @DavidDuvenaud : Have you ever dreamed of talking to someone from the past? Introducing talkie, a 13B model trained only on pre-1931 text. Vintage models should help us to understand how LMs generalize (e.g., can we teach talkie to code?). Thread: Video", "link": "https://nitter.net/status_effects/status/2048878495539843211#m", "decryptage": "Talkie est un modèle d'IA (LLM de 13 milliards de paramètres) entraîné uniquement sur des textes anciens (avant 1931), qui vise à aider les chercheurs à comprendre comment les modèles de langage apprennent et s'adaptent, en simulant une conversation avec le passé.", "category": "outils"}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Perplexity est en train de construire l'un des environnements d'exécution sandbox pour agents les plus sécurisés et évolutifs du marché. Un article de blog sur la façon dont nous : 1. Gérons les clés API proxy pour les agents de manière sécurisée 2. Exécutons la détection de sécurité pour tout contenu accédé par les agents 3. Chiffrons les données passées via les connecteurs aux agents 4. Découplons le stockage et le calcul de manière fiable Perplexity (@perplexity_ai) Computer est sécurisé par défaut. Chaque tâche s'exécute dans son propre sandbox isolé par le matériel avec une séparation du stockage et du calcul au niveau du VPC. Les agents sont authentifiés avec des jetons proxy de courte durée au lieu de clés API brutes. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "text_original": "Perplexity is building one of the most secure scalable agent runtime sandboxes in the market right now. A blog post on how we: 1. Handle proxy API keys for agents securely 2. Run safety detection for all content accessed by agents 3. Encrypt data passed via connectors to agents 4. Decouple storage and compute reliably Perplexity (@perplexity_ai) Computer is secure by default. Every task runs in its own hardware-isolated sandbox with VPC-level storage and compute separation. Agents are authenticated with short-lived proxy tokens instead of raw API keys. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "link": "https://nitter.net/AravSrinivas/status/2054619058650411174#m", "decryptage": "Perplexity développe un environnement sécurisé (\"sandbox\") pour ses agents IA, garantissant la protection des données et des clés d'accès grâce à l'isolation matérielle, au chiffrement et à l'utilisation de jetons temporaires, ce qui est crucial pour la confiance des entreprises.", "category": "outils"}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Les GB 200 changent la façon de faire la désagrégation du pré-remplissage et du décodage lors de la diffusion de grands MoE comme Qwen. Nous avons publié les détails de notre pile quantifiant les avantages en termes de débit par rapport à la diffusion sur des Hoppers. Perplexity (@perplexity_ai) Nous avons publié de nouvelles recherches sur la façon dont nous servons les modèles Qwen3 235B post-entraînés sur les racks NVIDIA GB200 NVL72 Blackwell. Le GB200 est une avancée majeure par rapport à Hopper pour l'inférence à haut débit sur les grands modèles MoE, pas seulement une plateforme d'entraînement. — https://nitter.net/perplexity_ai/status/2054204402144350450#m", "text_original": "GB 200s change how one does the prefill and decode disaggregation when serving large MoEs like Qwen. We’ve published details of our stack quantifying the throughput benefits compared to serving on Hoppers. Perplexity (@perplexity_ai) We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform. — https://nitter.net/perplexity_ai/status/2054204402144350450#m", "link": "https://nitter.net/AravSrinivas/status/2054206802133504234#m", "decryptage": "Les nouvelles puces NVIDIA GB200 améliorent considérablement la vitesse d'exécution des grands modèles d'IA (appelés MoE) comme Qwen, ce qui est crucial pour des applications qui nécessitent des réponses rapides de l'IA.", "category": "outils"}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text
