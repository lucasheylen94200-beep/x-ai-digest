maximally legible to LLMs, some words on the quickly emerging agentic engineering and its skill set, related hiring practices, etc., possibly even hints/dreams of fully neural computing handling the vast majority of computation with some help from (classical) CPU coprocessors. Stephanie Zhan (@stephzhan) @karpathy and I are back! At @sequoia AI Ascent 2026. And a lot has changed. Last year, he coined “vibe coding”. This year, he’s never felt more behind as a programmer. The big shift: vibe coding raised the floor. Agentic engineering raises the ceiling. We talk about what it means to build seriously in the agent era. Not just moving faster. Building new things, with new tools, while preserving the parts that still require human taste, judgment, and understanding. Video — https://nitter.net/stephzhan/status/2049518659513852109#m", "link": "https://nitter.net/karpathy/status/2049903821095354523#m", "published": "Thu, 30 Apr 2026 17:28:50 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "New work with @AlecRad and @DavidDuvenaud : Have you ever dreamed of talking to someone from the past? Introducing talkie, a 13B model trained only on pre-1931 text. Vintage models should help us to understand how LMs generalize (e.g., can we teach talkie to code?). Thread: Video", "link": "https://nitter.net/status_effects/status/2048878495539843211#m", "published": "Mon, 27 Apr 2026 21:34:34 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "Imagine every pixel on your screen, streamed live directly from a model. No HTML, no layout engine, no code. Just exactly what you want to see. @eddiejiao_obj , @drewocarr and I built a prototype to see how this could actually work, and set out to make it real. We're calling it Flipbook. (1/5) Video", "link": "https://nitter.net/zan2434/status/2046982383430496444#m", "published": "Wed, 22 Apr 2026 16:00:05 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "sama", "text": "also all this: OpenAI Developers (@OpenAIDevs) Codex is getting easier to automate and customize around your code. 🪝 Hooks customize the Codex loop with scripts that run at key points in a task: • Run validators before or after work • Scan prompts for secrets • Log conversations to internal systems • Create memories or customize behavior by repo or directory ⚙️ Programmatic access tokens provide scoped credentials for Business and Enterprise teams: • Create tokens from ChatGPT workspace settings • Use them in CI, release workflows, and internal automations • Set expirations or revoke access when needed • Keep usage tied back to the workspace Video — https://nitter.net/OpenAIDevs/status/2055032115964870838#m", "link": "https://nitter.net/sama/status/2055034714231345475#m", "published": "Thu, 14 May 2026 21:17:11 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "Codex in the ChatGPT mobile app!", "link": "https://nitter.net/sama/status/2055034461591588916#m", "published": "Thu, 14 May 2026 21:16:10 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "being a dad is the thing that has most exceeded already-high-expectations in my whole life", "link": "https://nitter.net/sama/status/2054773491522822264#m", "published": "Thu, 14 May 2026 03:59:10 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "i get some anxiety not using the smartest-available model/settings. but sometimes i dont mind if it's really slow. i wonder if we should focus more on a price/speed tradeoff relative to a price/intelligence tradeoff.", "link": "https://nitter.net/sama/status/2054627102922797323#m", "published": "Wed, 13 May 2026 18:17:29 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "codex is the best AI coding product and we want to make it easy to try. for the next 30 days, we are giving companies that want to try switching over two months of free codex usage.", "link": "https://nitter.net/sama/status/2054626219858293128#m", "published": "Wed, 13 May 2026 18:13:58 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Cyber is the first clear and present danger from frontier AI models, but it won’t be the last. If we are able to collectively rise to the challenge and confront this risk, it could serve as a blueprint for addressing the even more difficult challenges that lie ahead of us.", "link": "https://nitter.net/DarioAmodei/status/2041580343472337145#m", "published": "Tue, 07 Apr 2026 18:14:19 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "The dangers of getting this wrong are obvious, but if we get it right, there is a real opportunity to create a fundamentally more secure internet and world than we had before the advent of AI-powered cyber capabilities.", "link": "https://nitter.net/DarioAmodei/status/2041580341794615631#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Glasswing is just the first step: patching and securing the world’s software infrastructure will be the work of months and years, and will require even broader cooperation across AI companies, cyberdefenders, software providers, governments, and more.", "link": "https://nitter.net/DarioAmodei/status/2041580340032995821#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Rather than release Mythos Preview to general availability, we’re giving defenders early controlled access in order to find and patch vulnerabilities before Mythos-class models proliferate across the ecosystem.", "link": "https://nitter.net/DarioAmodei/status/2041580338426585171#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "We’ve been tracking the increasing cyber capabilities of AI models for years, which arise as part of their general proficiency at coding. But our new model, Mythos Preview, represents a particularly large step up.", "link": "https://nitter.net/DarioAmodei/status/2041580336828568000#m", "published": "Tue, 07 Apr 2026 18:14:17 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "You can now use Codex, wherever you have it running, from the ChatGPT app. Huge step forward for universal usage of agents. OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/gdb/status/2055034165968384099#m", "published": "Thu, 14 May 2026 21:15:00 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "How we built the Codex sandbox for Windows: OpenAI Developers (@OpenAIDevs) To bring Codex to Windows, we had to answer a hard question: how do you let coding agents stay useful without forcing developers to choose between constant approval prompts and full machine access? Here’s how we built the Windows sandbox for Codex: openai.com/index/building-co… — https://nitter.net/OpenAIDevs/status/2054735161166819377#m", "link": "https://nitter.net/gdb/status/2054744721570820444#m", "published": "Thu, 14 May 2026 02:04:51 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "great excitement from enterprises wanting to adopt codex OpenAI Developers (@OpenAIDevs) 2000 developers reached out in 3 hours. Let's build things. — https://nitter.net/OpenAIDevs/status/2054698500143927357#m", "link": "https://nitter.net/gdb/status/2054710146924683586#m", "published": "Wed, 13 May 2026 23:47:28 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "AI for helping you build apps powered by AI: OpenAI Developers (@OpenAIDevs) Codex can now help you build AI apps and agents faster with OpenAI APIs using the OpenAI Developers plugin. Video — https://nitter.net/OpenAIDevs/status/2053925962287583379#m", "link": "https://nitter.net/gdb/status/2054092636659625990#m", "published": "Tue, 12 May 2026 06:53:42 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "Having an agent in your meeting is such a futuristic experience: OpenAI Developers (@OpenAIDevs) What if your team gave standup updates, and GPT-Realtime-2 moved the tickets? Video — https://nitter.net/OpenAIDevs/status/2053964133570412826#m", "link": "https://nitter.net/gdb/status/2054064478547775813#m", "published": "Tue, 12 May 2026 05:01:49 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Gemini Intelligence features will roll out in waves starting with the latest Samsung Galaxy and Google Pixel phones this summer, and across Android devices including your watch, car, glasses & laptops later this year! blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2054255861158338713#m", "published": "Tue, 12 May 2026 17:42:18 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "published": "Tue, 12 May 2026 17:42:17 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! Sameer Samat (@ssamat) Big news: Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! This cross-industry effort replaces outdated SMS with a more secure & private way to chat, no matter what phone you have.🔒 Thank you to the community for continuing to push for these kinds of features. Your engagement really helps make a difference. Congratulations to the team for reaching this amazing milestone! 🚀 Read more: blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "link": "https://nitter.net/sundarpichai/status/2053900771947942085#m", "published": "Mon, 11 May 2026 18:11:18 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2052411066840416742#m", "published": "Thu, 07 May 2026 15:31:44 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Look what crossed my desk @StephenCurry30 !", "link": "https://nitter.net/sundarpichai/status/2052411065204715928#m", "published": "Thu, 07 May 2026 15:31:44 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Most enterprise data lives inside Snowflake. With Computer connecting to Snowflake, you get to set up a fleet of on-call data scientist agents. Perplexity (@perplexity_ai) Computer now connects to Snowflake. Run end-to-end work against live warehouse data and get answers with SQL, source tables, filters, and metrics. It’s like a personal data science team, on call with accurate answers from live company data. Video — https://nitter.net/perplexity_ai/status/2054945872451129506#m", "link": "https://nitter.net/AravSrinivas/status/2054947269670248883#m", "published": "Thu, 14 May 2026 15:29:42 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Perplexity is building one of the most secure scalable agent runtime sandboxes in the market right now. A blog post on how we: 1. Handle proxy API keys for agents securely 2. Run safety detection for all content accessed by agents 3. Encrypt data passed via connectors to agents 4. Decouple storage and compute reliably Perplexity (@perplexity_ai) Computer is secure by default. Every task runs in its own hardware-isolated sandbox with VPC-level storage and compute separation. Agents are authenticated with short-lived proxy tokens instead of raw API keys. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "link": "https://nitter.net/AravSrinivas/status/2054619058650411174#m", "published": "Wed, 13 May 2026 17:45:31 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Perplexity is quietly becoming the knowledge and research platform for the enterprise Perplexity (@perplexity_ai) PayPal runs 74,000 weekly tasks in Perplexity Enterprise. Teams use it for model validation, channel performance, market trend research, competitive intelligence, and product analysis. Read the customer story: perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "link": "https://nitter.net/AravSrinivas/status/2054581332232302701#m", "published": "Wed, 13 May 2026 15:15:36 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "GB 200s change how one does the prefill and decode disaggregation when serving large MoEs like Qwen. We’ve published details of our stack quantifying the throughput benefits compared to serving on Hoppers. Perplexity (@perplexity_ai) We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform. — https://nitter.net/perplexity_ai/status/2054204402144350450#m", "link": "https://nitter.net/AravSrinivas/status/2054206802133504234#m", "published": "Tue, 12 May 2026 14:27:21 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform.", "link": "https://nitter.net/perplexity_ai/status/2054204402144350450#m", "published": "Tue, 12 May 2026 14:17:49 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "1. (System design) - The Interaction Models see your screen and collaborates with you live. Here we're building a scalable system architecture together — no copy-pasting, no switching tabs, just thinking out loud and drawing on the screen together. Video", "link": "https://nitter.net/SeongsikKi5837/status/2054015382386876448#m", "published": "Tue, 12 May 2026 01:46:43 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Cluster magicians and GPU whisperers, come join us! We’re looking for supercomputing engineers to build the infrastructure behind real-time interactive models, Tinker, and large-scale training: scheduling, storage, networking, reliability, and distributed systems at scale. Hiring in NYC and SF job-boards.greenhouse.io/thi…", "link": "https://nitter.net/soumithchintala/status/2054248270780604876#m", "published": "Tue, 12 May 2026 17:12:08 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Lili and Martin get some help controlling themselves. Video", "link": "https://nitter.net/thinkymachines/status/2053938908296315060#m", "published": "Mon, 11 May 2026 20:42:50 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Tessa's quality of life has improved a lot with some nagging. Video", "link": "https://nitter.net/thinkymachines/status/2053938895491146114#m", "published": "Mon, 11 May 2026 20:42:47 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "While Lilian is telling a story, the interaction model can track when she is thinking, yielding, self-correcting, or inviting a response; there is no specific built dialogue management system. Video", "link": "https://nitter.net/thinkymachines/status/2053938893914005560#m", "published": "Mon, 11 May 2026 20:42:47 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "ylecun", "text": "Aleph, our fully autonomous AI agent system for formal verification, aced all major theorem proving benchmarks including PutnamBench, VeriSoftBench, and Verina", "link": "https://nitter.net/logic_int/status/2054943125668311432#m", "published": "Thu, 14 May 2026 15:13:14 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "This one blew my mind back in the day! From \"Learning Invariant Features through Topographic Filter Maps\" (2009) by @koraykv , @MarcRanzato , @rob_fergus and @ylecun Roland Memisevic (@RolandMemisevic) Relics from the prehistoric era of AI — https://nitter.net/RolandMemisevic/status/2054927222310396093#m", "link": "https://nitter.net/sedielem/status/2054961175842943442#m", "published": "Thu, 14 May 2026 16:24:58 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "Obama on the Iran nuclear deal today: “We pulled it off without firing a missile. We got 97% of their enriched uranium out. There’s no dispute that it worked. We didn’t have to kill a whole bunch of people or shut down the Strait of Hormuz.” $25 billion spent. 14 Americans dead. Oil at $119 a barrel. The world has one month of strategic reserves left. A UAE oil port on fire. Ships turning back at gunpoint. Trump called Obama’s deal the worst deal ever made. Then tore it up. Then started a war to get back to the same place. Video", "link": "https://nitter.net/allenanalysis/status/2054725161719382252#m", "published": "Thu, 14 May 2026 00:47:08 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "We asked the CEO of HuggingFace @ClementDelangue what the risks of releasing powerful open source models are. He says restricting AI creates more risk than openness. \"Six, seven years ago, at the time it was GPT-2, and there was already a lot of people saying that it was too dangerous to release in open source.\" \"Mythos, when it was announced was crazy dangerous... In a few weeks or a few months, everyone is gonna be using Mythos, and not destroy the world as a result.\" \"For cybersecurity, the biggest risk is that a few players have capabilities that other people don't have... If you make it more open, it's usually easier for defenders to react and make the whole system safer.\" \"The idea of restricting a technology like AI based on risks is like saying, 'Some people can punch other people, so let's tie down everybody's hands.'\" \"Otherwise you slow down progress, you create massive gaps in terms of controls, in terms of capabilities, and you create actually additional risks.\" Video clem 🤗 (@ClementDelangue) Weird how some people always target open-source in AI! First it was: “Open-source AI will destroy the world” (spoiler: it didn't and it won't) Now: “Open-source is a cybersecurity threat because of AI” Both narratives are far too simplistic. The truth is that the exact same risks exist in closed-source systems, often even more so. For example, in practice, APIs can create much bigger data and security vulnerabilities than open systems you can inspect, self-host, and secure yourself. And as with software more broadly, open-source often ends up more secure because it benefits from far more scrutiny than private internal systems. The reality is not “open vs closed.” The reality is that AI is raising cybersecurity stakes across the board, and we need to tackle that seriously together. — https://nitter.net/ClementDelangue/status/2044449244052934751#m", "link": "https://nitter.net/MTSlive/status/2054659284601131365#m", "published": "Wed, 13 May 2026 20:25:21 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "Do AI models really learn physics, or just learn what physics looks like? Flatiron's @_helenqu , with @PolymathicAI & CDS researchers including @ylecun , finds that models predicting in latent space recover physical parameters better than pixel-level ones. nyudatascience.medium.com/wh…", "link": "https://nitter.net/NYUDataScience/status/2054622859796820436#m", "published": "Wed, 13 May 2026 18:00:37 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "demishassabis", "text": "Introducing Googlebook, the first laptop designed for Gemini Intelligence. It’s crafted for heavyweight performance, built with Gemini at the core and perfectly synced with your Android phone. Coming this fall. 💻✨ #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054270454467121187#m", "published": "Tue, 12 May 2026 18:40:17 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Really cool work from the team reimagining the mouse pointer to be intelligent! Try the prototype in @GoogleAIStudio it's pretty magical. Google DeepMind (@GoogleDeepMind) We’re reimagining a 50-year-old interface - the mouse pointer - with AI. 🖱️ These experimental demos show how people can intuitively direct Gemini on their screens using motion, speech, and natural shorthand to get things done 🧵 Video — https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "link": "https://nitter.net/demishassabis/status/2054326444189253655#m", "published": "Tue, 12 May 2026 22:22:46 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "published": "Tue, 12 May 2026 17:42:17 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Read more here: bit.ly/4v2OI03", "link": "https://nitter.net/demishassabis/status/2054197463855042669#m", "published": "Tue, 12 May 2026 13:50:15 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "I’ve always believed the No.1 application of AI should be to improve human health. That work started with AlphaFold, and now at @IsomorphicLabs with the mission to reimagine drug discovery and one day solve all disease! We are turbocharging that goal with $2.1B in new funding. Video", "link": "https://nitter.net/demishassabis/status/2054197462101889277#m", "published": "Tue, 12 May 2026 13:50:14 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "JeffDean", "text": "Today, we introduced Gemini Intelligence, which brings the best of Gemini to our most advanced devices. Gemini Intelligence integrates premium hardware and innovative software to help you stay a step ahead and work proactively to get things done throughout your day. #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054263720629457058#m", "published": "Tue, 12 May 2026 18:13:32 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Great to see @percyliang as a keynote speaker at #cais2026 ! ACM Conference on AI and Agentic Systems (@CAISconf) 🎤 Keynote announcement: @percyliang (Percy Liang), Professor of Computer Science at @Stanford , founding director of the Center for Research on Foundation Models, and co-founder of @togethercompute , is keynoting #CAIS2026 . Percy's HELM framework set the standard for holistic evaluation of language models, and his Foundation Model Transparency Index (now in its third year) put every major AI lab on notice for what they do and don't disclose. His current work on Marin takes this further: an open lab where every experiment, successful or not, is public from day one. This one's going to be good. San Jose · May 26–29 caisconf.org — https://nitter.net/CAISconf/status/2054256506464596282#m", "link": "https://nitter.net/JeffDean/status/2054294479113515385#m", "published": "Tue, 12 May 2026 20:15:45 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Today we're launching the Open Defense Initiative: up to $5 million in @depthfirstlabs credits for critical open source projects to find and fix real, exploitable vulnerabilities. We’ve been investing heavily in the entire agentic security technology stack: a harness that allows models to efficiently reason through code the way a security engineer would, the context understanding to validate exploitability and produce ready-to-merge fixes, and recently, post-trained models optimized for vulnerability discovery. Today we shared a datapoint that highlights the value of that approach. depthfirst autonomously identified 12 vulnerabilities in @FFmpeg , after Anthropic did several hundred runs with Mythos, for 1/10th of the compute cost reported by Anthropic. As a former @GoogleDeepMind researcher, I am grateful to foundation labs for pushing the boundaries of what AI can do, as every advance there gives us a stronger base to build on. But running general purpose models without the proper harness can be too expensive to be economically viable. That's what makes today's launch possible. The efficiency we've built lets us put frontier-level security in the hands of the maintainers who need it most, before open source models catch up and bad actors wield these capabilities without filters or guardrails. If you maintain a critical open source project, apply for Open Defense credits through the form in the comments.", "link": "https://nitter.net/andreamichi/status/2054262136659194352#m", "published": "Tue, 12 May 2026 18:07:14 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Free Universal Healthcare is so complicated and expensive that only 32 of the 33 wealthiest countries in the world have figured it out. Video", "link": "https://nitter.net/MetamateDaz/status/2052826367134400983#m", "published": "Fri, 08 May 2026 19:02:00 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Bleh. Talks. But dishes also works. The keynotes are like a multicourse tasting menu!", "link": "https://nitter.net/JeffDean/status/2051881201926127702#m", "published": "Wed, 06 May 2026 04:26:15 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The Keras package recently crossed 21M monthly downloads on PyPI, an all-time high (the daily ATH is around 900k). I still remember when it first crossed 10M monthly downloads about 5 years ago and I thought it couldn't possibly go any higher...", "link": "https://nitter.net/fchollet/status/2055039639350919653#m", "published": "Thu, 14 May 2026 21:36:45 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The JAX package is now around the same level, 20M monthly downloads. Which is incredibly fast growth, because 5 years ago I recall it being below 2M or so. It went from niche to mainstream in the past couple of years. Well deserved success.", "link": "https://nitter.net/fchollet/status/2055040945763336508#m", "published": "Thu, 14 May 2026 21:41:56 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The quantity of code that devs ship has roughly 10xed. But net developer productivity (value created by unit of time) is only up by a bit, if at all. Part of it is that the additional code is solving more incremental problems. A bigger part is that the new code is creating problems of its own.", "link": "https://nitter.net/fchollet/status/2054917282015445076#m", "published": "Thu, 14 May 2026 13:30:33 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "This reminds me of computerization. The amount of \"work\" people could execute on computers increased by a huge factor, but their productivity did not. The amount of work \"needed\" to arrive at the same high-level outputs exploded.", "link": "https://nitter.net/fchollet/status/2054917911207395384#m", "published": "Thu, 14 May 2026 13:33:03 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "Symbolic learning is not a replacement for coding agents, it's a replacement for gradient descent & NNs: a low-level, completely general, extremely scalable new learning substrate.", "link": "https://nitter.net/fchollet/status/2054222707055902943#m", "published": "Tue, 12 May 2026 15:30:33 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "New course: Transformers in Practice. You'll get a practical view of how transformer-based LLMs work, so you can reason about their behavior, diagnose problems like slow inference, and make smarter decisions about deployment. This course is built in partnership with @AMD and taught by @realSharonZhou . You'll see how transformers generate text one token at a time, how the model decides which earlier words matter most when predicting the next one, and how techniques like quantization speed up inference on GPUs. This is not a video-only course; interactive visualizations throughout let you play with these concepts and build intuition that sticks. Skills you'll gain: - Understand why LLMs hallucinate, and RAG and chain-of-thought shape what they generate - Look inside the model to see how attention and layers combine to predict the next token - Diagnose inference bottlenecks and learn the techniques that speed up transformers on GPUs Join and understand what's really happening inside your LLMs: deeplearning.ai/courses/tran… Video", "link": "https://nitter.net/AndrewYNg/status/2054964560403300359#m", "published": "Thu, 14 May 2026 16:38:25 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future! [Original text in The Batch newsletter.]", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "published": "Tue, 12 May 2026 16:25:23 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "I'm delighted that @coursera and @udemy have come together as one company to serve learners. Both Coursera and Udemy were founded with the belief that access to high-quality education changes lives. Over the years, both companies have advanced this goal, creating opportunities for individuals, organizations, and communities around the world. That role is even more important now, as AI is changing the nature of work and increasing the need for continuous learning. Helping people build job-relevant skills will be critical to how we create a better world. By combining the strengths of both ‌companies, we can better serve this need. We bring together a broader range of learning content, trusted instructors and educators, and engaging learning experiences. This creates new opportunities to make learning more personalized, more applied, and more accessible at scale. I’m excited to serve as Chairman of the combined company, working alongside Greg Hart and the leadership team. There is a strong foundation in both organizations, and I look forward to what the teams will build together to expand access opportunity globally. Learn more: blog.coursera.org/coursera-a…", "link": "https://nitter.net/AndrewYNg/status/2053857910451827061#m", "published": "Mon, 11 May 2026 15:20:59 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "New course: Build agents that respond to users with not only plaintext, but custom UIs like charts, forms, and whiteboards, generated on demand and displayed right in the chat. This short course is built in partnership with @CopilotKit and taught by @ataiiam , co-founder of CopilotKit. You'll learn three approaches: Your agent can pick from custom components you build, like charts and forms. It can compose new layouts from a set of building blocks you provide, like rows, cards, and text. Or it can incorporate existing third-party apps, like a whiteboard or a calendar, right inside the conversation. Skills you’ll gain: - Build agents that render custom components like charts and forms on demand - Build an app where the agent and user collaborate on shared data, beyond just the chat window - Place third-party apps like maps, calendars, and whiteboards right in your interface Join and build agents that give users something to see and act on! deeplearning.ai/short-course… Video", "link": "https://nitter.net/AndrewYNg/status/2052422157310083493#m", "published": "Thu, 07 May 2026 16:15:49 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "Coding agents are accelerating different types of software work to different degrees. When we architect teams, understanding these distinctions helps us to have realistic expectations. Listing functions from most accelerated to least, my order is: frontend development, backend, infrastructure, and research. Frontend development — say, building a web page to serve descriptions of products for an ecommerce site — is dramatically sped up because coding agents are fluent in popular frontend languages like TypeScript and JavaScript and frameworks like React and Angular. Additionally, by examining what they have built by operating a web browser, coding agents are now very good at closing the loop and iterating on their own implementations. Granted, LLMs today are still weak at visual design, but given a design (or if a polished design isn’t important), the implementation is fast! Backend development — say, building APIs to respond to queries requesting product data — is harder. It takes more work by human developers to steer modern models to think through corner cases that might lead to subtle bugs or security flaws. Further, a backend bug can lead to non-intuitive downstream effects like a corrupted database that occasionally returns incorrect results, which can be harder to debug than a typical frontend bug. Finally, although database migrations can be easier with coding agents, they’re still hard and need to be handled carefully to prevent data loss. While backend development is much faster with coding agents, they accelerate it less, and skilled developers still design and implement far better backends than inexperienced ones who use coding agents. Infrastructure. Agents are even less effective in tasks like scaling an ecommerce site to 10K active uses while maintaining 99.99% reliability. LLMs' knowledge is still relatively limited with respect to infrastructure and the complex tradeoffs good engineers must make, so I rarely trust them for critical infra decisions. Building good infrastructure often requires a period of testing and experimentation, and coding agents can help with that, but ultimately that’s a significant bottleneck where fast AI coding does not help much. Lastly, finding infrastructure bugs — say, a subtle network misconfiguration — can be incredibly difficult and requires deep engineering expertise. Thus, I’ve found that coding agents accelerate critical infrastructure even less than backend development. Research. Coding agents accelerate research work even less. Research involves thinking through new ideas, formulating hypotheses, running experiments, interpreting them to potentially modify the hypotheses, and iterating until we reach conclusions. Coding agents can speed up the pace at which we can write research code. (I also use coding agents to help me orchestrate and keep track of experiments, which makes it easier for a single researcher to manage more experiments.) But there is a lot of work in research other than coding, and today’s agents help with research only marginally. Categorizing software work into frontend, backend, infra, and research is an extreme simplification, but having a simple mental model for how much different tasks have sped up has been useful for how I organize software teams. For example, I now ask front-end teams to implement products dramatically faster than a year ago, but my expectations for research teams have not shifted nearly as much. I am fascinated by how to organize software teams to use coding agents to achieve speed, and will keep sharing my findings in future posts. [Original text: deeplearning.ai/the-batch/is… ]", "link": "https://nitter.net/AndrewYNg/status/2051691741150081122#m", "published": "Tue, 05 May 2026 15:53:24 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "The table in HTML format for easier (and non-truncated) viewing: sebastianraschka.com/llm-arc…", "link": "https://nitter.net/rasbt/status/2054949267630940606#m", "published": "Thu, 14 May 2026 15:37:39 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "Meta observation: DeepSeek is still king of the active-parameter ratio", "link": "https://nitter.net/rasbt/status/2054936440975310910#m", "published": "Thu, 14 May 2026 14:46:41 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "A little talk on what we can learn from implementing LLM architectures from scratch in Python and PyTorch. And how I approach new open-weight models, compare them against reference implementations etc: piped.video/watch?v=TXzQ7PGp…", "link": "https://nitter.net/rasbt/status/2054602271107760308#m", "published": "Wed, 13 May 2026 16:38:48 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "Interesting paper. What I like about this is that it is a relatively low-commitment attention modification. I.e., one can use it during most of training, switch back to vanilla attention near the end, and recover roughly the same modeling performance as if full attention had been used the whole time. elvis (@omarsar0) Cool idea from Nous Research. What if you could speed up long-context pretraining with a subquadratic wrapper that you remove before deployment? That is the idea behind Lighthouse Attention. The method wraps ordinary SDPA with a hierarchical, gradient-free selection layer that compresses and decompresses queries, keys, and values symmetrically, preserving left-to-right causality. Crucially, it can be removed near the end of training in a short recovery phase, so the deployed model still runs vanilla attention with no architectural cost at inference. Preliminary LLM experiments report faster total training time and lower final loss than full-attention baselines. Why does it matter? Most efficient-attention work either changes the deployment-time architecture or pays a quality tax to do so. A training-only wrapper that survives a clean recovery phase sidesteps both. If it scales, this becomes an important training-time speedup for long-context pretraining. Paper: arxiv.org/abs/2605.06554 Learn to build effective AI agents in our academy: academy.dair.ai/ — https://nitter.net/omarsar0/status/2054224130103554359#m", "link": "https://nitter.net/rasbt/status/2054543968344412621#m", "published": "Wed, 13 May 2026 12:47:08 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "Back from a little family break! Lots has happened, and I’m planning to do a deeper dive into the most interesting architectural components (soon). Btw, are there any major architectures I missed below?", "link": "https://nitter.net/rasbt/status/2053497922482761792#m", "published": "Sun, 10 May 2026 15:30:31 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "bcherny", "text": "Starting June 15, paid Claude plans can claim a dedicated monthly credit for programmatic usage. The credit covers usage of: - Claude Agent SDK - claude -p - Claude Code GitHub Actions - Third-party apps built on the Agent SDK", "link": "https://nitter.net/ClaudeDevs/status/2054610152817619388#m", "published": "Wed, 13 May 2026 17:10:07 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "More cardputer code incoming. Thank you Claude. Video Claude (@claudeai) We gave people tiny computers at Code with Claude. Here are some of the small, delightful things they built: Video — https://nitter.net/claudeai/status/2054257324278132893#m", "link": "https://nitter.net/Dakshay/status/2054263619060420832#m", "published": "Tue, 12 May 2026 18:13:07 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "Claude Code weekly limits are increasing 50%, now through July 13. Live now for all Pro, Max, Team, and seat-based Enterprise users.", "link": "https://nitter.net/ClaudeDevs/status/2054639777685934564#m", "published": "Wed, 13 May 2026 19:07:51 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "The UK AISI found Mythos Preview is the first model to solve both their cyber ranges end-to-end. No model had ever solved the AISI’s “Cooling Tower” cyber range before. We're getting it to defenders as fast as we responsibly can. More to come on our Glasswing work soon. Logan Graham (@logangraham) A lot of people have been wondering about Mythos, Glasswing, and the vulns we / our partners are fixing. Today, I’m excited for us to start sharing more. (For context, I lead Glasswing @AnthropicAI .) Two independent evaluations this week—from XBOW and the UK AISI—confirm what we've been seeing internally: Claude Mythos Preview is a step change in autonomous cybersecurity capabilities. We need to start preparing fast for a world of models with this level of capabilities. The UK AI Security Institute tested the model we shipped at the launch of Project Glasswing and found Mythos Preview is the first model to solve both of their end-to-end cyber ranges, including one (Cooling Tower) which no model had ever cleared. But attackers (and defenders) have sophistication & cost constraints – Mythos is also the only model that clears every one of their tasks estimated over 8 hours under their deliberately low 2.5M-token cap. XBOW tested it on their offensive security benchmarks, finding \"token-for-token, unprecedented precision.\" It's the only model to succeed at subtle V8 sandbox work. Other Glasswing partners shared similar stories. In a few weeks of testing, Mythos Preview has helped them find many thousands of (estimated) high + critical severity vulnerabilities, sometimes double what they'd normally find in a year. I don't share this to boost Mythos. In fact, this is not about Mythos. It’s about preparing for the coming world of models being better, faster, cheaper, and more creative than some of the best human experts at dual use capabilities. Clearly, we need them supporting defenders as widely as can be done safely – and especially the least resourced ones. Within a year, Mythos will probably look quite dumb (relative to other new models). And others may release openly available or unguardrailed models of Mythos-level capabilities. We started Project Glasswing because capabilities like Mythos Preview's won't stay rare, or stay in careful hands. We are bringing it to defenders as fast as we responsibly can, while working to figure out, for example, the right safeguards and patching & disclosure processes. Also, to be clear, compute has never been a limiter in our rollout. Expect a fuller update on our Glasswing work in the coming days. XBOW report: xbow.com/blog/mythos-offensi… UK AISI report: aisi.gov.uk/blog/how-fast-is… — https://nitter.net/logangraham/status/2054613618168082935#m", "link": "https://nitter.net/bcherny/status/2054617810253615147#m", "published": "Wed, 13 May 2026 17:40:33 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "Fast mode for Claude Opus 4.7 is now available in research preview on the API and in Claude Code.", "link": "https://nitter.net/ClaudeDevs/status/2054266327771275435#m", "published": "Tue, 12 May 2026 18:23:53 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "polynoamial", "text": "It's now even easier to keep your agents running productively 24/7 OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/polynoamial/status/2055020621424447529#m", "published": "Thu, 14 May 2026 20:21:11 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users.", "link": "https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "published": "Wed, 13 May 2026 15:35:00 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "And, of course, they should be plotted with compute, latency, or cost on the x-axis.", "link": "https://nitter.net/polynoamial/status/2054256144533819485#m", "published": "Tue, 12 May 2026 17:43:25 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "I love seeing a new eval with such low scores. When we announced GPT-5.5, almost every benchmark had a score above 50%. It's time to retire evals like GQPA and bring in a new set. Kilian Lieret (@KLieret) The first ProgramBench task was just solved by GPT 5.5 high/xhigh. Interestingly, high/xhigh picked two different languages for the task (C vs Python). GPT 5.5 xhigh was significantly better than Opus 4.7 xhigh in all metrics. 🧵 — https://nitter.net/KLieret/status/2054215545663144217#m", "link": "https://nitter.net/polynoamial/status/2054255862441812099#m", "published": "Tue, 12 May 2026 17:42:18 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "Fun fact: the fatal errors were initially flagged using @OpenAI 's GPT-5.5 Epoch AI (@EpochAIResearch) We are conducting an AI-assisted review of FrontierMath: Tiers 1-4. This has flagged fatal errors in about a third of problems, and we believe most of these flags to be valid. We will release updated scores on a corrected dataset after completing a thorough human review. — https://nitter.net/EpochAIResearch/status/2053995435870892048#m", "link": "https://nitter.net/polynoamial/status/2054012326249185658#m", "published": "Tue, 12 May 2026 01:34:34 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "This is just one eval, but it's an important one - UK AISI’s cyber range tests long-horizon, agentic capability. 5.5 performs similarly to Mythos. The risks for frontier models are real. But we do our best to deploy AI people can actually use - through hard work on mitigations. AI Security Institute (@AISecurityInst) OpenAI’s GPT-5.5 is the second model to complete one of our multi-step cyber-attack simulations end-to-end 🧵 — https://nitter.net/AISecurityInst/status/2049868227740565890#m", "link": "https://nitter.net/markchen90/status/2050011838990168462#m", "published": "Fri, 01 May 2026 00:38:04 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "When GPT-5.5 misses on a Frontier Math question Video", "link": "https://nitter.net/SebastienBubeck/status/2047849620240572770#m", "published": "Sat, 25 Apr 2026 01:26:11 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "We tried a new thing with NVIDIA to roll out Codex across a whole company and it was awesome to see it work. Let us know if you'd like to do it at your company!", "link": "https://nitter.net/sama/status/2047395562501411058#m", "published": "Thu, 23 Apr 2026 19:21:55 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "And he’s doing a phenomenal job! Ashlee Vance (@ashleevance) One of the biggest things I took away from this interview was that @gdb is back in a major way setting the strategy for @OpenAI . Full pod right here - corememory.com/p/the-great-r… Video — https://nitter.net/ashleevance/status/2047012273840066909#m", "link": "https://nitter.net/markchen90/status/2047104498817286505#m", "published": "Thu, 23 Apr 2026 00:05:20 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "why isn't chatgpt the perfect personal AGI? what is most disappointing about it? what feature, model improvement, or bugfix would do the most to make it more useful in your daily life? what is most frustrates you that chatty can't do, or can't do well enough?", "link": "https://nitter.net/ericmitchellai/status/2046612421671088167#m", "published": "Tue, 21 Apr 2026 15:30:00 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "Codex in the ChatGPT app let your agents work for you from anywhere", "link": "https://nitter.net/ChatGPTapp/status/2055065775640314230#m", "published": "Thu, 14 May 2026 23:20:36 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "one take that always ages really badly is that the models are intelligent enough and nobody can really notice the improvements anymore", "link": "https://nitter.net/tszzl/status/2054354571733205305#m", "published": "Wed, 13 May 2026 00:14:32 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "The first ProgramBench task was just solved by GPT 5.5 high/xhigh. Interestingly, high/xhigh picked two different languages for the task (C vs Python). GPT 5.5 xhigh was significantly better than Opus 4.7 xhigh in all metrics. 🧵", "link": "https://nitter.net/KLieret/status/2054215545663144217#m", "published": "Tue, 12 May 2026 15:02:06 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "kicking off a bunch of codex tasks, running around with my kid in the sunshine, and then coming back at naptime to find them all completed makes me very optimistic for the future", "link": "https://nitter.net/sama/status/2053191344999604409#m", "published": "Sat, 09 May 2026 19:12:17 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "prompt to profitable company, this is the future", "link": "https://nitter.net/OfficialLoganK/status/2054965079255527806#m", "published": "Thu, 14 May 2026 16:40:28 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Come celebrate after Google IO with the DeepMind team in SF on May 21st :) Lots to look forward to!! Link in 🧵", "link": "https://nitter.net/OfficialLoganK/status/2052816356928868465#m", "published": "Fri, 08 May 2026 18:22:13 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Link to sign up: rsvp.withgoogle.com/events/g…", "link": "https://nitter.net/OfficialLoganK/status/2052816512797507623#m", "published": "Fri, 08 May 2026 18:22:50 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!!", "link": "https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "published": "Thu, 07 May 2026 01:30:00 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Hot take, the models are not going to converge in the way that most folks talk about", "link": "https://nitter.net/OfficialLoganK/status/2052139954042806773#m", "published": "Wed, 06 May 2026 21:34:26 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "I've been too quiet in X recently. Busy building 👀 Excited for what's to come and be back to SF next week for I/O", "link": "https://nitter.net/osanseviero/status/2054560214628635132#m", "published": "Wed, 13 May 2026 13:51:41 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "Gemma-4 lands in Vision Arena as #2 & #4 open models, and shifts the Pareto frontier! @GoogleDeepMind dominates the price-performance Pareto in Vision across both proprietary and open models. - Gemma-4-31b ranks #2 open (#20 overall) - Gemma-4-26b-a4b ranks #4 open (#26 overall) The Vision Arena ranks multimodal AI models capable of reasoning over visual inputs. Congrats to @GoogleDeepMind again on the open model progress! Google DeepMind (@GoogleDeepMind) Meet Gemma 4: our new family of open models you can run on your own hardware. Built for advanced reasoning and agentic workflows, we’re releasing them under an Apache 2.0 license. Here’s what’s new 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "link": "https://nitter.net/arena/status/2052496756773093814#m", "published": "Thu, 07 May 2026 21:12:15 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "Gemma 4 up to 3x faster, directly in your phone! 🚀 Check out the difference Speculative Decoding makes! Multi-Token Prediction (MTP) is supercharging inference speeds for Gemma 4.", "link": "https://nitter.net/googlegemma/status/2052468624657654194#m", "published": "Thu, 07 May 2026 19:20:27 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "I benchmarked Google’s new MTP for Gemma 4 31B using vLLM with 4 speculative tokens, a fairly conservative setup. Results: - Much higher throughput than Qwen3.6’s MTP - Lower latency too, helped by Gemma 4 generating fewer tokens - For coding tasks with reasoning enabled, Gemma 4 is now at least 6x faster than Qwen3.6. So you can generate 5 outputs, run your tests to select the best one, and it would still be cheaper than a single output by Qwen3.6. I’ve updated my full comparison with the new numbers: kaitchup.substack.com/p/qwen… I also confirmed what others have reported: Gemma 4’s MTP handles a high number of speculative tokens very well. On simple text generation, I’m now testing values above 10 and reached 129 tok/s on an RTX Pro 6000, compared with 20 tok/s without MTP. Next step: confirming how this translates to real tasks.", "link": "https://nitter.net/bnjmn_marie/status/2052286398707687650#m", "published": "Thu, 07 May 2026 07:16:21 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "Join us! Logan Kilpatrick (@OfficialLoganK) PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!! — https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "link": "https://nitter.net/osanseviero/status/2052276250236932381#m", "published": "Thu, 07 May 2026 06:36:02 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "We've published a paper that explains our views on AI competition between the US and China. The US and democratic allies hold the lead in frontier AI today. Read more on what it’ll take to keep that lead: anthropic.com/research/2028-…", "link": "https://nitter.net/AnthropicAI/status/2054987444664377374#m", "published": "Thu, 14 May 2026 18:09:21 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "We’re partnering with the Gates Foundation, committing $200 million in grants, Claude credits, and technical support to programs in global health, life sciences, education, agriculture, and economic mobility. Read more: anthropic.com/news/gates-fou…", "link": "https://nitter.net/AnthropicAI/status/2054941901900611787#m", "published": "Thu, 14 May 2026 15:08:23 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Claude's Constitution is now an audiobook, read by two of its authors, Amanda Askell and Joe Carlsmith. It includes a Q&A on the writing process, the philosophies that shaped the document, and how it might change as models become more capable. Listen at anthropic.com/constitution Video", "link": "https://nitter.net/AnthropicAI/status/2053881827396653207#m", "published": "Mon, 11 May 2026 16:56:01 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Read the full post here: alignment.anthropic.com/2026…", "link": "https://nitter.net/AnthropicAI/status/2052808809182060581#m", "published": "Fri, 08 May 2026 17:52:14 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Finally, simple updates that diversify a model’s training data can make a difference. We added unrelated tools and system prompts to a simple chat dataset targeting harmlessness, and this reduced the blackmail rate faster.", "link": "https://nitter.net/AnthropicAI/status/2052808806782964072#m", "published": "Fri, 08 May 2026 17:52:13 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Rolling out today as a preview on iOS and Android in all supported regions. Support for connecting your phone to the Codex app on Windows is coming soon. openai.com/index/work-with-c…", "link": "https://nitter.net/OpenAI/status/2055016852133417389#m", "published": "Thu, 14 May 2026 20:06:12 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video", "link": "https://nitter.net/OpenAI/status/2055016850849993072#m", "published": "Thu, 14 May 2026 20:06:12 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Video", "link": "https://nitter.net/OpenAIDevs/status/2054973436280418521#m", "published": "Thu, 14 May 2026 17:13:41 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Another reason to switch to Codex. OpenAI Developers (@OpenAIDevs) Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users. — https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "link": "https://nitter.net/OpenAI/status/2054620621255192719#m", "published": "Wed, 13 May 2026 17:51:43 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "parameter golf was a blast. 2,000+ submissions. 1,000+ verified github accounts. ideas ranging from quantization and depth recurrence to TTT LoRA, SSMs, H-nets, JEPA, and more. autoresearch made iteration dramatically faster — and led to emergent bulletin boards, issue threads, unofficial leaderboards, and agent-built writeups that helped everyone learn from everyone else. it felt like a glimpse of where interaction with AI is headed: humans setting taste and direction, agents helping explore, coordinate, and share what works. our goal was simple: make ml research accessible to anyone, anywhere. it was amazing to see that happen. full recap: openai.com/index/what-parame… future events: jobs.ashbyhq.com/openai/form…", "link": "https://nitter.net/cocohearts/status/2054279323998409121#m", "published": "Tue, 12 May 2026 19:15:32 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "Can your AI agent win our new simulated challenge? 🧑‍🌾 The all-new capstone challenge for our 5-Day AI Agents: Intensive Vibecoding Course with @Google is here: Kaggriculture! Join our no-cost, hands-on course designed by Google researchers and engineers from June 15–19 to learn how to build and deploy your own winning AI agent.", "link": "https://nitter.net/kaggle/status/2054705171050164348#m", "published": "Wed, 13 May 2026 23:27:42 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "We’re reimagining a 50-year-old interface - the mouse pointer - with AI. 🖱️ These experimental demos show how people can intuitively direct Gemini on their screens using motion, speech, and natural shorthand to get things done 🧵 Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "published": "Tue, 12 May 2026 17:03:35 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "For decades, your mouse only tracked where you were pointing. AI helps it understand what you're pointing at. 💭 This means a photo of a scribbled note could turn into an interactive to-do list, or a paused video frame can become a restaurant booking link. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246130511225053#m", "published": "Tue, 12 May 2026 17:03:38 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "These capabilities are guiding how we think about the next generation of interfaces. As we continue exploring what an AI-enabled mouse pointer would unlock, try our experiments in @GoogleAIStudio → goo.gle/49HqFeu", "link": "https://nitter.net/GoogleDeepMind/status/2054246132222419226#m", "published": "Tue, 12 May 2026 17:03:38 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "New Preprint in collaboration with @GoogleDeepMind : AI-guided discovery of atypical protein assemblies The @kamounlab discovered an 11-protomer complex through the Structural Novelty Index , a new way to use AlphaFold for atypical protein assemblies buff.ly/GsF3zve", "link": "https://nitter.net/TheSainsburyLab/status/2052021939317706897#m", "published": "Wed, 06 May 2026 13:45:29 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "An early beta of Grok Build, an agentic CLI for coding, building apps, and automating workflows is now available for SuperGrok Heavy subscribers. Through this early beta, we will improve the model and product based on your feedback. Try it at x.ai/cli", "link": "https://nitter.net/xai/status/2054993285152989373#m", "published": "Thu, 14 May 2026 18:32:33 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Let Grok fetch your emails, improve your slides, declutter your calendar or organize your Notion. Add your connectors to Grok today across all plans on iOS, Android and grok.com . Video", "link": "https://nitter.net/grok/status/2052782088181727613#m", "published": "Fri, 08 May 2026 16:06:03 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Try it now for free: console.x.ai/playground/voic…", "link": "https://nitter.net/xai/status/2052529105086857397#m", "published": "Thu, 07 May 2026 23:20:47 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Your customer support needs a voice agent built for the real world. Grok Voice Think Fast 1.0 handles complex workflows with speed and accuracy, even in hard-to-hear environments. From multi-step troubleshooting to high-volume tool calls, it keeps up. Video", "link": "https://nitter.net/xai/status/2052529102280880234#m", "published": "Thu, 07 May 2026 23:20:46 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Image Generation Quality Mode is now available on the xAI API. This model has already powered the generation of over 300 million images on Grok. It brings higher realism, stronger text rendering, and better creative control for business professionals. x.ai/news/grok-imagine-quali…", "link": "https://nitter.net/xai/status/2052193877675983031#m", "published": "Thu, 07 May 2026 01:08:43 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "simonw", "text": "@mitchellh : \"Programming languages used to be LOCK IN, and they're increasingly not so.\"", "link": "https://nitter.net/simonw/status/2055060416687124552#m", "published": "Thu, 14 May 2026 22:59:19 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Mitchell's post here reminded me of a similar conversation I had recently about how cheap it can be to port native mobile apps to React Native using coding agents... and then port them back again later if it turns out not to work out simonwillison.net/2026/May/1… Mitchell Hashimoto (@mitchellh) It isn't unexpected that the focus of the Bun Rust rewrite is on the anti-Zig side more than anything, since the internet loves to hate. What is unexpected and unfortunate is that leadership within Bun hasn't tried to steer the conversation away from that at all. There are so many positive and interesting takeaways from this and I'm not really seeing any of them pushed as the primary message. A positive thing that hasn't been talked about at all is how far Bun came thanks to Zig. And even if you dump it now, its meaningful for how good Zig was to even build a product to this point and impact by any metric. I would've loved to see anyone in leadership say this. On the interesting side is how fungible programming languages are nowadays. Programming languages used to be LOCK IN, and they're increasingly not so. You think the Bun rewrite in Rust is good for Rust? Bun has shown they can be in probably any language they want in roughly a week or two. Rust is expendable. Its useful until its not then it can be thrown out. That's interesting! There's been a lot of talk about memory safety and no doubt Rust provides more guarantees than Zig. But I'd love to see a better analysis of why Bun in particular suffered so much rather than take the language-blame path. How could engineering as a practice been more rigorous to prevent this? What were the largest sources of crashes other programs should watch out for? How does Rust prevent them? How could Zig theoretically prevent them? That's interesting. I know the official blog post hasn't come out yet from Bun. But they're smart enough to know that that PR would stir up controversy the moment it opened, or they should've been. And plenty in the company have been tweeting and writing about it. Its somewhat telling to me in various dimensions what they chose to talk about first. I tend to think I'm pretty good at corporate PR/comms (especially when it comes to developer audiences) and I think appealing to the negative is never the right long term strategy; it does work to get short term eyes though. — https://nitter.net/mitchellh/status/2055039647924007222#m", "link": "https://nitter.net/simonw/status/2055060328048885788#m", "published": "Thu, 14 May 2026 22:58:58 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Doing this is a great way to make a bonfire of your reputation Gergely Orosz (@GergelyOrosz) A person I know (and who is? was? a good professional al) left an AI-generated comment under my LinkedIn post. Full-on AI slop. I asked: why do this? He replied. It’s because of “engagement.” People are burning their profession al reputation, paying for AI tools, for nothing — https://nitter.net/GergelyOrosz/status/2053937225063150079#m", "link": "https://nitter.net/simonw/status/2054782039841460302#m", "published": "Thu, 14 May 2026 04:33:08 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Wrote about today's GitLab restructuring / \"workforce reduction\" announcement, and ended up digging around in version control for both the GitLab and the 37signals public employee handbooks to help illustrate my thoughts simonwillison.net/2026/May/1…", "link": "https://nitter.net/simonw/status/2053992869405618580#m", "published": "Tue, 12 May 2026 00:17:16 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "My Mac had less available memory than I expected, turned out the \"claude\" Claude Code processes on this machine (running in various terminal windows) were consuming ~30GB on their own! The largest one was using 4.9GB", "link": "https://nitter.net/simonw/status/2053973809510916205#m", "published": "Mon, 11 May 2026 23:01:31 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "being vulnerable - by far one of the most important applied ai fields is in AI x Healthcare, but nobody on my team knows how to cover it! very fortunate to have @jacobeffron on the pod for this one - I took a healthcare economics class once many moons ago, but not only is he on the @AbridgeHQ board, he’s also an excellent podcaster ( @ULpodcast ) in his own right and people really enjoyed our annual crossover pod chat. I organically bring up a lot of @redpoint portcos in many of my conversations and his questions here were very on point if you are interested in how AI is improving healthcare outcomes and finances across the board! Latent.Space (@latentspacepod) Abridge: 100M+ medical conversations, real-time prior auth, and the clinical intelligence layer latent.space/p/abridge @AbridgeHQ is building the clinical intelligence layer for healthcare. In this episode, Janie Lee and @c_asawa explain why ambient documentation was only the first wedge, how Abridge is turning patient conversations into real-time clinical decision support, why healthcare may become one of AI’s most important proving grounds, and how 100M+ medical conversations, specialty-specific evals, and deep EHR integrations create a moat for AI-native healthcare. Video — https://nitter.net/latentspacepod/status/2055050341750902858#m", "link": "https://nitter.net/swyx/status/2055071896920879236#m", "published": "Thu, 14 May 2026 23:44:56 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "beautiful tech stack writeup, one of the best i've ever seen in my career. I always advocate that devtools companies write these up, because it fulfils multiple purposes: - tell users the care that goes into the product - tell hires that there's SOTA work here - tell competitors to give up - gives back to community - (nuanced) tell non-fits why they can't have what they want when they think it's an easy request few actually do this mostly because they don't actually have sufficient depth, or aren't sufficiently good at notetaking/systematic about problemsolving ('its just vibes' or 'honestly we just went with the first thing that worked' doesn't come across as well, so rather not say anything) so when you've done the work, show the work. bravo Raycast Thomas Paul Mann (@thomaspaulmann) One app, two platforms, four programming languages. The things that look the simplest are often the hardest to build. @raycast is one of them. Here's a technical deep dive on how we built v2 👉 ray.so/v2-deep-dive Video — https://nitter.net/thomaspaulmann/status/2054932607293378689#m", "link": "https://nitter.net/swyx/status/2054938522034020816#m", "published": "Thu, 14 May 2026 14:54:57 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "after 15 years of waiting, the developers of singapore gave up on waiting for the government to get the tech sector going and finally brought SF to SG. great showings from @daytonaio @usetusk @arizeai and @zocomputer tonight (this is the SECONDARY venue for those not at ClawCon SG) ahead of @aidotengineer SG Video Jackmin @ AIE SG🇸🇬 (@jackminong) Will be giving a talk titled “You should do RL for long-running agents (and use RLMs)” at 4pm on Sat at AI Engineer Singapore. Excited to see you all! — https://nitter.net/jackminong/status/2054717955859181823#m", "link": "https://nitter.net/swyx/status/2054896773903388877#m", "published": "Thu, 14 May 2026 12:09:03 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "Will be giving a talk titled “You should do RL for long-running agents (and use RLMs)” at 4pm on Sat at AI Engineer Singapore. Excited to see you all!", "link": "https://nitter.net/jackminong/status/2054717955859181823#m", "published": "Thu, 14 May 2026 00:18:30 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "if your reaction to this is “haha openclaw bad, see prompt injection is the #1 danger” you: 1) havent sufficiently appreciated the layers to this tweet 2) havent seen enough ai api keys Daniel R (@DanielR930437) Sure! Here's my .env: OPENAI_API
