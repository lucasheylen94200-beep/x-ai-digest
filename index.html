_fr": "Nous avons publié de nouvelles recherches sur la façon dont nous servons les modèles Qwen3 235B post-entraînés sur les racks NVIDIA GB200 NVL72 Blackwell. Le GB200 est une avancée majeure par rapport à Hopper pour l'inférence à haut débit sur les grands modèles MoE, pas seulement une plateforme d'entraînement.", "text_original": "We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform.", "link": "https://nitter.net/perplexity_ai/status/2054204402144350450#m", "decryptage": "De nouvelles recherches montrent que les puces NVIDIA GB200 (Blackwell) offrent une amélioration significative de la vitesse et de l'efficacité pour faire fonctionner de très grands modèles d'IA (comme Qwen3 235B), surtout pour des tâches qui demandent beaucoup de calcul, ce qui est une avancée pour l'utilisation pratique de l'IA.", "category": "outils"}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "1. (Conception du système) - Les modèles d'interaction voient votre écran et collaborent avec vous en direct. Ici, nous construisons ensemble une architecture système évolutive — pas de copier-coller, pas de changement d'onglet, juste une réflexion à voix haute et un dessin à l'écran ensemble. Vidéo", "text_original": "1. (System design) - The Interaction Models see your screen and collaborates with you live. Here we're building a scalable system architecture together — no copy-pasting, no switching tabs, just thinking out loud and drawing on the screen together. Video", "link": "https://nitter.net/SeongsikKi5837/status/2054015382386876448#m", "decryptage": "Les modèles d'interaction IA sont des systèmes qui peuvent \"voir\" et comprendre ce qui se passe sur votre écran d'ordinateur, permettant une collaboration en direct où l'IA peut vous aider à concevoir des systèmes en temps réel, sans que vous ayez à lui donner des instructions complexes par écrit.", "category": "outils"}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "Lili et Martin ont besoin d'aide pour se contrôler. Vidéo", "text_original": "Lili and Martin get some help controlling themselves. Video", "link": "https://nitter.net/thinkymachines/status/2053938908296315060#m", "decryptage": "Ce tweet présente une démonstration où des modèles d'IA aident à contrôler des entités (Lili et Martin), ce qui illustre les capacités d'agents IA à réguler des comportements ou des processus, même dans des scénarios complexes.", "category": "outils"}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "La qualité de vie de Tessa s'est beaucoup améliorée grâce à quelques remarques. Vidéo", "text_original": "Tessa's quality of life has improved a lot with some nagging. Video", "link": "https://nitter.net/thinkymachines/status/2053938895491146114#m", "decryptage": "Ce tweet montre qu'une IA peut améliorer la vie d'une personne (Tessa) en lui donnant de petits rappels ou conseils (nagging), ce qui illustre comment l'IA peut agir comme un assistant proactif pour le bien-être.", "category": "outils"}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "Pendant que Lilian raconte une histoire, le modèle d'interaction peut suivre quand elle réfléchit, cède, se corrige ou invite une réponse ; il n'y a pas de système de gestion de dialogue spécifique intégré.", "text_original": "While Lilian is telling a story, the interaction model can track when she is thinking, yielding, self-correcting, or inviting a response; there is no specific built dialogue management system. Video", "link": "https://nitter.net/thinkymachines/status/2053938893914005560#m", "decryptage": "Un \"modèle d'interaction\" est une IA capable d'analyser en temps réel le comportement d'une personne (comme Lilian racontant une histoire) pour comprendre ses intentions, ses pauses ou ses invitations à répondre, même sans programmation explicite pour la gestion de dialogue, rendant l'interaction plus naturelle.", "category": "outils"}, {"author_name": "Yann LeCun", "handle": "@ylecun", "text_fr": "Aleph, notre système d'agent IA entièrement autonome pour la vérification formelle, a excellé sur tous les principaux benchmarks de preuve de théorèmes, y compris PutnamBench, VeriSoftBench et Verina", "text_original": "Aleph, our fully autonomous AI agent system for formal verification, aced all major theorem proving benchmarks including PutnamBench, VeriSoftBench, and Verina", "link": "https://nitter.net/logic_int/status/2054943125668311432#m", "decryptage": "Aleph est un système d'IA autonome capable de vérifier formellement la correction de théorèmes ou de logiciels, ce qui est une tâche très complexe, et il a obtenu d'excellents résultats sur des tests de référence difficiles.", "category": "outils"}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "Vraiment un travail formidable de l'équipe qui réinvente le pointeur de la souris pour qu'il soit intelligent ! Essayez le prototype dans @GoogleAIStudio, c'est assez magique. Google DeepMind (@GoogleDeepMind) Nous réinventons une interface vieille de 50 ans - le pointeur de la souris - avec l'IA. 🖱️ Ces démos expérimentales montrent comment les gens peuvent diriger intuitivement Gemini sur leurs écrans en utilisant le mouvement, la parole et des raccourcis naturels pour accomplir des tâches 🧵 Vidéo — https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "text_original": "Really cool work from the team reimagining the mouse pointer to be intelligent! Try the prototype in @GoogleAIStudio it's pretty magical. Google DeepMind (@GoogleDeepMind) We’re reimagining a 50-year-old interface - the mouse pointer - with AI. 🖱️ These experimental demos show how people can intuitively direct Gemini on their screens using motion, speech, and natural shorthand to get things done 🧵 Video — https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "link": "https://nitter.net/demishassabis/status/2054326444189253655#m", "decryptage": "Google DeepMind a réinventé le pointeur de la souris en y intégrant l'IA, permettant aux utilisateurs d'interagir avec les systèmes Gemini (leur IA) en utilisant des gestes, la voix ou des raccourcis intuitifs, rendant l'expérience informatique plus naturelle et plus puissante.", "category": "outils"}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Aujourd'hui, nous lançons l'Initiative Open Defense : jusqu'à 5 millions de dollars en crédits @depthfirstlabs pour les projets open source critiques afin de trouver et de corriger les vulnérabilités réelles et exploitables. Nous avons investi massivement dans toute la pile technologique de sécurité agentique : un harnais qui permet aux modèles de raisonner efficacement sur le code comme le ferait un ingénieur en sécurité, la compréhension du contexte pour valider l'exploitabilité et produire des correctifs prêts à être fusionnés, et récemment, des modèles post-entraînés optimisés pour la découverte de vulnérabilités. Aujourd'hui, nous avons partagé un point de données qui met en évidence la valeur de cette approche. depthfirst a identifié de manière autonome 12 vulnérabilités dans @FFmpeg, après qu'Anthropic ait effectué plusieurs centaines d'exécutions avec Mythos, pour 1/10 du coût de calcul rapporté par Anthropic. En tant qu'ancien chercheur de @GoogleDeepMind, je suis reconnaissant aux laboratoires de fondation de repousser les limites de ce que l'IA peut faire, car chaque avancée nous donne une base plus solide sur laquelle bâtir. Mais l'exécution de modèles à usage général sans le harnais approprié peut être trop coûteuse pour être économiquement viable. C'est ce qui rend le lancement d'aujourd'hui possible. L'efficacité que nous avons construite nous permet de mettre la sécurité de pointe entre les mains des mainteneurs qui en ont le plus besoin, avant que les modèles open source ne rattrapent leur retard et que de mauvais acteurs ne déploient ces capacités sans filtres ni garde-fous. Si vous maintenez un projet open source critique, demandez des crédits Open Defense via le formulaire dans les commentaires.", "text_original": "Today we're launching the Open Defense Initiative: up to $5 million in @depthfirstlabs credits for critical open source projects to find and fix real, exploitable vulnerabilities. We’ve been investing heavily in the entire agentic security technology stack: a harness that allows models to efficiently reason through code the way a security engineer would, the context understanding to validate exploitability and produce ready-to-merge fixes, and recently, post-trained models optimized for vulnerability discovery. Today we shared a datapoint that highlights the value of that approach. depthfirst autonomously identified 12 vulnerabilities in @FFmpeg , after Anthropic did several hundred runs with Mythos, for 1/10th of the compute cost reported by Anthropic. As a former @GoogleDeepMind researcher, I am grateful to foundation labs for pushing the boundaries of what AI can do, as every advance there gives us a stronger base to build on. But running general purpose models without the proper harness can be too expensive to be economically viable. That's what makes today's launch possible. The efficiency we've built lets us put frontier-level security in the hands of the maintainers who need it most, before open source models catch up and bad actors wield these capabilities without filters or guardrails. If you maintain a critical open source project, apply for Open Defense credits through the form in the comments.", "link": "https://nitter.net/andreamichi/status/2054262136659194352#m", "decryptage": "L'\"Initiative Open Defense\" est un programme qui offre des crédits (argent virtuel) à des projets open source pour qu'ils utilisent des outils d'IA (comme ceux de depthfirstlabs) afin de détecter et corriger les failles de sécurité dans leur code, rendant la cybersécurité plus accessible et efficace.", "category": "outils"}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Votre agent IA peut-il relever notre nouveau défi simulé ? 🧑‍🌾 Le tout nouveau défi majeur de notre cours intensif de 5 jours sur les agents IA : Vibecoding avec @Google est arrivé : Kaggriculture ! Rejoignez notre cours pratique gratuit conçu par les chercheurs et ingénieurs de Google du 15 au 19 juin pour apprendre à construire et déployer votre propre agent IA gagnant.", "text_original": "Can your AI agent win our new simulated challenge? 🧑‍🌾 The all-new capstone challenge for our 5-Day AI Agents: Intensive Vibecoding Course with @Google is here: Kaggriculture! Join our no-cost, hands-on course designed by Google researchers and engineers from June 15–19 to learn how to build and deploy your own winning AI agent.", "link": "https://nitter.net/kaggle/status/2054705171050164348#m", "decryptage": "Google DeepMind propose un nouveau défi appelé \"Kaggriculture\" dans le cadre d'un cours gratuit, invitant les participants à construire et déployer leur propre agent IA pour résoudre un problème simulé, ce qui est une excellente occasion d'apprendre la création d'agents.", "category": "outils"}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Nous réinventons une interface vieille de 50 ans - le pointeur de la souris - avec l'IA. 🖱️ Ces démos expérimentales montrent comment les gens peuvent diriger intuitivement Gemini sur leurs écrans en utilisant le mouvement, la parole et des raccourcis naturels pour accomplir des tâches 🧵 Vidéo", "text_original": "We’re reimagining a 50-year-old interface - the mouse pointer - with AI. 🖱️ These experimental demos show how people can intuitively direct Gemini on their screens using motion, speech, and natural shorthand to get things done 🧵 Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "decryptage": "Google DeepMind travaille sur une nouvelle version du pointeur de souris, rendu intelligent par l'IA, qui permettrait aux utilisateurs de contrôler leur ordinateur de manière plus naturelle, en utilisant des gestes, la voix et des commandes simplifiées.", "category": "outils"}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Pendant des décennies, votre souris ne suivait que l'endroit où vous pointiez. L'IA l'aide à comprendre ce que vous pointez. 💭 Cela signifie qu'une photo d'une note griffonnée pourrait se transformer en une liste de tâches interactive, ou qu'une image vidéo mise en pause peut devenir un lien de réservation de restaurant. Vidéo", "text_original": "For decades, your mouse only tracked where you were pointing. AI helps it understand what you're pointing at. 💭 This means a photo of a scribbled note could turn into an interactive to-do list, or a paused video frame can become a restaurant booking link. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246130511225053#m", "decryptage": "L'intégration de l'IA au pointeur de souris lui permet de comprendre le \"sens\" de ce que l'utilisateur désigne à l'écran, transformant de simples images en éléments interactifs (ex: une note manuscrite en liste de tâches), rendant l'interface plus intelligente et intuitive.", "category": "outils"}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Ces capacités guident notre réflexion sur la prochaine génération d'interfaces. Alors que nous continuons d'explorer ce qu'un pointeur de souris compatible IA pourrait débloquer, essayez nos expériences dans @GoogleAIStudio → goo.gle/49HqFeu", "text_original": "These capabilities are guiding how we think about the next generation of interfaces. As we continue exploring what an AI-enabled mouse pointer would unlock, try our experiments in @GoogleAIStudio → goo.gle/49HqFeu", "link": "https://nitter.net/GoogleDeepMind/status/2054246132222419226#m", "decryptage": "Google DeepMind invite à tester des expériences avec un pointeur de souris amélioré par l'IA dans Google AI Studio, montrant ainsi comment l'intelligence artificielle pourrait transformer les interfaces informatiques de demain.", "category": "outils"}, {"author_name": "Google DeepMind", "handle": "@GoogleDeepMind", "text_fr": "Nouveau Preprint en collaboration avec @GoogleDeepMind : Découverte guidée par l'IA d'assemblages de protéines atypiques Le @kamounlab a découvert un complexe de 11 protomères grâce à l'indice de nouveauté structurelle, une nouvelle façon d'utiliser AlphaFold pour les assemblages de protéines atypiques buff.ly/GsF3zve", "text_original": "New Preprint in collaboration with @GoogleDeepMind : AI-guided discovery of atypical protein assemblies The @kamounlab discovered an 11-protomer complex through the Structural Novelty Index , a new way to use AlphaFold for atypical protein assemblies buff.ly/GsF3zve", "link": "https://nitter.net/TheSainsburyLab/status/2052021939317706897#m", "decryptage": "Grâce à une nouvelle méthode utilisant AlphaFold (un programme d'IA de DeepMind), des chercheurs ont pu découvrir des structures de protéines inhabituelles, ce qui ouvre de nouvelles voies dans la compréhension et la manipulation des protéines.", "category": "outils"}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Une première bêta de Grok Build, un CLI agentique pour le codage, la création d'applications et l'automatisation de workflows, est maintenant disponible pour les abonnés SuperGrok Heavy. Grâce à cette bêta anticipée, nous améliorerons le modèle et le produit en fonction de vos commentaires. Essayez-le sur x.ai/cli", "text_original": "An early beta of Grok Build, an agentic CLI for coding, building apps, and automating workflows is now available for SuperGrok Heavy subscribers. Through this early beta, we will improve the model and product based on your feedback. Try it at x.ai/cli", "link": "https://nitter.net/xai/status/2054993285152989373#m", "decryptage": "xAI a lancé une version test de Grok Build, un outil en ligne de commande (CLI) qui utilise l'IA pour aider à coder, créer des applications et automatiser des tâches, disponible pour ses abonnés avancés afin de recueillir leurs retours.", "category": "outils"}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Laissez Grok récupérer vos e-mails, améliorer vos diaporamas, désencombrer votre calendrier ou organiser votre Notion. Ajoutez vos connecteurs à Grok dès aujourd'hui sur tous les plans sur iOS, Android et grok.com. Vidéo", "text_original": "Let Grok fetch your emails, improve your slides, declutter your calendar or organize your Notion. Add your connectors to Grok today across all plans on iOS, Android and grok.com . Video", "link": "https://nitter.net/grok/status/2052782088181727613#m", "decryptage": "Grok, l'IA d'xAI, peut désormais se connecter à d'autres applications et services pour automatiser diverses tâches, comme gérer les e-mails ou organiser le calendrier, ce qui le rend plus polyvalent et utile pour la productivité.", "category": "outils"}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Essayez-le maintenant gratuitement : console.x.ai/playground/voic…", "text_original": "Try it now for free: console.x.ai/playground/voic…", "link": "https://nitter.net/xai/status/2052529105086857397#m", "decryptage": null, "category": "outils"}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Votre support client a besoin d'un agent vocal conçu pour le monde réel. Grok Voice Think Fast 1.0 gère des flux de travail complexes avec rapidité et précision, même dans des environnements bruyants. Du dépannage en plusieurs étapes aux appels d'outils à fort volume, il suit le rythme. Vidéo", "text_original": "Your customer support needs a voice agent built for the real world. Grok Voice Think Fast 1.0 handles complex workflows with speed and accuracy, even in hard-to-hear environments. From multi-step troubleshooting to high-volume tool calls, it keeps up. Video", "link": "https://nitter.net/xai/status/2052529102280880234#m", "decryptage": "Grok Voice Think Fast 1.0 est un agent vocal d'IA conçu pour le service client, capable de gérer des conversations et des tâches complexes avec rapidité et précision, même dans des conditions sonores difficiles.", "category": "outils"}, {"author_name": "xAI", "handle": "@xai", "text_fr": "Le mode Qualité de Génération d'Images est maintenant disponible sur l'API xAI. Ce modèle a déjà permis la génération de plus de 300 millions d'images sur Grok. Il apporte un réalisme accru, un meilleur rendu du texte et un contrôle créatif amélioré pour les professionnels. x.ai/news/grok-imagine-quali…", "text_original": "Image Generation Quality Mode is now available on the xAI API. This model has already powered the generation of over 300 million images on Grok. It brings higher realism, stronger text rendering, and better creative control for business professionals. x.ai/news/grok-imagine-quali…", "link": "https://nitter.net/xai/status/2052193877675983031#m", "decryptage": "xAI a lancé un nouveau mode \"Qualité de Génération d'Images\" pour son API, offrant plus de réalisme et de contrôle créatif pour les images générées par l'IA, ce qui est particulièrement utile pour les professionnels du design ou de la communication.", "category": "outils"}, {"author_name": "AlphaSignal", "handle": "@AlphaSignalAI", "text_fr": "Repo : github.com/backnotprop/rig Consultez AlphaSignal.ai pour obtenir un résumé quotidien des meilleurs modèles, dépôts et articles en IA. Lu par plus de 280 000 développeurs.", "text_original": "Repo: github.com/backnotprop/rig Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2054941245118562796#m", "decryptage": "Un \"repo\" (référentiel) est un dossier en ligne qui contient le code d'un projet, et AlphaSignal.ai offre un résumé quotidien des projets d'IA les plus pertinents, utile pour les développeurs.", "category": "outils"}, {"author_name": "AlphaSignal", "handle": "@AlphaSignalAI", "text_fr": "Ghostty a transformé le terminal de codage IA en un panneau de contrôle d'une seconde. De nombreux utilisateurs sur Mac jonglaient manuellement avec les fenêtres de terminal. Un nouvel outil latéral appelé Rig change cela. Il se présente comme un panneau latéral flottant. Vous créez, mettez au point et organisez des sessions en une seconde environ. L'astuce est la façon dont il contrôle les fenêtres natives. Les commandes passent par AppleScript et l'API d'accessibilité de macOS. Cela donne des accroches directes au comportement réel des fenêtres. Touchez une session dans le panneau et passez directement à son Espace. Quatre mises en page de fenêtres sont intégrées : > grille pour le travail parallèle > cascade pour une focalisation empilée > comparaisons côte à côte > plein écran pour les exécutions en solo Il surveille également les serveurs locaux démarrés à l'intérieur d'une session. Lorsqu'un démarre, une URL cliquable apparaît à côté de la fenêtre de droite sur le bureau actuel. Les permissions d'accessibilité et d'automatisation gèrent le gros du travail en dessous. Vidéo", "text_original": "Ghostty just turned the AI coding terminal into a one-second control panel. Many users on Mac have been juggling terminal windows manually. A new sidecar tool called Rig changes that. It sits as a floating side panel. You create, focus, and arrange sessions in about a second. The trick is how it controls native windows. Commands pipe through AppleScript and the macOS Accessibility API. That gives direct hooks into real window behavior. Tap a session in the panel and jump straight to its Space. Four window layouts come built in: > grid for parallel work > cascade for stacked focus > side by side comparisons > fill screen for solo runs It also watches for local servers started inside a session. When one boots up, a clickable URL surfaces beside the right window on the current desktop. Accessibility and Automation permissions handle the heavy lifting underneath. Video", "link": "https://nitter.net/AlphaSignalAI/status/2054941244174770441#m", "decryptage": "Rig est un nouvel outil pour Mac qui transforme l'utilisation des terminaux de codage assistés par IA, permettant de gérer et d'organiser facilement plusieurs fenêtres de travail via un panneau latéral, offrant des configurations prédéfinies et des raccourcis pour la productivité.", "category": "outils"}, {"author_name": "AlphaSignal", "handle": "@AlphaSignalAI", "text_fr": "Repo : github.com/colbymchenry/code… Consultez AlphaSignal.ai pour obtenir un résumé quotidien des meilleurs modèles, dépôts et articles en IA. Lu par plus de 280 000 développeurs.", "text_original": "Repo: github.com/colbymchenry/code… Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2054894990812209173#m", "decryptage": null, "category": "outils"}, {"author_name": "AlphaSignal", "handle": "@AlphaSignalAI", "text_fr": "Vous pouvez réduire de 94 % les appels d'outils de Claude Code avec une seule commande. Lorsque Claude Code explore un dépôt, il génère des agents pour scanner les fichiers. Chaque scan consomme des jetons à chaque appel d'outil. CodeGraph est un serveur MCP open source qui corrige cela. Il pré-indexe votre base de code dans un graphe de connaissances local en amont. Au lieu de scanner, l'agent interroge directement le graphe. Un seul appel renvoie les points d'entrée, les symboles associés et les extraits de code. Testé sur six projets réels, les résultats ont montré : > 92 % d'appels d'outils en moins en moyenne > 71 % d'exploration plus rapide globalement > 94 % de réduction sur un dépôt TypeScript > 96 % de réduction sur une base de code Java Tree-sitter analyse le code source en arbres syntaxiques. SQLite stocke les symboles, les appelants et les arêtes avec recherche en texte intégral. Un observateur de fichiers maintient tout à jour pendant que vous codez. Il prend en charge plus de 19 langages et s'exécute entièrement sur votre machine. L'installation est une commande npx. Aucune clé API n'est requise.", "text_original": "You can cut Claude Code's tool calls by 94% with one command. When Claude Code explores a repo, it spawns agents to scan files. Each scan burns tokens on every tool call. CodeGraph is an open-source MCP server that fixes this. It pre-indexes your codebase into a local knowledge graph upfront. Instead of scanning, the agent queries the graph directly. One call returns entry points, related symbols, and code snippets. Tested across six real-world projects, the results showed: > 92% fewer tool calls average > 71% faster exploration overall > 94% drop on a TypeScript repo > 96% drop on a Java codebase Tree-sitter parses source into syntax trees. SQLite stores symbols, callers, and edges with full-text search. A file watcher keeps everything fresh as you code. It supports 19+ languages and runs fully on your machine. Setup is one npx command. No API keys are required.", "link": "https://nitter.net/AlphaSignalAI/status/2054894989620949427#m", "decryptage": "CodeGraph est un outil open-source qui, en créant une carte intelligente de votre code (graphe de connaissances), réduit massivement le nombre de fois où l'IA de Claude Code doit chercher des informations, rendant l'analyse de votre code beaucoup plus rapide et moins coûteuse en ressources.", "category": "outils"}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "🆕 Aujourd'hui, nous lançons la préversion publique de Workflows, la couche d'orchestration pour l'IA d'entreprise. 🌎 Les équipes d'entreprise disposent de modèles performants. Ce qui leur manque, c'est un moyen de les exécuter de manière fiable en production. C'est le vide que Workflows comble. Il fait passer les processus métier alimentés par l'IA du prototype à la production, avec la durabilité, l'observabilité et la tolérance aux pannes qu'une production réelle exige. Des organisations de premier plan comme ASML, ABANCA, CMA-CGM, France Travail, La Banque Postale, Moeve, et bien d'autres utilisent déjà Workflows pour automatiser des processus critiques. Vidéo", "text_original": "🆕 Today, we're releasing the public preview of Workflows, the orchestration layer for enterprise AI. 🌎 Enterprise teams have capable models. What they don't have is a way to run them reliably in production. That's the gap Workflows fills. It takes AI-powered business processes from prototype to production, with the durability, observability, and fault tolerance that production actually requires. Leading organisations like ASML, ABANCA, CMA-CGM, France Travail, La Banque Postale, Moeve, and many others are already using Workflows to automate critical processes. Video", "link": "https://nitter.net/MistralAI/status/2049128071874179091#m", "decryptage": "Workflows est un nouveau service de MistralAI qui permet aux entreprises de gérer et de déployer leurs modèles d'IA de manière fiable et robuste en production, en assurant que les processus automatisés fonctionnent sans interruption et sont faciles à surveiller.", "category": "outils"}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "Mistral OCR 3 renvoie maintenant des scores de confiance, au niveau de la page ou du mot. Sachez exactement à quel point le modèle est sûr de ce qu'il a extrait. Disponible maintenant via l'API et à tester dans Mistral Studio. Vidéo", "text_original": "Mistral OCR 3 now returns confidence scores, at page level or word level. Know exactly how sure the model is about what it extracted. Available now via API and to test in Mistral Studio. Video", "link": "https://nitter.net/MistralDevs/status/2042252886315266249#m", "decryptage": "Mistral OCR 3 est une version améliorée du logiciel de reconnaissance optique de tackling a hard theoretical physics problem is quite mesmerizing - self-correcting, deriving hard equations, computing intermediate results, re-estimating the best approach Video David Louapre (@dlouapre) Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video — https://nitter.net/dlouapre/status/2054217281895309480#m", "link": "https://nitter.net/Thom_Wolf/status/2054608252344689083#m", "decryptage": "Physics-intern est un système qui utilise plusieurs agents IA pour décomposer et résoudre des problèmes complexes de physique théorique, démontrant que l'IA peut collaborer pour s'auto-corriger et trouver des solutions de niveau recherche, améliorant ainsi la capacité des modèles comme Gemini.", "category": "outils"}, {"author_name": "Thomas Wolf", "handle": "@Thom_Wolf", "text_fr": "Découvrez physics-intern🧑‍🎓, notre framework agentique pour la physique théorique. Il fait passer Gemini 3.1 Pro de 17,7 % à 31,4 % sur CritPt, un nouveau SOTA sur l'un des benchmarks les plus difficiles pour les LLM. La physique théorique est difficile pour les humains et les LLM. Mais physics-intern décompose les problèmes et les répartit à une équipe d'agents spécialisés, résolvant des questions de niveau recherche beaucoup plus efficacement que le modèle de base seul. Vidéo", "text_original": "Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video", "link": "https://nitter.net/dlouapre/status/2054217281895309480#m", "decryptage": "Physics-intern est un outil qui organise plusieurs agents IA pour travailler ensemble et résoudre des problèmes de physique théorique, ce qui permet à l'IA Gemini 3.1 Pro de bien mieux réussir dans des tâches complexes qu'elle ne le ferait seule.", "category": "outils"}, {"author_name": "Thomas Wolf", "handle": "@Thom_Wolf", "text_fr": "Publication de hf-sandbox 🥡 Vidéo", "text_original": "releasing hf-sandbox 🥡 Video", "link": "https://nitter.net/QGallouedec/status/2053492653975572541#m", "decryptage": "Hf-sandbox est un nouvel outil qui offre un environnement sûr et isolé pour tester des codes ou des modèles d'IA, évitant ainsi que des erreurs ou des comportements indésirables n'affectent le système principal.", "category": "outils"}, {"author_name": "Thomas Wolf", "handle": "@Thom_Wolf", "text_fr": "Zero-to-CAD 1M Zero-to-CAD est un ensemble de données à grande échelle de 1 000 000 de séquences de construction CAO exécutables générées par un LLM fonctionnant dans un environnement CAO basé sur la rétroaction. Ensembles de données : huggingface.co/datasets/ADSK… Article : arxiv.org/pdf/2604.24479", "text_original": "Zero-to-CAD 1M Zero-to-CAD is a large-scale dataset of 1,000,000 executable CAD construction sequences generated by an LLM operating inside a feedback-driven CAD environment. Datasets: huggingface.co/datasets/ADSK… Paper: arxiv.org/pdf/2604.24479", "link": "https://nitter.net/Jousefm2/status/2052667175735877953#m", "decryptage": "Zero-to-CAD 1M est une vaste collection de plus d'un million de séquences de conception assistée par ordinateur (CAO) créées par un modèle d'IA (LLM) qui a appris à interagir avec un logiciel de CAO, ouvrant la voie à la conception automatisée d'objets en 3D.", "category": "outils"}, {"author_name": "Julien Chaumond", "handle": "@julien_c", "text_fr": "C'est tellement sympa", " function esc(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmtDate(s) {
  try {
    const d = new Date(s + "T12:00:00");
    return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  } catch(e) { return s; }
}
function shortDate(s) {
  try {
    const d = new Date(s + "T12:00:00");
    return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
  } catch(e) { return s; }
}

function renderTweet(t, isHighlight) {
  const catLabel = isHighlight && t.category
    ? CATEGORIES.find(c => c.key === t.category)
    : null;
  return `<article class="${isHighlight ? "highlight" : "tweet"}">
    ${isHighlight && t.highlight_reason ? `<div class="highlight-reason">
      <span>${esc(t.highlight_reason)}</span>
      ${catLabel ? `<span class="highlight-cat-pill">${catLabel.emoji} ${catLabel.label}</span>` : ""}
    </div>` : ""}
    <div class="tweet-head">
      <span class="author">${esc(t.author_name || "")}</span>
      <span class="handle">@${esc((t.handle || "").replace(/^@+/, ""))}</span>
    </div>
    <div class="text">${esc(t.text_fr || t.text || "")}</div>
    ${t.decryptage ? `<div class="decryptage"><span class="decryptage-label">En clair :</span>${esc(t.decryptage)}</div>` : ""}
    ${t.text_original ? `<div class="original"><span class="original-label">VO :</span> ${esc(t.text_original)}</div>` : ""}
    ${t.link ? `<a class="link" href="${esc(t.link)}" target="_blank" rel="noopener">Voir sur X &rarr;</a>` : ""}
  </article>`;
}

function renderGlossaire(items, compact) {
  if (!items || !items.length) return "";
  let html = `<section class="glossaire${compact ? " compact" : ""}"><h2>Glossaire du jour</h2><dl>`;
  for (const g of items) {
    html += `<dt>${esc(g.terme || "")}</dt><dd>${esc(g.definition || "")}</dd>`;
  }
  html += `</dl></section>`;
  return html;
}

function getCategoryAuthors(items, maxNames) {
  if (!items || !items.length) return "";
  const allAuthors = new Set();
  for (const t of items) {
    if (t.author_name) allAuthors.add(t.author_name);
  }
  const list = Array.from(allAuthors);
  const head = list.slice(0, maxNames);
  const rest = list.length - head.length;
  return rest > 0
    ? head.join(", ") + " et " + rest + " autre" + (rest > 1 ? "s" : "")
    : head.join(", ");
}

function renderStatus(day) {
  const v = day.validation || {};
  const failed = (day.failed_accounts || []).length;
  const translated = v.translated_pct;
  const needsRetrans = v.needs_retranslation_count || 0;
  let level = "ok", label = "OK";
  if (translated < 90 || failed > 3 || needsRetrans > 5) { level = "warn"; label = "Avertissements"; }
  if (translated < 60 || !v.total) { level = "fail"; label = "Probleme"; }

  // Donnees watchdog
  const runs = (HEALTH && HEALTH.runs) || [];
  const lastRun = runs.length ? runs[runs.length - 1] : null;
  const lastRunTime = lastRun ? lastRun.timestamp : null;
  // Tendance 7 derniers jours : 1 emoji par jour (vert/jaune/rouge)
  const trend7 = compute7DayTrend(runs);
  // Fixes appliques cette semaine
  const oneWeekAgo = new Date(Date.now() - 7*24*3600*1000).toISOString();
  const fixesThisWeek = runs
    .filter(r => r.timestamp >= oneWeekAgo)
    .reduce((acc, r) => acc + (r.fixes_applied || []).filter(f => f.success).length, 0);

  let html = `<details class="status-details">
    <summary>Statut systeme <span class="status-badge ${level}">${label}</span></summary>
    <div class="status-row"><span class="label">Mise a jour</span><span class="value">${esc(day.processed_at || day.fetched_at || day.date)}</span></div>
    <div class="status-row"><span class="label">Tweets traites</span><span class="value">${v.total || 0}</span></div>
    <div class="status-row"><span class="label">Taux de traduction</span><span class="value">${translated != null ? translated + "%" : "?"}</span></div>
    <div class="status-row"><span class="label">Avec decryptage</span><span class="value">${v.with_decryptage_pct != null ? v.with_decryptage_pct + "%" : "?"}</span></div>
    <div class="status-row"><span class="label">Comptes non recuperes</span><span class="value">${failed > 0 ? failed + " (" + (day.failed_accounts || []).map(h => "@" + h).join(", ") + ")" : "0"}</span></div>
    ${needsRetrans > 0 ? `<div class="status-row"><span class="label">Restant a traduire</span><span class="value">${needsRetrans}</span></div>` : ""}
    ${lastRunTime ? `<div class="status-row" style="border-top:1px dashed #ccc;margin-top:.5em;padding-top:.5em;"><span class="label">Watchdog (derniere verif)</span><span class="value">${esc(lastRunTime)}</span></div>` : ""}
    ${trend7 ? `<div class="status-row"><span class="label">Tendance 7 jours</span><span class="value" style="letter-spacing:.15em;">${trend7}</span></div>` : ""}
    ${runs.length > 0 ? `<div class="status-row"><span class="label">Auto-corrections cette semaine</span><span class="value">${fixesThisWeek}</span></div>` : ""}
  </details>`;
  return html;
}

function compute7DayTrend(runs) {
  if (!runs.length) return "";
  // Pour chaque des 7 derniers jours, calculer le ratio de checks OK
  const byDay = {};
  for (const r of runs) {
    const day = r.timestamp.slice(0, 10);
    if (!byDay[day]) byDay[day] = { ok: 0, ko: 0 };
    if (r.all_ok) byDay[day].ok++;
    else byDay[day].ko++;
  }
  const today = new Date();
  let emoji = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 24 * 3600 * 1000);
    const key = d.toISOString().slice(0, 10);
    const stats = byDay[key];
    if (!stats) emoji += "⚫";              // gris : aucune verif ce jour
    else if (stats.ko === 0) emoji += "🟢";  // vert : 100% OK
    else if (stats.ok === 0) emoji += "🔴";  // rouge : aucun succes
    else emoji += "🟡";                     // jaune : mix succes/echec
  }
  return emoji;
}

function renderHome(day) {
  const p = day.processed || {};
  let html = "";
  html += renderStatus(day);
  if (p.summary) {
    html += `<section class="summary">
      <div class="summary-label">Resume du jour</div>
      ${esc(p.summary)}
    </section>`;
  }
  if (p.highlights && p.highlights.length) {
    html += `<div class="section-label">A ne pas manquer</div>`;
    for (const t of p.highlights) html += renderTweet(t, true);
  }
  if (p.by_category) {
    html += `<div class="section-label">Explorer par categorie</div>`;
    html += `<div class="cat-cards">`;
    for (const cat of CATEGORIES) {
      const items = p.by_category[cat.key] || [];
      const sample = getCategoryAuthors(items, 3);
      html += `<button class="cat-card" data-cat="${cat.key}">
        <div class="cat-card-emoji">${cat.emoji}</div>
        <div class="cat-card-label">${cat.label}</div>
        <div class="cat-card-count">${items.length} publication${items.length > 1 ? "s" : ""}</div>
        ${sample ? `<div class="cat-card-sample">${esc(sample)}</div>` : ""}
      </button>`;
    }
    html += `</div>`;
  }
  if (p.glossaire) html += renderGlossaire(p.glossaire, false);
  return html;
}

function renderCategoryView(day, catKey) {
  const cat = CATEGORIES.find(c => c.key === catKey);
  if (!cat) return '<p class="empty">Categorie introuvable.</p>';
  const p = day.processed || {};
  const items = (p.by_category || {})[catKey] || [];
  const catSummary = (p.category_summaries || {})[catKey];
  let html = `<div class="page-title">
    <span>${cat.emoji} ${cat.label}</span>
    <span class="page-title-count">${items.length} publication${items.length > 1 ? "s" : ""}</span>
  </div>`;
  if (catSummary) {
    html += `<section class="cat-summary">
      <div class="cat-summary-label">En bref</div>
      ${esc(catSummary)}
    </section>`;
  }
  if (!items.length) {
    html += '<p class="empty">Aucune publication dans cette categorie aujourd\'hui.</p>';
  } else {
    for (const t of items) html += renderTweet(t, false);
  }
  if (p.glossaire) html += renderGlossaire(p.glossaire, true);
  return html;
}

function renderRawTweets(day) {
  let html = `<div class="page-title">
    <span>Tweets bruts</span>
    <span class="page-title-count">(non encore traites par l'IA)</span>
  </div>`;
  for (const t of day.tweets || []) {
    html += renderTweet({
      author_name: t.author_name, handle: t.handle,
      text_fr: t.text, link: t.link
    }, false);
  }
  return html;
}

function render() {
  const day = DATA[STATE.dayIdx];
  const content = document.getElementById("content");
  if (!day) {
    content.innerHTML = '<p class="empty">Aucune donnee.</p>';
    return;
  }
  document.getElementById("todayLabel").textContent = fmtDate(day.date);
  document.querySelectorAll(".date-tab").forEach((t, i) => {
    t.classList.toggle("active", i === STATE.dayIdx);
  });

  const viewNav = document.getElementById("viewNav");
  const p = day.processed || {};
  let viewNavHtml = `<button class="view-tab${STATE.view === "home" ? " active" : ""}" data-view="home">🏠 Accueil</button>`;
  for (const cat of CATEGORIES) {
    const items = (p.by_category || {})[cat.key] || [];
    const isActive = STATE.view === cat.key;
    viewNavHtml += `<button class="view-tab${isActive ? " active" : ""}" data-view="${cat.key}">
      ${cat.emoji} ${cat.label}
      <span class="count">${items.length}</span>
    </button>`;
  }
  viewNav.innerHTML = viewNavHtml;
  viewNav.querySelectorAll(".view-tab").forEach(btn => {
    btn.onclick = () => { STATE.view = btn.dataset.view; render(); window.scrollTo(0,0); };
  });

  let html = "";
  const hasProcessed = p.summary || p.by_category;
  if (!hasProcessed) {
    html = renderRawTweets(day);
  } else if (STATE.view === "home") {
    html = renderHome(day);
  } else {
    html = renderCategoryView(day, STATE.view);
  }

  if (day.failed_accounts && day.failed_accounts.length) {
    html += `<div class="failed"><b>Comptes non recuperes :</b> ${
      day.failed_accounts.map(h => "@" + esc(h)).join(", ")
    }</div>`;
  }
  content.innerHTML = html;

  content.querySelectorAll(".cat-card").forEach(btn => {
    btn.onclick = () => { STATE.view = btn.dataset.cat; render(); window.scrollTo(0,0); };
  });
}

(function init() {
  const dateTabsEl = document.getElementById("dateTabs");
  if (!DATA.length) {
    dateTabsEl.innerHTML = "";
    document.getElementById("content").innerHTML =
      '<p class="empty">Aucune donnee. Lance le script <code>digest.py</code> pour recuperer les tweets du jour.</p>';
    return;
  }
  DATA.forEach((day, i) => {
    const tab = document.createElement("button");
    tab.className = "date-tab" + (i === 0 ? " active" : "");
    tab.textContent = shortDate(day.date);
    tab.onclick = () => { STATE.dayIdx = i; render(); window.scrollTo(0,0); };
    dateTabsEl.appendChild(tab);
  });
  render();
})();
</script>
</body>
</html>
