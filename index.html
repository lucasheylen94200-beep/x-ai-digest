<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily AI Digest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 920px;
    margin: 0 auto;
    padding: 1.5em 1em 4em;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.5;
  }
  header { margin-bottom: .6em; }
  h1 { font-size: 1.9em; margin: 0 0 .15em; }
  .subtitle { color: #6e6e73; font-size: .95em; }

  /* Date tabs */
  .date-tabs {
    display: flex; gap: .35em;
    overflow-x: auto;
    padding: .5em 0;
    scrollbar-width: thin;
  }
  .date-tab {
    padding: .45em .9em;
    background: white;
    border: 1px solid #d2d2d7;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    font-size: .82em;
    color: #1d1d1f;
    font-family: inherit;
    transition: all .15s;
  }
  .date-tab:hover { background: #fafafa; }
  .date-tab.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }

  /* View nav (Accueil / Actu / Tips / Idees / Outils) */
  .view-nav {
    display: flex; gap: .4em;
    overflow-x: auto;
    padding: 1em 0;
    margin-bottom: 1.2em;
    border-top: 1px solid #e0e0e5;
    border-bottom: 1px solid #e0e0e5;
    margin-top: .5em;
    scrollbar-width: thin;
  }
  .view-tab {
    padding: .6em 1em;
    background: white;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    font-size: .92em;
    color: #1d1d1f;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: .4em;
    transition: all .15s;
  }
  .view-tab:hover { background: #f5f5f7; }
  .view-tab.active {
    background: #0071e3;
    color: white;
    border-color: #0071e3;
  }
  .view-tab .count {
    background: rgba(0,0,0,0.08);
    border-radius: 999px;
    padding: 0 .55em;
    font-size: .78em;
    font-weight: 600;
  }
  .view-tab.active .count {
    background: rgba(255,255,255,0.25);
  }

  /* Summary card */
  .summary {
    background: linear-gradient(135deg, #fff8e1, #fff3c4);
    padding: 1.1em 1.2em;
    border-radius: 14px;
    margin-bottom: 1.5em;
    border-left: 4px solid #f4b400;
    font-size: 1em;
  }
  .summary-label {
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: .72em;
    color: #9a7700;
    font-weight: 700;
    margin-bottom: .3em;
  }

  /* Per-category summary (au-dessus de chaque sous-page) */
  .cat-summary {
    background: white;
    border: 1px solid #e0e0e5;
    border-left: 4px solid #0071e3;
    padding: 1em 1.2em;
    border-radius: 12px;
    margin-bottom: 1.5em;
  }
  .cat-summary-label {
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: .72em;
    color: #0071e3;
    font-weight: 700;
    margin-bottom: .3em;
  }

  /* Statut systeme */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: .35em;
    padding: .35em .8em;
    border-radius: 999px;
    font-size: .82em;
    font-weight: 600;
    margin-left: .5em;
    vertical-align: middle;
  }
  .status-badge.ok    { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  .status-badge.warn  { background: #fff3e0; color: #b25400; border: 1px solid #ffcc80; }
  .status-badge.fail  { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
  .status-details {
    background: white;
    border: 1px solid #e0e0e5;
    border-radius: 12px;
    padding: .9em 1.1em;
    margin-bottom: 1.5em;
    font-size: .88em;
  }
  .status-details summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
  }
  .status-details summary::before {
    content: "\25B8";
    display: inline-block;
    margin-right: .35em;
    transition: transform .15s;
  }
  .status-details[open] summary::before { transform: rotate(90deg); }
  .status-row { display: flex; justify-content: space-between; padding: .25em 0; gap: 1em; }
  .status-row .label { color: #6e6e73; }
  .status-row .value { font-weight: 600; }

  /* Section labels */
  .section-label {
    font-size: 1.15em;
    font-weight: 700;
    margin: 1.8em 0 .9em;
    display: flex;
    align-items: center;
    gap: .4em;
  }

  /* Highlights */
  .highlight {
    background: linear-gradient(135deg, #fff5f5, #fff0e8);
    border-left: 4px solid #ff6b35;
    border-radius: 12px;
    padding: .9em 1.1em;
    margin-bottom: .7em;
  }
  .highlight-reason {
    display: flex; align-items: center; gap: .4em; flex-wrap: wrap;
    font-size: .78em; color: #cc4400; font-weight: 700;
    margin-bottom: .5em;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .highlight-reason::before { content: "\2605"; font-size: 1.15em; }
  .highlight-cat-pill {
    display: inline-block;
    background: rgba(204,68,0,0.12);
    color: #cc4400;
    padding: .15em .55em;
    border-radius: 999px;
    font-size: .9em;
    font-weight: 700;
    margin-left: auto;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Category cards on home */
  .cat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: .8em;
    margin: .5em 0 2em;
  }
  .cat-card {
    background: white;
    border: 1px solid #e0e0e5;
    border-radius: 12px;
    padding: 1.1em 1.1em 1em;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
    font-family: inherit;
    font-size: 1em;
    width: 100%;
  }
  .cat-card:hover {
    border-color: #0071e3;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0,113,227,0.08);
  }
  .cat-card-emoji { font-size: 1.8em; line-height: 1; }
  .cat-card-label { font-weight: 700; margin: .35em 0 .1em; font-size: 1.05em; }
  .cat-card-count { color: #0071e3; font-size: .85em; font-weight: 600; }
  .cat-card-sample { color: #6e6e73; font-size: .78em; margin-top: .4em; line-height: 1.35; }

  /* Page title for category views */
  .page-title {
    display: flex; align-items: baseline; gap: .5em; flex-wrap: wrap;
    margin: 0 0 1.2em;
    font-size: 1.4em;
    font-weight: 700;
  }
  .page-title-count {
    color: #6e6e73;
    font-size: .68em;
    font-weight: normal;
  }

  /* Tweet card */
  .tweet {
    background: white;
    border-radius: 14px;
    padding: 1em 1.1em;
    margin-bottom: .8em;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .tweet-head {
    display: flex; align-items: baseline; gap: .5em; flex-wrap: wrap;
    margin-bottom: .4em;
  }
  .author { font-weight: 600; }
  .handle { color: #6e6e73; font-size: .82em; }
  .text { margin: .2em 0 .5em; }
  .original {
    font-size: .82em; color: #6e6e73; font-style: italic;
    margin: .5em 0 0; padding-left: .7em;
    border-left: 2px solid #d2d2d7;
  }
  .original-label {
    font-style: normal; font-weight: 600; color: #888;
    text-transform: uppercase; font-size: .72em; letter-spacing: .04em;
  }
  .decryptage {
    background: #eef6ff;
    border-left: 3px solid #0071e3;
    padding: .55em .8em;
    border-radius: 6px;
    margin-top: .6em;
    font-size: .9em;
    color: #1d3a5c;
  }
  .decryptage-label {
    font-weight: 700;
    color: #0071e3;
    margin-right: .35em;
    font-size: .85em;
  }
  .link {
    display: inline-block; margin-top: .4em;
    color: #0071e3; text-decoration: none; font-size: .82em;
  }
  .link:hover { text-decoration: underline; }

  /* Glossaire */
  .glossaire {
    background: #f0f4ff;
    border-radius: 14px;
    padding: 1.2em 1.4em;
    margin-top: 2em;
    border: 1px solid #d0dcf0;
  }
  .glossaire h2 {
    font-size: 1.05em;
    margin: 0 0 .7em;
    color: #1d3a5c;
  }
  .glossaire dl { margin: 0; }
  .glossaire dt {
    font-weight: 700;
    color: #0050b3;
    margin-top: .7em;
    font-size: .95em;
  }
  .glossaire dt:first-child { margin-top: 0; }
  .glossaire dd {
    margin: .15em 0 0 0;
    color: #1d1d1f;
    font-size: .9em;
  }
  .glossaire.compact { padding: 1em 1.2em; margin-top: 2.5em; }
  .glossaire.compact h2 { font-size: 1em; }

  /* Misc */
  .empty {
    color: #6e6e73; font-style: italic; padding: 1em 0;
  }
  .failed {
    background: #fff5f5; border-left: 4px solid #d62b2b;
    padding: .8em 1em; border-radius: 10px;
    color: #7a1a1a; font-size: .85em; margin-top: 2em;
  }
</style>
</head>

<script>
const DATA = [{"date": "2026-05-16", "fetched_at": "2026-05-16T16:11:49", "tweets": [{"handle": "karpathy", "text": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/trq212/status/2052809885763747935#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "published": "Mon, 11 May 2026 16:20:21 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "This is the the quote I've been citing a lot recently. kache (@yacineMTB) you can outsource your thinking but you cannot outsource your understanding — https://nitter.net/yacineMTB/status/2018886083120153046#m", "link": "https://nitter.net/karpathy/status/2049907410303865030#m", "published": "Thu, 30 Apr 2026 17:43:06 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "Fireside chat at Sequoia Ascent 2026 from a ~week ago. Some highlights: The first theme I tried to push on is that LLMs are about a lot more than just speeding up what existed before (e.g. coding). Three examples of new horizons: 1. menugen: an app that can be fully engulfed by LLMs, with no classical code needed: input an image, output an image and an LLM can natively do the thing. 2. install .md skills instead of install .sh scripts. Why create a complex Software 1.0 bash script for e.g. installing a piece of software if you can write the installation out in words and say \"just show this to your LLM\". The LLM is an advanced interpreter of English and can intelligently target installation to your setup, debug everything inline, etc. 3. LLM knowledge bases as an example of something that was *impossible* with classical code because it's computation over unstructured data (knowledge) from arbitrary sources and in arbitrary formats, including simply text articles etc. I pushed on these because in every new paradigm change, the obvious things are always in the realm of speeding up or somehow improving what existed, but here we have examples of functionality that either suddenly perhaps shouldn't even exist (1,2), or was fundamentally not possible before (3). The second (ongoing) theme is trying to explain the pattern of jaggedness in LLMs. How it can be true that a single artifact will simultaneously 1) coherently refactor a 100,000-line code base *and* 2) tell you to walk to the car wash to wash your car. I previously wrote about the source of this as having to do with verifiability of a domain, here I expand on this as having to also do with economics because revenue/TAM dictates what the frontier labs choose to package into training data distributions during RL. You're either in the data distribution (on the rails of the RL circuits) and flying or you're off-roading in the jungle with a machete, in relative terms. Still not 100% satisfied with this, but it's an ongoing struggle to build an accurate model of LLM capabilities if you wish to practically take advantage of their power while avoiding their pitfalls, which brings me to... Last theme is the agent-native economy. The decomposition of products and services into sensors, actuators and logic (split up across all of 1.0/2.0/3.0 computing paradigms), how we can make information maximally legible to LLMs, some words on the quickly emerging agentic engineering and its skill set, related hiring practices, etc., possibly even hints/dreams of fully neural computing handling the vast majority of computation with some help from (classical) CPU coprocessors. Stephanie Zhan (@stephzhan) @karpathy and I are back! At @sequoia AI Ascent 2026. And a lot has changed. Last year, he coined “vibe coding”. This year, he’s never felt more behind as a programmer. The big shift: vibe coding raised the floor. Agentic engineering raises the ceiling. We talk about what it means to build seriously in the agent era. Not just moving faster. Building new things, with new tools, while preserving the parts that still require human taste, judgment, and understanding. Video — https://nitter.net/stephzhan/status/2049518659513852109#m", "link": "https://nitter.net/karpathy/status/2049903821095354523#m", "published": "Thu, 30 Apr 2026 17:28:50 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "New work with @AlecRad and @DavidDuvenaud : Have you ever dreamed of talking to someone from the past? Introducing talkie, a 13B model trained only on pre-1931 text. Vintage models should help us to understand how LMs generalize (e.g., can we teach talkie to code?). Thread: Video", "link": "https://nitter.net/status_effects/status/2048878495539843211#m", "published": "Mon, 27 Apr 2026 21:34:34 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "karpathy", "text": "Imagine every pixel on your screen, streamed live directly from a model. No HTML, no layout engine, no code. Just exactly what you want to see. @eddiejiao_obj , @drewocarr and I built a prototype to see how this could actually work, and set out to make it real. We're calling it Flipbook. (1/5) Video", "link": "https://nitter.net/zan2434/status/2046982383430496444#m", "published": "Wed, 22 Apr 2026 16:00:05 GMT", "author_name": "Andrej Karpathy", "category_hint": "researcher", "source_lang": "en"}, {"handle": "sama", "text": "i appreciate how seriously the team always takes these reports (even when the answer turns out to be 'i got used to the current level of magic and now i'd like more please') Tibo (@thsottiaux) Codex team is aware of reports of GPT-5.5 performing worse for some users and investigating. We don't have anything conclusive yet and systems are healthy but we will share updates as we go. — https://nitter.net/thsottiaux/status/2055316274394300829#m", "link": "https://nitter.net/sama/status/2055356452286640630#m", "published": "Fri, 15 May 2026 18:35:39 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "A preview for Pro users: a new personal finance experience in ChatGPT. Pro users in the U.S. can securely connect financial accounts, see where their money is going, and ask questions based on the information they choose to connect. Your full financial picture, now in ChatGPT. Video", "link": "https://nitter.net/ChatGPTapp/status/2055317612687675545#m", "published": "Fri, 15 May 2026 16:01:19 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "also all this: OpenAI Developers (@OpenAIDevs) Codex is getting easier to automate and customize around your code. 🪝 Hooks customize the Codex loop with scripts that run at key points in a task: • Run validators before or after work • Scan prompts for secrets • Log conversations to internal systems • Create memories or customize behavior by repo or directory ⚙️ Programmatic access tokens provide scoped credentials for Business and Enterprise teams: • Create tokens from ChatGPT workspace settings • Use them in CI, release workflows, and internal automations • Set expirations or revoke access when needed • Keep usage tied back to the workspace Video — https://nitter.net/OpenAIDevs/status/2055032115964870838#m", "link": "https://nitter.net/sama/status/2055034714231345475#m", "published": "Thu, 14 May 2026 21:17:11 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "Codex in the ChatGPT mobile app!", "link": "https://nitter.net/sama/status/2055034461591588916#m", "published": "Thu, 14 May 2026 21:16:10 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sama", "text": "being a dad is the thing that has most exceeded already-high-expectations in my whole life", "link": "https://nitter.net/sama/status/2054773491522822264#m", "published": "Thu, 14 May 2026 03:59:10 GMT", "author_name": "Sam Altman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Cyber is the first clear and present danger from frontier AI models, but it won’t be the last. If we are able to collectively rise to the challenge and confront this risk, it could serve as a blueprint for addressing the even more difficult challenges that lie ahead of us.", "link": "https://nitter.net/DarioAmodei/status/2041580343472337145#m", "published": "Tue, 07 Apr 2026 18:14:19 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "The dangers of getting this wrong are obvious, but if we get it right, there is a real opportunity to create a fundamentally more secure internet and world than we had before the advent of AI-powered cyber capabilities.", "link": "https://nitter.net/DarioAmodei/status/2041580341794615631#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Glasswing is just the first step: patching and securing the world’s software infrastructure will be the work of months and years, and will require even broader cooperation across AI companies, cyberdefenders, software providers, governments, and more.", "link": "https://nitter.net/DarioAmodei/status/2041580340032995821#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "Rather than release Mythos Preview to general availability, we’re giving defenders early controlled access in order to find and patch vulnerabilities before Mythos-class models proliferate across the ecosystem.", "link": "https://nitter.net/DarioAmodei/status/2041580338426585171#m", "published": "Tue, 07 Apr 2026 18:14:18 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "DarioAmodei", "text": "We’ve been tracking the increasing cyber capabilities of AI models for years, which arise as part of their general proficiency at coding. But our new model, Mythos Preview, represents a particularly large step up.", "link": "https://nitter.net/DarioAmodei/status/2041580336828568000#m", "published": "Tue, 07 Apr 2026 18:14:17 GMT", "author_name": "Dario Amodei", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "codex for improving computational complexity Kappaemme (@Kappaemme1926) CODEX SKILL THAT FINDS COMPLEXITY HOTSPOTS IN YOUR CODEBASE! I made a Codex skill that analyzes your codebase and reports where performance can be improved safely. Scan your project while Codex checks loops, repeated lookups, render-heavy code, N+1 patterns, and places where complexity can potentially be reduced without breaking behavior. -> codebase complexity analysis -> O(n²), O(n*m), repeated scan detection -> before/after complexity estimates -> safe optimization suggestions -> risk level + tests needed -> report-only mode by default -> one-command install Install: npx --yes codex-complexity-optimizer 100% open source. Repo in Bio. Video — https://nitter.net/Kappaemme1926/status/2055343704467206506#m", "link": "https://nitter.net/gdb/status/2055646916499714488#m", "published": "Sat, 16 May 2026 13:49:51 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "run codex on every commit Peter Steinberger 🦞 (@steipete) People freaking out over my AI spend. What nobody sees: Part of what excites me so much about working on OpenClaw is that I'm trying to answer the question: How would we build software in the future if tokens don't matter? We constant run ~100 codex in the cloud, reviewing every PR, every issue. If a fix on main lands, @clawsweeper will eventually find that 6 month old issue and close it with an exact reference. We run codex on every commit to review for security issues (as it's far too easy to miss). We run codex to de-duplicate issues and find clusters and send reports for the most pressing issues. We have agents that can recreate complex setups, spin up ephemeral crabbox.sh machines, log into e.g. Telegram, make a video and post before/after fix on the PR. There's codex that watch new issues and - if it fits our documented vision well, automatically create a PR of it. (that then another codex reviews) We have codex running that scans comments for spam and blocks people. We have codex instances running that verify performance benchmarks and report regressions into Discord. We have agents that listen on our meetings and proactively start work, e.g. create PRs when we discuss new features while we discuss them. We build clawpatch.ai to split all our projects into functional units to review and find bugs and regresssions. We do the same split for security with Vercel's deepsec and Codex Security to find regressions and vulnerabilities. All that automation allows us to run this project extremely lean. — https://nitter.net/steipete/status/2055405041843052792#m", "link": "https://nitter.net/gdb/status/2055436684666274020#m", "published": "Fri, 15 May 2026 23:54:28 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "Understand and manage your personal finances in ChatGPT. A further step towards ChatGPT becoming your personal agent, operating on your behalf 24/7, for helping you at home and work. ChatGPT (@ChatGPTapp) A preview for Pro users: a new personal finance experience in ChatGPT. Pro users in the U.S. can securely connect financial accounts, see where their money is going, and ask questions based on the information they choose to connect. Your full financial picture, now in ChatGPT. Video — https://nitter.net/ChatGPTapp/status/2055317612687675545#m", "link": "https://nitter.net/gdb/status/2055335361921130861#m", "published": "Fri, 15 May 2026 17:11:51 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "codex for finding local businesses who may need help building a website: Kappaemme (@Kappaemme1926) CODEX SKILL THAT TURNS LOCAL SEARCH INTO CLIENT LEADS! I made a Codex skill that helps find local businesses that may need a website. Search nearby shops, gyms, restaurants, salons, and local activities while Codex checks who has a real website and who only has socials. -> local business prospecting -> website vs social-only checks -> lead scoring -> phone/contact fields -> chat or CSV-style output -> one-command install Install: npx --yes local-client-prospector-skill 100% open source. Repo in Bio. Video — https://nitter.net/Kappaemme1926/status/2054981327414231173#m", "link": "https://nitter.net/gdb/status/2055285857628676399#m", "published": "Fri, 15 May 2026 13:55:08 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "gdb", "text": "You can now use Codex, wherever you have it running, from the ChatGPT app. Huge step forward for universal usage of agents. OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/gdb/status/2055034165968384099#m", "published": "Thu, 14 May 2026 21:15:00 GMT", "author_name": "Greg Brockman", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Gemini Intelligence features will roll out in waves starting with the latest Samsung Galaxy and Google Pixel phones this summer, and across Android devices including your watch, car, glasses & laptops later this year! blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2054255861158338713#m", "published": "Tue, 12 May 2026 17:42:18 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "published": "Tue, 12 May 2026 17:42:17 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! Sameer Samat (@ssamat) Big news: Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! This cross-industry effort replaces outdated SMS with a more secure & private way to chat, no matter what phone you have.🔒 Thank you to the community for continuing to push for these kinds of features. Your engagement really helps make a difference. Congratulations to the team for reaching this amazing milestone! 🚀 Read more: blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "link": "https://nitter.net/sundarpichai/status/2053900771947942085#m", "published": "Mon, 11 May 2026 18:11:18 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "blog.google/products-and-pla…", "link": "https://nitter.net/sundarpichai/status/2052411066840416742#m", "published": "Thu, 07 May 2026 15:31:44 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "sundarpichai", "text": "Look what crossed my desk @StephenCurry30 !", "link": "https://nitter.net/sundarpichai/status/2052411065204715928#m", "published": "Thu, 07 May 2026 15:31:44 GMT", "author_name": "Sundar Pichai", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Most enterprise data lives inside Snowflake. With Computer connecting to Snowflake, you get to set up a fleet of on-call data scientist agents. Perplexity (@perplexity_ai) Computer now connects to Snowflake. Run end-to-end work against live warehouse data and get answers with SQL, source tables, filters, and metrics. It’s like a personal data science team, on call with accurate answers from live company data. Video — https://nitter.net/perplexity_ai/status/2054945872451129506#m", "link": "https://nitter.net/AravSrinivas/status/2054947269670248883#m", "published": "Thu, 14 May 2026 15:29:42 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Perplexity is building one of the most secure scalable agent runtime sandboxes in the market right now. A blog post on how we: 1. Handle proxy API keys for agents securely 2. Run safety detection for all content accessed by agents 3. Encrypt data passed via connectors to agents 4. Decouple storage and compute reliably Perplexity (@perplexity_ai) Computer is secure by default. Every task runs in its own hardware-isolated sandbox with VPC-level storage and compute separation. Agents are authenticated with short-lived proxy tokens instead of raw API keys. — https://nitter.net/perplexity_ai/status/2054608966148374715#m", "link": "https://nitter.net/AravSrinivas/status/2054619058650411174#m", "published": "Wed, 13 May 2026 17:45:31 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "Perplexity is quietly becoming the knowledge and research platform for the enterprise Perplexity (@perplexity_ai) PayPal runs 74,000 weekly tasks in Perplexity Enterprise. Teams use it for model validation, channel performance, market trend research, competitive intelligence, and product analysis. Read the customer story: perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "link": "https://nitter.net/AravSrinivas/status/2054581332232302701#m", "published": "Wed, 13 May 2026 15:15:36 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "GB 200s change how one does the prefill and decode disaggregation when serving large MoEs like Qwen. We’ve published details of our stack quantifying the throughput benefits compared to serving on Hoppers. Perplexity (@perplexity_ai) We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform. — https://nitter.net/perplexity_ai/status/2054204402144350450#m", "link": "https://nitter.net/AravSrinivas/status/2054206802133504234#m", "published": "Tue, 12 May 2026 14:27:21 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "AravSrinivas", "text": "We published new research on how we serve post-trained Qwen3 235B models on NVIDIA GB200 NVL72 Blackwell racks. GB200 is a major step up over Hopper for high-throughput inference on large MoE models, not just a training platform.", "link": "https://nitter.net/perplexity_ai/status/2054204402144350450#m", "published": "Tue, 12 May 2026 14:17:49 GMT", "author_name": "Aravind Srinivas", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "1. (System design) - The Interaction Models see your screen and collaborates with you live. Here we're building a scalable system architecture together — no copy-pasting, no switching tabs, just thinking out loud and drawing on the screen together. Video", "link": "https://nitter.net/SeongsikKi5837/status/2054015382386876448#m", "published": "Tue, 12 May 2026 01:46:43 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Cluster magicians and GPU whisperers, come join us! We’re looking for supercomputing engineers to build the infrastructure behind real-time interactive models, Tinker, and large-scale training: scheduling, storage, networking, reliability, and distributed systems at scale. Hiring in NYC and SF job-boards.greenhouse.io/thi…", "link": "https://nitter.net/soumithchintala/status/2054248270780604876#m", "published": "Tue, 12 May 2026 17:12:08 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Lili and Martin get some help controlling themselves. Video", "link": "https://nitter.net/thinkymachines/status/2053938908296315060#m", "published": "Mon, 11 May 2026 20:42:50 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "Tessa's quality of life has improved a lot with some nagging. Video", "link": "https://nitter.net/thinkymachines/status/2053938895491146114#m", "published": "Mon, 11 May 2026 20:42:47 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "miramurati", "text": "While Lilian is telling a story, the interaction model can track when she is thinking, yielding, self-correcting, or inviting a response; there is no specific built dialogue management system. Video", "link": "https://nitter.net/thinkymachines/status/2053938893914005560#m", "published": "Mon, 11 May 2026 20:42:47 GMT", "author_name": "Mira Murati", "category_hint": "ceo", "source_lang": "en"}, {"handle": "ylecun", "text": "Yann LeCun says LLMs are strongest in domains where language itself is the substrate of reasoning, like math and code They can solve problems, prove theorems, and write programs — but they are not creative mathematicians, software architects, or computer scientists \"their role is to help humans build\" Video", "link": "https://nitter.net/haider1/status/2055322313843687523#m", "published": "Fri, 15 May 2026 16:20:00 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "piped.video/watch?v=ngBraLDq…", "link": "https://nitter.net/ylecun/status/2055347240923767084#m", "published": "Fri, 15 May 2026 17:59:03 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "Fun interview with Jacob Effron on the Unsupervised Learning podcast. Jacob Effron (@jacobeffron) It’s hard to imagine more of a dream Unsupervised Learning guest than @ylecun . Yann is one of the godfathers of AI, and he has some fascinating contrarian views on the limitations of LLMs. It was incredible to get to have a wide-ranging discussion with Yann about these views, reflections on his time at Meta and departure and what’s next for him. We hit on: ▪️ LLM limitations and a path forward for robotics ▪️ Why he left Meta ▪️ How he came to so dramatically disagree with his Turing co-laureates Geoff Hinton and Yoshua Bengio on LLMs ▪️ His predictions for 2027 ▪️ His new company AMI and the bet on world models ▪️ Why he compares OpenAI and Anthropic to Sun Microsystems ▪️ Why he tells PhD students to stop working on LLMs Plus some sharp views on the current safety discourse, how breakthrough research actually happens and what FAIR got right and wrong. YouTube: piped.video/ngBraLDqzdI Spotify: bit.ly/4dL8fvT Apple: bit.ly/4wxgpiX Video — https://nitter.net/jacobeffron/status/2055279354821607551#m", "link": "https://nitter.net/ylecun/status/2055346714039464373#m", "published": "Fri, 15 May 2026 17:56:57 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "The Art of the Steal: 1. IRS catches Trump cheating on his taxes. 2. Trump sues IRS for catching him cheating on his taxes. 3. DOJ helps Trump get $10 billion from the IRS because they caught him cheating on his taxes. 4. Americans who don't cheat on taxes will foot the bill. The New York Times (@nytimes) Breaking News: The Justice Department is said to be considering settling a lawsuit President Trump filed against the IRS over the release of his tax returns. nyti.ms/4wl9069 — https://nitter.net/nytimes/status/2054373596819083523#m", "link": "https://nitter.net/AwesomeNewsom/status/2054983625968369792#m", "published": "Thu, 14 May 2026 17:54:10 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "ylecun", "text": "There is a case to be made that the future of Mathematics is very bright. In my mind, proofs have always been a tool to achieve a goal. The goal was and still is to understand, and reading/writing proofs (or just know that they exist) will remain part of it.", "link": "https://nitter.net/Andrea__M/status/2055117516683501839#m", "published": "Fri, 15 May 2026 02:46:12 GMT", "author_name": "Yann LeCun", "category_hint": "researcher", "source_lang": "en"}, {"handle": "demishassabis", "text": "Very excited to share a new milestone in AI for Math: Aletheia, powered by Gemini Deep Think, was just used to autonomously solve a Kirby problem! “Kirby’s list” is a “compendium of the most important unsolved problems in topology, the study of deformable shapes” (Quanta magazine). 🧵", "link": "https://nitter.net/lmthang/status/2054615931838677436#m", "published": "Wed, 13 May 2026 17:33:05 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Introducing Googlebook, the first laptop designed for Gemini Intelligence. It’s crafted for heavyweight performance, built with Gemini at the core and perfectly synced with your Android phone. Coming this fall. 💻✨ #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054270454467121187#m", "published": "Tue, 12 May 2026 18:40:17 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Really cool work from the team reimagining the mouse pointer to be intelligent! Try the prototype in @GoogleAIStudio it's pretty magical. Google DeepMind (@GoogleDeepMind) We’re reimagining a 50-year-old interface - the mouse pointer - with AI. 🖱️ These experimental demos show how people can intuitively direct Gemini on their screens using motion, speech, and natural shorthand to get things done 🧵 Video — https://nitter.net/GoogleDeepMind/status/2054246119635300451#m", "link": "https://nitter.net/demishassabis/status/2054326444189253655#m", "published": "Tue, 12 May 2026 22:22:46 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Today at the @Android Show (I/O edition) we announced Gemini Intelligence - bringing the best of Gemini to our most advanced devices. Automate multi-step tasks across apps and Chrome, fill out forms in a single tap, turn spoken thoughts into polished text with Rambler, build custom widgets & loads more.", "link": "https://nitter.net/sundarpichai/status/2054255858700415005#m", "published": "Tue, 12 May 2026 17:42:17 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "demishassabis", "text": "Read more here: bit.ly/4v2OI03", "link": "https://nitter.net/demishassabis/status/2054197463855042669#m", "published": "Tue, 12 May 2026 13:50:15 GMT", "author_name": "Demis Hassabis", "category_hint": "ceo", "source_lang": "en"}, {"handle": "JeffDean", "text": "Those early whole company @Google ski trips were fun! I'm eighth from the left in the top row, wearing the white bathrobe (ninth if you count Susan's baby, Ari) Paul Buchheit (@paultoo) Don't just start a company Start a cult — https://nitter.net/paultoo/status/2055052066905866316#m", "link": "https://nitter.net/JeffDean/status/2055150652339478786#m", "published": "Fri, 15 May 2026 04:57:53 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Today, we introduced Gemini Intelligence, which brings the best of Gemini to our most advanced devices. Gemini Intelligence integrates premium hardware and innovative software to help you stay a step ahead and work proactively to get things done throughout your day. #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054263720629457058#m", "published": "Tue, 12 May 2026 18:13:32 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Great to see @percyliang as a keynote speaker at #cais2026 ! ACM Conference on AI and Agentic Systems (@CAISconf) 🎤 Keynote announcement: @percyliang (Percy Liang), Professor of Computer Science at @Stanford , founding director of the Center for Research on Foundation Models, and co-founder of @togethercompute , is keynoting #CAIS2026 . Percy's HELM framework set the standard for holistic evaluation of language models, and his Foundation Model Transparency Index (now in its third year) put every major AI lab on notice for what they do and don't disclose. His current work on Marin takes this further: an open lab where every experiment, successful or not, is public from day one. This one's going to be good. San Jose · May 26–29 caisconf.org — https://nitter.net/CAISconf/status/2054256506464596282#m", "link": "https://nitter.net/JeffDean/status/2054294479113515385#m", "published": "Tue, 12 May 2026 20:15:45 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Today we're launching the Open Defense Initiative: up to $5 million in @depthfirstlabs credits for critical open source projects to find and fix real, exploitable vulnerabilities. We’ve been investing heavily in the entire agentic security technology stack: a harness that allows models to efficiently reason through code the way a security engineer would, the context understanding to validate exploitability and produce ready-to-merge fixes, and recently, post-trained models optimized for vulnerability discovery. Today we shared a datapoint that highlights the value of that approach. depthfirst autonomously identified 12 vulnerabilities in @FFmpeg , after Anthropic did several hundred runs with Mythos, for 1/10th of the compute cost reported by Anthropic. As a former @GoogleDeepMind researcher, I am grateful to foundation labs for pushing the boundaries of what AI can do, as every advance there gives us a stronger base to build on. But running general purpose models without the proper harness can be too expensive to be economically viable. That's what makes today's launch possible. The efficiency we've built lets us put frontier-level security in the hands of the maintainers who need it most, before open source models catch up and bad actors wield these capabilities without filters or guardrails. If you maintain a critical open source project, apply for Open Defense credits through the form in the comments.", "link": "https://nitter.net/andreamichi/status/2054262136659194352#m", "published": "Tue, 12 May 2026 18:07:14 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "JeffDean", "text": "Free Universal Healthcare is so complicated and expensive that only 32 of the 33 wealthiest countries in the world have figured it out. Video", "link": "https://nitter.net/MetamateDaz/status/2052826367134400983#m", "published": "Fri, 08 May 2026 19:02:00 GMT", "author_name": "Jeff Dean", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "Most documented psychological biases are not irrational, they are highly optimized, energy-efficient shortcuts meant for a biological substrate operating under strict real-time physical constraints and a limited caloric budget", "link": "https://nitter.net/fchollet/status/2055346225092902924#m", "published": "Fri, 15 May 2026 17:55:01 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The JAX package is now around the same level, 20M monthly downloads. Which is incredibly fast growth, because 5 years ago I recall it being below 2M or so. It went from niche to mainstream in the past couple of years. Well deserved success.", "link": "https://nitter.net/fchollet/status/2055040945763336508#m", "published": "Thu, 14 May 2026 21:41:56 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The Keras package recently crossed 21M monthly downloads on PyPI, an all-time high (the daily ATH is around 900k). I still remember when it first crossed 10M monthly downloads about 5 years ago and I thought it couldn't possibly go any higher...", "link": "https://nitter.net/fchollet/status/2055039639350919653#m", "published": "Thu, 14 May 2026 21:36:45 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "This reminds me of computerization. The amount of \"work\" people could execute on computers increased by a huge factor, but their productivity did not. The amount of work \"needed\" to arrive at the same high-level outputs exploded.", "link": "https://nitter.net/fchollet/status/2054917911207395384#m", "published": "Thu, 14 May 2026 13:33:03 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "fchollet", "text": "The quantity of code that devs ship has roughly 10xed. But net developer productivity (value created by unit of time) is only up by a bit, if at all. Part of it is that the additional code is solving more incremental problems. A bigger part is that the new code is creating problems of its own.", "link": "https://nitter.net/fchollet/status/2054917282015445076#m", "published": "Thu, 14 May 2026 13:30:33 GMT", "author_name": "Francois Chollet", "category_hint": "researcher", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "New course: Transformers in Practice. You'll get a practical view of how transformer-based LLMs work, so you can reason about their behavior, diagnose problems like slow inference, and make smarter decisions about deployment. This course is built in partnership with @AMD and taught by @realSharonZhou . You'll see how transformers generate text one token at a time, how the model decides which earlier words matter most when predicting the next one, and how techniques like quantization speed up inference on GPUs. This is not a video-only course; interactive visualizations throughout let you play with these concepts and build intuition that sticks. Skills you'll gain: - Understand why LLMs hallucinate, and RAG and chain-of-thought shape what they generate - Look inside the model to see how attention and layers combine to predict the next token - Diagnose inference bottlenecks and learn the techniques that speed up transformers on GPUs Join and understand what's really happening inside your LLMs: deeplearning.ai/courses/tran… Video", "link": "https://nitter.net/AndrewYNg/status/2054964560403300359#m", "published": "Thu, 14 May 2026 16:38:25 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "There will be no AI jobpocalypse. The story that AI will lead to massive unemployment is stoking unnecessary fear. AI — like any other technology — does affect jobs, but telling overblown stories of large-scale unemployment is irresponsible and damaging. Let’s put a stop to it. I’ve expressed skepticism about the jobpocalypse in previous posts. I’m glad to see that the popular press is now pushing back on this narrative. The image below features some recent headlines. Software engineering is the sector most affected by AI tools, as coding agents race ahead. Yet hiring of software engineers remains strong! So while there are examples of AI taking away jobs, the trends strongly suggest the net job creation is vastly greater than the job destruction — just like earlier waves of technology. Further, despite all the exciting progress in AI, the U.S. unemployment rate remains a healthy 4.3%. Why is the AI jobpocalypse narrative so popular? For one thing, frontier AI labs have a strong incentive to tell stories that make AI technology sound more powerful. At their most extreme, they promote science-fiction scenarios of AI “taking over” and causing human extinction. If a technology can replace many employees, surely that technology must be very valuable! Also, a lot of SaaS software companies charge around $100-$1000 per user/year. But if an AI company can replace an employee who makes $100,000 — or make them 50% more productive — then charging even $10,000 starts to look reasonable. By anchoring not to typical SaaS prices but to salaries of employees, AI companies can charge a lot more. Additionally, businesses have a strong incentive to talk about layoffs as if they were caused by AI. After all, talking about how they’re using AI to be far more productive with fewer staff makes them look smart. This is a better message than admitting they overhired during the pandemic when capital was abundant due to low interest rates and a massive government financial stimulus. To be clear, I recognize that AI is causing a lot of people’s work to change. This is hard. This is stressful. (And to some, it can be fun.) I empathize with everyone affected. At the same time, this is very different from predicting a collapse of the job market. Societies are capable of telling themselves stories for years that have little basis in reality and lead to poor society-wide decision making. For example, fears over nuclear plant safety led to under-investment in nuclear power. Fears of the “population bomb” in the 1960s led countries to implement harsh policies to reduce their populations. And worries about dietary fat led governments to promote unhealthy high-sugar diets for decades. Now that mainstream media is openly skeptical about the jobpocalypse, I hope these stories will start to lose their teeth (much like fears of AI-driven human extinction have). Contrary to the predictions of an AI jobpocalypse, I predict the opposite: There will be an AI jobapalooza! AI will lead to a lot more good AI engineering jobs, and I’m also optimistic about the future of the overall job market. What AI engineers do will be different from traditional software engineering, and many of these jobs will be in businesses other than traditional large employers of developers. In non-AI roles, too, the skills needed will change because of AI. That makes this a good time to encourage more people to become proficient in AI, and make sure they’re ready for the different but plentiful jobs of the future! [Original text in The Batch newsletter.]", "link": "https://nitter.net/AndrewYNg/status/2054236506756370865#m", "published": "Tue, 12 May 2026 16:25:23 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "I'm delighted that @coursera and @udemy have come together as one company to serve learners. Both Coursera and Udemy were founded with the belief that access to high-quality education changes lives. Over the years, both companies have advanced this goal, creating opportunities for individuals, organizations, and communities around the world. That role is even more important now, as AI is changing the nature of work and increasing the need for continuous learning. Helping people build job-relevant skills will be critical to how we create a better world. By combining the strengths of both ‌companies, we can better serve this need. We bring together a broader range of learning content, trusted instructors and educators, and engaging learning experiences. This creates new opportunities to make learning more personalized, more applied, and more accessible at scale. I’m excited to serve as Chairman of the combined company, working alongside Greg Hart and the leadership team. There is a strong foundation in both organizations, and I look forward to what the teams will build together to expand access opportunity globally. Learn more: blog.coursera.org/coursera-a…", "link": "https://nitter.net/AndrewYNg/status/2053857910451827061#m", "published": "Mon, 11 May 2026 15:20:59 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "New course: Build agents that respond to users with not only plaintext, but custom UIs like charts, forms, and whiteboards, generated on demand and displayed right in the chat. This short course is built in partnership with @CopilotKit and taught by @ataiiam , co-founder of CopilotKit. You'll learn three approaches: Your agent can pick from custom components you build, like charts and forms. It can compose new layouts from a set of building blocks you provide, like rows, cards, and text. Or it can incorporate existing third-party apps, like a whiteboard or a calendar, right inside the conversation. Skills you’ll gain: - Build agents that render custom components like charts and forms on demand - Build an app where the agent and user collaborate on shared data, beyond just the chat window - Place third-party apps like maps, calendars, and whiteboards right in your interface Join and build agents that give users something to see and act on! deeplearning.ai/short-course… Video", "link": "https://nitter.net/AndrewYNg/status/2052422157310083493#m", "published": "Thu, 07 May 2026 16:15:49 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "AndrewYNg", "text": "Coding agents are accelerating different types of software work to different degrees. When we architect teams, understanding these distinctions helps us to have realistic expectations. Listing functions from most accelerated to least, my order is: frontend development, backend, infrastructure, and research. Frontend development — say, building a web page to serve descriptions of products for an ecommerce site — is dramatically sped up because coding agents are fluent in popular frontend languages like TypeScript and JavaScript and frameworks like React and Angular. Additionally, by examining what they have built by operating a web browser, coding agents are now very good at closing the loop and iterating on their own implementations. Granted, LLMs today are still weak at visual design, but given a design (or if a polished design isn’t important), the implementation is fast! Backend development — say, building APIs to respond to queries requesting product data — is harder. It takes more work by human developers to steer modern models to think through corner cases that might lead to subtle bugs or security flaws. Further, a backend bug can lead to non-intuitive downstream effects like a corrupted database that occasionally returns incorrect results, which can be harder to debug than a typical frontend bug. Finally, although database migrations can be easier with coding agents, they’re still hard and need to be handled carefully to prevent data loss. While backend development is much faster with coding agents, they accelerate it less, and skilled developers still design and implement far better backends than inexperienced ones who use coding agents. Infrastructure. Agents are even less effective in tasks like scaling an ecommerce site to 10K active uses while maintaining 99.99% reliability. LLMs' knowledge is still relatively limited with respect to infrastructure and the complex tradeoffs good engineers must make, so I rarely trust them for critical infra decisions. Building good infrastructure often requires a period of testing and experimentation, and coding agents can help with that, but ultimately that’s a significant bottleneck where fast AI coding does not help much. Lastly, finding infrastructure bugs — say, a subtle network misconfiguration — can be incredibly difficult and requires deep engineering expertise. Thus, I’ve found that coding agents accelerate critical infrastructure even less than backend development. Research. Coding agents accelerate research work even less. Research involves thinking through new ideas, formulating hypotheses, running experiments, interpreting them to potentially modify the hypotheses, and iterating until we reach conclusions. Coding agents can speed up the pace at which we can write research code. (I also use coding agents to help me orchestrate and keep track of experiments, which makes it easier for a single researcher to manage more experiments.) But there is a lot of work in research other than coding, and today’s agents help with research only marginally. Categorizing software work into frontend, backend, infra, and research is an extreme simplification, but having a simple mental model for how much different tasks have sped up has been useful for how I organize software teams. For example, I now ask front-end teams to implement products dramatically faster than a year ago, but my expectations for research teams have not shifted nearly as much. I am fascinated by how to organize software teams to use coding agents to achieve speed, and will keep sharing my findings in future posts. [Original text: deeplearning.ai/the-batch/is… ]", "link": "https://nitter.net/AndrewYNg/status/2051691741150081122#m", "published": "Tue, 05 May 2026 15:53:24 GMT", "author_name": "Andrew Ng", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "New article: a visual tour of recent LLM architecture advances, from Gemma 4 to DeepSeek V4. I focus on long-context efficiency tweaks like KV sharing, per-layer embeddings, layer-wise attention budgets, compressed attention, and mHC. Link: magazine.sebastianraschka.co…", "link": "https://nitter.net/rasbt/status/2055637086380650538#m", "published": "Sat, 16 May 2026 13:10:47 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "The table in HTML format for easier (and non-truncated) viewing: sebastianraschka.com/llm-arc…", "link": "https://nitter.net/rasbt/status/2054949267630940606#m", "published": "Thu, 14 May 2026 15:37:39 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "Meta observation: DeepSeek is still king of the active-parameter ratio", "link": "https://nitter.net/rasbt/status/2054936440975310910#m", "published": "Thu, 14 May 2026 14:46:41 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "A little talk on what we can learn from implementing LLM architectures from scratch in Python and PyTorch. And how I approach new open-weight models, compare them against reference implementations etc: piped.video/watch?v=TXzQ7PGp…", "link": "https://nitter.net/rasbt/status/2054602271107760308#m", "published": "Wed, 13 May 2026 16:38:48 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "rasbt", "text": "Interesting paper. What I like about this is that it is a relatively low-commitment attention modification. I.e., one can use it during most of training, switch back to vanilla attention near the end, and recover roughly the same modeling performance as if full attention had been used the whole time. elvis (@omarsar0) Cool idea from Nous Research. What if you could speed up long-context pretraining with a subquadratic wrapper that you remove before deployment? That is the idea behind Lighthouse Attention. The method wraps ordinary SDPA with a hierarchical, gradient-free selection layer that compresses and decompresses queries, keys, and values symmetrically, preserving left-to-right causality. Crucially, it can be removed near the end of training in a short recovery phase, so the deployed model still runs vanilla attention with no architectural cost at inference. Preliminary LLM experiments report faster total training time and lower final loss than full-attention baselines. Why does it matter? Most efficient-attention work either changes the deployment-time architecture or pays a quality tax to do so. A training-only wrapper that survives a clean recovery phase sidesteps both. If it scales, this becomes an important training-time speedup for long-context pretraining. Paper: arxiv.org/abs/2605.06554 Learn to build effective AI agents in our academy: academy.dair.ai/ — https://nitter.net/omarsar0/status/2054224130103554359#m", "link": "https://nitter.net/rasbt/status/2054543968344412621#m", "published": "Wed, 13 May 2026 12:47:08 GMT", "author_name": "Sebastian Raschka", "category_hint": "educator", "source_lang": "en"}, {"handle": "bcherny", "text": "A lot of people have been wondering about Mythos, Glasswing, and the vulns we / our partners are fixing. Today, I’m excited for us to start sharing more. (For context, I lead Glasswing @AnthropicAI .) Two independent evaluations this week—from XBOW and the UK AISI—confirm what we've been seeing internally: Claude Mythos Preview is a step change in autonomous cybersecurity capabilities. We need to start preparing fast for a world of models with this level of capabilities. The UK AI Security Institute tested the model we shipped at the launch of Project Glasswing and found Mythos Preview is the first model to solve both of their end-to-end cyber ranges, including one (Cooling Tower) which no model had ever cleared. But attackers (and defenders) have sophistication & cost constraints – Mythos is also the only model that clears every one of their tasks estimated over 8 hours under their deliberately low 2.5M-token cap. XBOW tested it on their offensive security benchmarks, finding \"token-for-token, unprecedented precision.\" It's the only model to succeed at subtle V8 sandbox work. Other Glasswing partners shared similar stories. In a few weeks of testing, Mythos Preview has helped them find many thousands of (estimated) high + critical severity vulnerabilities, sometimes double what they'd normally find in a year. I don't share this to boost Mythos. In fact, this is not about Mythos. It’s about preparing for the coming world of models being better, faster, cheaper, and more creative than some of the best human experts at dual use capabilities. Clearly, we need them supporting defenders as widely as can be done safely – and especially the least resourced ones. Within a year, Mythos will probably look quite dumb (relative to other new models). And others may release openly available or unguardrailed models of Mythos-level capabilities. We started Project Glasswing because capabilities like Mythos Preview's won't stay rare, or stay in careful hands. We are bringing it to defenders as fast as we responsibly can, while working to figure out, for example, the right safeguards and patching & disclosure processes. Also, to be clear, compute has never been a limiter in our rollout. Expect a fuller update on our Glasswing work in the coming days. XBOW report: xbow.com/blog/mythos-offensi… UK AISI report: aisi.gov.uk/blog/how-fast-is… AI Security Institute (@AISecurityInst) Our cyber range results illustrate this step-up. Since our first Mythos evaluation, we received access to a newer Mythos Preview checkpoint. On a 32-step corporate network attack we estimate takes a human expert ~20 hours, this checkpoint completes the full attack in 6 /10 attempts. — https://nitter.net/AISecurityInst/status/2054589763173126339#m", "link": "https://nitter.net/logangraham/status/2054613618168082935#m", "published": "Wed, 13 May 2026 17:23:54 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "Mythos has cracked MacOS. It took five days.", "link": "https://nitter.net/AndrewCurran_/status/2054975129621495973#m", "published": "Thu, 14 May 2026 17:20:25 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "Automating AI research is the next major step in AI We let Claude Code (Opus 4.7) and Codex (GPT 5.5) run autonomously on the nanoGPT speedrun optimizer track using our idle compute. ~10k runs, ~14k H200 hours Opus now holds the record at 2930 steps vs the 2990 human baseline", "link": "https://nitter.net/PrimeIntellect/status/2055056380881744365#m", "published": "Thu, 14 May 2026 22:43:16 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "Starting June 15, paid Claude plans can claim a dedicated monthly credit for programmatic usage. The credit covers usage of: - Claude Agent SDK - claude -p - Claude Code GitHub Actions - Third-party apps built on the Agent SDK", "link": "https://nitter.net/ClaudeDevs/status/2054610152817619388#m", "published": "Wed, 13 May 2026 17:10:07 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "bcherny", "text": "More cardputer code incoming. Thank you Claude. Video Claude (@claudeai) We gave people tiny computers at Code with Claude. Here are some of the small, delightful things they built: Video — https://nitter.net/claudeai/status/2054257324278132893#m", "link": "https://nitter.net/Dakshay/status/2054263619060420832#m", "published": "Tue, 12 May 2026 18:13:07 GMT", "author_name": "Boris Cherny", "category_hint": "builder", "source_lang": "en"}, {"handle": "polynoamial", "text": "It's now even easier to keep your agents running productively 24/7 OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/polynoamial/status/2055020621424447529#m", "published": "Thu, 14 May 2026 20:21:11 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users.", "link": "https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "published": "Wed, 13 May 2026 15:35:00 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "And, of course, they should be plotted with compute, latency, or cost on the x-axis.", "link": "https://nitter.net/polynoamial/status/2054256144533819485#m", "published": "Tue, 12 May 2026 17:43:25 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "I love seeing a new eval with such low scores. When we announced GPT-5.5, almost every benchmark had a score above 50%. It's time to retire evals like GQPA and bring in a new set. Kilian Lieret (@KLieret) The first ProgramBench task was just solved by GPT 5.5 high/xhigh. Interestingly, high/xhigh picked two different languages for the task (C vs Python). GPT 5.5 xhigh was significantly better than Opus 4.7 xhigh in all metrics. 🧵 — https://nitter.net/KLieret/status/2054215545663144217#m", "link": "https://nitter.net/polynoamial/status/2054255862441812099#m", "published": "Tue, 12 May 2026 17:42:18 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "polynoamial", "text": "Fun fact: the fatal errors were initially flagged using @OpenAI 's GPT-5.5 Epoch AI (@EpochAIResearch) We are conducting an AI-assisted review of FrontierMath: Tiers 1-4. This has flagged fatal errors in about a third of problems, and we believe most of these flags to be valid. We will release updated scores on a corrected dataset after completing a thorough human review. — https://nitter.net/EpochAIResearch/status/2053995435870892048#m", "link": "https://nitter.net/polynoamial/status/2054012326249185658#m", "published": "Tue, 12 May 2026 01:34:34 GMT", "author_name": "Noam Brown", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "This is just one eval, but it's an important one - UK AISI’s cyber range tests long-horizon, agentic capability. 5.5 performs similarly to Mythos. The risks for frontier models are real. But we do our best to deploy AI people can actually use - through hard work on mitigations. AI Security Institute (@AISecurityInst) OpenAI’s GPT-5.5 is the second model to complete one of our multi-step cyber-attack simulations end-to-end 🧵 — https://nitter.net/AISecurityInst/status/2049868227740565890#m", "link": "https://nitter.net/markchen90/status/2050011838990168462#m", "published": "Fri, 01 May 2026 00:38:04 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "When GPT-5.5 misses on a Frontier Math question Video", "link": "https://nitter.net/SebastienBubeck/status/2047849620240572770#m", "published": "Sat, 25 Apr 2026 01:26:11 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "We tried a new thing with NVIDIA to roll out Codex across a whole company and it was awesome to see it work. Let us know if you'd like to do it at your company!", "link": "https://nitter.net/sama/status/2047395562501411058#m", "published": "Thu, 23 Apr 2026 19:21:55 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "And he’s doing a phenomenal job! Ashlee Vance (@ashleevance) One of the biggest things I took away from this interview was that @gdb is back in a major way setting the strategy for @OpenAI . Full pod right here - corememory.com/p/the-great-r… Video — https://nitter.net/ashleevance/status/2047012273840066909#m", "link": "https://nitter.net/markchen90/status/2047104498817286505#m", "published": "Thu, 23 Apr 2026 00:05:20 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "markchen90", "text": "why isn't chatgpt the perfect personal AGI? what is most disappointing about it? what feature, model improvement, or bugfix would do the most to make it more useful in your daily life? what is most frustrates you that chatty can't do, or can't do well enough?", "link": "https://nitter.net/ericmitchellai/status/2046612421671088167#m", "published": "Tue, 21 Apr 2026 15:30:00 GMT", "author_name": "Mark Chen", "category_hint": "researcher", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "Update: it is extremely good Max Weinbach (@mweinbach) Let’s see how this is — https://nitter.net/mweinbach/status/2055323272565203060#m", "link": "https://nitter.net/mweinbach/status/2055369417618235432#m", "published": "Fri, 15 May 2026 19:27:10 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "my rough understanding of comp photography and mirrorless cameras is that nothing stops us from stacking 30 differently exposed images and doing iphone-like clever ml to get a pareto better image. but this is not it :( maybe codex can one-shot this Sony | Xperia (@sonyxperia) The new AI Camera Assistant* with Xperia Intelligence brings stories to life. Using subject, scene and weather, it suggests expressive options with adjustments of colour, exposure, bokeh, and lens for breathtaking photos*. sony.co.jp/en/xperia-1m8/s/ #SonyXperia #Xperia1VIII — https://nitter.net/sonyxperia/status/2054853108988047562#m", "link": "https://nitter.net/aidan_mclau/status/2055162125652205802#m", "published": "Fri, 15 May 2026 05:43:28 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "let’s see if he can do it", "link": "https://nitter.net/aidan_mclau/status/2055163479682658530#m", "published": "Fri, 15 May 2026 05:48:51 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": ">codex running while you cook with your partner >codex running while you push your kid on the swing >codex running while you call your mom >codex working on the thing you dreamed about for years but never had time for >codex doing this while you hang with your loved ones", "link": "https://nitter.net/aidan_mclau/status/2055131340102943091#m", "published": "Fri, 15 May 2026 03:41:08 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "aidan_mclau", "text": "working with Codex You can just touch grass", "link": "https://nitter.net/coreyching/status/2055038525377274240#m", "published": "Thu, 14 May 2026 21:32:19 GMT", "author_name": "Aidan McLaughlin", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Since moving back to the Bay Area, I have tried to only Waymo. 36 trips in, it really does feel like living in the future. 10/10 experience so far!", "link": "https://nitter.net/OfficialLoganK/status/2055443153730330759#m", "published": "Sat, 16 May 2026 00:20:10 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "prompt to profitable company, this is the future", "link": "https://nitter.net/OfficialLoganK/status/2054965079255527806#m", "published": "Thu, 14 May 2026 16:40:28 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Link to sign up: rsvp.withgoogle.com/events/g…", "link": "https://nitter.net/OfficialLoganK/status/2052816512797507623#m", "published": "Fri, 08 May 2026 18:22:50 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "Come celebrate after Google IO with the DeepMind team in SF on May 21st :) Lots to look forward to!! Link in 🧵", "link": "https://nitter.net/OfficialLoganK/status/2052816356928868465#m", "published": "Fri, 08 May 2026 18:22:13 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "officiallogank", "text": "PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!!", "link": "https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "published": "Thu, 07 May 2026 01:30:00 GMT", "author_name": "Logan Kilpatrick", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "New birthday tradition, run a marathon?", "link": "https://nitter.net/osanseviero/status/2055595938136146376#m", "published": "Sat, 16 May 2026 10:27:17 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "I've been too quiet in X recently. Busy building 👀 Excited for what's to come and be back to SF next week for I/O", "link": "https://nitter.net/osanseviero/status/2054560214628635132#m", "published": "Wed, 13 May 2026 13:51:41 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "Gemma-4 lands in Vision Arena as #2 & #4 open models, and shifts the Pareto frontier! @GoogleDeepMind dominates the price-performance Pareto in Vision across both proprietary and open models. - Gemma-4-31b ranks #2 open (#20 overall) - Gemma-4-26b-a4b ranks #4 open (#26 overall) The Vision Arena ranks multimodal AI models capable of reasoning over visual inputs. Congrats to @GoogleDeepMind again on the open model progress! Google DeepMind (@GoogleDeepMind) Meet Gemma 4: our new family of open models you can run on your own hardware. Built for advanced reasoning and agentic workflows, we’re releasing them under an Apache 2.0 license. Here’s what’s new 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "link": "https://nitter.net/arena/status/2052496756773093814#m", "published": "Thu, 07 May 2026 21:12:15 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "Gemma 4 up to 3x faster, directly in your phone! 🚀 Check out the difference Speculative Decoding makes! Multi-Token Prediction (MTP) is supercharging inference speeds for Gemma 4.", "link": "https://nitter.net/googlegemma/status/2052468624657654194#m", "published": "Thu, 07 May 2026 19:20:27 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "osanseviero", "text": "I benchmarked Google’s new MTP for Gemma 4 31B using vLLM with 4 speculative tokens, a fairly conservative setup. Results: - Much higher throughput than Qwen3.6’s MTP - Lower latency too, helped by Gemma 4 generating fewer tokens - For coding tasks with reasoning enabled, Gemma 4 is now at least 6x faster than Qwen3.6. So you can generate 5 outputs, run your tests to select the best one, and it would still be cheaper than a single output by Qwen3.6. I’ve updated my full comparison with the new numbers: kaitchup.substack.com/p/qwen… I also confirmed what others have reported: Gemma 4’s MTP handles a high number of speculative tokens very well. On simple text generation, I’m now testing values above 10 and reached 129 tok/s on an RTX Pro 6000, compared with 20 tok/s without MTP. Next step: confirming how this translates to real tasks.", "link": "https://nitter.net/bnjmn_marie/status/2052286398707687650#m", "published": "Thu, 07 May 2026 07:16:21 GMT", "author_name": "Omar Sanseviero", "category_hint": "builder", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "We've published a paper that explains our views on AI competition between the US and China. The US and democratic allies hold
