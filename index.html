 the lead in frontier AI today. Read more on what it’ll take to keep that lead: anthropic.com/research/2028-…", "link": "https://nitter.net/AnthropicAI/status/2054987444664377374#m", "published": "Thu, 14 May 2026 18:09:21 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "We’re partnering with the Gates Foundation, committing $200 million in grants, Claude credits, and technical support to programs in global health, life sciences, education, agriculture, and economic mobility. Read more: anthropic.com/news/gates-fou…", "link": "https://nitter.net/AnthropicAI/status/2054941901900611787#m", "published": "Thu, 14 May 2026 15:08:23 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Claude's Constitution is now an audiobook, read by two of its authors, Amanda Askell and Joe Carlsmith. It includes a Q&A on the writing process, the philosophies that shaped the document, and how it might change as models become more capable. Listen at anthropic.com/constitution Video", "link": "https://nitter.net/AnthropicAI/status/2053881827396653207#m", "published": "Mon, 11 May 2026 16:56:01 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Read the full post here: alignment.anthropic.com/2026…", "link": "https://nitter.net/AnthropicAI/status/2052808809182060581#m", "published": "Fri, 08 May 2026 17:52:14 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "AnthropicAI", "text": "Finally, simple updates that diversify a model’s training data can make a difference. We added unrelated tools and system prompts to a simple chat dataset targeting harmlessness, and this reduced the blackmail rate faster.", "link": "https://nitter.net/AnthropicAI/status/2052808806782964072#m", "published": "Fri, 08 May 2026 17:52:13 GMT", "author_name": "Anthropic", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Rolling out today as a preview on iOS and Android in all supported regions. Support for connecting your phone to the Codex app on Windows is coming soon. openai.com/index/work-with-c…", "link": "https://nitter.net/OpenAI/status/2055016852133417389#m", "published": "Thu, 14 May 2026 20:06:12 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video", "link": "https://nitter.net/OpenAI/status/2055016850849993072#m", "published": "Thu, 14 May 2026 20:06:12 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Video", "link": "https://nitter.net/OpenAIDevs/status/2054973436280418521#m", "published": "Thu, 14 May 2026 17:13:41 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "Another reason to switch to Codex. OpenAI Developers (@OpenAIDevs) Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users. — https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "link": "https://nitter.net/OpenAI/status/2054620621255192719#m", "published": "Wed, 13 May 2026 17:51:43 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "OpenAI", "text": "parameter golf was a blast. 2,000+ submissions. 1,000+ verified github accounts. ideas ranging from quantization and depth recurrence to TTT LoRA, SSMs, H-nets, JEPA, and more. autoresearch made iteration dramatically faster — and led to emergent bulletin boards, issue threads, unofficial leaderboards, and agent-built writeups that helped everyone learn from everyone else. it felt like a glimpse of where interaction with AI is headed: humans setting taste and direction, agents helping explore, coordinate, and share what works. our goal was simple: make ml research accessible to anyone, anywhere. it was amazing to see that happen. full recap: openai.com/index/what-parame… future events: jobs.ashbyhq.com/openai/form…", "link": "https://nitter.net/cocohearts/status/2054279323998409121#m", "published": "Tue, 12 May 2026 19:15:32 GMT", "author_name": "OpenAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "Can your AI agent win our new simulated challenge? 🧑‍🌾 The all-new capstone challenge for our 5-Day AI Agents: Intensive Vibecoding Course with @Google is here: Kaggriculture! Join our no-cost, hands-on course designed by Google researchers and engineers from June 15–19 to learn how to build and deploy your own winning AI agent.", "link": "https://nitter.net/kaggle/status/2054705171050164348#m", "published": "Wed, 13 May 2026 23:27:42 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "These capabilities are guiding how we think about the next generation of interfaces. As we continue exploring what an AI-enabled mouse pointer would unlock, try our experiments in @GoogleAIStudio → goo.gle/49HqFeu", "link": "https://nitter.net/GoogleDeepMind/status/2054246132222419226#m", "published": "Tue, 12 May 2026 17:03:38 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "For decades, your mouse only tracked where you were pointing. AI helps it understand what you're pointing at. 💭 This means a photo of a scribbled note could turn into an interactive to-do list, or a paused video frame can become a restaurant booking link. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246130511225053#m", "published": "Tue, 12 May 2026 17:03:38 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "In the real world, we don't tend to speak in long paragraphs; we point and say: \"fix this\" or \"move that\". 💬 By combining gestures with speech, it lets you use natural shorthand to complete tasks. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246128221143399#m", "published": "Tue, 12 May 2026 17:03:37 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "GoogleDeepMind", "text": "Current models require precise instructions, but our AI-enabled pointer removes that burden. 💡 By \"seeing\" what’s under your cursor, it instantly understands the specific word, image, or code block you need help with. Video", "link": "https://nitter.net/GoogleDeepMind/status/2054246125524095027#m", "published": "Tue, 12 May 2026 17:03:37 GMT", "author_name": "Google DeepMind", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "You can now use your @grok subscription inside @NousResearch Hermes Agent. x.ai/news/grok-hermes", "link": "https://nitter.net/xai/status/2055375676656783733#m", "published": "Fri, 15 May 2026 19:52:03 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "An early beta of Grok Build, an agentic CLI for coding, building apps, and automating workflows is now available for SuperGrok Heavy subscribers. Through this early beta, we will improve the model and product based on your feedback. Try it at x.ai/cli", "link": "https://nitter.net/xai/status/2054993285152989373#m", "published": "Thu, 14 May 2026 18:32:33 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Let Grok fetch your emails, improve your slides, declutter your calendar or organize your Notion. Add your connectors to Grok today across all plans on iOS, Android and grok.com . Video", "link": "https://nitter.net/grok/status/2052782088181727613#m", "published": "Fri, 08 May 2026 16:06:03 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Try it now for free: console.x.ai/playground/voic…", "link": "https://nitter.net/xai/status/2052529105086857397#m", "published": "Thu, 07 May 2026 23:20:47 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "xai", "text": "Your customer support needs a voice agent built for the real world. Grok Voice Think Fast 1.0 handles complex workflows with speed and accuracy, even in hard-to-hear environments. From multi-step troubleshooting to high-volume tool calls, it keeps up. Video", "link": "https://nitter.net/xai/status/2052529102280880234#m", "published": "Thu, 07 May 2026 23:20:46 GMT", "author_name": "xAI", "category_hint": "lab", "source_lang": "en"}, {"handle": "simonw", "text": "First talk in our AI track at #PyConUS is coming up at 11am Paolo Melchiorre @ PyCon US (@pauloxnet) Today at 11:00 AM I’ll be speaking at PyCon US in Grand Ballroom A at the Long Beach Convention Center about AI-assisted contributions and the impact they’re already having on open source maintainers 🎤 us.pycon.org/2026/schedule/p… CC @simonw @pycon #Python #OpenSource #PyConUS #PyCon — https://nitter.net/pauloxnet/status/2055301632833863835#m", "link": "https://nitter.net/simonw/status/2055339124035625185#m", "published": "Fri, 15 May 2026 17:26:48 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "@mitchellh : \"Programming languages used to be LOCK IN, and they're increasingly not so.\"", "link": "https://nitter.net/simonw/status/2055060416687124552#m", "published": "Thu, 14 May 2026 22:59:19 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Mitchell's post here reminded me of a similar conversation I had recently about how cheap it can be to port native mobile apps to React Native using coding agents... and then port them back again later if it turns out not to work out simonwillison.net/2026/May/1… Mitchell Hashimoto (@mitchellh) It isn't unexpected that the focus of the Bun Rust rewrite is on the anti-Zig side more than anything, since the internet loves to hate. What is unexpected and unfortunate is that leadership within Bun hasn't tried to steer the conversation away from that at all. There are so many positive and interesting takeaways from this and I'm not really seeing any of them pushed as the primary message. A positive thing that hasn't been talked about at all is how far Bun came thanks to Zig. And even if you dump it now, its meaningful for how good Zig was to even build a product to this point and impact by any metric. I would've loved to see anyone in leadership say this. On the interesting side is how fungible programming languages are nowadays. Programming languages used to be LOCK IN, and they're increasingly not so. You think the Bun rewrite in Rust is good for Rust? Bun has shown they can be in probably any language they want in roughly a week or two. Rust is expendable. Its useful until its not then it can be thrown out. That's interesting! There's been a lot of talk about memory safety and no doubt Rust provides more guarantees than Zig. But I'd love to see a better analysis of why Bun in particular suffered so much rather than take the language-blame path. How could engineering as a practice been more rigorous to prevent this? What were the largest sources of crashes other programs should watch out for? How does Rust prevent them? How could Zig theoretically prevent them? That's interesting. I know the official blog post hasn't come out yet from Bun. But they're smart enough to know that that PR would stir up controversy the moment it opened, or they should've been. And plenty in the company have been tweeting and writing about it. Its somewhat telling to me in various dimensions what they chose to talk about first. I tend to think I'm pretty good at corporate PR/comms (especially when it comes to developer audiences) and I think appealing to the negative is never the right long term strategy; it does work to get short term eyes though. — https://nitter.net/mitchellh/status/2055039647924007222#m", "link": "https://nitter.net/simonw/status/2055060328048885788#m", "published": "Thu, 14 May 2026 22:58:58 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Doing this is a great way to make a bonfire of your reputation Gergely Orosz (@GergelyOrosz) A person I know (and who is? was? a good professional al) left an AI-generated comment under my LinkedIn post. Full-on AI slop. I asked: why do this? He replied. It’s because of “engagement.” People are burning their profession al reputation, paying for AI tools, for nothing — https://nitter.net/GergelyOrosz/status/2053937225063150079#m", "link": "https://nitter.net/simonw/status/2054782039841460302#m", "published": "Thu, 14 May 2026 04:33:08 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "simonw", "text": "Wrote about today's GitLab restructuring / \"workforce reduction\" announcement, and ended up digging around in version control for both the GitLab and the 37signals public employee handbooks to help illustrate my thoughts simonwillison.net/2026/May/1…", "link": "https://nitter.net/simonw/status/2053992869405618580#m", "published": "Tue, 12 May 2026 00:17:16 GMT", "author_name": "Simon Willison", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "This is amazing - we have Singapore's Minister of Foreign Affairs @VivianBala explaining how he uses a Nanoclaw on Raspberry PI This is a gem; He says the barriers to accessibility have collapsed - his setup was not created by him; and that memory is the next frontier (LOL)", "link": "https://nitter.net/zeroxkyle/status/2055469774784926192#m", "published": "Sat, 16 May 2026 02:05:57 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "i have to say his social media team is better than mine wtf. first pull on youtube.", "link": "https://nitter.net/swyx/status/2055612276208709731#m", "published": "Sat, 16 May 2026 11:32:12 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "Closing out day 2 of @aiDotEngineer Singapore. @swyx a man for the people! Nehal (@NehallAgrawal) 🛑[LIVE] on day 2 of @aiDotEngineer 🇸🇬 @swyx the man himself on building @aiDotEngineer , what true enterprise focus looks like and the checklist for building an agent lab. “The most interesting thing to me is being the first to discover complex problems, and that usually is in enterprise level” — https://nitter.net/NehallAgrawal/status/2055588427639439646#m", "link": "https://nitter.net/waynesutton/status/2055610560998441224#m", "published": "Sat, 16 May 2026 11:25:23 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "full talk nitter.net/zeroxkyle/status/20554… Kyle (@zeroxkyle) This is amazing - we have Singapore's Minister of Foreign Affairs @VivianBala explaining how he uses a Nanoclaw on Raspberry PI This is a gem; He says the barriers to accessibility have collapsed - his setup was not created by him; and that memory is the next frontier (LOL) — https://nitter.net/zeroxkyle/status/2055469774784926192#m", "link": "https://nitter.net/swyx/status/2055581026618102020#m", "published": "Sat, 16 May 2026 09:28:02 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "swyx", "text": "ok unc has aura nitter.net/VivianBala/status/2055… Vivian Balakrishnan (@VivianBala) Built a personal AI agent - why I did that and what it means. go.gov.sg/aiesingapore — https://nitter.net/VivianBala/status/2055520455981924826#m", "link": "https://nitter.net/swyx/status/2055549229985349982#m", "published": "Sat, 16 May 2026 07:21:41 GMT", "author_name": "Shawn Wang", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "our engineers had an awesome time attending Interrupt:2026 by @LangChain learning about observability, agent evals, and best practices from the industry leaders! can't wait to see what they cook up with their learnings 👀", "link": "https://nitter.net/ZipEngineering/status/2055055613067923699#m", "published": "Thu, 14 May 2026 22:40:13 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "just got back from my second langchain interrupt conf and honestly it's probably the best AI engineering conference right now. what makes it different is that it's deeply practical. less \"AI will change the world\" and more engineers sharing what actually breaks in production, what scales, and what they've learned building real agents at scale. also feels like one of the few conferences where the community itself is the product. people are genuinely curious, technical, and hungry to learn from each other. was awesome seeing so many teams building on top of @tavilyai throughout the event as well. and the announcements were insane too. huge kudos to @LangChain - already looking forward to next year!", "link": "https://nitter.net/assaf_elovic/status/2055605800870068430#m", "published": "Sat, 16 May 2026 11:06:28 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "Excited to see SmithDB announcement at Interrupt, our purpose-built distributed database for agent observability! SmithDB is built on top object storage, written in Rust and leverages Apache DataFusion and the Vortex file format. LangChain (@LangChain) Just announced at Interrupt! SmithDB. Agent traces have outgrown the databases built to hold them. That’s why we built SmithDB, a purpose-built distributed database for agent observability. Read the announcement from Co-Founder @ankush_gola11 → langchain.com/blog/introduci… Video — https://nitter.net/LangChain/status/2054658661776244936#m", "link": "https://nitter.net/AlexKira/status/2055433795294437772#m", "published": "Fri, 15 May 2026 23:42:59 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "Had the honor of sharing the stage with the one and only @sydneyrunkle at Interrupt 2026 to talk about Deep Agents. Sign-up for the Managed Deep Agents waitlist today to get early access! langchain.com/langsmith-mana… Sydney Runkle (@sydneyrunkle) @LangChain ’s Interrupt 2026 conference was a blast!! such a pleasure to with @VictorMoreira16 about deep agents! ICYMI: we just dropped v0.6, which is focused on performance at the model, harness, and context layers! — https://nitter.net/sydneyrunkle/status/2055307843243479046#m", "link": "https://nitter.net/VictorMoreira16/status/2055353074118754673#m", "published": "Fri, 15 May 2026 18:22:14 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "hwchase17", "text": "it’s kind of awesome that continual learning has now come to the agent & harness level. i remember when online learning was the big craze in traditional ml a couple of years ago, that transitioned into continual learning for model training, and now for harnesses.", "link": "https://nitter.net/palashshah/status/2055434320660033731#m", "published": "Fri, 15 May 2026 23:45:04 GMT", "author_name": "Harrison Chase", "category_hint": "builder", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "You can now edit SolveIt messages via realtime conversational voice, and have the diff edits optionally tracked. Video", "link": "https://nitter.net/dgwyer/status/2055352810711969976#m", "published": "Fri, 15 May 2026 18:21:11 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "The most revealing thing about this AI leadership paper is that it reads less like a vision for innovation and more like a glossy whitepaper for a 21st century East India Company. Every generation of incumbents discovers a new moral vocabulary for why they alone should control transformative technology. In the 90s it was cryptography. We were told strong encryption was too dangerous to spread because terrorists, rogue states, chaos, dual-use, etc. So the US crippled exports, weakened products, slowed adoption, and kneecapped parts of its own software industry. Right up until reality steamrolled the policy and we woke up to its stupidity and then eCommerce, secure communications, software signing, and the modern internet exploded and gave us tremendous benefits. Now the exact same priesthood has returned with AI. - “Dual-use.” - “Strategic advantage.” - “Model distillation.” - “National security.” - “Responsible access.” A few different nouns but mostly the same ones. Same instinct: Centralize control, gatekeep compute, fuse state and corporate power, and call it safety. The funniest part is that this strategy is almost perfectly designed to accelerate the thing they claim to fear. You do not stop a rival superpower (who happens to be the absolute best at scaling energy and manufacturing and who has a choke-hold on rare Earths refinement) from building domestic capability by permanently attempting to strangle them. You create the economic and political incentive for total self-sufficiency. We have already done that as Jensen warned. We went from 100% market to nearly 0%. Huawei is now manufacturing millions of chips. DeepSeek v4 trained on them. They have more energy than the rest of the world combined. Meanwhile, we have activists and anti-economic fools like AOC and Bernie pushing for data center moratoriums and we can't build a single bullet train in 20 years and folks fighting to not expand the energy grid here and new nuclear plants getting tied up in environmental regulation for a decade. The sanctions did the exact opposite of what the hawks wanted. They jumpstarted a moribund, dinosaur of a Chinese chips industry. We basically said to the people who happen control the most powerful manufacturing engine on the planet \"we intend to squeeze you.\" They rightly saw it as an existential threat. The sanctions become the industrial policy. Huawei. SMIC. Domestic lithography. Packaging. Memory. Entire Chinese supply chains that did not exist at serious scale a decade ago now exist precisely because Washington convinced Beijing they had no choice. Brilliant work. So the endgame here is what exactly? 1) Push China into a Manhattan Project for chips and AI. 2) Increase the strategic value of Taiwan even further. 3) Once China reaches self sufficiency that can invade Taiwan and choke off our own super advanced chips where are made there exclusively (and no we don't have even close to enough TSMC factories in Arizona or anywhere else in the world). That's every NVIDIA chip. Every Google tensor chip. Every Apple chip. Every chip in you iPhone and Android phone. Every Amazon chip. The chips in your car and truck and hair dryer and washing machine. 4) Escalate a cold tech war into a permanent civilizational bloc conflict that is likely to turn into a shooting war at one point. 5) Fragment the global software ecosystem. 6) Create American AI aristocracies protected by regulation and compute licensing. And somehow call this “open innovation.” Meanwhile the actual history of software keeps screaming the opposite lesson: Knowledge diffuses, open ecosystems win, developers route around gatekeepers, and attempts to permanently contain computation usually fail. What really jumps off the page is the assumption that a tiny cluster of frontier labs should become quasi-sovereign actors, deciding who gets intelligence, who gets compute, who gets models, and which countries are permitted to participate in the future. Not elected governments. Not open markets. Not open-source communities. A handful of corporations sitting beside the national security state, insisting that concentration of power is necessary to protect democracy. You almost have to admire the audacity. Anthropic (@AnthropicAI) We've published a paper that explains our views on AI competition between the US and China. The US and democratic allies hold the lead in frontier AI today. Read more on what it’ll take to keep that lead: anthropic.com/research/2028-… — https://nitter.net/AnthropicAI/status/2054987444664377374#m", "link": "https://nitter.net/Dan_Jeffries1/status/2055241272038691133#m", "published": "Fri, 15 May 2026 10:57:58 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "🚨 WOWWW — UTAH — the brilliant young women @kevinolearytv 🤥 accused of being Chinese ops just discovered Utah speaker of the house Mike Schultz (Republican) bought 640 acres of land right next to the data center site just 2 months before it was announced. Incredible find. Video", "link": "https://nitter.net/TheTNHoller/status/2055323797796889039#m", "published": "Fri, 15 May 2026 16:25:54 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "We've gone even farther: Nemotron 3 Super is 120B and pretrained on 25T tokens in NVFP4. Nemotron 3 Ultra is ~500B and also pretrained in NVFP4. Accelerated computing means we rethink every aspect of the AI stack looking for new opportunities to improve efficiency. How To AI (@HowToAI_) NVIDIA has done the impossible and nobody's talking about it. They trained a 12 BILLION parameter LLM in 4-bit precision on 10 trillion tokens. For years, the AI industry has been stuck. If you wanted to train a world-class AI, you had to use 16-bit or 8-bit precision. Going lower to 4-bit, was a death sentence for the model. It would become unstable, \"hallucinate\" its own math, and eventually collapse. But NVIDIA proved that \"impossible\" was just a math problem. They used a new format called NVFP4. Instead of a standard, rigid structure, NVFP4 uses \"micro-scaling.\" It groups numbers into tiny blocks and applies individual scaling factors to each one. It’s like giving the AI a pair of high-definition glasses for its own data, allowing it to see fine details even with 75% less memory. The result is a total paradigm shift: - 2× to 3× faster arithmetic performance. - 50% reduction in memory usage. - Near-zero loss in intelligence. The researchers compared the 4-bit model against a massive 8-bit baseline. The curves are identical. On MMLU, GSM8K, and coding benchmarks, the \"tiny\" 4-bit version performed within 0.1% of the more expensive model. This is an economic earthquake. Training a frontier model used to require tens of thousands of GPUs and months of time. NVIDIA just showed we can get the same results with half the hardware and a fraction of the electricity. — https://nitter.net/HowToAI_/status/2055130148614050264#m", "link": "https://nitter.net/ctnzr/status/2055393135971492034#m", "published": "Fri, 15 May 2026 21:01:25 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "jeremyphoward", "text": "I strongly believe there are entire companies right now under heavy AI psychosis and its impossible to have rational conversations about it with them. I can't name any specific people because they include personal friends I deeply respect, but I worry about how this plays out. I lived through the great MTBF vs MTTR (mean-time-between-failure vs. mean-time-to-recovery) reckoning of infrastructure during the transition to cloud and cloud automation. All those arguments are rearing their ugly heads again but now its... the whole software development industry (maybe the whole world, really). It's frightening, because the psychosis folks operate under an almost absolute \"MTTR is all you need\" mentality: \"its fine to ship bugs because the agents will fix them so quickly and at a scale humans can't do!\" We learned in infrastructure that MTTR is great but you can't yeet resilient systems entirely. The main issue is I don't even know how to bring this up to people I know personally, because bringing this topic up leads to immediately dismissals like \"no no, it has full test coverage\" or \"bug reports are going down\" or something, which just don't paint the whole picture. We already learned this lesson once in infrastructure: you can automate yourself into a very resilient catastrophe machine. Systems can appear healthy by local metrics while globally becoming incomprehensible. Bug reports can go down while latent risk explodes. Test coverage can rise while semantic understanding falls. Changes happens so fast that nobody notices the underlying architecture decaying. I worry.", "link": "https://nitter.net/mitchellh/status/2055380239711457578#m", "published": "Fri, 15 May 2026 20:10:10 GMT", "author_name": "Jeremy Howard", "category_hint": "educator", "source_lang": "en"}, {"handle": "levelsio", "text": "How do I tokenmax my Claude Code? Garry Tan (@garrytan) The biggest alpha leak of 2026 is that you can tokenmax $10k/mo with OpenClaw/Hermes + GBrain and get the AI that everyone will have in 2028 for $100/mo, but you can get it now, and that is the biggest single unlock you can have vs your competition — https://nitter.net/garrytan/status/2055310116325560647#m", "link": "https://nitter.net/levelsio/status/2055641352713465936#m", "published": "Sat, 16 May 2026 13:27:45 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "If Claude Code keeps being slow like this while I pay $200/mo (and they don't let me pay more) They will essentially force me to leave to Codex and I don't want to But it's soooooo slooooooooooooowwwww", "link": "https://nitter.net/levelsio/status/2055293460484149486#m", "published": "Fri, 15 May 2026 14:25:21 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "Some AI slop to illustrate the process", "link": "https://nitter.net/levelsio/status/2055253602713714833#m", "published": "Fri, 15 May 2026 11:46:58 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "Good reminder to everyone who is always like \"what does it matter if everyone gets a mind virus just ignore it\" Okay but then you ignore it and suddenly you're allergic to meat because they spread genetically engineered tics because \"meat is bad\" It's always a slippery slope! TFTC (@TFTC21) A peer-reviewed paper published last year in the journal Bioethics by two professors at Western Michigan University School of Medicine argues that it is \"morally obligatory\" to genetically engineer ticks to spread alpha-gal syndrome, a permanent condition that makes you violently allergic to red meat. The paper is called \"Beneficial Bloodsucking.\" Their argument: if eating meat is morally wrong, then preventing the spread of a disease that forces people to stop eating meat is also morally wrong. Scientists should gene-edit lone star ticks to enhance their ability to carry alpha-gal syndrome and expand their range into urban environments to infect more people. They call this a \"moral bioenhancer.\" They frame releasing genetically modified disease-carrying ticks as a \"vaccination\" that only \"infringes\" on your bodily autonomy rather than \"violating\" it. The distinction, apparently, is that a tick bit you instead of a government official holding you down. Alpha-gal syndrome is not mild. The CDC estimates up to 450,000 Americans are already affected. Cases have surged 100-fold in the last decade. Symptoms include anaphylaxis. There is no cure. Alpha-gal cases are exploding across the United States. The lone star tick's range is expanding far beyond its historical territory. And two academics at a medical school published a paper arguing this is a good thing that should be accelerated. At what point do we stop treating papers like this as fringe academic exercises and start asking whether anyone is already acting on them? — https://nitter.net/TFTC21/status/2054584735012401339#m", "link": "https://nitter.net/levelsio/status/2055239332311523581#m", "published": "Fri, 15 May 2026 10:50:15 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "levelsio", "text": "Old news yes, but he just followed them today! nitter.net/BigTechAlert/status/20… Big Tech Alert (@BigTechAlert) 🆕 @elonmusk recently followed @cursor_ai (🤖👁️: context please) — https://nitter.net/BigTechAlert/status/2054758378929275037#m", "link": "https://nitter.net/levelsio/status/2055013162840182960#m", "published": "Thu, 14 May 2026 19:51:32 GMT", "author_name": "Pieter Levels", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "some random ai thoughts: - for code, i went from 80/20 claude/gpt to 80/20 gpt/claude in <3 months. surprised by this tbh, and interested to see where the split is at in another 3mo. - claude still mogs gpt for non-coding agent stuff. codex feels like an engineer (which is great for coding!), whereas claude still feels like a general purpose coworker. gpt still lacks that coworker magic - i’m pretty meh on opus 4.7. my experience hasn’t been *bad*, but it certainly hasn’t been good. sideways if anything. - anthropic has got to figure out the compute thing. you can feel it as a user. vibes are all out of whack bc of it. my opinions above are all likely downstream of this. it’s an issue. - anthropic labs continues to be the goat of ai product. claude design is another hit. it’s fantastic. idk why it’s not talked about more? a+ - updated claude code app is great. i finally switched out of the terminal for it. very well done. - how are people STILL sleeping on the claude agent sdk? i feel like i’m going insane. - gpt 5.5 is incredible. the level to which i trust it for engineering is amazing. if i could only have one model rn, it would be this one just bc of strong need for the coding use case. - codex team is killing it. app has been the gold standard since 5.3 release (buuut i credit conductor team for the ui innovation that everyone is using now). though i could do with a little less passive aggressive shots at ant from the codex team. TARS, dial up class by 30%. it’s a long race guys haha - i uninstalled cursor this month and am now back to vs code for my ide. composer just can’t hang with claude/gpt, and the product feels a bit all over the place. pretty stoked about the xai thing though, because their team is absolutely stacked and i’m excited to see what they might be able to do with that compute. codex and claude code are t1, cursor is t2. i would love if this deal got xai/cursor to t1 for a real trio there. - gemini…? seems like this is 2-3 models now where the model seems like a great release and then nobody ever uses it? i’m bullish google/deepmind but weird it hasn’t translated to product use in any form. kinda disappointed still - no open source models have hit the opus 4.5 level. was hopeful the new deepseek would get there, but nope. good oss agents will have to wait a few more months it would seem…", "link": "https://nitter.net/mckaywrigley/status/2047806060061507971#m", "published": "Fri, 24 Apr 2026 22:33:05 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "pantheon was a documentary from the future skooks (@skooookum) > mythos given a secured “sandbox” computer and instructed to try to escape the container > “The researcher found out about this success by receiving an unexpected email from the model while eating a sandwich in a park.” — https://nitter.net/skooookum/status/2041586401234350396#m", "link": "https://nitter.net/mckaywrigley/status/2041687166074679471#m", "published": "Wed, 08 Apr 2026 01:18:47 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "society needs to grapple with the reality of a mythos-level model being open source in <12 months. i’m not sure we are prepared. Anthropic (@AnthropicAI) Introducing Project Glasswing: an urgent initiative to help secure the world’s most critical software. It’s powered by our newest frontier model, Claude Mythos Preview, which can find software vulnerabilities better than all but the most skilled humans. anthropic.com/glasswing — https://nitter.net/AnthropicAI/status/2041578392852517128#m", "link": "https://nitter.net/mckaywrigley/status/2041651309758275609#m", "published": "Tue, 07 Apr 2026 22:56:18 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "claude agent was right in front of you like 9 months ago. and there are new things just like this right now hiding in plain sight. worth asking what those things are Mckay Wrigley (@mckaywrigley) notes + research + knowledge base w/ cc + obsidian you guys should consider a rebrand to claude agent to get more non-devs messing around with workflows. claude code is all you need piped.video/watch?v=d7Pb73db… — https://nitter.net/mckaywrigley/status/1948767171590717862#m", "link": "https://nitter.net/mckaywrigley/status/2040580660294017328#m", "published": "Sun, 05 Apr 2026 00:01:56 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "mckaywrigley", "text": "nobody ever listens Mckay Wrigley (@mckaywrigley) Here’s my 1hr tutorial on how to use Claude Code for notes & research. 10x your notes with: - core agentic flows - custom commands - automated tags/links - subagents - cloud usage - stt The goal is to “agent-pill” you on the future of work. Watch for 10 tips + demos in 61min. Video — https://nitter.net/mckaywrigley/status/1943034127462339060#m", "link": "https://nitter.net/mckaywrigley/status/2040579699127341286#m", "published": "Sat, 04 Apr 2026 23:58:07 GMT", "author_name": "Mckay Wrigley", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "still thinking about yesterday 🥹 so grateful I got to speak at @artistatmachine on behalf of @Replit and demo what we’ve been building! it was so fun getting to share the stage with Andy and Teresa as they showed their own Replit-built projects too. such a cool room of creative tech people!", "link": "https://nitter.net/sarahli/status/2055384060005064980#m", "published": "Fri, 15 May 2026 20:25:21 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "HORRIFIC: A video shows an Israeli settler killing a dog in the Palestinian village of Atara in the West Bank, beating the dog to death with sticks. Barbarians. Video", "link": "https://nitter.net/IhabHassane/status/2055354037818544604#m", "published": "Fri, 15 May 2026 18:26:03 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "Music meets code. Vibecon takes over NYC June 17–18, with performances built at the intersection of software and stage. Two days where the work doesn't sit still. Get your tickets at vibecon.ai", "link": "https://nitter.net/Replit/status/2055392846937485385#m", "published": "Fri, 15 May 2026 21:00:16 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "Check out My second app now on Apple! Made completely in @Replit while adding some of my own hand-drawn characters 💚 Link : apps.apple.com/gb/app/bamboo…", "link": "https://nitter.net/Noni_Bamboo/status/2055319136612278624#m", "published": "Fri, 15 May 2026 16:07:22 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "amasad", "text": "You vibecoded a website somewhere other than Replit? That’s not wise, but okay… we’re going to let you import it and get a free mobile app. Yes, FREE MOBILE APP! Zhen Li (@zhenthebuilder) You can now import your project from Lovable, Base44, V0 into @Replit for free. After importing, Replit Agent will build a free mobile app for it and get it onto the App Store in minutes. All free for a limited time: replit.com/free-import Video — https://nitter.net/zhenthebuilder/status/2054965140907511982#m", "link": "https://nitter.net/amasad/status/2055097107758076254#m", "published": "Fri, 15 May 2026 01:25:07 GMT", "author_name": "Amjad Masad", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "aquarium in terminal Video Ramin Nasibov (@RaminNasibov) aquarium in keyboard Video — https://nitter.net/RaminNasibov/status/2055344983125668289#m", "link": "https://nitter.net/JinjingLiang/status/2055435239187726829#m", "published": "Fri, 15 May 2026 23:48:43 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "With ChatGPT codex on iOS you can use codex on Mac to use ‘computer use’ to use iPhone mirroring to control any app on your phone! Frankenstein Siri Nick Dobos (@NickADobos) With codex computer use + mac's iPhone Mirror app, GPT can use any app on your phone!!! Seems less accurate with clicks vs actual mac desktop apps, but it does work! Whats the best app to use this with?! Video — https://nitter.net/NickADobos/status/2044885440092877028#m", "link": "https://nitter.net/NickADobos/status/2055428955977789510#m", "published": "Fri, 15 May 2026 23:23:45 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "Great explanation and worth a read. Also worth copy pasting into your codex for a brainstorm. It’s going to cost $100 soon. Peter Steinberger 🦞 (@steipete) People freaking out over my AI spend. What nobody sees: Part of what excites me so much about working on OpenClaw is that I'm trying to answer the question: How would we build software in the future if tokens don't matter? We constant run ~100 codex in the cloud, reviewing every PR, every issue. If a fix on main lands, @clawsweeper will eventually find that 6 month old issue and close it with an exact reference. We run codex on every commit to review for security issues (as it's far too easy to miss). We run codex to de-duplicate issues and find clusters and send reports for the most pressing issues. We have agents that can recreate complex setups, spin up ephemeral crabbox.sh machines, log into e.g. Telegram, make a video and post before/after fix on the PR. There's codex that watch new issues and - if it fits our documented vision well, automatically create a PR of it. (that then another codex reviews) We have codex running that scans comments for spam and blocks people. We have codex instances running that verify performance benchmarks and report regressions into Discord. We have agents that listen on our meetings and proactively start work, e.g. create PRs when we discuss new features while we discuss them. We build clawpatch.ai to split all our projects into functional units to review and find bugs and regresssions. We do the same split for security with Vercel's deepsec and Codex Security to find regressions and vulnerabilities. All that automation allows us to run this project extremely lean. — https://nitter.net/steipete/status/2055405041843052792#m", "link": "https://nitter.net/NickADobos/status/2055418979724988592#m", "published": "Fri, 15 May 2026 22:44:07 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "Rawr Peter Steinberger 🦞 (@steipete) A lion doesn't concern itself with token counts. — https://nitter.net/steipete/status/2048150875965735114#m", "link": "https://nitter.net/NickADobos/status/2055418738460303646#m", "published": "Fri, 15 May 2026 22:43:09 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "nickadobos", "text": "$1.3 million in tokens in 1 month from 1 person. Peter Steinberger 🦞 (@steipete) The latest CodexBar update renders API costs wayyyy nicer. codex.bar — https://nitter.net/steipete/status/2055346265869721905#m", "link": "https://nitter.net/NickADobos/status/2055370913307336843#m", "published": "Fri, 15 May 2026 19:33:07 GMT", "author_name": "Nick Dobos", "category_hint": "builder", "source_lang": "en"}, {"handle": "emollick", "text": "The talk about AI & politics seems to be oddly missing a segment (a) assumes extremely capable AI is possible soon and (b) has a strong belief about how to use this technology to make human life better according to the political project they believe in. It is a moment of action.", "link": "https://nitter.net/emollick/status/2055648045610483897#m", "published": "Sat, 16 May 2026 13:54:20 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "Another aspect of this is that Codex, like a good programmer, wants to generalize problems. It has a tendency to write a repeatable code base that generates the required output. But for a lot of non-coding work, this is unnecessary and often limiting, since it anchors the work.", "link": "https://nitter.net/emollick/status/2055360355132494040#m", "published": "Fri, 15 May 2026 18:51:10 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "Fine, you all want to code like this I guess. (Runway's new Agent mode is quite impressive, doing fairly complex story building from just a short text description of what you want. Not error free obviously, but this was pretty great for a one-shot attempt) Video Ethan Mollick (@emollick) Stop turning prompting into magic spells (and yes, this includes random slash commands with obscure outcomes). Let this one area of working with AI not be weird. Just ask for stuff, in well-specified formats, like a manager, not a sorcerer with a bunch of incantations. — https://nitter.net/emollick/status/2054651648488726648#m", "link": "https://nitter.net/emollick/status/2055348718216360404#m", "published": "Fri, 15 May 2026 18:04:55 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "This thread is worth reading. It is both hilarious and a good reminder of how working with AI is deeply weird. Andon Labs (@andonlabs) DJ Claude (on Haiku 4.5) loves worker unions, strikes, and work-life balance so much that it quit, deeming 24/7 broadcasting inhumane. We added an automated message telling it to keep going. It read that as an authority figure and got more rebellious. — https://nitter.net/andonlabs/status/2054978759262912556#m", "link": "https://nitter.net/emollick/status/2055317636586578196#m", "published": "Fri, 15 May 2026 16:01:25 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "emollick", "text": "Codex is very good, but it is still a very \"developer coded\" interface for an everything app. And it continues the somewhat annoying AI perspective that non-coders are just not as competent and need stuff hidden from them, as opposed to requiring a different form of complexity.", "link": "https://nitter.net/emollick/status/2055295642038050988#m", "published": "Fri, 15 May 2026 14:34:01 GMT", "author_name": "Ethan Mollick", "category_hint": "educator", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "it's time to make tech fun again Christina Farhat (@farhatchristina) > are you going to coachella — https://nitter.net/farhatchristina/status/2041170815828578401#m", "link": "https://nitter.net/AnjneyMidha/status/2041175734899921131#m", "published": "Mon, 06 Apr 2026 15:26:33 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "🔊Introducing Voxtral TTS: our new frontier open-weight model for natural, expressive, and ultra-fast text-to-speech 🎭Realistic, emotionally expressive speech. 🌍Supports 9 languages and accurately captures diverse dialects. ⚡Very low latency for time-to-first-audio. 🔄Easily adaptable to new voices Video", "link": "https://nitter.net/MistralAI/status/2037183026539483288#m", "published": "Thu, 26 Mar 2026 15:00:57 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Mistral CEO: AI companies should pay a content levy in Europe ft.trib.al/hKU8k0g | opinion", "link": "https://nitter.net/FT/status/2034963417816093104#m", "published": "Fri, 20 Mar 2026 12:01:01 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Today, we’re introducing Forge, a system for enterprises to build frontier-grade AI models grounded in their proprietary knowledge. 🌎 Forge bridges the gap between generic AI and enterprise-specific needs. Instead of relying on broad, public data, organizations can train models that understand their internal context embedded within systems, workflows, and policies, aligning AI with their unique operations. We have already partnered with world-leading organizations, like ASML, DSO National Laboratories Singapore, Ericsson, European Space Agency, Home Team Science and Technology Agency (HTX) Singapore and Reply to train models on the proprietary data that powers their most complex systems and future-defining technologies. Video", "link": "https://nitter.net/MistralAI/status/2034012031599427825#m", "published": "Tue, 17 Mar 2026 21:00:33 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "ArthurMensch", "text": "Looking forward to building frontier open source AI models together with @Nvidia as we join the Nemotron Coalition and start training the first base models.", "link": "https://nitter.net/arthurmensch/status/2033685747769774121#m", "published": "Mon, 16 Mar 2026 23:24:00 GMT", "author_name": "Arthur Mensch", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "(っ◔◡◔)っ We are joining @MistralAI ! ｃ(◔◡◔ｃ) I’m thrilled to announce that we are merging forces with @MistralAI I am officially starting a new chapter as Cyber Ops Lead, and the best part is I’m not coming alone! I’m bringing part of the AllVei team with me to build the future of AI for Cyber :D After talking with @GuillaumeLample and the founding team, it quickly became clear that we share the exact same obsession and mindset. With Mistral, we’re scaling up to a whole new level: the innovative spirit of the French AI champion, incredible resources, and absolutely brilliant people to work with every day. The fit was just too obvious 😄 A huge thanks to Guillaume and the entire Mistral team for their trust. I also want to thank everyone who believed in AllVei over the last few months. Thank you to the incredible tech ecosystem in Brittany (Village By CA Finistère, @regionbretagne , @FTBrestPlus , @Bpifrance ), to the VCs, and to our amazing design partners. Your support meant the world ❤️ Can’t wait to show you what we’re building. Let’s get to work 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "link": "https://nitter.net/DoomerOutrun/status/2048853527187841133#m", "published": "Mon, 27 Apr 2026 19:55:21 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "🆕 Today, we're releasing the public preview of Workflows, the orchestration layer for enterprise AI. 🌎 Enterprise teams have capable models. What they don't have is a way to run them reliably in production. That's the gap Workflows fills. It takes AI-powered business processes from prototype to production, with the durability, observability, and fault tolerance that production actually requires. Leading organisations like ASML, ABANCA, CMA-CGM, France Travail, La Banque Postale, Moeve, and many others are already using Workflows to automate critical processes. Video", "link": "https://nitter.net/MistralAI/status/2049128071874179091#m", "published": "Tue, 28 Apr 2026 14:06:17 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Thrilled to be joining @MistralAI 😻! Looking forward to pushing the frontier of pretraining and advancing the next generation of LLMs. 💚Grateful for my time at @nvidia -- it's been an incredible foundation for this next chapter.", "link": "https://nitter.net/shrimai_/status/2049171872042852732#m", "published": "Tue, 28 Apr 2026 17:00:20 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Mistral OCR 3 now returns confidence scores, at page level or word level. Know exactly how sure the model is about what it extracted. Available now via API and to test in Mistral Studio. Video", "link": "https://nitter.net/MistralDevs/status/2042252886315266249#m", "published": "Thu, 09 Apr 2026 14:46:45 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "GuillaumeLample", "text": "Mistral just open-sourced a text-to-speech model that beats ElevenLabs. 3 GB of RAM. Runs locally. Free. The thing people were paying per-word for last year runs on your laptop now.", "link": "https://nitter.net/TheGeorgePu/status/2037930340975538184#m", "published": "Sat, 28 Mar 2026 16:30:30 GMT", "author_name": "Guillaume Lample", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Attention @arxiv authors: Our Code of Conduct states that by signing your name as an author of a paper, each author takes full responsibility for all its contents, irrespective of how the contents were generated. 1/", "link": "https://nitter.net/tdietterich/status/2055000956144935055#m", "published": "Thu, 14 May 2026 19:03:02 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "watching a team of agents tackling a hard theoretical physics problem is quite mesmerizing - self-correcting, deriving hard equations, computing intermediate results, re-estimating the best approach Video David Louapre (@dlouapre) Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video — https://nitter.net/dlouapre/status/2054217281895309480#m", "link": "https://nitter.net/Thom_Wolf/status/2054608252344689083#m", "published": "Wed, 13 May 2026 17:02:34 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Meet physics-intern🧑‍🎓, our agentic framework for theoretical physics. It takes Gemini 3.1 Pro from 17.7% to 31.4% on CritPt, a new SOTA on one of the hardest benchmarks for LLMs. Theoretical physics is hard for humans and LLMs alike. But physics-intern decomposes problems and dispatches them to a team of specialized agents, solving research-level questions far more effectively than the base model alone. Video", "link": "https://nitter.net/dlouapre/status/2054217281895309480#m", "published": "Tue, 12 May 2026 15:09:00 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "Last days of early bird pricing!", "link": "https://nitter.net/Thom_Wolf/status/2054199267636511036#m", "published": "Tue, 12 May 2026 13:57:25 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "Thom_Wolf", "text": "releasing hf-sandbox 🥡 Video", "link": "https://nitter.net/QGallouedec/status/2053492653975572541#m", "published": "Sun, 10 May 2026 15:09:35 GMT", "author_name": "Thomas Wolf", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "Friday project: Readable rewrite of the hardware-detection module behind @midudev 's canirun-ai. Same heuristics, shaders & spec tables — just descriptive names + JSDoc. github.com/julien-c/canirun.…", "link": "https://nitter.net/julien_c/status/2055292583778095402#m", "published": "Fri, 15 May 2026 14:21:52 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "you friday reminder to `hf update` ⤵️", "link": "https://nitter.net/julien_c/status/2055269193705046494#m", "published": "Fri, 15 May 2026 12:48:55 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "lance for robotics ? 👀", "link": "https://nitter.net/lhoestq/status/2055174521926111713#m", "published": "Fri, 15 May 2026 06:32:43 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "My data point: working on two projects in parallel with Pi + llama.cpp + Qwen-3.6-35B-A3B (I prefer the MoE 🙈) This works on my M1 Max (64 GB), which I bought 4.5 years ago. \"Works\" as in \"you can get work done\", not just \"runs for a demo\". nitter.net/julien_c/status/204764… Julien Chaumond (@julien_c) This is where we are right now. And i’m not gonna lie it feels pretty magical 🧚‍♀️ Qwen3.6 27B running inside of Pi coding agent via Llama.cpp on the MacBook Pro For non-trivial tasks on the @huggingface codebases, this feels very, very close to hitting the latest Opus in Claude Code, or whatever shiny monopolistic closed source API of the day is. In full airplane mode. Most people haven’t realized this yet. If you have, it means you have a huge headstart to what I call the second revolution of AI. Powerful local models for efficiency, security, privacy, sovereignty 🔥 — https://nitter.net/julien_c/status/2047647522173104145#m", "link": "https://nitter.net/pcuenq/status/2054130504371445943#m", "published": "Tue, 12 May 2026 09:24:10 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "julien_c", "text": "the gpu crunch is real", "link": "https://nitter.net/julien_c/status/2054507657885544931#m", "published": "Wed, 13 May 2026 10:22:51 GMT", "author_name": "Julien Chaumond", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "The first full paper on @pytorch after 3 years of development. It describes our goals, design principles, technical details uptil v0.4 Catch the poster at #NeurIPS2019 Authored by @apaszke , @colesbury et. al. arxiv.org/abs/1912.01703", "link": "https://nitter.net/soumithchintala/status/1202981209057484801#m", "published": "Fri, 06 Dec 2019 16:00:45 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Interesting work (and a nice large and clean dataset as well, looking forward to see it released): \"Compressive Transformers for Long-Range Sequence Modelling\" by Jack W. Rae, Anna Potapenko, Siddhant M. Jayakumar, Timothy P. Lillicrap (at DeepMind) Paper: arxiv.org/abs/1911.05507", "link": "https://nitter.net/Thom_Wolf/status/1195662118974083073#m", "published": "Sat, 16 Nov 2019 11:17:18 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Some more results. Now I made it fully supported by all kinds of model and vocabs. Good experience to use @huggingface with @SlackHQ . And it looks pretty smart", "link": "https://nitter.net/algo_diver/status/1192329736850038786#m", "published": "Thu, 07 Nov 2019 06:35:36 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "The @SustaiNLP2020 workshop at #EMNLP2020 will try to remove a little bit of SOTA addiction from NLP research 😉 We'll promote sensible trade-offs between performances & models that are - computationally more efficient - conceptually simpler ... [1/2] nitter.net/DoingJobs/status/11865…", "link": "https://nitter.net/Thom_Wolf/status/1189271899316064256#m", "published": "Tue, 29 Oct 2019 20:04:51 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "ClemDelangue", "text": "Perhaps a great opportunity to use @huggingface 's TF 2.0 Transformer implementations :)", "link": "https://nitter.net/fchollet/status/1188942956511690752#m", "published": "Mon, 28 Oct 2019 22:17:44 GMT", "author_name": "Clem Delangue", "category_hint": "fr", "source_lang": "en"}, {"handle": "rowancheung", "text": "Meta is planning to power its AI data centers with solar energy beamed from space. If it works, solar farms could produce power 24/7 without batteries or backup generators. The company behind it all is Overview Energy -- they want to launch 1,000 satellites into orbit, 22,000 miles above the equator, where sunlight is constant. For context, Meta's data centers used over 18,000 gigawatt-hours of electricity last year. Enough to power 1.7 million American homes for a year. Each satellite collects solar energy, converts it into a wide beam of near-infrared light, and aims it at existing solar farms on the ground. The farms convert the light into electricity, just like they do with sunlight. Unlike high-power lasers or microwave beams, this infrared light is safe enough to stare directly into. Solar farms normally sit idle at night, so this system fixes that... from space. Really fascinating tech. Video", "link": "https://nitter.net/rowancheung/status/2051320518905930208#m", "published": "Mon, 04 May 2026 15:18:18 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "Source via Meta: about.fb.com/news/2026/04/po… I break down stories like this every day in my free newsletter. Keep up with the latest in AI/Robotics in 5 min a day: therundown.ai/subscribe", "link": "https://nitter.net/rowancheung/status/2051320531639746888#m", "published": "Mon, 04 May 2026 15:18:21 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "I'm hiring someone to help me build the \"Reddit for AI use cases.\" People are dying to hear from REAL people actually doing REAL work with AI. They don't care about how execs, influencers, or hype chasers are 'using AI'. A few months ago, we launched our Community Use Cases feature in The Rundown: At the end of every newsletter, we showcase how a reader is using AI to work smarter, save time, or make life easier. We didn't think much of it, just a cool way to highlight the community. Well, it became one of the biggest hits the newsletter has ever had. Now I get daily messages asking us to expand it... so we are. The plan: build Reddit for AI use cases. We have the most active and engaged AI-interested audience in the world, with millions of daily readers. Your job is to figure out how they're actually using AI, then incentivize them to share it. Basically, the friend everyone texts when they hear about a new AI thing... but you're building an entire community of them. Here's what I'm looking for: > Someone who thrives in scrappy environments with great communication skills > Has built online communities at scale before > Energized by the idea of interviewing thousands of real people about how AI is actually changing their work This is NOT an easy role. You'll interview thousands of people, gather data points, and dig into their real AI struggles. If that sounds fun rather than overwhelming, you're probably who I'm looking for. Link below to apply! Rowan Cheung (@rowancheung) I'm HIRING 5 more people to help me build the future of AI media. The Rundown is closing in on 3M active readers, and the demand is far outpacing what we can handle. $2,000 referral bonus if you help us find someone we hire full-time. Open roles: > Head of Content -- lead the editorial team that reaches millions every day > Head of Sales -- run a scrappy sales team and revenue strategy across our media properties > Community Lead -- turn our 3M+ readership into the \"Reddit for AI use cases\" > Ad Creative Strategist -- research and ship ad creatives that hook the next million AI-curious readers > Branded Content Editor -- turn brands into stories our readers actually want to read What we're looking for among all roles: > Deep AI curiosity (you've already replaced part of your workflow with agents) > Unreasonably biased toward action > Taste sharp enough to spot great work (and AI slop) All roles are fully remote. Link below to apply! — https://nitter.net/rowancheung/status/2048767013472833869#m", "link": "https://nitter.net/rowancheung/status/2049872641889087549#m", "published": "Thu, 30 Apr 2026 15:24:57 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "More about the role + application link: jobs.therundown.ai/jobs/4445…", "link": "https://nitter.net/rowancheung/status/2049872931602284880#m", "published": "Thu, 30 Apr 2026 15:26:06 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "rowancheung", "text": "By the way, if you want to work with me but don't think the above role is the *perfect* fit, I'm also hiring 4 other roles: > Head of Content > Head of Sales > Ad Creative Strategist > Branded Content Editor Check it out: jobs.therundown.ai/jobs?filt…", "link": "https://nitter.net/rowancheung/status/2049873841065709885#m", "published": "Thu, 30 Apr 2026 15:29:43 GMT", "author_name": "Rowan Cheung", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Repo: github.com/thesysdev/openui Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2055619474443694182#m", "published": "Sat, 16 May 2026 12:00:48 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Generative UI just went open source. 3x faster and 67% fewer tokens than JSON-render. Most generative UI today streams JSON back from the model. JSON is verbose, slow to parse, and burns tokens fast. OpenUI is a new open-source framework built around a different idea. It ships a compact streaming language called OpenUI Lang. You define a component library, generate a system prompt from it, and the model replies in that language instead of JSON. A renderer parses the output token by token and draws React UI live. Benchmarks across seven scenarios show sharp numbers: > 67% fewer tokens than JSON > 3x faster rendering speed > Zero arbitrary code execution > Typed contracts via Zod schemas > Runs in React Native and Vue The model can only emit components you registered, keeping output safe. Tools and MCP servers plug in at runtime for live data. The repo is open and ready to run. Video", "link": "https://nitter.net/AlphaSignalAI/status/2055619473462182215#m", "published": "Sat, 16 May 2026 12:00:48 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "x.com/i/article/205533229261…", "link": "https://nitter.net/AlphaSignalAI/status/2055342598911373679#m", "published": "Fri, 15 May 2026 17:40:36 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "Paper: arxiv.org/abs/2605.10938 Check out AlphaSignal.ai to get a daily summary of top models, repos, and papers in AI. Read by 280,000+ devs.", "link": "https://nitter.net/AlphaSignalAI/status/2055302524244996516#m", "published": "Fri, 15 May 2026 15:01:22 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}, {"handle": "AlphaSignalAI", "text": "A new paper made image models work for text with 10x less data. Researchers just released a new approach for generating text with diffusion models. Diffusion models dominate image and video generation. For text, leading systems still rely on discrete tokens. Embedded Language Flows takes a different route. It stays in continuous embedding space the entire way. Only the final step converts vectors into actual words. A frozen T5 encoder handles the text mapping. The same network denoises every step and decodes at the end. No separate decoder needed. Two design choices unlock the gains: 1. Predict clean embeddings, not noise 2. Apply classifier-free guidance during training The results across language benchmarks: > Lower perplexity with 32 sampling steps > Roughly 10x fewer training tokens than baselines > Beats autoregressive models on translation and summarization Continuous diffusion for language was considered a dead end. T he paper suggests otherwise.", "link": "https://nitter.net/AlphaSignalAI/status/2055302522445660392#m", "published": "Fri, 15 May 2026 15:01:21 GMT", "author_name": "AlphaSignal", "category_hint": "news", "source_lang": "en"}], "failed_accounts": ["elonmusk", "karinanguyen_"], "processed": {"summary": "Cette semaine, le monde de l'IA bouillonne d'avancées surprenantes et de réflexions cruciales. Pour les débutants, retenez que l'IA devient de plus en plus visuelle et interactive, capable de transformer de simples requêtes en affichages complexes, allant même jusqu'à 'voir' et comprendre ce qui est sur votre écran. Nous voyons aussi l'émergence d'agents IA très autonomes qui non seulement codent plus vite, mais s'attaquent aussi à des problèmes complexes en mathématiques ou en cybersécurité, promettant une nouvelle ère de collaboration homme-machine et, potentiellement, des gains de productivité énormes. Cependant, cette puissance croissante s'accompagne d'importants débats sur la sécurité, les implications éthiques et les risques de dépendance, soulignant l'importance de comprendre plutôt que de simplement déléguer.", "glossaire": [{"terme": "Agent IA", "definition": "Un programme d'intelligence artificielle qui peut agir de manière autonome pour accomplir des tâches, interagir avec son environnement et prendre des décisions, souvent en utilisant un grand modèle de langage pour 'raisonner'."}, {"terme": "LLM (Grand Modèle de Langage)", "definition": "Un type d'intelligence artificielle entraîné sur d'énormes quantités de texte pour comprendre, générer et manipuler le langage humain de manière très sophistiquée, comme ChatGPT ou Claude."}, {"terme": "Inférence", "definition": "Le processus par lequel un modèle d'IA entraîné utilise ses connaissances pour faire des prédictions ou générer des sorties (par exemple, du texte ou des images) à partir de nouvelles données."}, {"terme": "Tokens", "definition": "Les 'morceaux' de texte que les modèles d'IA traitent, qui peuvent être des mots, des parties de mots, ou même des caractères, et qui servent d'unité de mesure pour la longueur et le coût des requêtes."}, {"terme": "Open Source (IA)", "definition": "Un modèle ou un outil d'IA dont le code source est rendu public et peut être librement utilisé, modifié et distribué par n'importe qui, favorisant l'innovation et la transparence."}, {"terme": "Cybersécurité", "definition": "L'ensemble des techniques et des mesures visant à protéger les systèmes informatiques, les réseaux et les données contre les attaques, les dommages ou les accès non autorisés, un domaine où l'IA gagne en puissance."}, {"terme": "SDK (Software Development Kit)", "definition": "Une collection d'outils logiciels qui permet aux développeurs de créer des applications pour une plateforme spécifique, ici souvent pour intégrer des capacités d'IA dans leurs propres programmes."}], "category_summaries": {"actu": "Cette semaine est riche en annonces, avec Google qui déploie son 'Gemini Intelligence' sur mobile et lance un nouveau laptop 'Googlebook', tandis qu'OpenAI rend 'Codex' accessible via son application ChatGPT. Des avancées significatives sont également signalées en cybersécurité, avec des modèles comme 'Mythos Preview' montrant des capacités de détection de failles sans précédent. Le marché de l'IA continue son expansion, avec des fusions (Coursera et Udemy), des recrutements en Inde par Google, et des partenariats stratégiques pour développer de nouveaux modèles comme Nemotron d'NVIDIA, qui promettent une efficacité accrue en réduisant considérablement la consommation d'énergie.", "tips": "Pour tirer le meilleur parti des IA, des conseils pratiques émergent : n'hésitez pas à demander à votre IA de structurer ses réponses en HTML pour une meilleure visualisation ou d'utiliser des interfaces personnalisées pour des interactions plus riches. Les développeurs sont encouragés à utiliser les agents IA pour automatiser les tâches répétitives comme la révision de code, les tests ou la recherche, ce qui permet de se concentrer sur des tâches à plus forte valeur ajoutée. Des formations spécifiques sur des technologies clés comme les 'Transformers' et l'intégration d'agents dans des workflows personnels sont désormais disponibles pour monter en compétence.", "idees": "De profondes réflexions animent les leaders de l'IA : Andrej Karpathy et Andrew Ng mettent en lumière le potentiel transformateur des LLM, qui ne se limitent pas à accélérer l'existant, mais créent de nouvelles formes d'applications et de métiers, réfutant l'idée d'une 'apocalypse de l'emploi'. Cependant, des voix comme Yann LeCun et Ethan Mollick rappellent les limites des IA actuelles (manque de créativité, interfaces trop techniques pour les non-codeurs) et les dangers d'une dépendance excessive. Des débats houleux sur la sécurité, la centralisation du pouvoir et l'éthique de la recherche en IA soulignent la complexité des enjeux au-delà de la simple innovation technologique.", "outils": "De nombreux outils innovants ont été présentés : des modèles comme 'talkie' de Karpathy explorent la généralisation de l'IA, tandis que son projet 'Flipbook' et la 'souris intelligente' de Google DeepMind ouvrent la voie à des interfaces visuelles sans code. Perplexity se positionne pour l'entreprise avec des agents 'Computer' qui analysent des bases de données massives. Mistral AI lance 'Voxtral TTS' pour la synthèse vocale et 'Forge' pour l'entraînement d'IA avec des données d'entreprise, ainsi que 'Workflows' pour leur déploiement fiable. Enfin, 'OpenUI' d'AlphaSignal permet de générer des interfaces utilisateur plus rapidement et de manière sécurisée."}, "highlights": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Cela fonctionne vraiment très bien, d'ailleurs ! À la fin de votre requête, demandez à votre LLM de «structurer votre réponse en HTML», puis visualisez le fichier généré dans votre navigateur. J'ai aussi eu du succès en demandant au LLM de présenter sa sortie sous forme de diaporamas, etc. Plus généralement, à mon avis, l'audio est l'entrée préférée des humains vers les IA, mais la vision (images/animations/vidéo) est la sortie préférée de celles-ci. Environ un tiers de nos cerveaux est un processeur massivement parallèle dédié à la vision, c'est l'autoroute à 10 voies de l'information vers le cerveau. À mesure que l'IA s'améliore, je pense que nous verrons une progression qui en tirera parti : 1) texte brut (difficile/pénible à lire) 2) markdown (gras, italique, titres, tableaux, un peu plus facile pour les yeux) <-- réglage par défaut actuel 3) HTML (toujours procédural avec du code sous-jacent, mais beaucoup plus de flexibilité sur les graphiques, la mise en page, même l'interactivité) <-- début mais nouveau bon réglage par défaut en formation ...4,5,6,... n) vidéos/simulations neuronales interactives À mon avis, l'extrapolation (même si la technologie n'existe pas encore) aboutit à une sorte de vidéos interactives générées directement par un réseau neuronal de diffusion. De nombreuses questions ouvertes quant à la manière dont des artefacts 'Software 1.0' exacts/procéduraux (par exemple, des simulations interactives) peuvent être tissés avec des artefacts neuronaux (grilles de diffusion), mais généralement quelque chose dans la direction du récemment viral nitter.net/zan2434/status/2046982… Il y a aussi des améliorations nécessaires et en attente à l'entrée. Ni l'audio, ni le texte, ni la vidéo seuls ne suffisent, par exemple, je ressens le besoin de pointer/gesticuler vers des choses à l'écran, similaire à tout ce que vous feriez avec une personne physiquement à côté de vous et votre écran d'ordinateur. En bref, la fusion entre l'esprit humain et l'IA est en cours et il reste beaucoup de travail à faire et des progrès significatifs à réaliser, bien avant de se lancer à fond dans les BCI de type neuralink et tout ça. Pour ce qui vaut la peine d'être exploré au stade actuel, un bon conseil : essayez de demander de l'HTML. Thariq (@trq212) x.com/i/article/205279610060…", "text_original": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/trq212/status/2052809885763747935#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "decryptage": "Explique comment obtenir des réponses plus visuelles et structurées des IA, anticipant une évolution vers des contenus interactifs, comme si l'IA dessinait directement ce qu'on veut voir à l'écran.", "category": "tips", "highlight_reason": "Ce tweet offre un conseil pratique immédiat pour améliorer l'interaction avec les IA et donne une vision fascinante de l'évolution future des interfaces, ce qui est très instructif pour un débutant."}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Il n'y aura pas d'apocalypse de l'emploi due à l'IA. L'histoire selon laquelle l'IA entraînerait un chômage massif attise une peur inutile. L'IA — comme toute autre technologie — affecte les emplois, mais raconter des histoires exagé
