i pour les appareils Android, permettant d'automatiser des tâches complexes, de remplir des formulaires, ou de transformer la parole en texte soigné.", "category": "actu"}, {"author_name": "Sundar Pichai", "handle": "@sundarpichai", "text_fr": "Aujourd'hui, nous commençons à déployer le chiffrement de bout en bout pour les messages RCS entre les utilisateurs Android et iPhone ! Sameer Samat (@ssamat) Grande nouvelle : Aujourd'hui, nous commençons à déployer le chiffrement de bout en bout pour les messages RCS entre les utilisateurs Android et iPhone ! Cet effort intersectoriel remplace les SMS obsolètes par un moyen plus sécurisé et privé de discuter, quel que soit votre téléphone.🔒 Merci à la communauté de continuer à pousser pour ce genre de fonctionnalités. Votre engagement aide vraiment à faire la différence. Félicitations à l'équipe pour avoir atteint cette étape incroyable ! 🚀 En savoir plus : blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "text_original": "Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! Sameer Samat (@ssamat) Big news: Today, we’re starting to roll out end-to-end encryption for RCS messaging between Android and iPhone users! This cross-industry effort replaces outdated SMS with a more secure & private way to chat, no matter what phone you have.🔒 Thank you to the community for continuing to push for these kinds of features. Your engagement really helps make a difference. Congratulations to the team for reaching this amazing milestone! 🚀 Read more: blog.google/products-and-pla… — https://nitter.net/ssamat/status/2053890006997971368#m", "link": "https://nitter.net/sundarpichai/status/2053900771947942085#m", "decryptage": "Google commence à déployer le chiffrement de bout en bout pour les messages RCS (un système de messagerie plus avancé que les SMS) entre les téléphones Android et iPhone, rendant les conversations plus privées et sécurisées.", "category": "actu"}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "La plupart des données d'entreprise résident dans Snowflake. Avec la connexion de Computer à Snowflake, vous pouvez configurer une flotte d'agents scientifiques des données sur appel. Perplexity (@perplexity_ai) Computer se connecte désormais à Snowflake. Exécutez des travaux de bout en bout sur des données d'entrepôt en direct et obtenez des réponses avec SQL, des tables sources, des filtres et des métriques. C'est comme une équipe de science des données personnelle, sur appel avec des réponses précises à partir de données d'entreprise en direct. Vidéo — https://nitter.net/perplexity_ai/status/2054945872451129506#m", "text_original": "Most enterprise data lives inside Snowflake. With Computer connecting to Snowflake, you get to set up a fleet of on-call data scientist agents. Perplexity (@perplexity_ai) Computer now connects to Snowflake. Run end-to-end work against live warehouse data and get answers with SQL, source tables, filters, and metrics. It’s like a personal data science team, on call with accurate answers from live company data. Video — https://nitter.net/perplexity_ai/status/2054945872451129506#m", "link": "https://nitter.net/AravSrinivas/status/2054947269670248883#m", "decryptage": "Perplexity, via son outil \"Computer\", peut désormais se connecter à Snowflake (un entrepôt de données pour entreprises) et agir comme une équipe de scientifiques des données IA pour analyser et interroger les données en direct, fournissant des informations précises et automatisées.", "category": "actu"}, {"author_name": "Aravind Srinivas", "handle": "@AravSrinivas", "text_fr": "Perplexity est en train de devenir discrètement la plateforme de connaissance et de recherche pour l'entreprise Perplexity (@perplexity_ai) PayPal exécute 74 000 tâches hebdomadaires dans Perplexity Enterprise. Les équipes l'utilisent pour la validation de modèles, la performance des canaux, la recherche de tendances du marché, l'intelligence concurrentielle et l'analyse de produits. Lisez le témoignage client : perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "text_original": "Perplexity is quietly becoming the knowledge and research platform for the enterprise Perplexity (@perplexity_ai) PayPal runs 74,000 weekly tasks in Perplexity Enterprise. Teams use it for model validation, channel performance, market trend research, competitive intelligence, and product analysis. Read the customer story: perplexity.ai/enterprise/cus… — https://nitter.net/perplexity_ai/status/2054577555387371577#m", "link": "https://nitter.net/AravSrinivas/status/2054581332232302701#m", "decryptage": "Perplexity est de plus en plus utilisé par les grandes entreprises comme PayPal pour des tâches de recherche et d'analyse, transformant la manière dont les équipes valident leurs modèles, étudient les tendances et analysent les produits grâce à l'IA.", "category": "actu"}, {"author_name": "Mira Murati", "handle": "@miramurati", "text_fr": "Magiciens des clusters et souffleurs de GPU, rejoignez-nous ! Nous recherchons des ingénieurs en supercalcul pour construire l'infrastructure derrière les modèles interactifs en temps réel, Tinker, et la formation à grande échelle : ordonnancement, stockage, réseau, fiabilité et systèmes distribués à grande échelle. Recrutement à NYC et SF job-boards.greenhouse.io/thi…", "text_original": "Cluster magicians and GPU whisperers, come join us! We’re looking for supercomputing engineers to build the infrastructure behind real-time interactive models, Tinker, and large-scale training: scheduling, storage, networking, reliability, and distributed systems at scale. Hiring in NYC and SF job-boards.greenhouse.io/thi…", "link": "https://nitter.net/soumithchintala/status/2054248270780604876#m", "decryptage": "OpenAI recherche activement des ingénieurs spécialisés en supercalcul pour développer l'infrastructure complexe (gestion des serveurs, stockage, réseau) nécessaire au fonctionnement des modèles d'IA interactifs et à l'entraînement de modèles géants en temps réel.", "category": "actu"}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "Voici Googlebook, le premier ordinateur portable conçu pour Gemini Intelligence. Il est conçu pour des performances lourdes, construit avec Gemini au cœur et parfaitement synchronisé avec votre téléphone Android. Disponible cet automne. 💻✨ #TheAndroidShow Vidéo", "text_original": "Introducing Googlebook, the first laptop designed for Gemini Intelligence. It’s crafted for heavyweight performance, built with Gemini at the core and perfectly synced with your Android phone. Coming this fall. 💻✨ #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054270454467121187#m", "decryptage": "Google lance le \"Googlebook\", un nouvel ordinateur portable intégrant l'IA Gemini et conçu pour des performances élevées, qui sera en parfaite harmonie avec les téléphones Android.", "category": "actu"}, {"author_name": "Demis Hassabis", "handle": "@demishassabis", "text_fr": "J'ai toujours cru que la première application de l'IA devait être d'améliorer la santé humaine. Ce travail a commencé avec AlphaFold, et maintenant chez @IsomorphicLabs avec la mission de réinventer la découverte de médicaments et un jour de résoudre toutes les maladies ! Nous accélérons cet objectif avec 2,1 milliards de dollars de nouveaux financements. Vidéo", "text_original": "I’ve always believed the No.1 application of AI should be to improve human health. That work started with AlphaFold, and now at @IsomorphicLabs with the mission to reimagine drug discovery and one day solve all disease! We are turbocharging that goal with $2.1B in new funding. Video", "link": "https://nitter.net/demishassabis/status/2054197462101889277#m", "decryptage": "Demis Hassabis de DeepMind confirme que l'IA, notamment à travers AlphaFold et IsomorphicLabs, est un levier majeur pour la santé humaine et la découverte de médicaments, avec un financement important pour accélérer cette mission.", "category": "actu"}, {"author_name": "Jeff Dean", "handle": "@JeffDean", "text_fr": "Aujourd'hui, nous avons présenté Gemini Intelligence, qui apporte le meilleur de Gemini à nos appareils les plus avancés. Gemini Intelligence intègre du matériel haut de gamme et des logiciels innovants pour vous aider à garder une longueur d'avance et à travailler de manière proactive pour accomplir vos tâches tout au long de la journée. #TheAndroidShow Vidéo", "text_original": "Today, we introduced Gemini Intelligence, which brings the best of Gemini to our most advanced devices. Gemini Intelligence integrates premium hardware and innovative software to help you stay a step ahead and work proactively to get things done throughout your day. #TheAndroidShow Video", "link": "https://nitter.net/Google/status/2054263720629457058#m", "decryptage": "Google a lancé \"Gemini Intelligence\", une suite de fonctionnalités IA qui combine des appareils puissants et des logiciels innovants pour améliorer la productivité quotidienne des utilisateurs Android.", "category": "actu"}, {"author_name": "Jeremy Howard", "handle": "@jeremyphoward", "text_fr": "Les références hallucinées vous vaudront désormais une interdiction d'un an sur ArXiv. Waouh.", "text_original": "hallucinated references will land you a 1-year ban from arxiv now. wow", "link": "https://nitter.net/andrewwhite01/status/2055013183715447038#m", "decryptage": "ArXiv, une archive de prépublications scientifiques, va désormais bannir pendant un an les auteurs qui soumettent des travaux contenant des références bibliographiques inventées par l'IA, soulignant l'importance de la vérification humaine.", "category": "actu"}, {"author_name": "Jeremy Howard", "handle": "@jeremyphoward", "text_fr": "Attention aux auteurs @arxiv : Notre Code de Conduite stipule qu'en signant votre nom en tant qu'auteur d'un article, chaque auteur assume l'entière responsabilité de tout son contenu, quelle que soit la manière dont le contenu a été généré. 1/", "text_original": "Attention @arxiv authors: Our Code of Conduct states that by signing your name as an author of a paper, each author takes full responsibility for all its contents, irrespective of how the contents were generated. 1/", "link": "https://nitter.net/tdietterich/status/2055000956144935055#m", "decryptage": "ArXiv rappelle aux chercheurs que même si l'IA peut aider à générer du contenu pour les articles, la responsabilité finale de l'exactitude et de l'intégrité de toutes les informations publiées incombe entièrement à l'auteur humain qui signe le document.", "category": "actu"}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Nous avons publié un article qui explique nos points de vue sur la concurrence en matière d'IA entre les États-Unis et la Chine. Les États-Unis et leurs alliés démocratiques détiennent aujourd'hui l'avantage en matière d'IA de pointe. Lisez ce qu'il faudra faire pour maintenir cette avance : anthropic.com/research/2028-…", "text_original": "We've published a paper that explains our views on AI competition between the US and China. The US and democratic allies hold the lead in frontier AI today. Read more on what it’ll take to keep that lead: anthropic.com/research/2028-…", "link": "https://nitter.net/AnthropicAI/status/2054987444664377374#m", "decryptage": "Anthropic a publié un rapport sur la compétition entre les États-Unis et la Chine dans le domaine de l'IA de pointe, soulignant la position actuelle des États-Unis et les actions nécessaires pour maintenir leur leadership.", "category": "actu"}, {"author_name": "Anthropic", "handle": "@AnthropicAI", "text_fr": "Nous nous associons à la Fondation Gates, en engageant 200 millions de dollars en subventions, crédits Claude et soutien technique à des programmes dans les domaines de la santé mondiale, des sciences de la vie, de l'éducation, de l'agriculture et de la mobilité économique. En savoir plus : anthropic.com/news/gates-fou…", "text_original": "We’re partnering with the Gates Foundation, committing $200 million in grants, Claude credits, and technical support to programs in global health, life sciences, education, agriculture, and economic mobility. Read more: anthropic.com/news/gates-fou…", "link": "https://nitter.net/AnthropicAI/status/2054941901900611787#m", "decryptage": "Anthropic et la Fondation Gates s'associent pour investir 200 millions de dollars dans des programmes d'IA appliqués à la santé, l'éducation, l'agriculture et l'économie mondiale, en fournissant des financements et l'accès à l'IA Claude.", "category": "actu"}, {"author_name": "OpenAI", "handle": "@OpenAI", "text_fr": "Déploiement aujourd'hui en préversion sur iOS et Android dans toutes les régions prises en charge. Le support pour connecter votre téléphone à l'application Codex sur Windows arrive bientôt. openai.com/index/work-with-c…", "text_original": "Rolling out today as a preview on iOS and Android in all supported regions. Support for connecting your phone to the Codex app on Windows is coming soon. openai.com/index/work-with-c…", "link": "https://nitter.net/OpenAI/status/2055016852133417389#m", "decryptage": "OpenAI lance une version préliminaire de son application Codex sur iOS et Android, permettant aux utilisateurs de programmer avec l'IA depuis leur mobile, avec une future compatibilité Windows.", "category": "actu"}, {"author_name": "OpenAI", "handle": "@OpenAI", "text_fr": "Vous l'avez demandé... Maintenant en préversion : Codex dans l'application mobile ChatGPT. Commencez de nouveaux travaux, examinez les résultats, dirigez l'exécution et approuvez les prochaines étapes, le tout depuis l'application mobile ChatGPT. Codex continuera de fonctionner sur votre ordinateur portable, Mac mini ou devbox. Vidéo", "text_original": "You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video", "link": "https://nitter.net/OpenAI/status/2055016850849993072#m", "decryptage": "Codex, l'assistant de codage par l'IA d'OpenAI, est maintenant disponible en avant-première dans l'application mobile ChatGPT, permettant de lancer, suivre et gérer des tâches de codage à distance, tandis que Codex s'exécute sur votre ordinateur.", "category": "actu"}, {"author_name": "OpenAI", "handle": "@OpenAI", "text_fr": "Une autre raison de passer à Codex. OpenAI Developers (@OpenAIDevs) Vous voulez utiliser Codex officiellement au travail ? Envoyez ce message à votre CTO pour faire adopter Codex à votre équipe. Les clients d'entreprise éligibles qui changent dans les 30 prochains jours bénéficient de 2 mois d'utilisation gratuite de Codex pour les nouveaux utilisateurs. — https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "text_original": "Another reason to switch to Codex. OpenAI Developers (@OpenAIDevs) Want to (officially) use Codex at work? Send this post to your CTO to bring your team to Codex. Eligible enterprise customers who switch in the next 30 days get 2 free months of Codex usage for new users. — https://nitter.net/OpenAIDevs/status/2054586214112780518#m", "link": "https://nitter.net/OpenAI/status/2054620621255192719#m", "decryptage": "OpenAI encourage les entreprises à adopter Codex en offrant deux mois d'utilisation gratuite pour les nouveaux utilisateurs, soulignant ainsi les avantages de leur assistant de codage par l'IA.", "category": "actu"}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "Super, super excité de collaborer avec l'excellente équipe de LangChain Labs sur cet effort. Le traçage d'agents de production est la graine qui permet de boucler la boucle pour l'apprentissage continu. Trop de données sont collectées mais non utilisées pour l'apprentissage. Il est temps de changer cela :) Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "text_original": "suuuuper excited to be collaborating with the excellent LangChain Labs team on this effort prod agent tracing is the seed that lets you close the loop for continual learning. too much data gets collected but not used for learning. time to change that :) Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/willccbb/status/2054983266046996839#m", "decryptage": "Le lancement de LangChain Labs vise à créer un système de suivi pour les agents IA en production, ce qui permettra aux modèles d'apprendre continuellement de leurs actions et d'améliorer leurs capacités, transformant les données collectées en opportunités d'apprentissage.", "category": "actu"}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "LangChain Labs est en ligne Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "text_original": "LangChain Labs is live Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/caspar_br/status/2054986813513830604#m", "decryptage": "LangChain Labs, une nouvelle initiative, est désormais opérationnel pour aider les développeurs à créer et gérer des agents IA.", "category": "actu"}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "Nous sommes ravis de nous associer à @LangChain pour le déploiement d'agents auto-améliorants. L'apprentissage continu dans votre environnement de production débloque des gains de capacité cumulés pour l'optimisation modèle-produit. Vos données. Votre avantage. Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "text_original": "We are excited to be partnering with @LangChain for deploying self-improving agents. Continual learning in your production environment unlocks compounding capability gains for model-product optimization. Your data. Your advantage. Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/PrimeIntellect/status/2054986817779425579#m", "decryptage": "LangChain s'associe à Prime Intellect pour déployer des agents IA qui s'améliorent en permanence grâce à l'apprentissage continu dans des environnements réels, transformant les données d'entreprise en un avantage compétitif.", "category": "actu"}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "J'allais dire que LangChain Labs est la chose la plus excitante que nous ayons annoncée récemment, mais avec tant de lancements, c'est difficile à justifier… mais toujours incroyablement ravi de voir cela démarrer !! Consultez le blog pour plus d'informations Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "text_original": "I was going to say LangChain Labs is the most exciting thing we’ve announced recently, but with so many launches it’s hard to justify… but still incredibly thrilled to see this get started!! Checkout the blog for more info Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/BraceSproul/status/2054992219560702326#m", "decryptage": null, "category": "actu"}, {"author_name": "Harrison Chase", "handle": "@hwchase17", "text_fr": "Il y a un immense espace inexploré dans la création de systèmes d'agents de qualité entreprise qui s'améliorent continuellement. Félicitations à @hwchase17 et @LangChain pour le lancement de LangChain Labs et hâte de continuer à repousser les limites avec vous tous ! Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "text_original": "There's a ton on unexplored space in building enterprise-grade agent harnesses that continuously improve over time. Congrats to @hwchase17 and @LangChain on the launch of LangChain Labs and excited to keep pushing the frontier with you all! Harrison Chase (@hwchase17) x.com/i/article/205495642199… — https://nitter.net/hwchase17/status/2054971176464847188#m", "link": "https://nitter.net/nikogrupen/status/2054992765000524259#m", "decryptage": "Le lancement de LangChain Labs est salué comme une avancée majeure dans la construction de systèmes d'agents IA pour entreprises, capables de s'améliorer constamment, ouvrant la voie à de nouvelles opportunités.", "category": "actu"}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "Mixpanel est en direct sur le marché MCP de Replit ! Les développeurs qui créent sur @Replit peuvent intégrer les analyses de produits dans leurs flux de travail d'agent — pas de tableau de bord, pas de configuration ultérieure, juste des données là où vous construisez. Voyez-le en action lors du Hackathon de Londres le 19 mai. Inscrivez-vous : events.mixpanel.com/hackatho…", "text_original": "Mixpanel is live in the Replit MCP marketplace! Devs building on @Replit can pull product analytics into their agent workflows—no dashboard, no setup later, just data where you're building. See it in action at the London Hackathon on May 19. Register: events.mixpanel.com/hackatho…", "link": "https://nitter.net/mixpanel/status/2054888261428838836#m", "decryptage": "Mixpanel, un outil d'analyse de données, est désormais intégré à la plateforme de développement Replit, permettant aux développeurs d'utiliser des données d'analyse de produits directement dans leurs projets d'agents IA sans configuration complexe.", "category": "actu"}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "Vous pouvez maintenant importer gratuitement votre projet depuis Lovable, Base44, V0 dans @Replit. Après l'importation, Replit Agent construira gratuitement une application mobile et la mettra sur l'App Store en quelques minutes. Le tout gratuitement pour une durée limitée : replit.com/free-import Vidéo", "text_original": "You can now import your project from Lovable, Base44, V0 into @Replit for free. After importing, Replit Agent will build a free mobile app for it and get it onto the App Store in minutes. All free for a limited time: replit.com/free-import Video", "link": "https://nitter.net/zhenthebuilder/status/2054965140907511982#m", "decryptage": "Replit offre la possibilité d'importer des projets existants pour qu'un agent IA crée gratuitement une application mobile compatible et la publie sur l'App Store rapidement, facilitant la transition des idées au produit fonctionnel.", "category": "actu"}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "L'IA stimule la créativité. Vibecon transforme NYC en une galerie vivante d'installations basées sur le code, du 17 au 18 juin. Deux jours où le code devient l'environnement et le médium devient le message. Obtenez vos billets sur vibecon.ai", "text_original": "AI powered creativity on full display. Vibecon transforms NYC into a living gallery of code-driven installations, June 17–18. Two days where code becomes the environment and the medium becomes the message. Get your tickets at vibecon.ai", "link": "https://nitter.net/Replit/status/2054668056639545502#m", "decryptage": "Vibecon est un événement où la créativité assistée par l'IA sera mise en valeur, transformant des espaces à New York en galeries d'art interactives générées par du code.", "category": "actu"}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "Je serai à Londres la semaine prochaine. Venez ! Replit ⠕ (@Replit) Replit se rend à Londres ✈️ Le PDG de @posthog, @james406, et @amasad se réunissent pour une discussion au coin du feu, organisée avec nos amis de @meetgranola. 21 mai. Réservez votre place ⠕ luma.com/amjad-james — https://nitter.net/Replit/status/2054275528996094167#m", "text_original": "I’ll be in London next week. Pull up! Replit ⠕ (@Replit) Replit is going to London ✈️ @posthog CEO, @james406 , and @amasad are coming together for a fireside chat, hosted with our friends at @meetgranola . May 21st. Save your spot ⠕ luma.com/amjad-james — https://nitter.net/Replit/status/2054275528996094167#m", "link": "https://nitter.net/amasad/status/2054663692504256808#m", "decryptage": null, "category": "actu"}, {"author_name": "Amjad Masad", "handle": "@amasad", "text_fr": "La fête des mères est peut-être passée, mais nous n'avons pas fini de présenter les mères qui développent sur Replit. Lorsque Noni a fondé une famille, elle a mis en veille son rêve de créer des applications. Une maison occupée, une salle de classe occupée, et pas le temps d'apprendre à coder. Puis elle a découvert Replit pendant le Mobile Buildathon et ce fut une heureuse coïncidence. Quelques semaines plus tard, elle a lancé Bamboo Brain SATS sur l'App Store. Près de 2 000 téléchargements. Numéro 12 des meilleures applications éducatives. Sa deuxième application, Bamboo Times Tables, a suivi de près. Enseignante le jour, réalisant ses rêves de développement la nuit, pas à pas.", "text_original": "Mother's Day may have passed, but we're not done showcasing mothers who build on Replit. When Noni started a family, she put her dream of building apps on hold. A busy home, a busy classroom, and no time to learn how to code. Then she found Replit during the Mobile Buildathon and it was serendipitous. A few weeks later, she shipped Bamboo Brain SATS on the App Store. Nearly 2,000 downloads. Number 12 in top educational apps. Her second app, Bamboo Times Tables, followed close behind. Teacher by day, chasing her dreams one build at a time by night.", "link": "https://nitter.net/Replit/status/2054350956666425364#m", "decryptage": "Replit met en avant l'histoire de Noni, une mère et enseignante qui a pu réaliser son rêve de créer des applications mobiles grâce à la plateforme, en lançant deux applications éducatives à succès sur l'App Store.", "category": "actu"}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Venez faire la fête après Google I/O avec l'équipe DeepMind à San Francisco le 21 mai :) Il y a beaucoup à attendre !! Lien dans le fil de discussion 🧵", "text_original": "Come celebrate after Google IO with the DeepMind team in SF on May 21st :) Lots to look forward to!! Link in 🧵", "link": "https://nitter.net/OfficialLoganK/status/2052816356928868465#m", "decryptage": null, "category": "actu"}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Lien pour s'inscrire : rsvp.withgoogle.com/events/g…", "text_original": "Link to sign up: rsvp.withgoogle.com/events/g…", "link": "https://nitter.net/OfficialLoganK/status/2052816512797507623#m", "decryptage": null, "category": "actu"}, {"author_name": "Logan Kilpatrick", "handle": "@OfficialLoganK", "text_fr": "Avis de service public, nous recrutons pour notre équipe DevX afin de lancer notre présence en Inde 🇮🇳 ! Si vous voulez aider les bâtisseurs à tirer le meilleur parti de Gemini en Inde, veuillez me contacter par DM ou par e-mail. L'Inde est notre plus grand marché du point de vue des utilisateurs d'AI Studio, très excité de la visiter plus tard cette année également !!", "text_original": "PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!!", "link": "https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "decryptage": "Logan Kilpatrick annonce que son équipe recrute en Inde pour soutenir les développeurs utilisant Gemini, soulignant l'importance de ce marché pour l'adoption de l'IA.", "category": "actu"}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "Je suis resté trop silencieux sur X récemment. Occupé à construire 👀 Excité pour ce qui va arriver et de revenir à San Francisco la semaine prochaine pour I/O", "text_original": "I've been too quiet in X recently. Busy building 👀 Excited for what's to come and be back to SF next week for I/O", "link": "https://nitter.net/osanseviero/status/2054560214628635132#m", "decryptage": null, "category": "actu"}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "Gemma-4 arrive dans Vision Arena en tant que 2ème et 4ème modèles ouverts, et déplace la frontière de Pareto ! @GoogleDeepMind domine le Pareto prix-performance en Vision à travers les modèles propriétaires et ouverts. - Gemma-4-31b se classe 2ème ouvert (20ème au total) - Gemma-4-26b-a4b se classe 4ème ouvert (26ème au total) La Vision Arena classe les modèles d'IA multimodaux capables de raisonner sur des entrées visuelles. Félicitations à @GoogleDeepMind encore une fois pour les progrès des modèles ouverts ! Google DeepMind (@GoogleDeepMind) Découvrez Gemma 4 : notre nouvelle famille de modèles ouverts que vous pouvez exécuter sur votre propre matériel. Conçus pour le raisonnement avancé et les flux de travail agentiques, nous les publions sous licence Apache 2.0. Voici les nouveautés 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "text_original": "Gemma-4 lands in Vision Arena as #2 & #4 open models, and shifts the Pareto frontier! @GoogleDeepMind dominates the price-performance Pareto in Vision across both proprietary and open models. - Gemma-4-31b ranks #2 open (#20 overall) - Gemma-4-26b-a4b ranks #4 open (#26 overall) The Vision Arena ranks multimodal AI models capable of reasoning over visual inputs. Congrats to @GoogleDeepMind again on the open model progress! Google DeepMind (@GoogleDeepMind) Meet Gemma 4: our new family of open models you can run on your own hardware. Built for advanced reasoning and agentic workflows, we’re releasing them under an Apache 2.0 license. Here’s what’s new 🧵 — https://nitter.net/GoogleDeepMind/status/2039735446628925907#m", "link": "https://nitter.net/arena/status/2052496756773093814#m", "decryptage": "Les nouveaux modèles d'IA open-source Gemma 4 de Google DeepMind obtiennent d'excellents résultats dans les benchmarks de traitement visuel (Vision Arena), montrant qu'ils sont très performants pour comprendre des images et des vidéos, et ce à un coût avantageux.", "category": "actu"}, {"author_name": "Omar Sanseviero", "handle": "@osanseviero", "text_fr": "Rejoignez-nous ! Logan Kilpatrick (@OfficialLoganK) Avis de service public, nous recrutons pour notre équipe DevX afin de lancer notre présence en Inde 🇮🇳 ! Si vous voulez aider les bâtisseurs à tirer le meilleur parti de Gemini en Inde, veuillez me contacter par DM ou par e-mail. L'Inde est notre plus grand marché du point de vue des utilisateurs d'AI Studio, très excité de la visiter plus tard cette année également !! — https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "text_original": "Join us! Logan Kilpatrick (@OfficialLoganK) PSA, we are hiring for our DevX team to kick start our India presence 🇮🇳! If you want to help builders get the most out of Gemini in India, please ping me via DM or email. India is our largest market from an AI Studio user pov, very excited to visit later this year as well!! — https://nitter.net/OfficialLoganK/status/2052199234607182077#m", "link": "https://nitter.net/osanseviero/status/2052276250236932381#m", "decryptage": null, "category": "actu"}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Source via Meta : about.fb.com/news/2026/04/po… Je décortique des histoires comme celle-ci chaque jour dans ma newsletter gratuite. Restez informé des dernières nouvelles en IA/Robotique en 5 minutes par jour : therundown.ai/subscribe", "text_original": "Source via Meta: about.fb.com/news/2026/04/po… I break down stories like this every day in my free newsletter. Keep up with the latest in AI/Robotics in 5 min a day: therundown.ai/subscribe", "link": "https://nitter.net/rowancheung/status/2051320531639746888#m", "decryptage": null, "category": "actu"}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Meta prévoit d'alimenter ses centres de données IA avec de l'énergie solaire transmise depuis l'espace. Si cela fonctionne, les fermes solaires pourraient produire de l'énergie 24h/24 et 7j/7 sans batteries ni générateurs de secours. L'entreprise derrière tout cela est Overview Energy -- ils veulent lancer 1 000 satellites en orbite, à 22 000 miles au-dessus de l'équateur, où la lumière du soleil est constante. Pour contextualiser, les centres de données de Meta ont utilisé plus de 18 000 gigawatts-heures d'électricité l'année dernière. Assez pour alimenter 1,7 million de foyers américains pendant un an. Chaque satellite collecte l'énergie solaire, la convertit en un large faisceau de lumière proche infrarouge, et la dirige vers les fermes solaires existantes au sol. Les fermes convertissent la lumière en électricité, comme elles le font avec la lumière du soleil. Contrairement aux lasers de haute puissance ou aux faisceaux de micro-ondes, cette lumière infrarouge est suffisamment sûre pour être fixée directement. Les fermes solaires restent normalement inactives la nuit, donc ce système résout ce problème... depuis l'espace. Une technologie vraiment fascinante. Vidéo", "text_original": "Meta is planning to power its AI data centers with solar energy beamed from space. If it works, solar farms could produce power 24/7 without batteries or backup generators. The company behind it all is Overview Energy -- they want to launch 1,000 satellites in orbit, 22,000 miles above the equator, where sunlight is constant. For context, Meta's data centers used over 18,000 gigawatt-hours of electricity last year. Enough to power 1.7 million American homes for a year. Each satellite collects solar energy, converts it into a wide beam of near-infrared light, and aims it at existing solar farms on the ground. The farms convert the light into electricity, just like they do with sunlight. Unlike high-power lasers or microwave beams, this infrared light is safe enough to stare directly into. Solar farms normally sit idle at night, so this system fixes that... from space. Really fascinating tech. Video", "link": "https://nitter.net/rowancheung/status/2051320518905930208#m", "decryptage": "Meta explore une technologie révolutionnaire pour alimenter ses centres de données IA : l'énergie solaire envoyée depuis des satellites en orbite, ce qui permettrait une production d'électricité continue et propre, même la nuit, en convertissant la lumière en faisceaux infrarouges dirigés vers les fermes solaires terrestres.", "category": "actu"}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Plus d'informations sur le rôle + lien de candidature : jobs.therundown.ai/jobs/4445…", "text_original": "More about the role + application link: jobs.therundown.ai/jobs/4445…", "link": "https://nitter.net/rowancheung/status/2049873841065709885#m", "decryptage": null, "category": "actu"}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Au fait, si vous voulez travailler avec moi mais ne pensez pas que le rôle ci-dessus soit *parfait*, je recrute également pour 4 autres postes : > Responsable du contenu > Responsable des ventes > Stratège créatif publicitaire > Rédacteur de contenu de marque Vérifiez-le : jobs.therundown.ai/jobs?filt…", "text_original": "By the way, if you want to work with me but don't think the above role is the *perfect* fit, I'm also hiring 4 other roles: > Head of Content > Head of Sales > Ad Creative Strategist > Branded Content Editor Check it out: jobs.therundown.ai/jobs?filt…", "link": "https://nitter.net/rowancheung/status/2049872931602284880#m", "decryptage": null, "category": "actu"}, {"author_name": "Rowan Cheung", "handle": "@rowancheung", "text_fr": "Je recrute quelqu'un pour m'aider à construire le « Reddit des cas d'utilisation de l'IA ». Les gens meurent d'envie d'entendre de VRAIES personnes faisant un VRAI travail avec l'IA. Ils ne se soucient pas de la façon dont les dirigeants, les influenceurs ou les chasseurs de buzz « utilisent l'IA ». Il y a quelques mois, nous avons lancé notre fonctionnalité Cas d'Utilisation Communautaires dans The Rundown : À la fin de chaque newsletter, nous présentons comment un lecteur utilise l'IA pour travailler plus intelligemment, gagner du temps ou faciliter la vie. Nous n'y avons pas beaucoup réfléchi, juste une façon sympa de mettre en avant la communauté. Eh bien, c'est devenu l'un des plus grands succès de la newsletter. Maintenant, je reçois des messages quotidiens nous demandant de l'étendre… alors nous le faisons. Le plan : construire un Reddit pour les cas d'utilisation de l'IA. Nous avons le public le plus actif et engagé intéressé par l'IA au monde, avec des millions de lecteurs quotidiens. Votre travail est de découvrir comment ils utilisent réellement l'IA, puis de les inciter à le partager. En gros, l'ami que tout le monde contacte quand il entend parler d'une nouvelle chose IA… mais vous construisez une communauté entière d'entre eux. Voici ce que je recherche : > Quelqu'un qui s'épanouit dans des environnements rudimentaires avec d'excellentes compétences en communication > A déjà construit des communautés en ligne à grande échelle > Motivé par l'idée d'interviewer des milliers de vraies personnes sur la façon dont l'IA change réellement leur travail Ce n'est PAS un rôle facile. Vous interviewerez des milliers de personnes, collecterez des points de données et approfondirez leurs véritables difficultés avec l'IA. Si cela vous semble amusant plutôt qu'accablant, vous êtes probablement la personne que je recherche. Lien ci-dessous pour postuler ! Rowan Cheung (@rowancheung) Je recrute 5 personnes supplémentaires pour m'aider à construire l'avenir des médias IA. The Rundown approche les 3 millions de lecteurs actifs, et la demande dépasse largement ce que nous pouvons gérer. Bonus de parrainage de 2 000 $ si vous nous aidez à trouver quelqu'un que nous embauchons à temps plein. Postes ouverts : > Responsable du contenu — dirige l'équipe éditoriale qui touche des millions de personnes chaque jour > Responsable des ventes — dirige une équipe de vente et une stratégie de revenus pour nos propriétés médiatiques > Responsable de communauté — transforme nos 3 millions+ de lecteurs en un « Reddit des cas d'utilisation de l'IA » > Stratège créatif publicitaire — recherche et publie des créatifs publicitaires qui attirent le prochain million de lecteurs curieux de l'IA > Rédacteur de contenu de marque — transforme les marques en histoires que nos lecteurs veulent réellement lire Ce que nous recherchons pour tous les rôles : > Curiosité profonde pour l'IA (vous avez déjà remplacé une partie de votre flux de travail par des agents) > Biais déraisonnable envers l'action > Goût suffisamment affûté pour repérer les grands travaux (et le 'AI slop') Tous les rôles sont entièrement à distance. Lien ci-dessous pour postuler ! — https://nitter.net/rowancheung/status/2048767013472833869#m", "text_original": "I'm hiring someone to help me build the \"Reddit for AI use cases.\" People are dying to hear from REAL people actually doing REAL work with AI. They don't care about how execs, influencers, or hype chasers are 'using AI'. A few months ago, we launched our Community Use Cases feature in The Rundown: At the end of every newsletter, we showcase how a reader is using AI to work smarter, save time, or make life easier. We didn't think much of it, just a cool way to highlight the community. Well, it became one of the biggest hits the newsletter has ever had. Now I get daily messages asking us to expand it... so we are. The plan: build Reddit for AI use cases. We have the most active and engaged AI-interested audience in the world, with millions of daily readers. Your job is to figure out how they're actually using AI, then incentivize them to share it. Basically, the friend everyone texts when they hear about a new AI thing... but you're building an entire community of them. Here's what I'm looking for: > Someone who thrives in scrappy environments with great communication skills > Has built online communities at scale before > Energized by the idea of interviewing thousands of real people about how AI is actually changing their work This is NOT an easy role. You'll interview thousands of people, gather data points, and dig into their real AI struggles. If that sounds fun rather than overwhelming, you're probably who I'm looking for. Link below to apply! Rowan Cheung (@rowancheung) I'm HIRING 5 more people to help me build the future of AI media. The Rundown is closing in on 3M active readers, and the demand is far outpacing what we can handle. $2,000 referral bonus if you help us find someone we hire full-time. Open roles: > Head of Content -- lead the editorial team that reaches millions every day > Head of Sales -- run a scrappy sales team and revenue strategy across our media properties > Community Lead -- turn our 3M+ readership into the \"Reddit for AI use cases\" > Ad Creative Strategist -- research and ship ad creatives that hook the next million AI-curious readers > Branded Content Editor -- turn brands into stories our readers actually want to read What we're looking for among all roles: > Deep AI curiosity (you've already replaced part of your workflow with agents) > Unreasonably biased toward action > Taste sharp enough to spot great work (and AI slop) All roles are fully remote. Link below to apply! — https://nitter.net/rowancheung/status/2048767013472833869#m", "link": "https://nitter.net/rowancheung/status/2049872641889087549#m", "decryptage": "Rowan Cheung recrute pour créer une plateforme communautaire dédiée aux cas d'utilisation réels de l'IA, afin de partager des expériences concrètes et d'aider d'autres utilisateurs à mieux employer cette technologie.", "category": "actu"}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "(っ◔◡◔)っ Nous rejoignons @MistralAI ! ｃ(◔◡◔ｃ) Je suis ravi d'annoncer que nous unissons nos forces avec @MistralAI. Je commence officiellement un nouveau chapitre en tant que Responsable des Opérations Cyber, et le meilleur, c'est que je ne viens pas seul ! J'amène une partie de l'équipe AllVei avec moi pour construire l'avenir de l'IA pour la Cyber :D Après avoir discuté avec @GuillaumeLample et l'équipe fondatrice, il est rapidement devenu clair que nous partageons la même obsession et le même état d'esprit. Avec Mistral, nous passons à un tout autre niveau : l'esprit innovant du champion français de l'IA, des ressources incroyables et des gens absolument brillants avec qui travailler chaque jour. L'adéquation était trop évidente 😄 Un grand merci à Guillaume et à toute l'équipe Mistral pour leur confiance. Je tiens également à remercier tous ceux qui ont cru en AllVei au cours des derniers mois. Merci à l'incroyable écosystème technologique en Bretagne (Village By CA Finistère, @regionbretagne, @FTBrestPlus, @Bpifrance), aux VC et à nos incroyables partenaires de conception. Votre soutien a énormément compté ❤️ J'ai hâte de vous montrer ce que nous construisons. Au travail 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "text_original": "(っ◔◡◔)っ We are joining @MistralAI ! ｃ(◔◡◔ｃ) I’m thrilled to announce that we are merging forces with @MistralAI I am officially starting a new chapter as Cyber Ops Lead, and the best part is I’m not coming alone! I’m bringing part of the AllVei team with me to build the future of AI for Cyber :D After talking with @GuillaumeLample and the founding team, it quickly became clear that we share the exact same obsession and mindset. With Mistral, we’re scaling up to a whole new level: the innovative spirit of the French AI champion, incredible resources, and absolutely brilliant people to work with every day. The fit was just too obvious 😄 A huge thanks to Guillaume and the entire Mistral team for their trust. I also want to thank everyone who believed in AllVei over the last few months. Thank you to the incredible tech ecosystem in Brittany (Village By CA Finistère, @regionbretagne , @FTBrestPlus , @Bpifrance ), to the VCs, and to our amazing design partners. Your support meant the world ❤️ Can’t wait to show you what we’re building. Let’s get to work 🔥 𝑯𝑨𝑪𝑲 𝑻𝑯𝑬 𝑷𝑳𝑨𝑵𝑬𝑻 :𝑫", "link": "https://nitter.net/DoomerOutrun/status/2048853527187841133#m", "decryptage": "L'entreprise MistralAI annonce l'acquisition de l'équipe AllVei, qui rejoindra ses rangs pour développer des solutions d'IA dédiées à la cybersécurité, renforçant ainsi sa position sur ce marché stratégique.", "category": "actu"}, {"author_name": "Guillaume Lample", "handle": "@GuillaumeLample", "text_fr": "Ravi de rejoindre @MistralAI 😻 ! Hâte de repousser les limites de la pré-formation et de faire avancer la prochaine génération de LLM. 💚 Reconnaissant pour mon temps passé chez @nvidia -- ce fut une base incroyable pour ce nouveau chapitre.", "text_original": "Thrilled to be joining @MistralAI 😻! Looking forward to pushing the frontier of pretraining and advancing the next generation of LLMs. 💚Grateful for my time at @nvidia -- it's been an incredible foundation for this next chapter.", "link": "https://nitter.net/shrimai_/status/2049171872042852732#m", "decryptage": "Shrimai, un expert en IA, exprime son enthousiasme à rejoindre MistralAI pour faire progresser la recherche et le développement des LLM (modèles de langage à grande échelle) de nouvelle génération.", "category": "actu"}], "tips": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Ça marche vraiment bien, au fait : à la fin de votre requête, demandez à votre LLM de « structurer sa réponse en HTML », puis visualisez le fichier généré dans votre navigateur. J'ai aussi eu du succès en demandant au LLM de présenter sa sortie sous forme de diaporamas, etc. Plus généralement, à mon avis, l'audio est l'entrée préférée des humains pour les IA, mais la vision (images/animations/vidéos) est la sortie préférée de celles-ci. Environ un tiers de nos cerveaux est un processeur massivement parallèle dédié à la vision ; c'est l'autoroute à 10 voies de l'information vers le cerveau. À mesure que l'IA s'améliore, je pense que nous verrons une progression qui en tirera parti : 1) texte brut (difficile/pénible à lire) 2) Markdown (gras, italique, titres, tableaux, un peu plus facile pour les yeux) <-- réglage par défaut actuel 3) HTML (toujours procédural avec du code sous-jacent, mais beaucoup plus de flexibilité sur les graphiques, la mise en page, voire l'interactivité) <-- début prometteur d'un nouveau réglage par défaut ...4,5,6,... n) vidéos/simulations neuronales interactives. À mon avis, l'extrapolation (bien que la technologie n'existe pas encore) aboutit à une sorte de vidéos interactives générées directement par un réseau neuronal de diffusion. De nombreuses questions restent ouvertes quant à la manière dont les artefacts exacts/procéduraux du « Logiciel 1.0 » (par exemple, les simulations interactives) peuvent être tissés avec des artefacts neuronaux (grilles de diffusion), mais généralement quelque chose dans la direction du nitter.net/zan2434/status/2046982… récemment viral. Des améliorations sont également nécessaires et en attente au niveau de l'entrée. L'audio, le texte ou la vidéo seuls ne suffisent pas, par exemple, je ressens le besoin de pointer/gesticuler vers des éléments à l'écran, de la même manière que tout ce que vous feriez avec une personne physiquement à côté de vous et votre écran d'ordinateur. En bref, l'intégration esprit-machine entre les humains et les IA est en cours et il y a beaucoup de travail à faire et de progrès significatifs à réaliser, bien avant de se lancer directement dans les BCI de type Neuralink et tout ça. Pour ce qui vaut la peine d'être exploré au stade actuel, un conseil : essayez de demander du HTML. Thariq (@trq212) x.com/i/article/205279610060…", "text_original": "This works really well btw, at the end of your query ask your LLM to \"structure your response as HTML\", then view the generated file in your browser. I've also had some success asking the LLM to present its output as slideshows, etc. More generally, imo audio is the human-preferred input to AIs but vision (images/animations/video) is the preferred output from them. Around a ~third of our brains are a massively parallel processor dedicated to vision, it is the 10-lane superhighway of information into brain. As AI improves, I think we'll see a progression that takes advantage: 1) raw text (hard/effortful to read) 2) markdown (bold, italic, headings, tables, a bit easier on the eyes) <-- current default 3) HTML (still procedural with underlying code, but a lot more flexibility on the graphics, layout, even interactivity) <-- early but forming new good default ...4,5,6,... n) interactive neural videos/simulations Imo the extrapolation (though the technology doesn't exist just yet) ends in some kind of interactive videos generated directly by a diffusion neural net. Many open questions as to how exact/procedural \"Software 1.0\" artifacts (e.g. interactive simulations) may be woven together with neural artifacts (diffusion grids), but generally something in the direction of the recently viral nitter.net/zan2434/status/2046982… There are also improvements necessary and pending at the input. Audio nor text nor video alone are not enough, e.g. I feel a need to point/gesture to things on the screen, similar to all the things you would do with a person physically next to you and your computer screen. TLDR The input/output mind meld between humans and AIs is ongoing and there is a lot of work to do and significant progress to be made, way before jumping all the way into neuralink-esque BCIs and all that. For what's worth exploring at the current stage, hot tip try ask for HTML. Thariq (@trq212) x.com/i/article/205279610060… — https://nitter.net/karpathy/status/2053872850101285137#m", "link": "https://nitter.net/karpathy/status/2053872850101285137#m", "decryptage": "Les LLM (modèles de langage à grande échelle) peuvent non seulement générer du texte, mais aussi structurer leurs réponses de manière visuelle (HTML, diaporamas), transformant la façon dont nous interagissons avec l'IA en passant d'une simple lecture à une expérience plus riche et interactive, utilisant la 'vision' comme principal canal d'échange, un peu comme nous utilisons nos yeux pour traiter la majorité des informations.", "category": "tips"}, {"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "Cette citation, je la cite beaucoup ces derniers temps. kache (@yacineMTB) vous pouvez externaliser votre réflexion mais vous ne pouvez pas externaliser votre compréhension — https://nitter.net/yacineMTB/status/2018886083120153046#m", "text_original": "This is the the quote I've been citing a lot recently. kache (@yacineMTB) you can outsource your thinking but you cannot outsource your understanding — https://nitter.net/yacineMTB/status/2018886083120153046#m", "link": "https://nitter.net/karpathy/status/2049907410303865030#m", "decryptage": "Cette idée met en lumière une limite importante de l'IA : même si elle peut accomplir des tâches complexes et 'réfléchir' pour nous, elle ne peut pas nous remplacer dans la capacité à comprendre réellement le monde et les concepts.", "category": "tips"}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Nouveau cours : Transformers in Practice. Vous obtiendrez une vue pratique du fonctionnement des LLM basés sur des transformeurs, afin de pouvoir raisonner sur leur comportement, diagnostiquer des problèmes comme une inférence lente et prendre des décisions plus judicieuses concernant le déploiement. Ce cours est conçu en partenariat avec @AMD et enseigné par @realSharonZhou. Vous verrez comment les transformeurs génèrent du texte un jeton à la fois, comment le modèle décide quels mots précédents sont les plus importants lors de la prédiction du suivant, et comment des techniques comme la quantification accélèrent l'inférence sur les GPU. Ce n'est pas un cours uniquement vidéo ; des visualisations interactives tout au long vous permettent de jouer avec ces concepts et de construire une intuition durable. Compétences que vous acquerrez : - Comprendre pourquoi les LLM hallucinent, et comment RAG (Retrieval Augmented Generation) et le chaînage de pensées (chain-of-thought) façonnent ce qu'ils génèrent - Regarder à l'intérieur du modèle pour voir comment l'attention et les couches se combinent pour prédire le jeton suivant - Diagnostiquer les goulots d'étranglement de l'inférence et apprendre les techniques qui accélèrent les transformeurs sur les GPU Rejoignez-nous et comprenez ce qui se passe réellement à l'intérieur de vos LLM : deeplearning.ai/courses/tran… Vidéo", "text_original": "New course: Transformers in Practice. You'll get a practical view of how transformer-based LLMs work, so you can reason about their behavior, diagnose problems like slow inference, and make smarter decisions about deployment. This course is built in partnership with @AMD and taught by @realSharonZhou . You'll see how transformers generate text one token at a time, how the model decides which earlier words matter most when predicting the next one, and how techniques like quantization speed up inference on GPUs. This is not a video-only course; interactive visualizations throughout let you play with these concepts and build intuition that sticks. Skills you'll gain: - Understand why LLMs hallucinate, and RAG and chain-of-thought shape what they generate - Look inside the model to see how attention and layers combine to predict the next token - Diagnose inference bottlenecks and learn the techniques that speed up transformers on GPUs Join and understand what's really happening inside your LLMs: deeplearning.ai/courses/tran… Video", "link": "https://nitter.net/AndrewYNg/status/2054964560403300359#m", "decryptage": "Un nouveau cours propose de comprendre en pratique comment fonctionnent les LLM (modèles de langage à grande échelle) basés sur les transformeurs, en abordant des sujets comme la génération de texte, l'\"hallucination\" des modèles, ou l'accélération de leur fonctionnement, ce qui est essentiel pour mieux les utiliser et les déployer.", "category": "tips"}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Nouveau cours : Créez des agents qui répondent aux utilisateurs non seulement avec du texte brut, mais aussi avec des interfaces utilisateur personnalisées comme des graphiques, des formulaires et des tableaux blancs, générés à la demande et affichés directement dans le chat. Ce cours court est conçu en partenariat avec @CopilotKit et enseigné par @ataiiam, co-fondateur de CopilotKit. Vous apprendrez trois approches : Votre agent peut choisir parmi des composants personnalisés que vous construisez, comme des graphiques et des formulaires. Il peut composer de nouvelles mises en page à partir d'un ensemble de blocs de construction que vous fournissez, comme des lignes, des cartes et du texte. Ou il peut intégrer des applications tierces existantes, comme un tableau blanc ou un calendrier, directement dans la conversation. Compétences que vous acquerrez : - Construire des agents qui affichent des composants personnalisés comme des graphiques et des formulaires à la demande - Construire une application où l'agent et l'utilisateur collaborent sur des données partagées, au-delà de la fenêtre de chat - Placer des applications tierces comme des cartes, des calendriers et des tableaux blancs directement dans votre interface Rejoignez-nous et construisez des agents qui donnent aux utilisateurs quelque chose à voir et sur lequel agir ! deeplearning.ai/short-course… Vidéo", "text_original": "New course: Build agents that respond to users with not only plaintext, but custom UIs like charts, forms, and whiteboards, generated on demand and displayed right in the chat. This short course is built in partnership with @CopilotKit and taught by @ataiiam , co-founder of CopilotKit. You'll learn three approaches: Your agent can pick from custom components you build, like charts and forms. It can compose new layouts from a set of building blocks you provide, like rows, cards, and text. Or it can incorporate existing third-party apps, like a whiteboard or a calendar, right inside the conversation. Skills you’ll gain: - Build agents that render custom components like charts and forms on demand - Build an app where the agent and user collaborate on shared data, beyond just the chat window - Place third-party apps like maps, calendars, and whiteboards right in your interface Join and build agents that give users something to see and act on! deeplearning.ai/short-course… Video", "link": "https://nitter.net/AndrewYNg/status/2052422157310083493#m", "decryptage": "Un nouveau cours explique comment créer des agents IA capables de générer des interfaces visuelles personnalisées (graphiques, formulaires, cartes interactives) directement dans une conversation, rendant les interactions avec l'IA plus riches et plus actionnables que du simple texte.", "category": "tips"}, {"author_name": "Andrew Ng", "handle": "@AndrewYNg", "text_fr": "Les agents de codage accélèrent différents types de travail logiciel à des degrés divers. Lorsque nous concevons des équipes, la compréhension de ces distinctions nous aide à avoir des attentes réalistes. En listant les fonctions de la plus accélérée à la moins accélérée, mon ordre est le suivant : développement frontend, backend, infrastructure et recherche. Le développement frontend — par exemple, la création d'une page web pour afficher des descriptions de produits pour un site de commerce électronique — est considérablement accéléré car les agents de codage maîtrisent les langages frontend populaires comme TypeScript et JavaScript et les frameworks comme React et Angular. De plus, en examinant ce qu'ils ont construit en utilisant un navigateur web, les agents de codage sont maintenant très bons pour boucler la boucle et itérer sur leurs propres implémentations. Certes, les LLM sont encore faibles en matière de conception visuelle, mais étant donné une conception (ou si une conception peaufinée n'est pas importante), l'implémentation est rapide ! Le développement backend — par exemple, la création d'API pour répondre aux requêtes de données de produits — est plus difficile. Il faut plus de travail de la part des développeurs humains pour guider les modèles modernes à réfléchir aux cas limites qui pourraient entraîner des bugs subtils ou des failles de sécurité. De plus, un bug backend peut entraîner des effets en aval non intuitifs comme une base de données corrompue qui renvoie occasionnellement des résultats incorrects, ce qui peut être plus difficile à déboguer qu'un bug frontend typique. Enfin, bien que les migrations de bases de données puissent être plus faciles avec les agents de codage, elles restent difficiles et doivent être gérées avec soin pour éviter la perte de données. Bien que le développement backend soit beaucoup plus rapide avec les agents de codage, ils l'accélèrent moins, et les développeurs qualifiés conçoivent et implémentent toujours de meilleurs backends que les inexpérimentés qui utilisent des agents de codage. L'infrastructure. Les agents sont encore moins efficaces dans des tâches comme la mise à l'échelle d'un site de commerce électronique à 10 000 utilisateurs actifs tout en maintenant une fiabilité de 99,99 %. La connaissance des LLM est encore relativement limitée en ce qui concerne l'infrastructure et les compromis complexes que les bons ingénieurs doivent faire, donc je leur fais rarement confiance pour les décisions critiques d'infra. La construction d'une bonne infrastructure nécessite souvent une période de test et d'expérimentation, et les agents de codage peuvent y aider, mais ultimement c'est un goulot d'étranglement important où le codage rapide par l'IA n'aide pas beaucoup. Enfin, trouver des bugs d'infrastructure — par exemple, une subtile mauvaise configuration réseau — peut être incroyablement difficile et nécessite une expertise technique approfondie. Ainsi, j'ai constaté que les agents de codage accélèrent l'infrastructure critique encore moins que le développement backend. La recherche. Les agents de codage accélèrent encore moins le travail de recherche. La recherche implique de réfléchir à de nouvelles idées, de formuler des hypothèses, d'exécuter des expériences, d'interpréter les pour potentiellement modifier les hypothèses, et d'itérer jusqu'à ce que nous arrivions à des conclusions. Les agents de codage peuvent accélérer le rythme auquel nous pouvons écrire du code de recherche. (J'utilise également des agents de codage pour m'aider à orchestrer et à suivre les expériences, ce qui facilite la gestion de plus d'expériences par un seul chercheur.) Mais il y a beaucoup de travail dans la recherche autre que le codage, et les agents actuels n'aident que marginalement à la recherche. La catégorisation du travail logiciel en frontend, backend, infra et recherche est une simplification extrême, mais avoir un modèle mental simple de la rapidité avec laquelle les différentes tâches ont été accélérées a été utile pour la façon dont j'organise les équipes logicielles. Par exemple, je demande maintenant aux équipes frontend d'implémenter des produits beaucoup plus rapidement qu'il y a un an, mais mes attentes pour les équipes de recherche n'ont pas changé autant. Je suis fasciné par la façon d'organiser les équipes logicielles pour utiliser les agents de codage afin d'atteindre la vitesse, et je continuerai à partager mes découvertes dans de futurs articles. [Texte original : deeplearning.ai/the-batch/is… ]", "text_original": "Coding agents are accelerating different types of software work to different degrees. When we architect teams, understanding these distinctions helps us to have realistic expectations. Listing functions from most accelerated to least, my order is: frontend development, backend, infrastructure, and research. Frontend development — say, building a web page to serve descriptions of products for an ecommerce site — is dramatically sped up because coding agents are fluent in popular frontend languages like TypeScript and JavaScript and frameworks like React and Angular. Additionally, by examining what they have built by operating a web browser, coding agents are now very good at closing the loop and iterating on their own implementations. Granted, LLMs today are still weak at visual design, but given a design (or if a polished design isn’t important), the implementation is fast! Backend development — say, building APIs to respond to queries requesting product data — is harder. It takes more work by human developers to steer modern models to think through corner cases that might lead to subtle bugs or security flaws. Further, a backend bug can lead to non-intuitive downstream effects like a corrupted database that occasionally returns incorrect results, which can be harder to debug than a typical frontend bug. Finally, although database migrations can be easier with coding agents, they’re still hard and need to be handled carefully to prevent data loss. While backend development is much faster with coding agents, they accelerate it less, and skilled developers still design and implement far better backends than inexperienced ones who use coding agents. Infrastructure. Agents are even less effective in tasks like scaling an ecommerce site to 10K active uses while maintaining 99.99% reliability. LLMs' knowledge is still relatively limited with respect to infrastructure and the complex tradeoffs good engineers must make, so I rarely trust them for critical infra decisions. Building good infrastructure often requires a period of testing and experimentation, and coding agents can help with that, but ultimately that’s a significant bottleneck where fast AI coding does not help much. Lastly, finding infrastructure bugs — say, a subtle network misconfiguration — can be incredibly difficult and requires deep engineering expertise. Thus, I’ve found that coding agents accelerate critical infrastructure even less than backend development. Research. Coding agents accelerate research work even less. Research involves thinking through new ideas, formulating hypotheses, running experiments, interpreting them to potentially modify the hypotheses, and iterating until we reach conclusions. Coding agents can speed up the pace at which we can write research code. (I also use coding agents to help me orchestrate and keep track of experiments, which makes it easier for a single researcher to manage more experiments.) But there is a lot of work in research other than coding, and today’s agents help with research only marginally. Categorizing software work into frontend, backend, infra, and research is an extreme simplification, but having a simple mental model for how much different tasks have sped up has been useful for how I organize software teams. For example, I now ask front-end teams to implement products dramatically faster than a year ago, but my expectations for research teams have not shifted nearly as much. I am fascinated by how to organize software teams to use coding agents to achieve speed, and will keep sharing my findings in future posts. [Original text: deeplearning.ai/the-batch/is… ]", "link": "https://nitter.net/AndrewYNg/status/2051691741150081122#m", "decryptage": "Les agents de codage, des programmes IA qui aident à écrire du code, sont plus efficaces pour accélérer le développement d'interfaces visuelles (frontend) que pour les tâches plus complexes comme la gestion des bases de données (backend) ou la construction de l'infrastructure logicielle (infra), et encore moins pour la recherche, car ces dernières demandent plus de raisonnement humain et de résolution de problèmes non standard.", "category": "tips"}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "La table au format HTML pour une visualisation plus facile (et non tronquée) : sebastianraschka.com/llm-arc…", "text_original": "The table in HTML format for easier (and non-truncated) viewing: sebastianraschka.com/llm-arc…", "link": "https://nitter.net/rasbt/status/2054949267630940606#m", "decryptage": null, "category": "tips"}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Méta observation : DeepSeek reste le roi du ratio de paramètres actifs", "text_original": "Meta observation: DeepSeek is still king of the active-parameter ratio", "link": "https://nitter.net/rasbt/status/2054936440975310910#m", "decryptage": "DeepSeek est un modèle d'IA de langage qui est très performant en utilisant une grande proportion de ses \"paramètres actifs\", c'est-à-dire les parties du modèle qui sont réellement utilisées et mises à jour pendant son fonctionnement, ce qui est un signe de son efficacité.", "category": "tips"}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "Une petite conférence sur ce que nous pouvons apprendre en implémentant des architectures de LLM de zéro en Python et PyTorch. Et comment j'aborde les nouveaux modèles à poids ouverts, les compare aux implémentations de référence, etc. : piped.video/watch?v=TXzQ7PGp…", "text_original": "A little talk on what we can learn from implementing LLM architectures from scratch in Python and PyTorch. And how I approach new open-weight models, compare them against reference implementations etc: piped.video/watch?v=TXzQ7PGp…", "link": "https://nitter.net/rasbt/status/2054602271107760308#m", "decryptage": "Sebastian Raschka partage son expérience sur l'apprentissage en reconstruisant des architectures de LLM (modèles de langage à grande échelle) à partir de zéro, une méthode qui aide à mieux comprendre comment ces IA fonctionnent.", "category": "tips"}, {"author_name": "Sebastian Raschka", "handle": "@rasbt", "text_fr": "De retour d'une petite pause en famille ! Beaucoup de choses se sont passées, et je prévois de plonger plus en profondeur dans les composants architecturaux les plus intéressants (bientôt). Au fait, ai-je manqué des architectures majeures ci-dessous ?", "text_original": "Back from a little family break! Lots has happened, and I’m planning to do a deeper dive into the most interesting architectural components (soon). Btw, are there any major architectures I missed below?", "link": "https://nitter.net/rasbt/status/2053497922482761792#m", "decryptage": null, "category": "tips"}, {"author_name": "Shawn Wang", "handle": "@swyx", "text_fr": "Superbe rédaction de la pile technologique, l'une des meilleures que j'aie jamais vues dans ma carrière. Je recommande toujours aux entreprises d'outils de développement de les rédiger, car cela remplit plusieurs objectifs : - informer les utilisateurs du soin apporté au produit - informer les futurs employés qu'il y a du travail de pointe ici - dire aux concurrents d'abandonner - rendre à la communauté - (nuancé) dire aux non-adaptés pourquoi ils ne peuvent pas avoir ce qu'ils veulent quand ils pensent que c'est une demande facile peu le font réellement, principalement parce qu'ils n'ont pas réellement une profondeur suffisante, ou ne sont pas suffisamment bons en prise de notes/systématiques en matière de résolution de problèmes ('ce n'est que des ondes' ou 'honnêtement, nous avons juste pris la première chose qui a marché' ne passe pas aussi bien, alors il vaut mieux ne rien dire) alors quand vous avez fait le travail, montrez le travail. Bravo Raycast Thomas Paul Mann (@thomaspaulmann) Une application, deux plateformes, quatre langages de programmation. Les choses qui semblent les plus simples sont souvent les plus difficiles à construire. @raycast en fait partie. Voici une analyse technique approfondie de la façon dont nous avons construit la v2 👉 ray.so/v2-deep-dive Vidéo — https://nitter.net/thomaspaulmann/status/2054932607293378689#m", "text_original": "beautiful tech stack writeup, one of the best i've ever seen in my career. I always advocate that devtools companies write these up, because it fulfils multiple purposes: - tell users the care that goes into the product - tell hires that there's SOTA work here - tell competitors to give up - gives back to community - (nuanced) tell non-fits why they can't have what they want when they think it's an easy request few actually do this mostly because they don't actually have sufficient depth, or aren't sufficiently good at notetaking/systematic about problemsolving ('its just vibes' or 'honestly we just went with the first thing that worked' doesn't come across as well, so rather not say anything) so when you've done the work, show the work. bravo Raycast Thomas Paul Mann (@thomaspaulmann) Une application, deux plateformes, quatre langages de programmation. Les choses qui semblent les plus simples sont souvent les plus difficiles à construire. @raycast en fait partie. Voici une analyse technique approfondie de la façon dont nous avons construit la v2 👉 ray.so/v2-deep-dive Vidéo — https://nitter.net/thomaspaulmann/status/2054932607293378689#m", "link": "https://nitter.net/swyx/status/2054938522034020816#m", "decryptage": "Un \"tech stack writeup\" est un document qui décrit en détail les technologies utilisées pour construire un produit, expliquant pourquoi certains choix ont été faits, ce qui est très utile pour communiquer sur la qualité du produit, attirer des talents et partager les connaissances techniques.", "category": "tips"}, {"author_name": "Nick Dobos", "handle": "@nickadobos", "text_fr": "Autre très bon conseil : Matthew Cassinelli (@mattcassinelli) Pour quiconque utilise Codex depuis son mobile, vous pouvez vous assurer que l'application est ouverte sur votre Mac en utilisant des Raccourcis 👇 — https://nitter.net/mattcassinelli/status/2055054264242991428#m", "text_original": "Another really good tip: Matthew Cassinelli (@mattcassinelli) For anyone using Codex from mobile, you can make sure the app open on your Mac using Shortcuts 👇 — https://nitter.net/mattcassinelli/status/2055054264242991428#m", "link": "https://nitter.net/NickADobos/status/2055060955349024953#m", "decryptage": "Pour utiliser Codex sur votre Mac via l'application mobile, une astuce consiste à configurer un \"Raccourci\" (fonctionnalité d'automatisation sur Apple) qui garantit que l'application reste ouverte sur votre ordinateur, même si vous travaillez à distance depuis votre téléphone.", "category": "tips"}, {"author_name": "Nick Dobos", "handle": "@nickadobos", "text_fr": "utiliser caffeinate via CLI est également une option, mais je ne l'aime pas autant qu'avoir une application pratique dans la barre de menus pour cela", "text_original": "using caffeinate via CLI is also an option, but I dont like it as much as having a handy menu bar app for this", "link": "https://nitter.net/NickADobos/status/2055037904246972868#m", "decryptage": "La commande 'caffeinate' en ligne de commande (CLI) permet d'empêcher un ordinateur Mac de se mettre en veille, mais l'auteur préfère utiliser une application de barre de menus pour cette fonction, car c'est plus pratique et facile à gérer.", "category": "tips"}, {"author_name": "Nick Dobos", "handle": "@nickadobos", "text_fr": "Codex sur iOS Astuce Pro : Comment empêcher votre Mac de se mettre en veille Sur votre Mac - téléchargez Amphetamine gratuitement - activez-le lorsque Codex est activé - optionnel : décochez le paramètre pour permettre de fermer le couvercle de votre ordinateur portable OpenAI (@OpenAI) Vous l'avez demandé... Maintenant en préversion : Codex dans l'application mobile ChatGPT. Commencez de nouveaux travaux, examinez les résultats, dirigez l'exécution et approuvez les prochaines étapes, le tout depuis l'application mobile ChatGPT. Codex continuera de fonctionner sur votre ordinateur portable, Mac mini ou devbox. Vidéo — https://nitter.net/OpenAI/status/2055016850849993072#m", "text_original": "Codex on iOS Pro tip: How to keep you mac from sleeping On your mac - download amphetamine for free - enable when codex is on - optional: uncheck the setting to allow closing your laptop lid OpenAI (@OpenAI) You've been asking for this one... Now in preview: Codex in the ChatGPT mobile app. Start new work, review outputs, steer execution, and approve next steps, all from the ChatGPT mobile app. Codex will keep running on your laptop, Mac mini, or devbox. Video — https://nitter.net/OpenAI/status/2055016850849993072#m", "link": "https://nitter.net/NickADobos/status/2055037902305001962#m", "decryptage": "Pour garantir que Codex continue de fonctionner sans interruption sur votre Mac pendant que vous l'utilisez depuis votre appareil iOS, il est conseillé d'utiliser une application comme \"Amphetamine\" pour empêcher l'ordinateur de se mettre en veille.", "category": "tips"}], "idees": [{"author_name": "Andrej Karpathy", "handle": "@karpathy", "text_fr": "C'est la première thématique que j'ai essayé de mettre en avant : les LLM sont bien plus que des outils pour accélérer ce qui existait déjà (par exemple, le codage). Trois exemples de nouveaux horizons : 1. menugen : une application qui peut être entièrement absorbée par les LLM, sans code classique nécessaire : on entre une image, on obtient une image, et un LLM peut faire la chose nativement. 2. installer des compétences en .md au lieu de scripts .sh. Pourquoi créer un script bash complexe du Logiciel 1.0 pour, par exemple, installer un logiciel, si vous pouvez écrire l'installation en mots et dire \"montrez juste cela à votre LLM\" ? Le LLM est un interprète avancé de l'anglais et peut intelligemment cibler l'installation à votre configuration, déboguer tout en ligne, etc. 3. Les bases de connaissances LLM comme exemple de quelque chose qui était *impossible* avec le code classique car il s'agit de calcul sur des données non structurées (connaissances) provenant de sources arbitraires et de formats arbitraires, y compris de simples articles textuels, etc. J'ai insisté sur ces points car à chaque nouveau changement de paradigme, les choses évidentes sont toujours dans le domaine de l'accélération ou de l'amélioration de ce qui existait, mais ici nous avons des exemples de fonctionnalités qui, soit ne devraient peut-être même plus exister (1,2), soit n'étaient fondamentalement pas possibles auparavant (3). Le deuxième thème (en cours) est d'essayer d'expliquer le modèle de l'irrégularité des LLM. Comment il peut être vrai qu'un seul artefact va simultanément 1) refactoriser de manière cohérente une base de code de 100 000 lignes *et* 2) vous dire d'aller à la station de lavage pour laver votre voiture. J'ai déjà écrit que la source de cela était liée à la vérifiabilité d'un domaine, ici j'étends cela en disant que c'est aussi lié à l'économie parce que les revenus/TAM dictent ce que les laboratoires de pointe choisissent d'inclure dans les distributions de données d'entraînement pendant le RL. Vous êtes soit dans la distribution de données (sur les rails des circuits RL) et vous volez, soit vous faites du hors-piste dans la jungle avec une machette, en termes relatifs. Toujours pas satisfait à 100 % de cela, mais c'est une lutte continue pour construire un modèle précis des capacités des LLM si vous souhaitez tirer pratiquement parti de leur puissance tout en évitant leurs pièges, ce qui m'amène à... Le dernier thème est l'économie native des agents. La décomposition des produits et services en capteurs, actionneurs et logique (répartis sur tous les paradigmes de calcul 1.0/2.0/3.0), comment nous pouvons rendre l'information aussi lisible que possible pour les LLM, quelques mots sur l'ingénierie agentique émergente rapide et ses compétences, les pratiques de recrutement associées, etc., voire des indices/rêves d'un calcul entièrement neuronal gérant la grande majorité du calcul avec l'aide de coprocesseurs CPU (classiques). Stephanie Zhan (@stephzhan) @karpathy et moi sommes de retour ! À @sequoia AI Ascent 2026. Et beaucoup de choses ont changé. L'année dernière, il a inventé le \"vibe coding\". Cette année, il ne s'est jamais senti aussi dépassé en tant que programmeur. Le grand changement : le \"vibe coding\" a relevé le niveau minimum. L'ingénierie agentique élève le niveau maximum. Nous discutons de ce que signifie construire sérieusement à l'ère des agents. Pas seulement aller plus vite. Construire de nouvelles choses, avec de nouveaux outils, tout en préservant les parties qui nécessitent encore le goût, le jugement et la compréhension humaine. Vidéo — https://nitter.net/stephzhan/status/2049518659513852109#m", "text_original": "Fireside chat at Sequoia Ascent 2026 from a ~week ago. Some highlights: The first theme I tried to push on is that LLMs are about a lot more than just speeding up what existed before (e.g. coding). Three examples of new horizons: 1. menugen: an app that can be fully engulfed by LLMs, with no classical code needed: input an image, output an image and an LLM can natively do the thing. 2. install .md skills instead of install .sh scripts. Why create a complex Software 1.0 bash script for e.g. installing a piece of software if you can write the installation out in words and say \"just show this to your LLM\". The LLM is an advanced interpreter of English and can intelligently target installation to your setup, debug everything inline, etc. 3. LLM knowledge bases as an example of something that was *impossible* with classical code because it's computation over unstructured data (knowledge) from arbitrary sources and in arbitrary formats, including simply text articles etc. I pushed on these because in every new paradigm change, the obvious things are always in the realm of spee
